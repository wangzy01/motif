# stage512b —— 数据+训练阶段 REDESIGN 配方（2026-06-29）【设计权威: docs/数据+训练阶段_重设计方案_v1_20260629.md §3/§6/§7】
# ───────────────────────────────────────────────────────────────────────────
# ⚠️ REDESIGN 新方案的 stage512b config（anime 高质量对齐段）, 给【未来重设计训练】用; 绝不喂给在跑的 v1/B1/B3/消融。
# 基于 stage512a_redesign_v1.yaml 克隆, 改动（512a→512b = 同分辨率换 mix/池, 直接续, 不 re-warmup）:
#   1) stage="512b"（image_size/512、token/512 同 512a; elig 仍 elig_512）。
#   2) domain_mix 512b=anime0.78/monet0.13/gpic0.04/synth0.04/text0.01（anime 主导对齐 + real/synth/text 降到防遗忘地板）。
#      —— 由共享 JSON t5_sampling_redesign_v1.json 的 512b 块提供; caption 路由 512b=35/20/20/25
#        （晚期回升 tag 做 booru 兼容; 512a 已降至 40/30/20/10, 故 512b ≠ 512a。权威=JSON）。
#   3) 曝光量 256M（上限）: max_steps = 256M / global_batch。global 1536 -> 167000 步。
#      ★ 默认完成点 = 128M（≈83500 步）+ eval gate（§3: 64/128/192/256M 看 anime 质量+prompt-following+多样性-记忆化再续）。
#   4) num_warmup_steps=0（同分辨率续 512a, 不 re-warmup; §6）。
#   5) 512b multi-caption 护栏（§5.3）= 现有随机变体（免费）; 记忆/多样性下降再补 Qwen3-VL-30B 生成（loader 预留接口）。
#   6) multi-AR 沿用 512a（dataset.multi_ar; Phase2b 落地后开）。

model_cls: networks.model_mot.MoTT2IModel
target_device: cuda

model:
  pretrained_path: /fsx/models/Qwen3-VL-2B-Instruct
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  patch_size: 1
  time_gap: 2048
  timestep_multiplier: 1.0
  text_max_length: 512
  cfg_dropout_prob: 0.1
  text_rich_cfg_dropout_prob: 0.0
  prompt_template:
    enabled: true
  gradient_checkpointing: true

  sandwich_norm: true
  noise_condition: true
  long_skip:
    enabled: false
    mode: A_full
  text_adapter:
    enabled: false
    num_layers: 2
    multi_layer_fusion:
      enabled: false
      num_layers: 12
  und_lora:
    enabled: false
    num_layers: 8
    rank: 32
    alpha: 32
    lr_scale: 0.3
    target_modules: [q, k, v, o]
  abs_sincos:
    enabled: false

vae:
  name: flux2
  pretrained_path: /fsx/models/FLUX.2-klein-4B/vae
  dtype: bfloat16

dataset:
  store_cls: training.dataline.complete_dataset.CompleteV1Dataset
  sampling_config: /fsx/evan/mot_code/data_analysis/configs/t5_sampling_redesign_v1.json  # ★共享 REDESIGN JSON; 512b 块提供 anime0.78 mix
  stage: "512b"                      # ★ dataline elig 用 elig_{image_size}=elig_512（Phase2a）
  image_size: 512
  buffer_size: 512                   # 512 阶段放大(同 512a, multi-AR 分桶防小域空洞)
  queue_size: 128
  min_fill: 64
  first_fill_policy: all_min
  first_fill_timeout_s: 180
  fetch_workers: 8
  drain_mode: proportional           # ★对齐 live 最佳实践 + multi-AR 分桶下保各域 mix（见 512a 注）
  textatlas_local_root: /local/evan/textatlas5m
  anime_nrows: 20000
  anime_cache_dir: /local/evan/anime_img_cache
  stats_cache: /fsx/evan/mot_code/data_analysis/outputs/monet_global_stats_rich_v1.json
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  use_latent_cache: false
  multi_ar:
    enabled: false                   # ★Phase2b：沿用 512a; 分桶 sampler 已落地+JCC 验证; Evan 拍板后改 true
    target_area: 262144
    divisor: 16
    ar_list: [1.3333, 1.5, 1.7778]   # 同 512a = 7 桶
    warmup_steps: 0                  # 512b 续 512a(同分辨率), 不 re-warmup → 全程开桶（§6/§7; warmup 已在 512a 用掉）
    # ★data-matched 先验 = Σ domain_mix[512b]·P(bucket|domain)；512b anime0.78 主导→更偏 anime 的 landscape 分布(3:2/4:3)。桶序同 512a。
    bucket_probs: [0.061, 0.265, 0.191, 0.204, 0.094, 0.103, 0.082]
    square_only_domains: []          # 护栏2 逃生口(默认空); 同 512a, synthetic 实测裁剪伤害明显再开

sigma_sampling:
  dist: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  shift: 1.0

optimizer:
  name: torch.optim.AdamW
  params:
    lr: 1.73e-4
    weight_decay: 0.0
    betas: [0.9, 0.95]
    eps: 1.0e-8

scheduler:
  num_warmup_steps: 0                # 同分辨率续 512a, 不 re-warmup（§6）
  decay: constant

trainer:
  seed: 42
  amp_dtype: bfloat16
  batch_size: 16                     # 512px micro-batch; job yaml 按 world 覆盖
  max_steps: 167000                  # REDESIGN 512b 曝光量上限 256M → global 1536 × 167k ≈ 256M（默认完成点 128M≈83500 + eval gate）。仅作参考——实际由下面 max_exposure_images 派生
  max_exposure_images: 256000000     # 衔接：曝光量上限 256M → max_steps=ceil(256M/实际global_batch)，步数随卡数自适应（见 train.py）。默认完成点 128M 由 eval gate 提前停, 非靠 max_steps
  # global_batch_size: 1536          # 选填：不设则按 batch_size×world_size 现算（推荐留空, 自适应）
  gradient_clip_val: 1.0
  log_every: 10
  dataline_metrics_every: 50
  checkpoint_steps: 3000
  checkpoint_keep_every: 25000
  checkpoint_keep_max: 4
  checkpoint_keep_format: weights_ema
  checkpoint_dir: /fsx/evan/checkpoints/mot_pilot_v1/stage512b_redesign_v1  # REDESIGN 独立 dir; job yaml 按 RUN_ID 覆盖
  resume: true
  # 阶段切换（512a→512b，同分辨率换 mix/池）：首次启动用 --overrides trainer.init_from=<512a final last.pt> 从 512a 权重(+optimizer 动量)初始化，
  # step 重置为 0；同分辨率故 num_warmup_steps:0 不 re-warmup。gated：不设则行为不变；resume 优先（本地有 last.pt 即续训不重置）。
  # init_from: /fsx/evan/checkpoints/mot_pilot_v1/stage512a_redesign_v1/last.pt
  # init_load_optimizer: true
  # ⚠️ B1 臂须同时 --overrides model.text_adapter.enabled=true [bidirectional=...]（与 512a 一致，否则指纹校验硬报错）。
  skip_distributed_teardown: false
  force_os_exit_after_train: false
  debug_step_trace: false
  debug_step_trace_dir: null
  debug_trace_dump_interval: 0
  batch_ready_barrier: false
  batch_ready_barrier_dir: null
  batch_ready_barrier_run_id: null
  batch_ready_barrier_timeout_s: 300
  ema:
    enabled: true
    decay: 0.9999
