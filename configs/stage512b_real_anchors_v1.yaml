# Stage512b-real: 512-resolution breadth stage, bucket_mode=anchors_v1 (13 fixed
# anchors) over the CURATED rich_v1 real pool. 512M exposures = 250,000 steps @ 2048.
#
# (The header said "full-survivor" until 2026-08-02. That was the D18 design; Evan
# switched to the curated pool on 2026-08-01 because phase5 requires 17 columns for
# the real domains and the full survivor manifest is missing 20 of them, including the
# src_* payload locators. Reviving full-survivor needs a new rich_v2 build first.)
#
# This stage REPLACES the 2026-06-29 anime-alignment 512b design; that one is no
# longer planned (Evan, 2026-08-01).
#
# Launch remains forbidden.
#   BUILT   offline_catalog_root  -- phase5 formal, 2026-08-02, 89,786,866 rows,
#           catalog_hash b91e4906df9a1f8b039effa69df83a0555310d964bf22d6e1da7c13e9c781b91
#   BUILT   offline_plan_root     -- weighted plan, 2026-08-02, 245 blocks / 250,000
#           steps, plan_hash 50b5ae2bb2a952b18355d5d5876ceac8c4d8086ae72f872b306a8167f84fd685
#   BUILT   offline_anime_freq_root, offline_caption_sidecar_root (56 GB),
#           offline_textatlas_gt_root (v2). The trainer: block is complete except
#           checkpoint_dir, which the FORMAL job supplies via CKPT_DIR.

model_cls: networks.model_mot.MoTT2IModel
target_device: cuda

model:
  pretrained_path: /fsx/models/Qwen3-VL-2B-Instruct
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  patch_size: 1
  time_gap: 2048
  timestep_multiplier: 1.0
  text_max_length: 512
  cfg_dropout_prob: 0.1
  # 0.1, NOT the inherited 0.0 -- and this changes nothing at runtime. It is a
  # correction of a config that was describing an intention rather than a behaviour.
  #
  # MoTT2IModel.forward reads batch.get("text_rich") and would apply this rate to
  # text-bearing rows. No data path emits text_rich: the offline loader yields
  # {prompts, pixels, cfg_keep} and so does the streaming one. The key has therefore
  # been inert since it was written, here and in Stage512a, and every TextAtlas row has
  # always taken the ordinary cfg_dropout_prob. Writing 0.0 told the next reader that
  # text samples are protected. They are not.
  #
  # Decided 2026-08-02 (S512B-18) to leave the BEHAVIOUR alone rather than wire
  # text_rich up. Adding GT to the prompt does not argue for protecting these rows:
  # dropout replaces the whole prompt with "", so what the prompt contained is
  # irrelevant to the dropped 10%, and GT only strengthens the conditional branch in
  # the other 90%. Excluding all of TextAtlas from the unconditional distribution would
  # also be its own unvalidated change -- CFG trains the unconditional branch on the
  # full image distribution by design. Scale: TextAtlas is 5% of 512M, so the dropped
  # exposures are 0.5% of the run and the dropped GT-bearing ones about 0.24%.
  #
  # If OCR exact-string comes back poor, the experiment is 10%/5%/0% on the ~47% of
  # TextAtlas rows that HAVE authoritative GT -- not blanket protection for the domain.
  text_rich_cfg_dropout_prob: 0.1
  prompt_template:
    enabled: true
  gradient_checkpointing: true
  sandwich_norm: true
  noise_condition: true
  long_skip:
    enabled: false
    mode: A_full
  text_adapter:
    enabled: true
    num_layers: 2
    bidirectional: false
    rope: false
    multi_layer_fusion:
      enabled: true
      num_layers: 12
  und_lora:
    enabled: false
    num_layers: 8
    rank: 32
    alpha: 32
    lr_scale: 0.3
    target_modules: [q, k, v, o]
  abs_sincos:
    enabled: false

vae:
  name: flux2
  pretrained_path: /fsx/models/FLUX.2-klein-4B/vae
  dtype: bfloat16

dataset:
  store_cls: training.dataline_offline.offline_dataset.OfflineExactDataset
  # DO NOT EDIT the sampling config after a catalog is built against it, not even a
  # comment field. The catalog records inputs.sampling_config_sha256 and
  # OfflineExactDataset refuses to load when the runtime file's digest differs, so an
  # annotation unbinds the catalog. (Learned the hard way on 2026-08-02: writing up the
  # realized-exposure measurement into that file broke the binding and had to be
  # reverted. Findings about a frozen input belong beside the artifact -- see
  # offline_arb_plan_..._20260802.REALIZED_EXPOSURE.md.) Bound digest: a3ecd965...
  #
  # THIS yaml is different: the catalog records inputs.pipeline_config_sha256 but
  # nothing enforces it, and drift here is structural rather than accidental -- the
  # plan root and plan_hash below cannot exist until after the plan is built, which is
  # after the catalog. So this file's digest necessarily stops matching what the
  # catalog recorded, and that is expected, not a defect.
  sampling_config: /fsx/evan/mot_code_s512b_impl/data_analysis/configs/t5_sampling_stage512b_real_v1.json
  stage: "512b"
  image_size: 512
  # BUILT 2026-08-02. 245 blocks x 1024 steps = 250,000 steps / 512M exposures, 4.4 GB.
  # plan_id stage512b_offline_exact_v2_w64_512m_anchors_v1 (planner_v1.py:363 derives the
  # required prefix from the stage; a non-conforming id is refused).
  offline_plan_root: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_plan_stage512b_w64_512m_anchors_v1_20260802
  offline_plan_hash: 50b5ae2bb2a952b18355d5d5876ceac8c4d8086ae72f872b306a8167f84fd685
  # data_analysis/configs/weighted_contract_stage512b_v1.json -- in-repo and reviewable,
  # unlike the Stage512a contract which lived only in a control dir outside git.
  offline_weighted_contract_sha256: 352dd3aa75fd03c2f58dc9ed7a9e83f80f42f716b38dc467f6cfbe2452040035
  # BUILT 2026-08-02 by the phase5 formal run at this exact path
  # (== CANONICAL_OUTPUT_DIRS['512b'], a root distinct from the frozen 512a catalog so a
  # 13-anchor build can never os.replace() the 361-bucket parquets).
  #   89,786,866 rows | catalog_hash    b91e4906df9a1f8b039effa69df83a0555310d964bf22d6e1da7c13e9c781b91
  #                   | assignment_hash d2fb8e837fab2488e66134de831ff72b483acab3c638cb5a959219717989eb4e
  #   self-checks all pass: N agreement exact at tolerance 0 against BOTH phase3a's
  #   N_matrix and a raw-manifest recount; 0 duplicate uids; 53,478,305 tar joins with
  #   0 misses; 0 upsampling rows. The 1,751-row shortfall against phase3a is entirely
  #   tar_index_miss and is itemised in bad_rows.parquet.
  offline_catalog_root: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_stage512b_v1
  offline_anime_freq_root: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_animefreq_stage512b_v1   # BUILT 2026-08-02, bound by catalog_hash
  offline_caption_sidecar_root: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_caption_sidecar_stage512b_v1   # BUILT 2026-08-02, 56 GB, five domains, 89,786,866 rows
  # TextAtlas authoritative rendered-text GT, joined by row_id at load time. Optional:
  # omit the key and textatlas prompts are the plain i1 caption, exactly as before.
  # Covers 1,941,791 of ~4.12M textatlas rows (~47%) -- only CleanTextSynth and
  # TextScenesHQ record an exact string rather than describe one; the other seven
  # subsets yield nothing extractable, measured, not assumed. Uncovered rows fall back
  # to the plain caption, and so does any row whose GT clause alone exceeds the caption
  # budget: a truncated exact string is a WRONG label, not a weaker one.
  # v2 (not v1) is required at runtime. v1 emitted a single NFKC- and whitespace-folded
  # column, which for a text renderer is a rewritten target: NFKC turns full-width into
  # half-width and folds circled and mathematical characters. The loader refuses v1 by
  # schema name rather than failing later on a missing column.
  offline_textatlas_gt_root: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_textatlas_gt_stage512b_v2   # BUILT 2026-08-02, 1,941,791 rows, sha256 09d51bed…
  caption_sidecar_workers: 16
  caption_workers_anime: 8
  caption_workers_monet_real: 8
  caption_workers_gpic: 4
  caption_workers_synthetic: 2
  fetch_workers_anime: 8
  fetch_workers_tar: 8
  gpic_payload_in_memory: true
  gpic_threads_per_node: 16
  gpic_source_consistency_mode: strict_path

  buffer_size: 4096
  queue_size: 128
  min_fill: 64
  first_fill_policy: all_min
  first_fill_timeout_s: 180
  fetch_workers: 8
  producer_native_io_serial: false
  drain_mode: proportional
  textatlas_local_root: /local/evan/textatlas5m
  anime_nrows: 20000
  anime_cache_dir: /local/evan/anime_img_cache
  # MONET-only: source_counts + cluster_sizes over all 40,000,000 monet rows.
  stats_cache: /fsx/evan/mot_code/data_analysis/outputs/monet_global_stats_rich_v1.json
  # GPIC's own within-domain cluster_sizes. Required for stage 512b. phase5 applies
  # the cluster factor to every real domain, but stats_cache above is a MONET-only
  # scan and GPIC shares MONET's cluster namespace (one joint k-means), so the
  # lookup succeeds while inverting the intent: corr(log monet size, log gpic size)
  # = -0.24, so GPIC's densest modes sit in MONET's sparsest clusters. Measured on
  # the eligible pool, MONET's table drops GPIC's effective clusters from 16,226 to
  # 13,559 and doubles top-1 share; GPIC's own table gives 17,229 / 0.087%.
  #   built by data_analysis/scripts/s512b_gpic_cluster_stats_v1.py
  #   sha256 af8e254ea2f80329e81eb7d384c97bbd26042bbc4020cb1c20a42783b2b8fd4c
  #   20,000,000 rows, 19,943 of 20,000 clusters present, 0 unclustered, 0 holdout
  gpic_cluster_stats: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/stage512b_gpic_cluster_stats_v1.json
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  use_latent_cache: false

  crop_v_anchor:
    anime: 0.15

  multi_ar:
    enabled: true
    assignment_mode: offline_weighted_band_v1
    bucket_mode: anchors_v1
    # Required and explicit: it materially changes admission. 262144 reproduces the
    # Stage512b audits; 0 would disable it (servability then decided purely by the
    # feasible-anchor test, which is what guarantees zero upsampling).
    anchors_area_gate: 262144
    anchors_crop_loss_max: 0.20
    # Per-domain TIGHTENING only (a value above the global one is refused). TextAtlas
    # renders text, so a crop that slices a glyph is not a mild quality loss -- the
    # caption still quotes the whole string, which teaches the model to render words
    # that are not in the picture. Measured over all 595 shards: at the global 0.20,
    # 2,388 of 909,678 non-square textatlas rows sit at crop_loss >= 0.12, almost all
    # in LongWordsSubset-M a7/a8, and sampled crops confirm sliced headlines ("5 Tips
    # for a Really Modern Website Design" -> "ps for a Really Modern Website Des").
    # Gradient-energy proxies show a clean dose-response: ink-in-cut 0.49% below 0.02
    # versus 8.07% above 0.12. Capping textatlas at 0.12 drops 2,388 rows = 0.058% of
    # kept textatlas, 0.0003% of the pool. Unpinning from the square anchor remains a
    # large net win either way: a 512x512 centre crop would have taken >20% of the
    # source from 808,928 of these rows and >40% from 84,046.
    anchors_crop_loss_max_by_domain:
      textatlas: 0.12
    target_area: 262144
    divisor: 16
    adaptive_no_upscale: true
    adaptive_min_area_ratio: 0.75
    adaptive_max_aspect: 4.0
    bucket_buffer_size: 256
    bucket_min_fill: 1
    bucket_wait_timeout_s: 180
    bucket_wait_native_s: 0
    # anchors_v1 requires an identity fold: nearest_allowed_bucket has no feasibility
    # test, so folding a pruned extent lands on a taller anchor and upsamples.
    bucket_prob_floor: 0.0
    warmup_exposure_images: 0
    warmup_steps: 0
    # D5: TextAtlas unpinned from the square anchor (it was square_only in 512a).
    square_only_domains: [synthetic]

sigma_sampling:
  dist: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  shift: 1.0

optimizer:
  name: torch.optim.AdamW
  params:
    lr: 1.732051e-4
    weight_decay: 0.0
    betas: [0.9, 0.95]
    eps: 1.0e-8

scheduler:
  num_warmup_steps: 500
  decay: constant

trainer:
  seed: 42
  amp_dtype: bfloat16
  batch_size: 32
  # 512M exposures = 250,000 steps @ global batch 2048 (world 64 x bs 32). The file
  # inherited 512a's 125,000/256M, which contradicted its own header.
  max_steps: 250000
  max_exposure_images: 512000000
  gradient_clip_val: 1.0
  log_every: 10
  dataline_metrics_every: 50
  checkpoint_steps: 3000
  # 30000, not the inherited 60000 (Evan, 2026-08-02). This is an EVALUATION decision,
  # not a storage one: keep_every decides which steps still exist when someone wants to
  # score them, and it cannot be fixed after the fact -- raising it later does not bring
  # back a checkpoint that has already rolled off.
  #
  # keep_max MUST be raised with it. checkpoint.py:193 prunes with snaps[:-keep_max]
  # over ALL step_*.pt, so keep_max is a cap on the total number of periodic snapshots,
  # not a separate rolling window. The inherited pair was self-consistent by accident:
  # 60000 over 250,000 steps produces exactly 4 snapshots, so keep_max 4 pruned nothing.
  # Halving keep_every to 30000 produces 8, and leaving keep_max at 4 would have deleted
  # the first four -- the earliest surviving snapshot would become step 150,000, LATER
  # than the 60,000 it was meant to improve on. Exactly backwards.
  #
  # 8 = the count of multiples of 30,000 below 250,000 (30k..240k, one per ~61M
  # exposures). Snapshots are checkpoint_keep_format weights_ema, about 13 GB each and
  # NOT resumable -- they are for eval and rollback; last.pt is the resumable copy.
  # 8 x 13 GB = 104 GB, up from 52 GB.
  checkpoint_keep_every: 30000
  checkpoint_keep_max: 8
  checkpoint_keep_format: weights_ema
  # PLACEHOLDER name, but the DIRECTORY IDENTITY RULE is not a placeholder: this must be
  # a fresh, create-once directory that no prior run has ever written. This block was
  # inherited verbatim from stage512a_20260722_weighted_w64_v1.yaml, whose checkpoint_dir
  # is the ABANDONED step-6000 Stage512a attempt (it still holds a FORMAL_RUN.json and a
  # 26 GB step-6000 last.pt). Launching Stage512b against it would have resumed a
  # 6,000-step checkpoint and written new checkpoints into a formal run directory.
  #
  # With resume: true (below), a stale or reused checkpoint_dir is SILENTLY resumed
  # instead of initialised from Stage512a. Verify the directory does not exist -- or is
  # empty -- immediately before the first submission, and let JCC retries reuse only
  # this same directory.
  checkpoint_dir: /fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/PLACEHOLDER_stage512b_real_v1
  # resume is for Stage512b's OWN retries and MUST be true; it is not a switch for
  # "start fresh". train.py:368-384 branches on NOT(local last.pt AND resume):
  #   resume: true  + empty dir -> init_from Stage512a, global_step reset to 0 (first launch)
  #   resume: true  + our last.pt -> full Stage512b resume (what a JCC retry needs)
  #   resume: false -> EVERY retry re-inits from Stage512a and discards Stage512b progress
  # Continuation from Stage512a is init_from + init_load_optimizer, never resume; pointing
  # resume at another stage's directory misaligns global step / scheduler / max_steps.
  resume: true
  # Verified 2026-08-02: torch.load(mmap=True) reports global_step = 125000 with a full
  # state dict (trainable_state + optimizer + ema + scheduler), and the run directory's
  # RECOVERY_FORMAL_RUN.json carries plan_hash 7295ca93..., the frozen Stage512a plan.
  # This is NOT stage512a_20260722_weighted_w64_v1 (that one stopped at step 6000 and only
  # seeded this run) -- the terminal Stage512a state lives under recovery_v2.
  #   sha256(last.pt)      = 957bfcf12b89c4042a32056566012a2451e72aa0b2706b0ca51808ab79155c31
  #   sha256(metrics.jsonl)= f51b83038f00f60e85c889f1d4114017c4934df016719e658ba0e7e5bce586e6  (125,000 rows)
  # Re-verify sha256(last.pt) before the first submission; it is a mutable path that the
  # Stage512a job would overwrite if that job were ever relaunched.
  init_from: /fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/stage512a_20260724_weighted_w64_recovery_v2/last.pt
  init_load_optimizer: true
  skip_distributed_teardown: true
  force_os_exit_after_train: true
  gc_gen2_threshold: 200
  gc_freeze_after_steps: 50
  gc_refreeze_every: 10000
  debug_step_trace: false
  debug_step_trace_dir: null
  debug_trace_dump_interval: 0
  batch_ready_barrier: false
  batch_ready_barrier_dir: null
  batch_ready_barrier_run_id: null
  batch_ready_barrier_timeout_s: 300
  ema:
    enabled: true
    decay: 0.9999
  use_wandb: false
  wandb_project: mot-pilot-v1
  wandb_entity: null
  wandb_mode: offline
