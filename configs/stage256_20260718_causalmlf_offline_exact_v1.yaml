# 7.18 Stage256 formal recipe.
#
# Training intent:
#   * fresh run from the model's pretrained components (NO trainer.init_from);
#   * causal two-layer text adapter + 12-layer MLF (the approved best topology);
#   * deterministic offline-exact multi-AR, with a semantic plan that proves
#     Stage256 anime tag-only exposure is exactly zero;
#   * exact 384,000,768 image exposures on W64, per-rank batch 36 => 166667 steps.
#
# This is derived from configs/stage256_offline_exact_v1.yaml.  Apart from the
# explicitly listed architecture/LR/store/plan/checkpoint changes below, the
# runtime recipe is intentionally unchanged.

model_cls: networks.model_mot.MoTT2IModel
target_device: cuda

model:
  pretrained_path: /fsx/models/Qwen3-VL-2B-Instruct
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  patch_size: 1
  time_gap: 2048
  timestep_multiplier: 1.0
  text_max_length: 384
  cfg_dropout_prob: 0.1
  text_rich_cfg_dropout_prob: 0.0
  prompt_template:
    enabled: true
  gradient_checkpointing: true
  sandwich_norm: true
  noise_condition: true
  long_skip:
    enabled: false
    mode: A_full
  text_adapter:
    enabled: true
    num_layers: 2
    bidirectional: false
    rope: false
    multi_layer_fusion:
      enabled: true
      num_layers: 12
  und_lora:
    enabled: false
    num_layers: 8
    rank: 32
    alpha: 32
    lr_scale: 0.3
    target_modules: [q, k, v, o]
  abs_sincos:
    enabled: false

vae:
  name: flux2
  pretrained_path: /fsx/models/FLUX.2-klein-4B/vae
  dtype: bfloat16

dataset:
  # New top-level package keeps the old frozen training source tree untouched.
  store_cls: stage256_20260718.offline_semantic_dataset.OfflineSemanticExactDataset
  sampling_config: /fsx/evan/mot_code/data_analysis/configs/t5_sampling_redesign_v1.json
  stage: "256"
  image_size: 256
  offline_plan_root: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_stage256_20260718_semantic_v1/w64_prod/plan
  offline_semantic_overlay_root: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_stage256_20260718_semantic_v1/overlay
  offline_catalog_root: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1
  offline_anime_freq_root: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_animefreq_v1
  offline_caption_sidecar_root: /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_caption_sidecar_v1
  caption_sidecar_workers: 16
  caption_workers_anime: 8
  caption_workers_monet_real: 8
  caption_workers_gpic: 4
  caption_workers_synthetic: 2
  fetch_workers_anime: 8
  fetch_workers_tar: 8
  gpic_payload_in_memory: true
  gpic_threads_per_node: 16
  gpic_source_consistency_mode: strict_path

  # Streaming-era fields are inert in the offline loader and retained only so
  # the baseline diff remains auditable.
  buffer_size: 4096
  queue_size: 128
  min_fill: 64
  first_fill_policy: all_min
  first_fill_timeout_s: 120
  fetch_workers: 8
  producer_native_io_serial: false
  drain_mode: proportional
  textatlas_local_root: /local/evan/textatlas5m
  anime_nrows: 20000
  anime_cache_dir: /local/evan/anime_img_cache
  stats_cache: /fsx/evan/mot_code/data_analysis/outputs/monet_global_stats_rich_v1.json
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  use_latent_cache: false

  crop_v_anchor:
    anime: 0.15

  multi_ar:
    enabled: true
    assignment_mode: offline_exact_v1
    bucket_mode: adaptive
    target_area: 65536
    divisor: 16
    adaptive_no_upscale: true
    adaptive_min_area_ratio: 0.75
    adaptive_max_aspect: 4.0
    bucket_buffer_size: 256
    bucket_min_fill: 1
    bucket_wait_timeout_s: 120
    bucket_wait_native_s: 0
    bucket_prob_floor: 0.01
    warmup_exposure_images: 0
    warmup_steps: 0
    square_only_domains: [synthetic, textatlas]

sigma_sampling:
  dist: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  shift: 1.0

optimizer:
  name: torch.optim.AdamW
  params:
    lr: 2.121e-4
    weight_decay: 0.0
    betas: [0.9, 0.95]
    eps: 1.0e-8

scheduler:
  num_warmup_steps: 1000
  decay: constant

trainer:
  seed: 42
  amp_dtype: bfloat16
  batch_size: 36
  max_steps: 250000
  max_exposure_images: 384000768
  gradient_clip_val: 1.0
  log_every: 10
  dataline_metrics_every: 50
  checkpoint_steps: 3000
  checkpoint_keep_every: 50000
  checkpoint_keep_max: 4
  checkpoint_keep_format: weights_ema
  checkpoint_dir: /fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/stage256_20260718_causalmlf_offline_exact_v1
  # true permits same-namespace retry/resume.  Freshness is enforced by the
  # smoke/formal launch preflight; there is deliberately no init_from key.
  resume: true
  skip_distributed_teardown: true
  force_os_exit_after_train: true
  gc_gen2_threshold: 200
  gc_freeze_after_steps: 50
  gc_refreeze_every: 10000
  debug_step_trace: false
  debug_step_trace_dir: null
  debug_trace_dump_interval: 0
  batch_ready_barrier: false
  batch_ready_barrier_dir: null
  batch_ready_barrier_run_id: null
  batch_ready_barrier_timeout_s: 300
  ema:
    enabled: true
    decay: 0.9999
  use_wandb: false
  wandb_project: mot-pilot-v1
  wandb_entity: null
  wandb_mode: offline
