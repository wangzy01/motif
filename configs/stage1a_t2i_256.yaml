# stage1a t2i @256 预训配置【训练代码路径已 GPU 验证（见 @512）；本分辨率未单独跑；数据读取仍 stub】
# v3 阶段拆分：新增独立 256 预训阶段（吃大数据、把能力种下），再进 512 主训。
# 与 stage1a_t2i_512.yaml 仅在分辨率 / shift / 步数 / batch 上不同（模型分辨率无关）。
# 绝对步数待定：约 90M 数据过 1–2 遍量级，开训前与团队核。

model_cls: networks.model_mot.MoTT2IModel
target_device: cuda

model:
  pretrained_path: /fsx/models/Qwen3-VL-2B-Instruct
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  patch_size: 1                    # FLUX.2 latent 已 128ch/16×，不再二次 pack
  time_gap: 2048
  timestep_multiplier: 1.0
  text_max_length: 384            # caption ~343 + 模板 ~41（对标 Anima-2B/Qwen-Image 长 caption；原 296 偏保守）
  cfg_dropout_prob: 0.1
  text_rich_cfg_dropout_prob: 0.0
  prompt_template:
    enabled: true
  gradient_checkpointing: true

  sandwich_norm: true
  noise_condition: true
  long_skip:
    enabled: false
    mode: A_full
  text_adapter:
    enabled: false
    num_layers: 2
  abs_sincos:
    enabled: false

vae:
  name: flux2                      # VAE gate 已拍板 FLUX.2（AutoencoderKLFlux2, f16c128）
  pretrained_path: /fsx/models/FLUX.2-klein-4B/vae
  dtype: bfloat16

dataset:                            # complete_v1 真实数据线（4 域：anime/MONET-real/GPIC/synth）
  store_cls: training.dataline.complete_dataset.CompleteV1Dataset
  sampling_config: /fsx/evan/mot_code/data_analysis/configs/t5_sampling_complete_v1.json
  stage: "256"
  image_size: 256
  buffer_size: 256                  # per-domain shuffle buffer（256px uint8 ~196KB/张）
  queue_size: 128
  min_fill: 64
  anime_nrows: 20000                # 每次每 anime 源 shard 增量读行数（控读时延 + 跨 shard 多样性）
  anime_cache_dir: /local/evan/anime_img_cache    # R2 图磁盘缓存（别写 /fsx）
  stats_cache: /local/evan/mot_stats/monet_global_stats.json  # 全局源/簇统计（多卡须预算共享）
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct  # caption 真实 token 截断（F3，消除模型端硬截）

sigma_sampling:
  dist: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  shift: 1.0                       # 256 基本不 shift（v3）

optimizer:
  name: torch.optim.AdamW
  params:
    lr: 1.0e-4
    weight_decay: 0.0
    betas: [0.9, 0.95]
    eps: 1.0e-8

scheduler:
  num_warmup_steps: 300
  decay: constant

trainer:
  seed: 42
  amp_dtype: bfloat16              # GPU bf16 autocast（参数留 fp32，无需 GradScaler）；CPU 时自动退化为 fp32
  batch_size: 64                   # 256 序列短，单卡可放更大 micro-batch
  max_steps: 400000                # Evan 2026-06-17: 300k→400k（256 是 ablation 稳定起步单元，原 300k 偏轻）。8卡 global bs512 → 204.8M 样本
  gradient_clip_val: 1.0
  log_every: 10
  checkpoint_steps: 3000           # last.pt 每 3000 步(~100min@2s/step)覆盖一次（最新/全量可续训~23GB）。1000→3000：/fsx 写次数 3× 降、iter 尖峰更少；崩溃最多丢 ~100min（maxRetries+resume 兜底）。⚠️在跑 job 须重启才生效（config 启动时读）
  checkpoint_keep_every: 50000     # 每 50k 步额外留一个步号快照 step_N.pt
  checkpoint_keep_max: 4           # 最多留 4 个步号快照（删最旧）；last.pt 仍为最新可续训副本
  checkpoint_keep_format: weights_ema  # 步号快照仅权重+EMA(~11GB,供eval/回滚)；改 full 则快照=last.pt硬链接(22.6GB,可续训)
  checkpoint_dir: /fsx/evan/checkpoints/mot_pilot_v1/stage1a_256
  resume: true
  ema:
    enabled: true
    decay: 0.9999
