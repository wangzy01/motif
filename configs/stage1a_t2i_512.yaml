# stage1a t2i @512 正式配置【训练/FSDP2/EMA/采样路径已 GPU 验证；数据读取仍 stub 占位】
# 真实数据集（manifest+dataio）与 VAE（等 VAE gate 结论）接入后才可用。
# 步数/学习率锚点：nano-T2I 512 阶段 ~20 万步量级、Tsubaki 7.5B 用 LR 1e-4 bs4096
# （方案0608「阶段拆分细化」+ 交接文档 §2），绝对值开训前再和团队核。
#
# 本配置对齐「自己写的模型+训练设置文档_v3.md」Day-1 baseline +「模型架构修改规划_v1」。

model_cls: networks.model_mot.MoTT2IModel
target_device: cuda

model:
  pretrained_path: /fsx/models/Qwen3-VL-2B-Instruct
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  patch_size: 1                    # FLUX.2 latent 已 128ch/16×（VAE 内含 2×2 patch），不再二次 pack
  time_gap: 2048                   # 文本->生成图 Δ（Cosmos3）
  timestep_multiplier: 1.0         # v3：Cosmos3 对齐默认（=timestep_scale 0.001）；sweep {1,10,1000}
  text_max_length: 384             # caption ~343 token + Qwen-Image 模板 ~41 token（对标 Anima-2B/Qwen-Image 长 caption）
  cfg_dropout_prob: 0.1            # 10% caption dropout（CFG）
  text_rich_cfg_dropout_prob: 0.0  # 文字样本特例：默认不 dropout（需数据线带 text_rich 标志）
  prompt_template:
    enabled: true                  # Qwen-Image 式模板（用户已拍板）
  gradient_checkpointing: true

  # ---- Day-1 baseline 架构开关 ---- #
  sandwich_norm: true              # 生成侧 sandwich norm（v3 Day-1 baseline）
  noise_condition: true            # 加性 timestep 注入（B3 消融时可关）

  # ---- i1 消融增量（默认全关；关时不构造参数、对 baseline 零影响）---- #
  long_skip:                       # B2 生成侧 long skip
    enabled: false
    mode: A_full                   # A_full（对称全连）| B_outer（只连最外 ~1/3）
  text_adapter:                    # B1 文本 adapter（attention 臂接入留专门一轮）
    enabled: false
    num_layers: 2
  abs_sincos:                      # B4 绝对 sinusoidal（仅生成 token、alpha zero-init）
    enabled: false

vae:
  name: flux2                      # VAE gate 已拍板 FLUX.2（AutoencoderKLFlux2, f16c128）
  pretrained_path: /fsx/models/FLUX.2-klein-4B/vae   # = FLUX.2-dev 共享 autoencoder
  dtype: bfloat16                  # GPU 训练用 bf16；CPU 调试改 float32 或换 FakeVAE

dataset:                            # complete_v1 真实数据线（512：anime 0.65 / MONET 0.23 / GPIC 0.08 / synth 0.04；Evan 2026-06-17 把 GPIC 加回 512 补数据量）
  store_cls: training.dataline.complete_dataset.CompleteV1Dataset
  sampling_config: /fsx/evan/mot_code/data_analysis/configs/t5_sampling_complete_v1_textatlas.json  # 5域版(含 textatlas)；4域原版另存防旧代码 ablation 跑偏(坑点#11)
  stage: "512"
  image_size: 512
  buffer_size: 192                  # 512px uint8 ~786KB/张
  queue_size: 96
  min_fill: 48
  anime_nrows: 20000
  anime_cache_dir: /local/evan/anime_img_cache
  stats_cache: /fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json  # ⚠️多机须/fsx共享盘（/local 非 node0 rank 看不到 rank0 写的 cache→重算/不一致；对齐 256_v2）
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct  # caption 真实 token 截断（F3，消除模型端硬截）
  # ---- domain_mix 修复（2026-06-26，16-rank probe 实证 4 域全 ±5%、不拖速）----
  drain_mode: proportional          # 排空∝消费：每域只淘本批实际被抽中量（非旧 uniform 的无差别 bs//2）→
                                    #   慢域不被过排空、保持 present → sampler renorm 落到目标配比。
                                    #   512(supply≈demand) probe 实证：anime+0.2/monet-1.6/gpic+1.3/synth+0.1（uniform 下 anime+6.5✗）。
  fetch_workers: 4                  # gpic 逐文件并发取图（512 demand<supply，4 足够且不过订阅挂载）
  fetch_workers_anime: 1            # anime 串行（缓存/R2 域，并发只过订阅挂载饿死 tar 域；anime 即便串行也供过量）
  # ---- TextAtlas 第5域（2026-06-27，512 text=0.10，i1 等权配方 ~9.1% 依据）----
  textatlas_local_root: /local/evan/textatlas5m   # 源图 /local NVMe 预存优先；缺失自动回退 cfg.textatlas_source_root(S3)保正确性

sigma_sampling:
  dist: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  shift: 2.0                       # 512 阶段固定 shift（sweep 起点；随 VAE 下采样因子再核）

optimizer:
  name: torch.optim.AdamW
  params:
    lr: 1.0e-4
    weight_decay: 0.0
    betas: [0.9, 0.95]
    eps: 1.0e-8

scheduler:
  num_warmup_steps: 300            # v3/i1：constant LR + 短 warmup（i1 本身无 warmup）
  decay: constant

trainer:
  seed: 42
  amp_dtype: bfloat16              # GPU bf16 autocast（参数留 fp32，无需 GradScaler）；CPU 时自动退化为 fp32
  batch_size: 32                   # 单卡 micro-batch，全局 bs 上 FSDP 后另算
  max_steps: 200000
  gradient_clip_val: 1.0           # v3/i1 配方
  log_every: 10
  dataline_metrics_every: 50       # 每 50 步把 realized mix/buffer/吞吐/取图写 metrics.jsonl（在线监控真实配比）
  checkpoint_steps: 1000
  checkpoint_dir: /fsx/evan/checkpoints/mot_pilot_v1/stage1a
  resume: true
  ema:                             # ⚠️ 仅预留字段：EMA 实现 + ckpt save/load 由 naifu 接入
    enabled: true
    decay: 0.9999
