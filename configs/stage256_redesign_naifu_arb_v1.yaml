sigma_sampling:
  dist: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  shift: 1.0

optimizer:
  name: torch.optim.AdamW
  params:
    lr: 1.73e-4
    weight_decay: 0.0
    betas: [0.9, 0.95]
    eps: 1.0e-8

scheduler:
  num_warmup_steps: 1000
  decay: constant

trainer:
  seed: 42
  amp_dtype: bfloat16
  batch_size: 48
  max_steps: 250000
  max_exposure_images: 384000000
  gradient_clip_val: 1.0
  log_every: 10
  dataline_metrics_every: 50
  checkpoint_steps: 3000
  checkpoint_keep_every: 50000
  checkpoint_keep_max: 4
  checkpoint_keep_format: weights_ema
  checkpoint_dir: /fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/stage256_redesign_naifu_arb_v1
  resume: true
  skip_distributed_teardown: false
  force_os_exit_after_train: false
  debug_step_trace: false
  debug_step_trace_dir: null
  debug_trace_dump_interval: 0
  batch_ready_barrier: false
  batch_ready_barrier_dir: null
  batch_ready_barrier_run_id: null
  batch_ready_barrier_timeout_s: 300
  ema:
    enabled: true
    decay: 0.9999
  use_wandb: false
  wandb_project: mot-pilot-v1
  wandb_entity: null
  wandb_mode: offline
