# stage256 REDESIGN + NAI-like ARB retrain config（isolated cleanup_crop, 2026-07-08）
# 目标：相对 rd256，采用更接近 naifu 的 item-level adaptive bucket assignment + per-bucket queue。
# 这是隔离实验配置，只在 /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop 中使用。

model_cls: networks.model_mot.MoTT2IModel
target_device: cuda

model:
  pretrained_path: /fsx/models/Qwen3-VL-2B-Instruct
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  patch_size: 1
  time_gap: 2048
  timestep_multiplier: 1.0
  text_max_length: 384
  cfg_dropout_prob: 0.1
  text_rich_cfg_dropout_prob: 0.0
  prompt_template:
    enabled: true
  gradient_checkpointing: true
  sandwich_norm: true
  noise_condition: true
  long_skip:
    enabled: false
    mode: A_full
  text_adapter:
    enabled: false
    num_layers: 2
    multi_layer_fusion:
      enabled: false
      num_layers: 12
  und_lora:
    enabled: false
    num_layers: 8
    rank: 32
    alpha: 32
    lr_scale: 0.3
    target_modules: [q, k, v, o]
  abs_sincos:
    enabled: false

vae:
  name: flux2
  pretrained_path: /fsx/models/FLUX.2-klein-4B/vae
  dtype: bfloat16

dataset:
  store_cls: training.dataline.complete_dataset.CompleteV1Dataset
  sampling_config: /fsx/evan/mot_code/data_analysis/configs/t5_sampling_redesign_v1.json
  stage: "256"
  image_size: 256
  # 512→4096（2026-07-09 smoke#1 后）：native 就绪判据 ≈ buffer·P(B) ≥ bs·mix_d,512 只够最大桶
  # → 逐槽 native 命中率随 buffer 线性升,re-resize 相应降。内存 ~4GB/rank(256px u8),900GB 节点无压力。
  buffer_size: 4096
  queue_size: 128
  min_fill: 64
  first_fill_policy: all_min
  first_fill_timeout_s: 120
  fetch_workers: 8
  producer_native_io_serial: false
  drain_mode: proportional
  textatlas_local_root: /local/evan/textatlas5m
  anime_nrows: 20000
  anime_cache_dir: /local/evan/anime_img_cache
  stats_cache: /fsx/evan/mot_code/data_analysis/outputs/monet_global_stats_rich_v1.json
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  use_latent_cache: false

  crop_v_anchor:
    anime: 0.15

  multi_ar:
    enabled: true
    assignment_mode: item_queue
    bucket_mode: adaptive
    target_area: 65536
    divisor: 16
    adaptive_no_upscale: true
    adaptive_min_area_ratio: 0.75
    adaptive_max_aspect: 4.0
    bucket_buffer_size: 256
    bucket_min_fill: 1
    bucket_wait_timeout_s: 120
    # 软计划三相（2026-07-09 组批 blocker 重构）：Phase1 等全 native ≤bucket_wait_native_s;
    # Phase2 等计划域总量 ≤bucket_wait_timeout_s（缺 native 槽位 AR 最近桶 re-resize 兜底）;Phase3
    # 到点计划封顶+present 重归一。旧「硬 multinomial 前置+超时杀 rank」已废（稀有桶结构性不可满足）。
    # 30→0（smoke#1 复盘）：全 native 就绪对中小 P(B) 桶结构性不可达（buffer 封顶）,30s 死等吃掉
    # 85%+ 迭代时间（dw≈30s/步,CPU 复验 wait_s 中位数恰=30.0 实锤）;native 纯度靠 buffer_size,
    # 供给背压由 Phase2 的 soft-ready 等待正确承担。
    bucket_wait_native_s: 0
    # 调度剪枝：派生 P(B)<floor 的稀有桶（256 样本审计的量化噪声源）折进最近保留桶;
    # producer 指派同步只出保留桶。0=不剪。
    bucket_prob_floor: 0.01
    warmup_exposure_images: 0
    warmup_steps: 0
    square_only_domains: [synthetic, textatlas]
