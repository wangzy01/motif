# CPU 调试配置：tiny 随机权重 + 假 VAE + stub 数据，几分钟内跑通若干 step。
# 用法: venv-gpu/bin/python train.py --config configs/debug_tiny_cpu.yaml

model_cls: networks.model_mot.MoTT2IModel
target_device: cpu

model:
  pretrained_path: null            # tiny 模式：随机初始化
  tokenizer_path: /fsx/models/Qwen3-VL-2B-Instruct
  tiny_text_config:                # 迷你 Qwen3-VL 文本塔（结构同源、维度缩小）
    hidden_size: 64
    intermediate_size: 128
    num_hidden_layers: 2
    num_attention_heads: 4
    num_key_value_heads: 2
    head_dim: 16
    vocab_size: 151936             # 与真 tokenizer 对齐
    rms_norm_eps: 1.0e-6
    attention_bias: false
    attention_dropout: 0.0
    max_position_embeddings: 8192
    rope_theta: 5000000
    rope_scaling:
      rope_type: default
      mrope_section: [3, 3, 2]     # 和必须 = head_dim//2 = 8
      mrope_interleaved: true
    pad_token_id: 151643
  patch_size: 2
  time_gap: 2048
  timestep_multiplier: 1.0         # 与正式配置一致（Cosmos3 对齐），避免 smoke 语义脱节
  text_max_length: 64
  cfg_dropout_prob: 0.1
  prompt_template:
    enabled: true
  gradient_checkpointing: false

vae:
  name: fake
  downsample_factor: 16
  latent_channels: 16              # tiny：proj 维度小一点跑得快

dataset:
  store_cls: training.stub_data.StubT2IDataset
  mode: latents                    # 直接随机 latent，跳过 VAE
  image_size: 128                  # latent 8x8 -> patch 后 4x4=16 个图 token
  latent_channels: 16
  downsample_factor: 16
  overfit_one: true                # 单 batch 过拟合检查 loss 下降
  seed: 0

sigma_sampling:
  dist: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  shift: 1.0                       # per-分辨率固定 shift（tiny/低分≈不 shift）

optimizer:
  name: torch.optim.AdamW
  params:
    lr: 1.0e-3
    weight_decay: 0.0              # frozen LM 下 wd=0（方案0608）
    betas: [0.9, 0.95]

scheduler:
  num_warmup_steps: 5
  decay: constant

trainer:
  seed: 42
  batch_size: 4
  max_steps: 100
  gradient_clip_val: 1.0
  log_every: 10
  checkpoint_steps: 50
  checkpoint_dir: outputs/debug_tiny_cpu
  resume: false
  # --- wandb（可选，默认关闭）；正式 config 照此加这几行 ---
  use_wandb: false          # 改 true 开启；仅 rank0 上报，metrics.jsonl 始终双写
  wandb_project: mot_pilot_v1
  # wandb_entity: your-username   # 留空=个人默认 entity（用自己的号即可）
  # run_name: my-run              # 留空=用 checkpoint_dir 的 basename
  wandb_mode: online        # 在线优先；探测到 api.wandb.ai 不可达自动退 offline
