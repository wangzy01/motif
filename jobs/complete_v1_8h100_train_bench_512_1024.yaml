# complete_v1 real-data + real-model train-only 8xH100 benchmark for 512/1024.
# Submit: jcc job submit jobs/complete_v1_8h100_train_bench_512_1024.yaml
name: evan-mot-complete-v1-8h100-train-bench-512-1024
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 8
cpuPerWorker: 80
memGBPerWorker: 1200
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1

  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=4
  export PYTHONUNBUFFERED=1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton
  mkdir -p /local/evan/mot_stats /local/evan/mot_bench /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  STATS=/local/evan/mot_stats/monet_global_stats.json

  echo "===== STACK PROBE ====="
  date -u
  hostname
  nvidia-smi
  $PY -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available(), 'ndev', torch.cuda.device_count())"

  echo "===== PRECOMPUTE MONET GLOBAL STATS CACHE ====="
  PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1 $PY - <<'PY'
  import json, time
  from training.dataline.config import load_sampling_config
  from training.dataline.manifest_index import list_shards, compute_real_global_stats
  cfg = load_sampling_config('/fsx/evan/mot_code/data_analysis/configs/t5_sampling_complete_v1.json')
  shards = list_shards(cfg)['monet_real']
  t0 = time.perf_counter()
  stats = compute_real_global_stats(shards, cache_path='/local/evan/mot_stats/monet_global_stats.json')
  print('STATS_CACHE_JSON ' + json.dumps({
      'monet_shards': len(shards),
      'source_keys': len(stats['source_counts']),
      'cluster_keys': len(stats['cluster_sizes']),
      'sec': round(time.perf_counter() - t0, 3),
  }), flush=True)
  PY

  echo "===== TRAIN BENCH stage 512 ====="
  $PY -m torch.distributed.run --nproc_per_node=8 --master_port=29822 \
    train.py --config configs/stage1a_t2i_512.yaml --max-steps 12 \
    dataset.stats_cache="$STATS" trainer.resume=false trainer.save_final=false trainer.checkpoint_steps=0 \
    trainer.checkpoint_dir=/local/evan/mot_bench/train_stage512_rerun trainer.log_every=1

  echo "===== TRAIN BENCH stage 1024 ====="
  $PY -m torch.distributed.run --nproc_per_node=8 --master_port=29823 \
    train.py --config configs/stage2_1024.yaml --max-steps 8 \
    dataset.stats_cache="$STATS" trainer.resume=false trainer.save_final=false trainer.checkpoint_steps=0 \
    trainer.checkpoint_dir=/local/evan/mot_bench/train_stage1024_rerun trainer.log_every=1

  echo "===== DONE ====="
  date -u
