# Exact 3-step, 1-node x 8-GPU smoke.  It starts from an empty checkpoint
# namespace, exercises W8 semantic data + GPIC blob runtime, then independently
# inspects last.pt for the approved architecture and actual adapter/MLF updates.
name: evan-offarb-s256-20260718-causalmlf-smoke-1x8-v1
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 8
cpuPerWorker: 80
memGBPerWorker: 900
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=4 PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  CACHE_TAG=${JCC_JOB_ID:-${JOB_ID:-manual}}
  export PYTHONPYCACHEPREFIX="/local/evan/stage256_20260718_pycache/$CACHE_TAG/$(hostname)"
  mkdir -p "$PYTHONPYCACHEPREFIX"
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN FI_EFA_USE_DEVICE_RDMA=1
  export OFFLINE_ARB_PREFETCH_STEPS=4 OFFLINE_ARB_STEP_TIMEOUT_S=1800
  unset OFFLINE_ARB_GPIC_THREADS_PER_NODE
  unset MALLOC_ARENA_MAX MALLOC_TRIM_THRESHOLD_ ARROW_DEFAULT_MEMORY_POOL LD_PRELOAD TCMALLOC_RELEASE_RATE
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  RUN_ID=stage256_20260718_causalmlf_offline_exact_v1_smoke_1x8
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ROOT=$BASE/offline_arb_stage256_20260718_semantic_v1
  RES=$ROOT/smoke_1x8
  CK=/fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/stage256_20260718_causalmlf_offline_exact_v1_smoke_1x8
  CFG=configs/stage256_20260718_causalmlf_offline_exact_v1.yaml
  PLAN=$ROOT/w8_smoke/plan
  CAT=$BASE/offline_arb_catalog_v1
  ARTIFACT_BUILDTAG=evan-mot-crop-offlinearb-gpic-s3-production-build-zg8g
  ARTIFACT_ROOT=$BASE/offline_gpic_blob_v1_release/$ARTIFACT_BUILDTAG
  MANIFEST_SHA256=a18ba1f1250e3b00abdc1051dc71e08a254b8855d5b61b9975e88d2e6ae2ee05
  EXPECTED_ARCH_FP_SHA256=70546507a768a9d01705b8118b6e3cfea3f055f22db5e9bcdfb3e25e7d022642
  YAML_SELF=jobs/offline_exact_stage256_20260718_smoke_1x8.yaml
  GPIC_PREFLIGHT=scripts/offline_arb/verify_offline_gpic_compact_controls.py
  CHECKPOINT_VERIFY=scripts/offline_arb/verify_stage256_20260718_smoke_checkpoint.py

  test -f "$ROOT/FREEZE_VERIFY_SUCCESS.json" && test ! -L "$ROOT/FREEZE_VERIFY_SUCCESS.json"
  test -f "$ROOT/FREEZE_MANIFEST.json" && test ! -L "$ROOT/FREEZE_MANIFEST.json"
  test -f "$PLAN/PLAN_AUDIT_SUCCESS.json" && test ! -L "$PLAN/PLAN_AUDIT_SUCCESS.json"
  test -f "$ROOT/OVERLAY_VERIFY_SUCCESS.json" && test ! -L "$ROOT/OVERLAY_VERIFY_SUCCESS.json"
  test -f "$PLAN/header.json" && test ! -L "$PLAN/header.json"
  test -f "$CFG" && test ! -L "$CFG"
  test -f "$GPIC_PREFLIGHT" && test -f "$CHECKPOINT_VERIFY"
  # Raw token kept for static audit: trainer.init_from is forbidden.
  if grep -Eq '^[[:space:]]+init_from:' "$CFG"; then echo "FATAL: trainer.init_from is forbidden"; exit 42; fi
  test ! -e "$CK" && test ! -L "$CK" \
    || { echo "FATAL: smoke checkpoint namespace is not fresh: $CK"; exit 42; }
  test ! -e "$RES" && test ! -L "$RES" \
    || { echo "FATAL: smoke result namespace is not fresh: $RES"; exit 42; }
  mkdir -p "$CK" "$RES"

  # Recompute the exact architecture constant from the candidate config.
  "$PY" - "$CFG" "$EXPECTED_ARCH_FP_SHA256" <<'PYEOF'
  import hashlib, json, sys, yaml
  c = yaml.safe_load(open(sys.argv[1], encoding="utf-8")); m=c["model"]; t=m["text_adapter"]; u=m["und_lora"]
  fp={"text_adapter.enabled":bool(t["enabled"]),"text_adapter.bidirectional":bool(t["bidirectional"]),"text_adapter.num_layers":int(t["num_layers"]),"text_adapter.rope":bool(t["rope"]),"text_adapter.multi_layer_fusion.enabled":bool(t["multi_layer_fusion"]["enabled"]),"text_adapter.multi_layer_fusion.num_layers":int(t["multi_layer_fusion"]["num_layers"]),"und_lora.enabled":bool(u["enabled"]),"und_lora.num_layers":int(u["num_layers"]),"und_lora.rank":int(u["rank"]),"und_lora.alpha":float(u["alpha"]),"und_lora.lr_scale":float(u["lr_scale"]),"und_lora.target_modules":",".join(sorted(u["target_modules"])),"long_skip.enabled":bool(m["long_skip"]["enabled"]),"long_skip.mode":str(m["long_skip"]["mode"]),"noise_condition":bool(m["noise_condition"]),"abs_sincos.enabled":bool(m["abs_sincos"]["enabled"]),"sandwich_norm":bool(m["sandwich_norm"]),"patch_size":int(m["patch_size"])}
  digest=hashlib.sha256(json.dumps(fp,sort_keys=True,separators=(",",":")).encode()).hexdigest()
  assert digest == sys.argv[2], (digest, fp)
  assert "init_from" not in c["trainer"]
  print("ARCH_FP_PASS", digest)
  PYEOF
  "$PY" - "$ROOT/FREEZE_VERIFY_SUCCESS.json" "$ROOT/FREEZE_MANIFEST.json" "$PLAN/PLAN_AUDIT_SUCCESS.json" "$ROOT/OVERLAY_VERIFY_SUCCESS.json" "$PLAN/header.json" <<'PYEOF'
  import hashlib, json, pathlib, sys
  freeze_p, manifest_p, audit_p, overlay_p, header_p = map(pathlib.Path,sys.argv[1:])
  load=lambda p:json.load(open(p,encoding="utf-8"))
  freeze,audit,overlay,header=load(freeze_p),load(audit_p),load(overlay_p),load(header_p)
  assert freeze.get("status")==audit.get("status")==overlay.get("status")=="PASS"
  assert freeze["freeze_sha256"]==hashlib.sha256(manifest_p.read_bytes()).hexdigest()
  assert int(audit["formal_prefix"]["steps"])==3
  assert int(audit["formal_prefix"]["exposures"])==864
  assert int(audit["full_stage"]["anime_tag_only_exposures"])==0
  assert int(overlay["tag_only_exposure"])==0
  catalog,assignment=header["catalog_hash"],header["assignment_hash"]
  assert header["upstream_catalog_hash"]==catalog and header["upstream_assignment_hash"]==assignment
  assert header["hashes"]["catalog_sha256"]==catalog and header["hashes"]["assignment_sha256"]==assignment
  print("SMOKE_RELEASE_CONTROL_PASS")
  PYEOF

  HOST=$(hostname); JOBTAG=${HOST%-*}; STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  GPIC_JSON=$RES/gpicpreflight.$JOBTAG.$STAMP.json
  "$PY" "$GPIC_PREFLIGHT" \
    --artifact-root "$ARTIFACT_ROOT" --buildtag "$ARTIFACT_BUILDTAG" \
    --manifest-sha256 "$MANIFEST_SHA256" --catalog-root "$CAT" \
    --plan-root "$PLAN" --config "$CFG" --job-yaml "$YAML_SELF" \
    --jobtag "$JOBTAG" --node-rank 0 --output "$GPIC_JSON"

  set +e
  "$PY" -m torch.distributed.run --standalone --nnodes 1 --nproc-per-node 8 \
    train.py --config "$CFG" --max-steps 3 \
    trainer.resume=false \
    trainer.checkpoint_dir="$CK" \
    trainer.checkpoint_steps=3 \
    trainer.save_final=true \
    dataset.offline_plan_root="$PLAN" \
    dataset.gpic_payload_backend=offline_gpic_blob_v1 \
    dataset.offline_gpic_blob_root="$ARTIFACT_ROOT" \
    dataset.gpic_blob_manifest_sha256="$MANIFEST_SHA256" \
    dataset.gpic_blob_fd_cache_size=1024 \
    2>&1 | tee "$RES/train.$JOBTAG.$STAMP.log"
  PIPE_RC=("${PIPESTATUS[@]}")
  set -e
  [ "${PIPE_RC[1]}" -eq 0 ] || { echo "FATAL: smoke evidence tee failed"; exit "${PIPE_RC[1]}"; }
  [ "${PIPE_RC[0]}" -eq 0 ] || exit "${PIPE_RC[0]}"
  test -f "$CK/last.pt" && test ! -L "$CK/last.pt"
  grep -qE '^\[train\] step 3/3 ' "$RES/train.$JOBTAG.$STAMP.log"

  CHECKPOINT_RECEIPT=$ROOT/SMOKE_CHECKPOINT_SUCCESS.json
  "$PY" "$CHECKPOINT_VERIFY" \
    --repo-root /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop \
    --config "$(pwd)/$CFG" \
    --checkpoint "$CK/last.pt" \
    --expected-step 3 \
    --eval-helper /fsx/evan/mot_code/data_analysis/eval_releases/stage256_offline_exact_v1_vs_prev_final_20260718a/sample_two_final_eval.py \
    --output "$CHECKPOINT_RECEIPT"

  "$PY" - "$ROOT" "$CHECKPOINT_RECEIPT" "$GPIC_JSON" "$EXPECTED_ARCH_FP_SHA256" <<'PYEOF'
  import hashlib, json, os, pathlib, sys
  root, checkpoint_path, gpic_path = map(pathlib.Path, sys.argv[1:4]); arch = sys.argv[4]
  output = root / "SMOKE_SUCCESS.json"
  assert not output.exists() and not output.is_symlink(), output
  checkpoint = json.load(open(checkpoint_path, encoding="utf-8")); gpic = json.load(open(gpic_path, encoding="utf-8"))
  assert checkpoint.get("status") == "PASS", checkpoint
  assert gpic.get("status") == "PASS", gpic
  value={"status":"PASS","run_id":"stage256_20260718_causalmlf_offline_exact_v1","expected_step":3,"tag_only_exposure":0,"architecture_fingerprint_sha256":arch,"checkpoint_receipt_sha256":hashlib.sha256(checkpoint_path.read_bytes()).hexdigest(),"gpic_preflight_sha256":hashlib.sha256(gpic_path.read_bytes()).hexdigest()}
  fd=os.open(output,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o444)
  with os.fdopen(fd,"w",encoding="utf-8") as f: json.dump(value,f,indent=2,sort_keys=True); f.write("\n"); f.flush(); os.fsync(f.fileno())
  print(json.dumps(value,indent=2,sort_keys=True))
  PYEOF
