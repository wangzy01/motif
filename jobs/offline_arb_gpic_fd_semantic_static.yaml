# CPU-only preflight for the dedicated GPIC fd semantic/audit chain.
name: evan-offarb-gpic-fd-semantic-static
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  cd "$REPO"
  export PYTHONPATH="$REPO"
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  HOST=$(hostname)
  TMP=/local/evan/offline_arb_gpic_fd_semantic_static_$HOST
  export STATIC_TMP=$TMP
  test ! -e "$TMP" && test ! -L "$TMP"
  mkdir -p -m 0700 "$TMP/pycache"
  export PYTHONPYCACHEPREFIX=$TMP/pycache

  "$PY" -m py_compile \
    scripts/offline_arb/run_gpic_fd_semantic_gate.py \
    scripts/offline_arb/run_gpic_fd_contract_negatives.py \
    scripts/offline_arb/smoke_gpic_fd_semantic_loader.py \
    scripts/offline_arb/audit_gpic_fd_semantic_gate.py

  "$PY" - <<'PYEOF'
  import subprocess
  from pathlib import Path
  import yaml

  jobs = (
      "jobs/offline_arb_gpic_fd_semantic_gate.yaml",
      "jobs/offline_arb_gpic_fd_semantic_independent_audit.yaml",
      "jobs/offline_arb_gpic_fd_semantic_static.yaml",
  )
  for path in jobs:
      value = yaml.safe_load(Path(path).read_text(encoding="utf-8"))
      assert value["gpuPerWorker"] == 0
      assert value["cpuPerWorker"] == 16
      assert value["maxRetries"] == 0
      subprocess.run(
          ["bash", "-n"], input=value["command"].encode("utf-8"), check=True
      )
  formal = yaml.safe_load(
      Path("configs/stage256_offline_exact_v1.yaml").read_text(encoding="utf-8")
  )
  assert formal["dataset"]["gpic_payload_in_memory"] is True
  assert formal["dataset"]["gpic_source_consistency_mode"] == "strict_path"
  assert formal["dataset"]["gpic_threads_per_node"] == 16

  capture = Path("scripts/offline_arb/run_gpic_fd_semantic_gate.py").read_text()
  audit = Path("scripts/offline_arb/audit_gpic_fd_semantic_gate.py").read_text()
  wrapper = Path("scripts/offline_arb/smoke_gpic_fd_semantic_loader.py").read_text()
  negative = Path("scripts/offline_arb/run_gpic_fd_contract_negatives.py").read_text()
  for token in (
      "trace_sha256", "prompts_sha256", "pixels_sha256", "cfg_keep_sha256",
      "runtime_identities", "gpic_threads_per_node", "gpic_workers_per_rank",
      "fstat_calls", "path_stat_calls", "rejected_emits_before_closure",
      "REQUIRED_CONSUMED_WINDOW_STARTS", "attempt_state_token",
      "proc_starttime_ticks", "exclusive_claim", "capture_manifest",
      "assert_artifact_tree_exact", "workers",
  ):
      assert token in capture, token
  for token in (
      "per_rank_exact_hashes", "audit_telemetry_rank", "audit_negative",
      "runtime_identity_contract", "refusing to overwrite audit output",
      "SourceTreeFreeze", "verify_unchanged", "audit_capture_manifest",
  ):
      assert token in audit, token
  for token in ("GPIC_FD_RUNTIME_IDENTITY", "os.write", "ORIGINAL_WORKER"):
      assert token in wrapper, token
  for token in ("short_read", "in_place", "namespace", "PASS_OLD_OPENED_INODE"):
      assert token in negative, token
  PYEOF

  "$PY" - <<'PYEOF'
  import os
  import shutil
  import tempfile
  import threading
  from concurrent.futures import ThreadPoolExecutor
  from pathlib import Path

  from scripts.offline_arb.run_gpic_fd_semantic_gate import (
      GateError,
      atomic_bytes,
      expected_artifact_directories,
      expected_artifact_files,
      exclusive_claim,
  )
  from scripts.offline_arb.audit_gpic_fd_semantic_gate import (
      AuditError,
      SourceTreeFreeze,
      expected_source_directories,
      expected_source_files,
  )

  base = Path(tempfile.mkdtemp(prefix="atomic-tree-selftest-", dir=os.environ["STATIC_TMP"]))
  try:
      hosts = {"strict_path": "static-0", "fd_stable": "static-1"}
      assert expected_artifact_directories() == expected_source_directories()
      assert expected_artifact_files(hosts, phase="final") == expected_source_files(hosts)
      assert len(expected_source_files(hosts)) == 58
      assert len(expected_source_directories()) == 11
      barrier = threading.Barrier(2)
      claim_path = base / "claim.json"

      def claim_writer(index):
          barrier.wait()
          try:
              exclusive_claim(claim_path, {"writer": index})
              return "PASS"
          except GateError:
              return "REJECTED"

      with ThreadPoolExecutor(max_workers=2) as pool:
          claim_results = list(pool.map(claim_writer, (0, 1)))
      assert sorted(claim_results) == ["PASS", "REJECTED"], claim_results

      barrier = threading.Barrier(2)
      final_path = base / "ordinary.json"

      def ordinary_writer(index):
          barrier.wait()
          try:
              atomic_bytes(final_path, f"writer={index}\n".encode())
              return "PASS"
          except GateError:
              return "REJECTED"

      with ThreadPoolExecutor(max_workers=2) as pool:
          publish_results = list(pool.map(ordinary_writer, (0, 1)))
      assert sorted(publish_results) == ["PASS", "REJECTED"], publish_results
      assert not list(base.glob("*.tmp")) and not list(base.glob(".*.tmp"))

      def fixture(label):
          root = base / label
          root.mkdir()
          (root / "evidence.bin").write_bytes(b"frozen-evidence")
          return root

      clean = fixture("clean")
      clean_freeze = SourceTreeFreeze(clean)
      clean_freeze.verify_unchanged()

      tamper = fixture("tamper")
      tamper_freeze = SourceTreeFreeze(tamper)
      (tamper / "evidence.bin").write_bytes(b"tampered-bytes!")
      try:
          tamper_freeze.verify_unchanged()
      except AuditError:
          pass
      else:
          raise AssertionError("auditor accepted mid-run byte tamper")

      extra = fixture("extra")
      extra_freeze = SourceTreeFreeze(extra)
      (extra / "unexpected.bin").write_bytes(b"extra")
      try:
          extra_freeze.verify_unchanged()
      except AuditError:
          pass
      else:
          raise AssertionError("auditor accepted an extra source artifact")

      symlink = fixture("symlink")
      symlink_freeze = SourceTreeFreeze(symlink)
      (symlink / "link.bin").symlink_to(symlink / "evidence.bin")
      try:
          symlink_freeze.verify_unchanged()
      except AuditError:
          pass
      else:
          raise AssertionError("auditor accepted a source-tree symlink")
  finally:
      shutil.rmtree(base, ignore_errors=True)
  print("ATOMIC_TREE_SELFTEST_PASS claim=1/2 publish=1/2 clean=PASS tamper=FAIL extra=FAIL symlink=FAIL")
  PYEOF

  "$PY" - <<'PYEOF'
  from training.dataline_offline.offline_dataset import (
      OfflineLoaderError,
      _resolved_gpic_threads_per_node,
  )
  assert _resolved_gpic_threads_per_node(16, 16, 4) == 16
  assert _resolved_gpic_threads_per_node(16, None, 4) == 16
  for args in ((16, 8, 4), (18, 18, 4), (2, 2, 4)):
      try:
          _resolved_gpic_threads_per_node(*args)
      except OfflineLoaderError:
          pass
      else:
          raise AssertionError(f"resolution negative unexpectedly passed: {args}")
  PYEOF

  "$PY" - "$TMP/run.json" "$HOST" <<'PYEOF'
  import json, sys
  from pathlib import Path
  Path(sys.argv[1]).write_text(
      json.dumps({
          "schema_version": "offline_arb_gpic_fd_semantic_run_v1",
          "jobtag": "static-attempt",
          "run_nonce": "a" * 64,
          "worker0_host": sys.argv[2],
      }, sort_keys=True) + "\n",
      encoding="utf-8",
  )
  PYEOF
  "$PY" scripts/offline_arb/run_gpic_fd_contract_negatives.py \
    --run-json "$TMP/run.json" --jobtag static-attempt \
    --host "$HOST" --worker-index 0 \
    --local-root "$TMP/negative-fixture" --output "$TMP/negative_contract.json"
  "$PY" - "$TMP/negative_contract.json" <<'PYEOF'
  import json, sys
  from pathlib import Path
  value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
  expected = {
      "normal_success": 4,
      "short_read_rejected": 4,
      "in_place_rejected": 4,
      "namespace_strict_rejected": 2,
      "namespace_fd_old_inode": 2,
      "invalid_mode_rejected": 5,
  }
  assert value["status"] == "PASS"
  assert value["summary"] == expected
  assert value["case_count"] == sum(expected.values()) == 21
  assert value["claim"]["path"] == str(Path(sys.argv[1]).parent / "claim.negative.json")
  assert (Path(sys.argv[1]).parent / "claim.negative.json").is_file()
  rejected = [case for case in value["cases"] if case["outcome"] == "EXPECTED_REJECTION"]
  assert len(rejected) == 15
  assert all(
      case["error_type"] == "OfflineLoaderError"
      and case["error_category"]
      and case["required_substring"]
      for case in rejected
  )
  PYEOF
  echo "GPIC_FD_SEMANTIC_STATIC_PASS host=$HOST negative_cases=21"
