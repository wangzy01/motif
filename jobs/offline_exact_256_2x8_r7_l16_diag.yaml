# OFFLINE_ARB_V1 r7-L16 diagnostic: one clean 2x8, 192-step run.
#
# This is a diagnostic only.  It cannot authorize FORMAL by itself: a winning
# thread count still requires semantic A/B, a fresh freeze, and the complete
# A350/B500 GPU validation.  Window telemetry stays node-local during training;
# after torchrun exits each node seals its eight rank files into an FSX staging
# directory, re-hashes the copies, and atomically publishes the directory.
name: evan-mot-crop-offline-exact-256-2x8-r7-l16-diag
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 2
gpuPerWorker: 8
cpuPerWorker: 48
memGBPerWorker: 900
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=6 PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN
  export FI_EFA_USE_DEVICE_RDMA=1
  export OFFLINE_ARB_STEP_TIMEOUT_S=1800
  export OFFLINE_ARB_GPIC_THREADS_PER_NODE=16
  export OFFLINE_ARB_PREFETCH_STEPS=4
  export OFFLINE_ARB_WAIT_LOG_THRESHOLD_S=2
  export OFFLINE_ARB_IO_STATE_EVERY_STEPS=4
  export OFFLINE_ARB_PROFILE_WINDOWS=0
  unset OFFLINE_ARB_IO_TELEMETRY_DIR OFFLINE_ARB_ATTEMPT_JOBTAG OFFLINE_ARB_ATTEMPT_NONCE OFFLINE_ARB_ATTEMPT_HOST OFFLINE_ARB_SIDECAR_HEADER_SHA256 OFFLINE_ARB_SIDECAR_RELEASE_DIGEST OFFLINE_ARB_SMOKE_DATASET_CONFIG
  unset MALLOC_ARENA_MAX MALLOC_TRIM_THRESHOLD_ ARROW_DEFAULT_MEMORY_POOL LD_PRELOAD TCMALLOC_RELEASE_RATE
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  RUN_ID=stage256_offline_exact_2x8_r7_l16_diag_20260712
  CFG=configs/stage256_offline_exact_v1.yaml
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  PLAN=$BASE/offline_arb_plans_v1/w16_gpuval/plan
  CAT=$BASE/offline_arb_catalog_v1
  SIDECAR=$BASE/offline_arb_caption_sidecar_v1
  BS=36
  NNODES=2
  LOCAL_RANKS=8
  YAML_SELF=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop/jobs/offline_exact_256_2x8_r7_l16_diag.yaml
  SOURCE_SELF=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop/training/dataline_offline/offline_dataset.py
  test -f "$PLAN/header.json" || { echo "FATAL: w16_gpuval plan missing"; exit 34; }
  test -f "$CAT/header.json" || { echo "FATAL: catalog header missing"; exit 34; }
  test -f "$SIDECAR/header.json" || { echo "FATAL: caption sidecar missing"; exit 34; }
  test -f "$SOURCE_SELF" || { echo "FATAL: offline dataset source missing"; exit 34; }
  NW_DECL=$(grep -m1 '^numWorkers:' "$YAML_SELF" | awk '{print $2}')
  GPU_DECL=$(grep -m1 '^gpuPerWorker:' "$YAML_SELF" | awk '{print $2}')
  [ "$NW_DECL" = "$NNODES" ] && [ "$GPU_DECL" = "$LOCAL_RANKS" ] \
    || { echo "FATAL: yaml topology drift workers=$NW_DECL gpu=$GPU_DECL"; exit 21; }

  HOST=$(hostname)
  NODE_RANK=${HOST##*-}
  JOBTAG=${HOST%-*}
  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  case "$NODE_RANK" in (0|1) ;; (*) echo "FATAL: invalid node rank $NODE_RANK"; exit 21;; esac
  RES=$BASE/$RUN_ID/$JOBTAG
  CK=$RES/ckpt
  mkdir -p "$RES" "$CK"
  if find "$CK" -mindepth 1 -print -quit | grep -q .; then
    echo "FATAL: r7-L16 checkpoint namespace is not empty: $CK"
    exit 37
  fi

  # Every node publishes a fresh boundary first.  Node 0's full sidecar PASS is
  # accepted only after both attempt-bound markers exist and are recent.
  PREFLIGHT_JSON=$RES/sidecarpreflight.$JOBTAG.json
  PREFLIGHT_PASS=$RES/sidecarpreflight.$JOBTAG.pass
  FRESH_MARKER=$RES/sidecarpreflight.$JOBTAG.n$NODE_RANK.fresh
  rm -f "$FRESH_MARKER" "$FRESH_MARKER.tmp"
  MARK_TS=$(date +%s)
  printf 'READY|%s|%s|%s|%s\n' "$JOBTAG" "$NODE_RANK" "$MARK_TS" "$HOST" > "$FRESH_MARKER.tmp"
  mv "$FRESH_MARKER.tmp" "$FRESH_MARKER"
  if [ "$NODE_RANK" = "0" ]; then
    rm -f "$PREFLIGHT_JSON" "$PREFLIGHT_JSON.tmp" "$PREFLIGHT_PASS" "$PREFLIGHT_PASS.tmp"
    MARKERS_READY=0
    for _ in $(seq 1 600); do
      READY=1
      NOW=$(date +%s)
      for RANK in $(seq 0 $((NNODES - 1))); do
        MARKER=$RES/sidecarpreflight.$JOBTAG.n$RANK.fresh
        M_STATUS=""; M_JOBTAG=""; M_RANK=""; M_TS=""; M_HOST=""
        if [ -f "$MARKER" ] && [ ! -L "$MARKER" ]; then
          IFS='|' read -r M_STATUS M_JOBTAG M_RANK M_TS M_HOST < "$MARKER" || true
        fi
        case "$M_TS" in (*[!0-9]*|'') READY=0 ;; esac
        if [ "$M_STATUS" != READY ] || [ "$M_JOBTAG" != "$JOBTAG" ] \
           || [ "$M_RANK" != "$RANK" ] || [ -z "$M_HOST" ] \
           || [ "$READY" -ne 1 ] || [ "$M_TS" -gt $((NOW + 60)) ] \
           || [ $((NOW - M_TS)) -ge 1800 ]; then
          READY=0
        fi
      done
      if [ "$READY" -eq 1 ]; then MARKERS_READY=1; break; fi
      sleep 2
    done
    [ "$MARKERS_READY" -eq 1 ] \
      || { echo "FATAL: all-node fresh marker barrier timed out"; exit 35; }
    timeout --signal=TERM --kill-after=30s 7200s \
      "$PY" scripts/offline_arb/make_freeze_manifest.py \
        --verify-sidecar --sidecar-root "$SIDECAR" --catalog-root "$CAT" \
        > "$PREFLIGHT_JSON.tmp"
    mv "$PREFLIGHT_JSON.tmp" "$PREFLIGHT_JSON"
    PREFLIGHT_JSON_SHA=$(sha256sum "$PREFLIGHT_JSON" | awk '{print $1}')
    read -r SIDE_HEADER SIDE_HEADER_FILE SIDE_SUCCESS_FILE SIDE_CATALOG_HEADER SIDE_RELEASE < <(
      "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x.get("status")=="PASS" and x.get("mode")=="verify-sidecar"; print(x["header_sha256"],x["header_file_sha256"],x["success_file_sha256"],x["catalog_header_sha256"],x["release_digest"])' "$PREFLIGHT_JSON"
    )
    NONCE=$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')
    NOW=$(date +%s)
    printf 'PASS|%s|%s|%s|%s|%s|%s|%s|%s|%s\n' \
      "$JOBTAG" "$NONCE" "$NOW" "$SIDE_HEADER" "$SIDE_HEADER_FILE" \
      "$SIDE_SUCCESS_FILE" "$SIDE_CATALOG_HEADER" "$SIDE_RELEASE" \
      "$PREFLIGHT_JSON_SHA" > "$PREFLIGHT_PASS.tmp"
    mv "$PREFLIGHT_PASS.tmp" "$PREFLIGHT_PASS"
  fi

  for _ in $(seq 1 2400); do
    [ -f "$PREFLIGHT_PASS" ] && [ ! -L "$PREFLIGHT_PASS" ] \
      && [ "$PREFLIGHT_PASS" -nt "$FRESH_MARKER" ] && break
    sleep 4
  done
  [ -f "$PREFLIGHT_PASS" ] && [ ! -L "$PREFLIGHT_PASS" ] \
    && [ "$PREFLIGHT_PASS" -nt "$FRESH_MARKER" ] \
    || { echo "FATAL: sidecar PASS is missing or not newer than local marker"; exit 35; }
  IFS='|' read -r PASS_STATUS PASS_JOBTAG PASS_NONCE PASS_TS PASS_HEADER PASS_HEADER_FILE PASS_SUCCESS_FILE PASS_CATALOG_HEADER PASS_RELEASE PASS_JSON_SHA < "$PREFLIGHT_PASS"
  [ "$PASS_STATUS" = PASS ] && [ "$PASS_JOBTAG" = "$JOBTAG" ] \
    || { echo "FATAL: sidecar PASS JOBTAG mismatch"; exit 35; }
  case "$PASS_NONCE" in (*[!0-9a-f]*|'') echo "FATAL: malformed sidecar PASS nonce"; exit 35;; esac
  [ "${#PASS_NONCE}" -eq 64 ] || { echo "FATAL: malformed sidecar nonce length"; exit 35; }
  case "$PASS_TS" in (*[!0-9]*|'') echo "FATAL: malformed sidecar PASS timestamp"; exit 35;; esac
  NOW=$(date +%s)
  [ "$PASS_TS" -le $((NOW + 60)) ] && [ $((NOW - PASS_TS)) -lt 10800 ] \
    || { echo "FATAL: stale/future sidecar PASS"; exit 35; }
  for VALUE in "$PASS_HEADER" "$PASS_HEADER_FILE" "$PASS_SUCCESS_FILE" "$PASS_CATALOG_HEADER" "$PASS_RELEASE" "$PASS_JSON_SHA"; do
    case "$VALUE" in (*[!0-9a-f]*|'') echo "FATAL: malformed sidecar PASS hash"; exit 35;; esac
    [ "${#VALUE}" -eq 64 ] || { echo "FATAL: malformed sidecar PASS hash length"; exit 35; }
  done
  [ -f "$PREFLIGHT_JSON" ] && [ ! -L "$PREFLIGHT_JSON" ] \
    || { echo "FATAL: shared preflight JSON missing"; exit 35; }
  LIVE_JSON_SHA=$(sha256sum "$PREFLIGHT_JSON" | awk '{print $1}')
  [ "$LIVE_JSON_SHA" = "$PASS_JSON_SHA" ] \
    || { echo "FATAL: shared preflight JSON SHA mismatch"; exit 35; }
  read -r JSON_STATUS JSON_MODE JSON_HEADER JSON_HEADER_FILE JSON_SUCCESS_FILE JSON_CATALOG_HEADER JSON_RELEASE < <(
    "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); print(x.get("status"),x.get("mode"),x.get("header_sha256"),x.get("header_file_sha256"),x.get("success_file_sha256"),x.get("catalog_header_sha256"),x.get("release_digest"))' "$PREFLIGHT_JSON"
  )
  [ "$JSON_STATUS" = PASS ] && [ "$JSON_MODE" = verify-sidecar ] \
    && [ "$JSON_HEADER" = "$PASS_HEADER" ] \
    && [ "$JSON_HEADER_FILE" = "$PASS_HEADER_FILE" ] \
    && [ "$JSON_SUCCESS_FILE" = "$PASS_SUCCESS_FILE" ] \
    && [ "$JSON_CATALOG_HEADER" = "$PASS_CATALOG_HEADER" ] \
    && [ "$JSON_RELEASE" = "$PASS_RELEASE" ] \
    || { echo "FATAL: shared preflight JSON/PASS binding mismatch"; exit 35; }

  CONTROL_JSON=$RES/sidecarcontrol.$JOBTAG.n$NODE_RANK.$STAMP.json
  rm -f "$CONTROL_JSON" "$CONTROL_JSON.tmp"
  "$PY" scripts/offline_arb/make_freeze_manifest.py \
    --verify-sidecar-control --sidecar-root "$SIDECAR" --catalog-root "$CAT" \
    > "$CONTROL_JSON.tmp"
  mv "$CONTROL_JSON.tmp" "$CONTROL_JSON"
  read -r LIVE_HEADER LIVE_HEADER_FILE LIVE_SUCCESS_FILE LIVE_CATALOG_HEADER LIVE_RELEASE < <(
    "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x.get("status")=="PASS" and x.get("mode")=="verify-sidecar-control"; print(x["header_sha256"],x["header_file_sha256"],x["success_file_sha256"],x["catalog_header_sha256"],x["release_digest"])' "$CONTROL_JSON"
  )
  [ "$LIVE_HEADER" = "$PASS_HEADER" ] \
    && [ "$LIVE_HEADER_FILE" = "$PASS_HEADER_FILE" ] \
    && [ "$LIVE_SUCCESS_FILE" = "$PASS_SUCCESS_FILE" ] \
    && [ "$LIVE_CATALOG_HEADER" = "$PASS_CATALOG_HEADER" ] \
    && [ "$LIVE_RELEASE" = "$PASS_RELEASE" ] \
    || { echo "FATAL: sidecar controls changed after node0 preflight"; exit 35; }
  POST_JSON_SHA=$(sha256sum "$PREFLIGHT_JSON" | awk '{print $1}')
  [ "$POST_JSON_SHA" = "$PASS_JSON_SHA" ] \
    || { echo "FATAL: preflight JSON changed during per-node control close"; exit 35; }
  echo "sidecar preflight PASS jobtag=$JOBTAG nonce=$PASS_NONCE header=$PASS_HEADER release=$PASS_RELEASE json_sha=$PASS_JSON_SHA"

  # Rendezvous filename and payload are both attempt/nonce-bound.
  RDZV=$RES/rdzv.$JOBTAG.rR7.addr
  if [ "$NODE_RANK" = "0" ]; then
    rm -f "$RDZV" "$RDZV.tmp"
    MYIP=$(hostname -i | awk '{print $1}')
    printf '%s %s %s %s\n' "$MYIP" "$(date +%s)" "$JOBTAG" "$PASS_NONCE" > "$RDZV.tmp"
    mv "$RDZV.tmp" "$RDZV"
    MASTER_ADDR=$MYIP
  else
    MASTER_ADDR=""
    for _ in $(seq 1 2100); do
      if [ -s "$RDZV" ] && [ ! -L "$RDZV" ]; then
        TS=$(awk '{print $2}' "$RDZV" 2>/dev/null || true)
        TOKEN=$(awk '{print $3}' "$RDZV" 2>/dev/null || true)
        TOKEN_NONCE=$(awk '{print $4}' "$RDZV" 2>/dev/null || true)
        case "$TS" in (*[!0-9]*|'') TS="" ;; esac
        NOW_R=$(date +%s)
        if [ -n "$TS" ] && [ "$TOKEN" = "$JOBTAG" ] && [ "$TOKEN_NONCE" = "$PASS_NONCE" ] \
           && [ $((NOW_R - TS)) -lt 7200 ] && [ "$TS" -le $((NOW_R + 60)) ]; then
          MASTER_ADDR=$(awk '{print $1}' "$RDZV")
          break
        fi
      fi
      sleep 2
    done
    [ -n "$MASTER_ADDR" ] || { echo "FATAL: fresh r7 rendezvous missing"; exit 20; }
  fi

  # The path is unique to this JCC attempt, sidecar nonce, and node.  Resolve it
  # before export so an accidental /local symlink cannot redirect hot telemetry
  # writes to FSX.
  TELEM_LOCAL=/local/evan/offline_arb_r7_l16/$JOBTAG/$PASS_NONCE/node$NODE_RANK
  case "$TELEM_LOCAL" in (/local/*) ;; (*) echo "FATAL: telemetry path is not under /local"; exit 42;; esac
  [ ! -e "$TELEM_LOCAL" ] && [ ! -L "$TELEM_LOCAL" ] \
    || { echo "FATAL: telemetry path already exists: $TELEM_LOCAL"; exit 42; }
  mkdir -p -m 0700 "$TELEM_LOCAL"
  TELEM_REAL=$(realpath -e "$TELEM_LOCAL")
  case "$TELEM_REAL" in (/local/*) ;; (*) echo "FATAL: resolved telemetry path escaped /local: $TELEM_REAL"; exit 42;; esac
  [ "$TELEM_REAL" = "$TELEM_LOCAL" ] \
    || { echo "FATAL: telemetry path resolution drift: $TELEM_REAL != $TELEM_LOCAL"; exit 42; }
  export OFFLINE_ARB_IO_TELEMETRY_DIR=$TELEM_LOCAL
  export OFFLINE_ARB_ATTEMPT_JOBTAG=$JOBTAG
  export OFFLINE_ARB_ATTEMPT_NONCE=$PASS_NONCE
  export OFFLINE_ARB_ATTEMPT_HOST=$HOST
  export OFFLINE_ARB_SIDECAR_HEADER_SHA256=$PASS_HEADER
  export OFFLINE_ARB_SIDECAR_RELEASE_DIGEST=$PASS_RELEASE

  PROBE=$RES/probe.$JOBTAG.n$NODE_RANK.$STAMP.log
  {
    echo "RUN_ID=$RUN_ID jobtag=$JOBTAG node_rank=$NODE_RANK cfg=$CFG plan=$PLAN"
    echo "sidecar_header_sha256=$PASS_HEADER sidecar_release_digest=$PASS_RELEASE preflight_json_sha256=$PASS_JSON_SHA sidecar_nonce=$PASS_NONCE"
    echo "OFFLINE_ARB_GPIC_THREADS_PER_NODE=$OFFLINE_ARB_GPIC_THREADS_PER_NODE"
    echo "OFFLINE_ARB_PREFETCH_STEPS=$OFFLINE_ARB_PREFETCH_STEPS"
    echo "OFFLINE_ARB_WAIT_LOG_THRESHOLD_S=$OFFLINE_ARB_WAIT_LOG_THRESHOLD_S"
    echo "OFFLINE_ARB_IO_STATE_EVERY_STEPS=$OFFLINE_ARB_IO_STATE_EVERY_STEPS"
    echo "OFFLINE_ARB_PROFILE_WINDOWS=$OFFLINE_ARB_PROFILE_WINDOWS"
    echo "OFFLINE_ARB_IO_TELEMETRY_DIR=$OFFLINE_ARB_IO_TELEMETRY_DIR"
    echo "OFFLINE_ARB_ATTEMPT_JOBTAG=$OFFLINE_ARB_ATTEMPT_JOBTAG"
    echo "OFFLINE_ARB_ATTEMPT_NONCE=$OFFLINE_ARB_ATTEMPT_NONCE"
    echo "OFFLINE_ARB_ATTEMPT_HOST=$OFFLINE_ARB_ATTEMPT_HOST"
    echo "OFFLINE_ARB_SIDECAR_HEADER_SHA256=$OFFLINE_ARB_SIDECAR_HEADER_SHA256"
    echo "OFFLINE_ARB_SIDECAR_RELEASE_DIGEST=$OFFLINE_ARB_SIDECAR_RELEASE_DIGEST"
    echo "fetch_workers_tar=8(config) nnodes=$NNODES local_ranks=$LOCAL_RANKS per_rank_bs=$BS max_steps=192 checkpoint_steps=0 save_final=false resume=false force_os_exit_after_train=true skip_distributed_teardown=true"
    hostname
    nvidia-smi -L
    df -h /local | tail -1
    sha256sum \
      "$SOURCE_SELF" \
      training/dataline_offline/caption_sidecar.py \
      train.py \
      "$CFG" \
      "$PLAN/header.json" \
      "$CAT/header.json" \
      "$SIDECAR/header.json" \
      "$YAML_SELF"
  } 2>&1 | tee "$PROBE"

  DOTS_COMMON="dataset.offline_plan_root=$PLAN \
        trainer.checkpoint_dir=$CK trainer.batch_size=$BS \
        trainer.checkpoint_steps=0 trainer.save_final=false trainer.resume=false \
        trainer.force_os_exit_after_train=true trainer.skip_distributed_teardown=true \
        trainer.log_every=16 trainer.dataline_metrics_every=4"
  TRAIN_LOG=$RES/train.$JOBTAG.rR7.n$NODE_RANK.$STAMP.log
  echo "===== OFFLINE-EXACT r7-L16 2x8 node=$NODE_RANK master=$MASTER_ADDR max_steps=192 $(date -u) ====="
  set +e
  "$PY" -m torch.distributed.run \
    --nnodes "$NNODES" --nproc-per-node "$LOCAL_RANKS" --node-rank "$NODE_RANK" \
    --master-addr "$MASTER_ADDR" --master-port 29771 \
    train.py --config "$CFG" --max-steps 192 \
    $DOTS_COMMON \
    2>&1 | tee "$TRAIN_LOG"
  TRAIN_PIPE=("${PIPESTATUS[@]}")
  set -e
  TRAIN_RC=${TRAIN_PIPE[0]}
  TRAIN_TEE_RC=${TRAIN_PIPE[1]}
  echo "===== r7-L16 node=$NODE_RANK train_rc=$TRAIN_RC tee_rc=$TRAIN_TEE_RC $(date -u) ====="

  # Preserve telemetry before returning any train failure.  A malformed or
  # partial set is still copied with status=FAIL so the analyzer can distinguish
  # incomplete evidence from a performance NO_GO.
  shopt -s nullglob dotglob
  ALL_LOCAL_ENTRIES=("$TELEM_LOCAL"/*)
  JSONL_FILES=("$TELEM_LOCAL"/*.jsonl)
  shopt -u nullglob dotglob
  COLLECT_STATUS=PASS
  COLLECT_ERROR=""
  if [ "${#ALL_LOCAL_ENTRIES[@]}" -ne 8 ] || [ "${#JSONL_FILES[@]}" -ne 8 ]; then
    COLLECT_STATUS=FAIL
    COLLECT_ERROR="expected_exactly_8_jsonl_and_no_other_entries;entries=${#ALL_LOCAL_ENTRIES[@]};jsonl=${#JSONL_FILES[@]}"
  fi
  VALID_JSONL=()
  for FILE in "${JSONL_FILES[@]}"; do
    if [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ]; then
      VALID_JSONL+=("$FILE")
    else
      COLLECT_STATUS=FAIL
      COLLECT_ERROR="${COLLECT_ERROR};invalid_jsonl=$(basename "$FILE")"
    fi
  done
  if [ "${#VALID_JSONL[@]}" -ne 8 ]; then
    COLLECT_STATUS=FAIL
    COLLECT_ERROR="${COLLECT_ERROR};valid_jsonl=${#VALID_JSONL[@]}"
  fi

  LOCAL_MANIFEST=$TELEM_LOCAL/node_manifest.json
  export R7_JOBTAG=$JOBTAG R7_NONCE=$PASS_NONCE R7_NODE_RANK=$NODE_RANK R7_HOST=$HOST
  export R7_TRAIN_RC=$TRAIN_RC R7_TEE_RC=$TRAIN_TEE_RC
  export R7_COLLECT_STATUS=$COLLECT_STATUS R7_COLLECT_ERROR=$COLLECT_ERROR
  "$PY" - "$LOCAL_MANIFEST.tmp" "${VALID_JSONL[@]}" <<'PYEOF'
  import hashlib
  import json
  import os
  import stat
  import sys
  from pathlib import Path

  output = Path(sys.argv[1])
  files = []
  for raw in sys.argv[2:]:
      path = Path(raw)
      meta = path.lstat()
      if not stat.S_ISREG(meta.st_mode) or path.is_symlink() or meta.st_size <= 0:
          raise SystemExit(f"FATAL invalid telemetry file during manifest close: {path}")
      digest = hashlib.sha256()
      with path.open("rb", buffering=0) as handle:
          for chunk in iter(lambda: handle.read(1 << 20), b""):
              digest.update(chunk)
      files.append(
          {"name": path.name, "bytes": meta.st_size, "sha256": digest.hexdigest()}
      )
  files.sort(key=lambda item: item["name"])
  value = {
      "schema_version": "offline_arb_r7_l16_node_manifest_v1",
      "status": os.environ["R7_COLLECT_STATUS"],
      "error": os.environ["R7_COLLECT_ERROR"],
      "jobtag": os.environ["R7_JOBTAG"],
      "nonce": os.environ["R7_NONCE"],
      "node_rank": int(os.environ["R7_NODE_RANK"]),
      "host": os.environ["R7_HOST"],
      "train_rc": int(os.environ["R7_TRAIN_RC"]),
      "tee_rc": int(os.environ["R7_TEE_RC"]),
      "expected_rank_files": 8,
      "files": files,
  }
  payload = json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
  with output.open("x", encoding="utf-8") as handle:
      handle.write(payload)
      handle.flush()
      os.fsync(handle.fileno())
  PYEOF
  mv "$LOCAL_MANIFEST.tmp" "$LOCAL_MANIFEST"

  EVIDENCE_ROOT=$RES/telemetry.$JOBTAG
  FINAL_NODE=$EVIDENCE_ROOT/node$NODE_RANK
  STAGE_NODE=$EVIDENCE_ROOT/.node$NODE_RANK.$HOST.tmp
  mkdir -p "$EVIDENCE_ROOT"
  [ ! -e "$FINAL_NODE" ] && [ ! -L "$FINAL_NODE" ] \
    || { echo "FATAL: final telemetry evidence already exists: $FINAL_NODE"; exit 46; }
  rm -rf "$STAGE_NODE"
  mkdir -m 0700 "$STAGE_NODE"
  for FILE in "${VALID_JSONL[@]}"; do
    cp -- "$FILE" "$STAGE_NODE/$(basename "$FILE")"
  done
  cp -- "$LOCAL_MANIFEST" "$STAGE_NODE/node_manifest.json"

  # Re-open every FSX copy, enforce the manifest's exact file set/SHA/size, and
  # fsync files plus staging directory before the same-filesystem atomic rename.
  "$PY" - "$STAGE_NODE" "$JOBTAG" "$PASS_NONCE" "$NODE_RANK" <<'PYEOF'
  import hashlib
  import json
  import os
  import stat
  import sys
  from pathlib import Path

  root = Path(sys.argv[1])
  jobtag, nonce, node_raw = sys.argv[2:]
  manifest_path = root / "node_manifest.json"
  if manifest_path.is_symlink() or not manifest_path.is_file():
      raise SystemExit("FATAL copied node manifest missing/non-regular")
  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
  if (
      manifest.get("schema_version") != "offline_arb_r7_l16_node_manifest_v1"
      or manifest.get("jobtag") != jobtag
      or manifest.get("nonce") != nonce
      or manifest.get("node_rank") != int(node_raw)
  ):
      raise SystemExit("FATAL copied node manifest identity mismatch")
  declared = manifest.get("files")
  if not isinstance(declared, list):
      raise SystemExit("FATAL copied node manifest files malformed")
  expected = {"node_manifest.json"} | {item.get("name") for item in declared}
  observed = {path.name for path in root.iterdir()}
  if None in expected or observed != expected:
      raise SystemExit(f"FATAL copied telemetry set mismatch observed={observed} expected={expected}")
  for item in declared:
      path = root / item["name"]
      meta = path.lstat()
      if not stat.S_ISREG(meta.st_mode) or path.is_symlink() or meta.st_size != item["bytes"]:
          raise SystemExit(f"FATAL copied telemetry metadata mismatch: {path}")
      digest = hashlib.sha256()
      with path.open("rb", buffering=0) as handle:
          for chunk in iter(lambda: handle.read(1 << 20), b""):
              digest.update(chunk)
          os.fsync(handle.fileno())
      if digest.hexdigest() != item["sha256"]:
          raise SystemExit(f"FATAL copied telemetry SHA mismatch: {path}")
  with manifest_path.open("rb", buffering=0) as handle:
      os.fsync(handle.fileno())
  directory_fd = os.open(root, os.O_RDONLY | os.O_DIRECTORY)
  try:
      os.fsync(directory_fd)
  finally:
      os.close(directory_fd)
  PYEOF
  mv "$STAGE_NODE" "$FINAL_NODE"
  "$PY" - "$EVIDENCE_ROOT" <<'PYEOF'
  import os, sys
  descriptor = os.open(sys.argv[1], os.O_RDONLY | os.O_DIRECTORY)
  try:
      os.fsync(descriptor)
  finally:
      os.close(descriptor)
  PYEOF
  FINAL_MANIFEST_SHA=$(sha256sum "$FINAL_NODE/node_manifest.json" | awk '{print $1}')

  if [ "$COLLECT_STATUS" = PASS ]; then COLLECT_RC=0; else COLLECT_RC=46; fi
  READY_FILE=$RES/telemetry.$JOBTAG.n$NODE_RANK.ready
  rm -f "$READY_FILE" "$READY_FILE.tmp"
  printf 'PRESERVED|%s|%s|%s|%s|%s|%s|%s\n' \
    "$JOBTAG" "$PASS_NONCE" "$NODE_RANK" "$FINAL_MANIFEST_SHA" \
    "$TRAIN_RC" "$TRAIN_TEE_RC" "$COLLECT_RC" > "$READY_FILE.tmp"
  mv "$READY_FILE.tmp" "$READY_FILE"

  # Both wrappers wait for and verify both immutable node manifests.  This runs
  # even when torchrun failed, so partial diagnostic evidence is not discarded.
  BOTH_READY=0
  for _ in $(seq 1 900); do
    READY=1
    for RANK in $(seq 0 $((NNODES - 1))); do
      PEER=$RES/telemetry.$JOBTAG.n$RANK.ready
      P_STATUS=""; P_JOBTAG=""; P_NONCE=""; P_RANK=""; P_SHA=""; P_TRAIN=""; P_TEE=""; P_COLLECT=""
      if [ -f "$PEER" ] && [ ! -L "$PEER" ]; then
        IFS='|' read -r P_STATUS P_JOBTAG P_NONCE P_RANK P_SHA P_TRAIN P_TEE P_COLLECT < "$PEER" || true
      fi
      case "$P_SHA" in (*[!0-9a-f]*|'') READY=0 ;; esac
      if [ "$P_STATUS" != PRESERVED ] || [ "$P_JOBTAG" != "$JOBTAG" ] \
         || [ "$P_NONCE" != "$PASS_NONCE" ] || [ "$P_RANK" != "$RANK" ] \
         || [ "${#P_SHA}" -ne 64 ] || [ ! -f "$EVIDENCE_ROOT/node$RANK/node_manifest.json" ] \
         || [ -L "$EVIDENCE_ROOT/node$RANK/node_manifest.json" ]; then
        READY=0
      fi
    done
    if [ "$READY" -eq 1 ]; then BOTH_READY=1; break; fi
    sleep 2
  done
  [ "$BOTH_READY" -eq 1 ] \
    || { echo "FATAL: dual-node telemetry manifest barrier timed out"; exit 47; }
  for RANK in $(seq 0 $((NNODES - 1))); do
    PEER=$RES/telemetry.$JOBTAG.n$RANK.ready
    IFS='|' read -r _ _ _ _ PEER_SHA _ _ _ < "$PEER"
    LIVE_SHA=$(sha256sum "$EVIDENCE_ROOT/node$RANK/node_manifest.json" | awk '{print $1}')
    [ "$LIVE_SHA" = "$PEER_SHA" ] \
      || { echo "FATAL: peer node manifest SHA drift rank=$RANK"; exit 47; }
  done

  AGGREGATE=$RES/telemetry.$JOBTAG.aggregate.json
  if [ "$NODE_RANK" = "0" ]; then
    rm -f "$AGGREGATE" "$AGGREGATE.tmp"
    "$PY" - "$AGGREGATE.tmp" "$RES" "$EVIDENCE_ROOT" "$JOBTAG" "$PASS_NONCE" <<'PYEOF'
  import hashlib
  import json
  import os
  import sys
  from pathlib import Path

  output, result_root, evidence_root = map(Path, sys.argv[1:4])
  jobtag, nonce = sys.argv[4:]
  nodes = []
  for rank in range(2):
      ready_path = result_root / f"telemetry.{jobtag}.n{rank}.ready"
      parts = ready_path.read_text(encoding="ascii").strip().split("|")
      if len(parts) != 8 or parts[:4] != ["PRESERVED", jobtag, nonce, str(rank)]:
          raise SystemExit(f"FATAL malformed node ready marker rank={rank}")
      manifest_path = evidence_root / f"node{rank}" / "node_manifest.json"
      raw = manifest_path.read_bytes()
      digest = hashlib.sha256(raw).hexdigest()
      if digest != parts[4]:
          raise SystemExit(f"FATAL node manifest/ready SHA mismatch rank={rank}")
      value = json.loads(raw)
      if value.get("jobtag") != jobtag or value.get("nonce") != nonce or value.get("node_rank") != rank:
          raise SystemExit(f"FATAL node manifest identity mismatch rank={rank}")
      nodes.append(
          {
              "node_rank": rank,
              "manifest": str(manifest_path),
              "manifest_sha256": digest,
              "status": value.get("status"),
              "train_rc": int(parts[5]),
              "tee_rc": int(parts[6]),
              "collect_rc": int(parts[7]),
              "rank_files": len(value.get("files", [])),
          }
      )
  status = "PASS" if all(
      node["status"] == "PASS"
      and node["train_rc"] == 0
      and node["tee_rc"] == 0
      and node["collect_rc"] == 0
      and node["rank_files"] == 8
      for node in nodes
  ) else "FAIL"
  aggregate = {
      "schema_version": "offline_arb_r7_l16_telemetry_aggregate_v1",
      "status": status,
      "jobtag": jobtag,
      "nonce": nonce,
      "expected_nodes": 2,
      "expected_ranks": 16,
      "nodes": nodes,
  }
  with output.open("x", encoding="utf-8") as handle:
      json.dump(aggregate, handle, ensure_ascii=False, indent=2, sort_keys=True)
      handle.write("\n")
      handle.flush()
      os.fsync(handle.fileno())
  PYEOF
    mv "$AGGREGATE.tmp" "$AGGREGATE"
    "$PY" - "$RES" <<'PYEOF'
  import os, sys
  descriptor = os.open(sys.argv[1], os.O_RDONLY | os.O_DIRECTORY)
  try:
      os.fsync(descriptor)
  finally:
      os.close(descriptor)
  PYEOF
  else
    for _ in $(seq 1 600); do
      [ -f "$AGGREGATE" ] && [ ! -L "$AGGREGATE" ] && break
      sleep 2
    done
  fi
  [ -f "$AGGREGATE" ] && [ ! -L "$AGGREGATE" ] \
    || { echo "FATAL: dual-node telemetry aggregate missing"; exit 47; }
  AGGREGATE_SHA=$(sha256sum "$AGGREGATE" | awk '{print $1}')
  echo "R7_L16_TELEMETRY_PRESERVED jobtag=$JOBTAG node=$NODE_RANK aggregate_sha256=$AGGREGATE_SHA train_rc=$TRAIN_RC tee_rc=$TRAIN_TEE_RC collect_rc=$COLLECT_RC"

  [ "$TRAIN_TEE_RC" -eq 0 ] || exit "$TRAIN_TEE_RC"
  [ "$TRAIN_RC" -eq 0 ] || exit "$TRAIN_RC"
  [ "$COLLECT_RC" -eq 0 ] || exit "$COLLECT_RC"
  "$PY" - "$AGGREGATE" <<'PYEOF'
  import json, sys
  value = json.load(open(sys.argv[1], encoding="utf-8"))
  if value.get("status") != "PASS":
      raise SystemExit("FATAL r7-L16 dual-node telemetry aggregate is not PASS")
  PYEOF
  echo "R7_L16_GPU_DIAG_PASS result=$AGGREGATE sha256=$AGGREGATE_SHA"
