# One-worker CPU16 publisher for the immutable six-file FSx runtime view.
# It performs no S3 writes and never reads the 2.9TB blob payload bodies.
name: evan-mot-crop-offlinearb-gpic-runtime-view-publish
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1

  [ "${HOSTNAME##*-}" = 0 ] || { echo "FATAL: publisher must have one worker"; exit 2; }
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  HELPER=$REPO/training/dataline_offline/gpic_release_view.py
  RUNNER=$REPO/scripts/offline_arb/publish_offline_gpic_runtime_view.py
  BUILD=evan-mot-crop-offlinearb-gpic-s3-production-build-zg8g
  VERIFY=evan-mot-crop-offlinearb-gpic-s3-production-verify-tp8b
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  VERIFIED=$BASE/offline_gpic_blob_v1_verification/$BUILD/$VERIFY
  VIEW_BASE=$BASE/offline_gpic_blob_v1_release
  S3_ROOT=/s3/evan/artifacts/offline_gpic_blob_v1/$BUILD

  check_sha() {
    EXPECTED=$1
    FILE=$2
    ACTUAL=$(sha256sum -- "$FILE" | awk '{print $1}')
    [ "$ACTUAL" = "$EXPECTED" ] \
      || { echo "FATAL: frozen code SHA drift file=$FILE expected=$EXPECTED actual=$ACTUAL"; exit 2; }
  }
  check_sha 0311d1d397a668c7cbd93fa4c7d1ef95dd1982e4be9ae24bf271c4130f1dabad "$HELPER"
  check_sha 4ff046c597e83ab33e42785b4d1b1fa293e2a6c15a0ccde59d15fd855020edb4 "$RUNNER"
  "$PY" -m py_compile "$HELPER" "$RUNNER"

  timeout --preserve-status --signal=TERM --kill-after=60s 3600s \
    "$PY" "$RUNNER" \
      --verified-root "$VERIFIED" \
      --view-base "$VIEW_BASE" \
      --s3-root "$S3_ROOT" \
      --buildtag "$BUILD" \
      --verifier-jobtag "$VERIFY" \
      --canonical-self-sha256 2812e5e5d9af11f65708c80b53deec2cae6a62a5ba858f99b5143d3228400065 \
      --canonical-raw-sha256 85a9564e2ba24f1d3c0f822b290a2f5dffd9f526ca2928e364f7be9171f70595 \
      --summary-self-sha256 30d6982846e846c95745629cbc278d4d58679e71d31956fd851157d0e7ee73f0 \
      --summary-raw-sha256 d771411c3597cb6e3308f6c5d9d97c2cc83e1dcb56e8e84c7bfe9a32ebe04a76 \
      --index-sha256 ebddc4fb433a79873caa837b7c93cb1d62e2ab1b5aeeb3c0d63bbcd53e10f25a \
      --index-bytes 1120000000 \
      --rows 20000000 \
      --blob-count 680 \
      --payload-bytes 2909056174376 \
      --max-view-bytes 2000000000
  echo "OFFLINE_GPIC_RUNTIME_VIEW_PUBLISH_JCC_PASS build=$BUILD verify=$VERIFY"
