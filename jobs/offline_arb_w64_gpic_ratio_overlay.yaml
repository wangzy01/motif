# Exact plan-only ratio-overlay analysis.  It reads no image and never opens
# the GPIC catalog parquet payload.  All plan work runs in this CPU16 JCC job;
# temporary state is confined to /local and only the final JSON is published.
name: evan-mot-crop-offlinearb-w64-gpic-ratio-overlay
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_arb_w64_gpic_ratio_overlay.$(hostname)

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  PLAN=$BASE/offline_arb_plans_v1/w64_prod/plan
  FREEZE=$BASE/offline_arb_plans_v1/FREEZE_MANIFEST.json
  CATALOG_HEADER=$BASE/offline_arb_catalog_v1/header.json
  SCRIPT=$REPO/scripts/offline_arb/analyze_w64_gpic_ratio_overlay.py
  YAML_SELF=$REPO/jobs/offline_arb_w64_gpic_ratio_overlay.yaml
  EXPECTED_SCRIPT_BYTES=64859
  EXPECTED_SCRIPT_SHA256=fe5600ea3ebfdb159a8ed461f7f0170af450270b72ace55cfb023069b461a574
  RUN_ROOT=$BASE/offline_arb_w64_gpic_ratio_overlay_v1
  WORK_ROOT=/local/evan/offline_arb_w64_gpic_ratio_overlay

  HOST=$(hostname)
  NODE_RANK=${HOST##*-}
  JOBTAG=${HOST%-*}
  [ "$NODE_RANK" = 0 ] && [ "$HOST" = "$JOBTAG-0" ] \
    || { echo "FATAL: expected one-node JCC hostname ending in -0"; exit 21; }
  case "$JOBTAG" in
    (''|.|..|*[!A-Za-z0-9_.-]*) echo "FATAL: unsafe JCC jobtag"; exit 21 ;;
  esac
  [ "$(basename -- "$JOBTAG")" = "$JOBTAG" ] \
    || { echo "FATAL: JCC jobtag is not a basename"; exit 21; }

  for FILE in "$PLAN/header.json" "$PLAN/checksums.json" "$FREEZE" "$CATALOG_HEADER" "$SCRIPT" "$YAML_SELF"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] \
      || { echo "FATAL: required regular non-symlink input missing: $FILE"; exit 22; }
  done
  [ -d "$PLAN" ] && [ -d "$PLAN/blocks" ] && [ ! -L "$PLAN" ] && [ ! -L "$PLAN/blocks" ] \
    || { echo "FATAL: canonical plan directories missing/symlinked"; exit 22; }
  [ "$(find "$PLAN/blocks" -maxdepth 1 -type f -name 'block_*.npz' | wc -l)" = 168 ] \
    || { echo "FATAL: W64 plan does not expose exactly 168 NPZ blocks"; exit 22; }
  [ "$(wc -c < "$SCRIPT")" = "$EXPECTED_SCRIPT_BYTES" ] \
    && [ "$(sha256sum "$SCRIPT" | awk '{print $1}')" = "$EXPECTED_SCRIPT_SHA256" ] \
    || { echo "FATAL: queued job script bytes/SHA pin mismatch"; exit 22; }
  NW_DECL=$(grep -m1 '^numWorkers:' "$YAML_SELF" | awk '{print $2}')
  GPU_DECL=$(grep -m1 '^gpuPerWorker:' "$YAML_SELF" | awk '{print $2}')
  CPU_DECL=$(grep -m1 '^cpuPerWorker:' "$YAML_SELF" | awk '{print $2}')
  [ "$NW_DECL" = 1 ] && [ "$GPU_DECL" = 0 ] && [ "$CPU_DECL" = 16 ] \
    || { echo "FATAL: job topology declaration drift"; exit 23; }

  mkdir -p "$RUN_ROOT" "$WORK_ROOT" "$PYTHONPYCACHEPREFIX"
  [ -d "$RUN_ROOT" ] && [ ! -L "$RUN_ROOT" ] && [ "$(realpath -e "$RUN_ROOT")" = "$RUN_ROOT" ] \
    || { echo "FATAL: run root must be canonical"; exit 23; }
  ATTEMPT=$RUN_ROOT/$JOBTAG
  mkdir "$ATTEMPT"
  OUTPUT=$ATTEMPT/ratio_overlay_analysis.$JOBTAG.json
  [ ! -e "$OUTPUT" ] && [ ! -L "$OUTPUT" ] \
    || { echo "FATAL: refusing to overwrite ratio-overlay evidence"; exit 24; }

  "$PY" -m py_compile "$SCRIPT"
  timeout --signal=TERM --kill-after=30s 600s \
    "$PY" "$SCRIPT" --self-test --work-root "$WORK_ROOT"

  SCRIPT_SHA_BEFORE=$(sha256sum "$SCRIPT" | awk '{print $1}')
  YAML_SHA_BEFORE=$(sha256sum "$YAML_SELF" | awk '{print $1}')
  FREEZE_SHA_BEFORE=$(sha256sum "$FREEZE" | awk '{print $1}')
  HEADER_SHA_BEFORE=$(sha256sum "$PLAN/header.json" | awk '{print $1}')
  CHECKSUMS_SHA_BEFORE=$(sha256sum "$PLAN/checksums.json" | awk '{print $1}')
  CATALOG_HEADER_SHA_BEFORE=$(sha256sum "$CATALOG_HEADER" | awk '{print $1}')

  timeout --signal=TERM --kill-after=60s 21600s \
    "$PY" "$SCRIPT" \
      --plan-root "$PLAN" \
      --freeze "$FREEZE" \
      --catalog-header "$CATALOG_HEADER" \
      --job-yaml "$YAML_SELF" \
      --output "$OUTPUT" \
      --work-root "$WORK_ROOT" \
      --storage-bytes 98304,114688,131072,144296,163840,196608

  [ -f "$OUTPUT" ] && [ ! -L "$OUTPUT" ] && [ -s "$OUTPUT" ] \
    || { echo "FATAL: analyzer did not publish JSON evidence"; exit 25; }
  [ "$(sha256sum "$SCRIPT" | awk '{print $1}')" = "$SCRIPT_SHA_BEFORE" ] \
    && [ "$(sha256sum "$YAML_SELF" | awk '{print $1}')" = "$YAML_SHA_BEFORE" ] \
    && [ "$(sha256sum "$FREEZE" | awk '{print $1}')" = "$FREEZE_SHA_BEFORE" ] \
    && [ "$(sha256sum "$PLAN/header.json" | awk '{print $1}')" = "$HEADER_SHA_BEFORE" ] \
    && [ "$(sha256sum "$PLAN/checksums.json" | awk '{print $1}')" = "$CHECKSUMS_SHA_BEFORE" ] \
    && [ "$(sha256sum "$CATALOG_HEADER" | awk '{print $1}')" = "$CATALOG_HEADER_SHA_BEFORE" ] \
    || { echo "FATAL: bound source/plan/catalog metadata changed during analysis"; exit 26; }

  "$PY" - "$OUTPUT" <<'PYEOF'
  import hashlib
  import json
  import sys
  from pathlib import Path

  output = Path(sys.argv[1])
  payload = output.read_bytes()
  result = json.loads(payload)

  def require(condition, message):
      if not condition:
          raise SystemExit(f"FATAL: {message}")

  require(result.get("schema_version") == "offline_arb_w64_gpic_ratio_overlay_v1", "schema drift")
  require(result.get("status") == "PASS", "analysis is not PASS")
  scope = result["scope"]
  require(scope["formal_steps"] == {"start_inclusive": 0, "stop_exclusive": 166667, "count": 166667}, "formal interval drift")
  require(scope["formal_global_exposures"] == 384000768, "formal global exposure drift")
  require(scope["formal_gpic_exposures"] == 99456552, "formal GPIC exposure drift")
  require(scope["image_payload_reads"] == 0, "image-read contract drift")
  require(scope["catalog_parquet_payload_reads"] == 0, "catalog-parquet-read contract drift")
  require(scope["sample_paths_read"] == 0 and scope["sample_paths_emitted"] == 0, "sample-path contract drift")
  require(scope["bitmap_artifacts_published"] == 0, "unexpected bitmap publication")
  binding = result["input_binding"]
  require(binding["all_plan_blocks_sha256_verified"] is True, "all-block SHA verification absent")
  require(binding["all_plan_block_count"] == 168, "block count drift")
  require(binding["formal_array_blocks_streamed_once"] == 163, "formal block pass drift")
  require(binding["nonformal_blocks_sha_only_verified"] == 5, "nonformal SHA-only count drift")
  assignment = binding["freeze_and_catalog_binding"]["assignment_identity_binding"]
  require(assignment["all_four_assignment_identities_equal"] is True, "assignment identity binding absent")
  require(assignment["comparison"] == "exact_lowercase_sha256_string_equality", "assignment comparison drift")
  assignment_values = {
      assignment["freeze_identities_assignment_hash"],
      assignment["plan_header_hashes_assignment_sha256"],
      assignment["plan_header_top_level_assignment_hash"],
      assignment["catalog_header_assignment_hash"],
      assignment["assignment_hash"],
  }
  require(len(assignment_values) == 1 and len(next(iter(assignment_values))) == 64, "assignment identity mismatch")

  expected_k = list(range(8, 18))
  ratios = result["ratios"]
  require([row["k"] for row in ratios] == expected_k, "k set/order drift")
  matrix = result["all_worst_target_gate_matrix"]
  require([row["k"] for row in matrix] == expected_k, "all-worst matrix k drift")

  def validate_capacity(record):
      cold = record["absolute_cold_source_exposures"]
      for gate in record["capacity_gates"].values():
          require(gate["comparison"] == "exact_integer_cross_multiplication", "gate comparison drift")
          require(gate["pass"] == (cold == 0 or gate["lhs"] >= gate["rhs"]), "gate arithmetic drift")

  for row in ratios:
      k = row["k"]
      require(row["selection_rule"] == f"gpic_local_row_id % 20 < {k}", "selection rule drift")
      require(row["selected_catalog_unique_row_ids"] == k * 1000000, "selected catalog cardinality drift")
      require(row["selected_formal_exposed_unique_row_ids"] <= row["selected_catalog_unique_row_ids"], "exposed unique exceeds selection")
      require(len(row["per_node"]) == 8, "per-node count drift")
      require(len(row["global_overlay_storage_estimates"]) == 6, "global storage sensitivity drift")
      validate_capacity(row["global_full_formal_prefix_average_capacity"])
      for node in row["per_node"]:
          require([h["horizon_steps"] for h in node["horizons"]] == [4, 16, 64], "node horizon drift")
          require(len(node["selected_node_storage_estimates"]) == 6, "node storage sensitivity drift")
          validate_capacity(node["full_formal_prefix_average_capacity"])
          for horizon in node["horizons"]:
              require(set(horizon["absolute_cold_source_demand"]["points"]) == {"p99", "p99.9", "max"}, "cold upper-tail points drift")
              require(set(horizon["absolute_total_gpic_demand"]["points"]) == {"p99", "p99.9", "max"}, "total upper-tail points drift")
              require(set(horizon["selected_coverage_lower_tail_context_only"]["points"]) == {"min", "p0.1", "p1"}, "coverage context points drift")
              for point in horizon["absolute_cold_source_demand"]["points"].values():
                  validate_capacity(point)
      require([h["horizon_steps"] for h in row["aggregate_node_windows"]] == [4, 16, 64], "aggregate horizon drift")
      require(row["all_worst_target_gate"]["check_count"] == 33, "all-worst check count drift")

  passing = [row for row in matrix if row["all_target_1.25_gates_pass"]]
  decision = result["minimum_evaluated_ratio_whose_all_worst_cases_pass_target_1.25"]
  require(decision["found_within_evaluated_ratios"] == bool(passing), "minimum decision existence drift")
  require(decision["k"] == (passing[0]["k"] if passing else None), "minimum decision k drift")
  require(result["capacity_model_contract"]["coverage_is_context_only_not_capacity_authority"] is True, "coverage/capacity separation drift")

  print(json.dumps({
      "status": "PASS",
      "output": str(output),
      "output_sha256": hashlib.sha256(payload).hexdigest(),
      "minimum_all_worst_target_k": decision["k"],
      "evaluated_k": expected_k,
  }, sort_keys=True))
  PYEOF
