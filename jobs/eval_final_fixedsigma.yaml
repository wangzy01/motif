# Stage256 FINAL eval - fixed-sigma MSE grid for the 4 runs (AUXILIARY; loss axis).
# Uses an anime SOURCE parquet (has quality_z, load_anime_shard format) so the eval batch
# builds (daily_v1 default lacks quality_z -> prior FAIL). Identical batch/noise across runs.
name: evan-mot-evalf-fixedsigma
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 16
memGBPerWorker: 220
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  export HF_HOME=/local/evan/cache/huggingface TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  mkdir -p $HF_HOME $TORCH_HOME $TRITON_CACHE_DIR /local/evan/anime_img_cache
  OUT=experiments/results/eval_final_4model/fixedsigma
  mkdir -p $OUT
  CKR=/fsx/evan/checkpoints/mot_pilot_v1
  SC=/fsx/evan/mot_code/data_analysis/configs/t5_sampling_complete_v1.json
  SHARD=/s3/evan/anime_core_ditv04_ct_soft/data/00000000.parquet
  CV1=configs/stage1a_t2i_256.yaml
  CV2=configs/stage1a_t2i_256_v2.yaml
  nvidia-smi -L || true
  run_fs () {
    local key=$1 cfg=$2 sub=$3; shift 3
    echo "===== fixed-sigma $key ====="
    HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 30m $PY experiments/exp_scripts/fixed_sigma_eval.py \
      --config $cfg --ckpt $CKR/$sub/last.pt --resolution 256 --shift-label $key \
      --eval-shard $SHARD --out $OUT/fixed_sigma_$key.json --weights ema --seed 1234 \
      --overrides dataset.sampling_config=$SC "$@" || echo "[fs] $key FAILED rc=$?"
  }
  run_fs b1        $CV1 s256_1x8_b1adapter_20260618   model.text_adapter.enabled=true model.text_adapter.bidirectional=true
  run_fs ab1causal $CV2 s256v2_2x8_ab1causal_20260623 model.text_adapter.enabled=true model.text_adapter.bidirectional=false
  run_fs ab2fusion $CV2 s256v2_2x8_ab2fusion_20260623 model.text_adapter.enabled=true model.text_adapter.bidirectional=true model.text_adapter.multi_layer_fusion.enabled=true  # 钉 bidir：ckpt 是 bidir 训练的（v2 config 默认已改 causal）
  run_fs ab3lora   $CV2 s256v2_2x8_ab3lora_20260623   model.und_lora.enabled=true
  echo "===== SUMMARY (mean_loss_over_grid; lower=better, expect near-identical) ====="
  for k in b1 ab1causal ab2fusion ab3lora; do echo "--- $k ---"; cat $OUT/fixed_sigma_$k.json 2>/dev/null || echo "(missing $k)"; done
