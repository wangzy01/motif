name: evan-offarb-textatlas-full-decode-audit
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 8
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  HOST=$(hostname); SHARD_INDEX=${HOST##*-}; SHARD_COUNT=8
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_arb_textatlas_full_decode.$SHARD_INDEX
  mkdir -p "$PYTHONPYCACHEPREFIX"

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  CATALOG=$BASE/offline_arb_catalog_v1
  PLAN_AUDIT=$BASE/offline_arb_textatlas_integrity_audit_v1
  OUT=$BASE/offline_arb_textatlas_full_strict_decode_audit_v1
  PLAN_JSON=$PLAN_AUDIT/plan_rows.json
  BITMAP=$PLAN_AUDIT/plan_rows_bitmap.npz
  RESULT=$OUT/payload_shard_${SHARD_INDEX}.json
  mkdir -p "$OUT"
  test -f "$PLAN_AUDIT/_PLAN_SUCCESS" && test -f "$PLAN_JSON" && test -f "$BITMAP" \
    || { echo "FATAL: completed plan-row audit missing"; exit 34; }
  test ! -e "$RESULT" || { echo "FATAL: immutable shard output exists: $RESULT"; exit 34; }

  "$PY" -m py_compile scripts/offline_arb/audit_textatlas_planned_payloads.py
  "$PY" scripts/offline_arb/audit_textatlas_planned_payloads.py \
    --catalog-root "$CATALOG" \
    --plan-json "$PLAN_JSON" \
    --plan-bitmap "$BITMAP" \
    --shard-index "$SHARD_INDEX" \
    --shard-count "$SHARD_COUNT" \
    --workers 16 \
    --signature-mode strict_decode_failure_all \
    --output "$RESULT"
  sha256sum "$RESULT" > "$RESULT.sha256"
  touch "$OUT/_PAYLOAD_SHARD_${SHARD_INDEX}_SUCCESS"
