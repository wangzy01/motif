# OFFLINE_ARB_V1 read-only CPU A/B: anime caption parquet concurrency 1/4/8/16/32.
# Five independent 16-CPU pods run the same W=4 exact plan and emit
# trace/prompt/pixel hashes plus per-window phase timings.
name: evan-mot-crop-offlinearb-caption-workers-ab
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 5
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 96
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  export OFFLINE_ARB_STEP_TIMEOUT_S=1800
  export OFFLINE_ARB_PROFILE_WINDOWS=1
  export OFFLINE_ARB_SMOKE_DATASET_CONFIG=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop/configs/stage256_offline_exact_v1.yaml

  HOST=$(hostname)
  IDX=${HOST##*-}
  case "$IDX" in
    0) CAPTION_WORKERS=1 ;;
    1) CAPTION_WORKERS=4 ;;
    2) CAPTION_WORKERS=8 ;;
    3) CAPTION_WORKERS=16 ;;
    4) CAPTION_WORKERS=32 ;;
    *) echo "FATAL: unexpected worker index $IDX from $HOST"; exit 20 ;;
  esac
  export OFFLINE_ARB_ANIME_CAPTION_WORKERS=$CAPTION_WORKERS
  # CPU A/B pods may co-locate on one physical node and reuse container PIDs.
  # Give every variant a disjoint staging root so gpic consume/unlink cannot
  # collide across experiments.  Formal has one training pod per node.
  export OFFLINE_ARB_LOCAL_ROOT=/local/evan/offline_arb_v1_caption_ab_${CAPTION_WORKERS}_${HOST}

  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  PLAN_ROOT=$BASE/offline_arb_plans_v1/w4_smoke/plan
  CATALOG_ROOT=$BASE/offline_arb_catalog_v1
  ANIME_FREQ_ROOT=$BASE/offline_arb_animefreq_v1
  OUT=$BASE/offline_arb_caption_workers_ab_r2_20260711
  mkdir -p "$OUT"
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  echo "CAPTION_AB host=$HOST caption_workers=$CAPTION_WORKERS formal_dataset_config=$OFFLINE_ARB_SMOKE_DATASET_CONFIG"
  "$PY" -m py_compile training/dataline_offline/offline_dataset.py scripts/offline_arb/smoke_offline_loader.py
  set +e
  timeout --signal=TERM --kill-after=30s 3570s \
    "$PY" scripts/offline_arb/smoke_offline_loader.py \
      --plan-root "$PLAN_ROOT" \
      --catalog-root "$CATALOG_ROOT" \
      --anime-freq-root "$ANIME_FREQ_ROOT" \
      --ranks 4 \
      --steps 6 \
    2>&1 | tee "$OUT/caption_workers_${CAPTION_WORKERS}.log"
  RC=${PIPESTATUS[0]}
  set -e
  echo "CAPTION_AB_DONE caption_workers=$CAPTION_WORKERS rc=$RC"
  exit "$RC"
