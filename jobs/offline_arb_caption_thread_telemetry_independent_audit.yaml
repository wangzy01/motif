# Independent, read-only audit of the completed L32/L16/telemetry semantic matrix.
name: evan-offarb-caption-thread-audit
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  SOURCE_JOBTAG=evan-offarb-caption-thread-semantic-lw22
  SOURCE_ROOT=$BASE/offline_arb_caption_thread_telemetry_semantic_v1/$SOURCE_JOBTAG
  FORMAL_CFG=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop/configs/stage256_offline_exact_v1.yaml
  PLAN_ROOT=$BASE/offline_arb_plans_v1/w4_smoke/plan
  CATALOG_ROOT=$BASE/offline_arb_catalog_v1
  SIDECAR_ROOT=$BASE/offline_arb_caption_sidecar_v1
  HOST=$(hostname)
  AUDIT_ROOT=$BASE/offline_arb_caption_thread_telemetry_audit_v1/$HOST
  LOCAL_TMP=/local/evan/offline_arb_caption_thread_audit_$HOST
  mkdir -p "$AUDIT_ROOT" "$LOCAL_TMP"
  test ! -e "$AUDIT_ROOT/independent_audit.json"

  "$PY" scripts/offline_arb/make_freeze_manifest.py \
    --verify-sidecar-control --sidecar-root "$SIDECAR_ROOT" \
    --catalog-root "$CATALOG_ROOT" > "$LOCAL_TMP/sidecar_control.json.tmp"
  mv "$LOCAL_TMP/sidecar_control.json.tmp" "$LOCAL_TMP/sidecar_control.json"

  "$PY" - "$SOURCE_ROOT" "$SOURCE_JOBTAG" "$FORMAL_CFG" "$PLAN_ROOT" \
    "$CATALOG_ROOT" "$SIDECAR_ROOT" "$LOCAL_TMP/sidecar_control.json" \
    "$AUDIT_ROOT/independent_audit.json" <<'PYEOF'
  import hashlib
  import json
  import os
  import re
  import stat
  import sys
  from pathlib import Path

  (
      root,
      source_jobtag,
      formal_path,
      plan_root,
      catalog_root,
      sidecar_root,
      control_path,
      output_path,
  ) = (
      Path(sys.argv[1]),
      sys.argv[2],
      *map(Path, sys.argv[3:9]),
  )
  hex64 = re.compile(r"[0-9a-f]{64}").fullmatch
  arms = ("l32_off", "l16_off", "l16_on")
  expected_arm = {
      "l32_off": (0, 32, False),
      "l16_off": (1, 16, False),
      "l16_on": (2, 16, True),
  }
  hash_keys = (
      "trace_sha256",
      "prompts_sha256",
      "pixels_sha256",
      "cfg_keep_sha256",
  )
  identity_keys = (
      "plan_id",
      "plan_hash",
      "catalog_hash",
      "assignment_hash",
      "semantic_hash_schema",
      "ranks",
      "per_rank_bs",
      "start_step",
      "steps",
  )

  def fail(message):
      raise SystemExit(f"FATAL independent audit: {message}")

  def regular_bytes(path):
      try:
          metadata = path.lstat()
      except FileNotFoundError:
          fail(f"missing file {path}")
      if not stat.S_ISREG(metadata.st_mode) or path.is_symlink() or metadata.st_size <= 0:
          fail(f"not a non-empty regular file {path}")
      return path.read_bytes()

  def strict_json_bytes(path):
      raw = regular_bytes(path)
      try:
          value = json.loads(
              raw.decode("utf-8"),
              parse_constant=lambda token: (_ for _ in ()).throw(
                  ValueError(f"non-finite JSON token {token}")
              ),
          )
      except (UnicodeDecodeError, ValueError, json.JSONDecodeError) as exc:
          fail(f"invalid strict JSON {path}: {exc}")
      if not isinstance(value, dict):
          fail(f"top-level JSON is not an object {path}")
      return raw, value

  def digest(raw):
      return hashlib.sha256(raw).hexdigest()

  if root.is_symlink() or not root.is_dir():
      fail(f"source root is not a real directory {root}")
  run_raw, run = strict_json_bytes(root / "run.json")
  aggregate_raw, aggregate = strict_json_bytes(root / "thread_aggregate.json")
  snapshot_raw = regular_bytes(root / "formal.snapshot.yaml")
  formal_raw = regular_bytes(formal_path)
  plan_raw, plan = strict_json_bytes(plan_root / "header.json")
  catalog_raw, catalog = strict_json_bytes(catalog_root / "header.json")
  sidecar_raw, sidecar = strict_json_bytes(sidecar_root / "header.json")
  _control_raw, control = strict_json_bytes(control_path)
  nonce = run.get("run_nonce")
  if (
      run.get("schema_version") != "offline_arb_caption_thread_matrix_run_v1"
      or run.get("jobtag") != source_jobtag
      or not hex64(str(nonce or ""))
  ):
      fail("run identity/schema mismatch")
  bindings = {
      "config_sha256": digest(snapshot_raw),
      "sidecar_header_sha256": sidecar.get("header_sha256"),
      "sidecar_release_digest": control.get("release_digest"),
      "plan_hash": plan.get("plan_hash"),
      "catalog_hash": catalog.get("catalog_hash"),
  }
  if (
      formal_raw != snapshot_raw
      or digest(snapshot_raw) != run.get("config_sha256")
      or digest(plan_raw) != run.get("plan_header_sha256")
      or digest(catalog_raw) != run.get("catalog_header_sha256")
      or digest(sidecar_raw) != run.get("sidecar_header_file_sha256")
      or bindings["plan_hash"] != run.get("plan_hash")
      or bindings["catalog_hash"] != run.get("catalog_hash")
      or bindings["sidecar_header_sha256"] != run.get("sidecar_header_sha256")
      or bindings["sidecar_release_digest"] != run.get("sidecar_release_digest")
      or control.get("status") != "PASS"
      or control.get("mode") != "verify-sidecar-control"
      or control.get("header_sha256") != bindings["sidecar_header_sha256"]
      or (sidecar_root / "_SUCCESS").read_text(encoding="ascii")
      not in {
          bindings["sidecar_header_sha256"],
          bindings["sidecar_header_sha256"] + "\n",
      }
      or any(not hex64(str(value or "")) for value in bindings.values())
  ):
      fail("formal config/plan/catalog/sidecar binding mismatch")
  if (
      aggregate.get("status") != "PASS"
      or aggregate.get("schema_version")
      != "offline_arb_caption_thread_telemetry_semantic_v1"
      or aggregate.get("run_context")
      != {"run_nonce": nonce, "jobtag": source_jobtag}
      or aggregate.get("arms") != list(arms)
      or aggregate.get("steps") != [6, 12]
      or aggregate.get("matched_hashes") != list(hash_keys)
      or aggregate.get("shared_inputs") != bindings
  ):
      fail("aggregate identity/schema/binding mismatch")

  summary_steps = {}
  telemetry_summary = {}
  for steps in (6, 12):
      results = {}
      for arm in arms:
          _raw, result = strict_json_bytes(root / f"thread.{arm}.steps{steps}.json")
          worker, threads, telemetry_enabled = expected_arm[arm]
          context = result.get("run_context", {})
          shared = result.get("shared_inputs", {})
          if (
              result.get("status") != "PASS"
              or result.get("schema_version")
              != "offline_arb_caption_thread_matrix_arm_v1"
              or result.get("arm") != arm
              or result.get("steps") != steps
              or result.get("gpic_threads_per_node") != threads
              or result.get("telemetry_enabled") is not telemetry_enabled
              or context.get("worker_index") != worker
              or context.get("run_nonce") != nonce
              or context.get("jobtag") != source_jobtag
              or not context.get("host")
              or shared.get("config_path") != str(root / "formal.snapshot.yaml")
              or shared.get("config_sha256") != bindings["config_sha256"]
              or shared.get("caption_backend") != "sidecar_direct"
              or shared.get("sidecar_header_sha256")
              != bindings["sidecar_header_sha256"]
              or shared.get("sidecar_release_digest")
              != bindings["sidecar_release_digest"]
          ):
              fail(f"arm identity mismatch arm={arm} steps={steps}")
          smoke = result.get("smoke", {})
          per_rank_bs = smoke.get("per_rank_bs")
          expected_items = 4 * steps * per_rank_bs if type(per_rank_bs) is int else -1
          if (
              smoke.get("status") != "PASS"
              or smoke.get("steps") != steps
              or smoke.get("ranks") != 4
              or smoke.get("start_step") != 0
              or smoke.get("plan_hash") != bindings["plan_hash"]
              or smoke.get("catalog_hash") != bindings["catalog_hash"]
              or smoke.get("assertions", {}).get("item_trace_exact") != expected_items
              or set(smoke.get("per_rank", {})) != {"0", "1", "2", "3"}
          ):
              fail(f"smoke evidence mismatch arm={arm} steps={steps}")
          results[arm] = result

      smokes = {arm: results[arm]["smoke"] for arm in arms}
      smoke_identities = [
          {key: smokes[arm].get(key) for key in identity_keys} for arm in arms
      ]
      if smoke_identities[1:] != smoke_identities[:-1]:
          fail(f"smoke identities differ steps={steps}")
      per_rank_hashes = {}
      for rank in ("0", "1", "2", "3"):
          per_rank_hashes[rank] = {}
          for key in hash_keys:
              hashes = [smokes[arm]["per_rank"][rank].get(key) for arm in arms]
              if len(set(hashes)) != 1 or not hex64(str(hashes[0] or "")):
                  fail(f"semantic hash mismatch steps={steps} rank={rank} key={key}")
              per_rank_hashes[rank][key] = hashes[0]
      comparison = aggregate.get("comparisons", {}).get(str(steps), {})
      if (
          comparison.get("identity") != smoke_identities[0]
          or comparison.get("per_rank_hashes") != per_rank_hashes
      ):
          fail(f"aggregate comparison differs from arm files steps={steps}")
      for arm in ("l32_off", "l16_off"):
          if results[arm].get("telemetry") != {
              "status": "OFF",
              "enabled": False,
              "rank_files": 0,
          }:
              fail(f"telemetry-off evidence drift arm={arm} steps={steps}")

      telemetry = results["l16_on"].get("telemetry", {})
      shared_root = root / f"thread_telemetry.l16_on.steps{steps}"
      manifest_path = shared_root / "manifest.json"
      manifest_raw, manifest = strict_json_bytes(manifest_path)
      if (
          shared_root.is_symlink()
          or not shared_root.is_dir()
          or telemetry.get("status") != "PASS"
          or telemetry.get("enabled") is not True
          or telemetry.get("rank_files") != 4
          or telemetry.get("shared_root") != str(shared_root)
          or telemetry.get("manifest") != str(manifest_path)
          or telemetry.get("manifest_sha256") != digest(manifest_raw)
          or manifest.get("status") != "PASS"
          or manifest.get("schema_version")
          != "offline_arb_caption_thread_matrix_shared_telemetry_v1"
          or manifest.get("jobtag") != source_jobtag
          or manifest.get("run_nonce") != nonce
          or manifest.get("arm") != "l16_on"
          or manifest.get("steps") != steps
          or manifest.get("shared_root") != str(shared_root)
          or manifest.get("files") != telemetry.get("files")
          or len(manifest.get("files", [])) != 4
      ):
          fail(f"telemetry manifest mismatch steps={steps}")
      expected_entries = {"manifest.json"} | {
          f"io_profile.rank{rank:04d}.jsonl" for rank in range(4)
      }
      if {path.name for path in shared_root.iterdir()} != expected_entries:
          fail(f"telemetry directory file set mismatch steps={steps}")
      rank_summaries = []
      for rank, evidence in enumerate(manifest["files"]):
          path = shared_root / f"io_profile.rank{rank:04d}.jsonl"
          raw = regular_bytes(path)
          if not raw.endswith(b"\n"):
              fail(f"telemetry file lacks final newline steps={steps} rank={rank}")
          lines = raw.decode("utf-8").splitlines()
          try:
              records = [
                  json.loads(
                      line,
                      parse_constant=lambda token: (_ for _ in ()).throw(
                          ValueError(f"non-finite JSON token {token}")
                      ),
                  )
                  for line in lines
              ]
          except (UnicodeDecodeError, ValueError, json.JSONDecodeError) as exc:
              fail(f"invalid telemetry JSONL steps={steps} rank={rank}: {exc}")
          if not records:
              fail(f"empty telemetry JSONL steps={steps} rank={rank}")
          for sequence, record in enumerate(records):
              if (
                  not isinstance(record, dict)
                  or record.get("schema_version") != "offline_arb_io_profile_v1"
                  or record.get("sequence") != sequence
                  or record.get("rank") != rank
              ):
                  fail(
                      f"telemetry sequence/schema/rank mismatch "
                      f"steps={steps} rank={rank} sequence={sequence}"
                  )
          identities = [r for r in records if r.get("record_type") == "identity"]
          closures = [r for r in records if r.get("record_type") == "closure"]
          windows = sum(r.get("record_type") == "window" for r in records)
          if (
              len(identities) != 1
              or identities[0] is not records[0]
              or len(closures) != 1
              or closures[0] is not records[-1]
              or windows <= 0
          ):
              fail(f"identity/window/closure ordering mismatch steps={steps} rank={rank}")
          identity, closure = identities[0], closures[0]
          if (
              identity.get("attempt_jobtag") != source_jobtag
              or identity.get("attempt_nonce") != nonce
              or identity.get("attempt_host")
              != results["l16_on"]["run_context"]["host"]
              or identity.get("world_size") != 4
              or identity.get("local_world_size") != 4
              or identity.get("local_rank") != rank
              or identity.get("gpic_threads_per_node") != 16
              or identity.get("gpic_workers_per_rank") != 4
              or identity.get("tar_workers_per_rank") != 8
              or identity.get("gpic_payload_in_memory") is not True
              or identity.get("plan_hash") != bindings["plan_hash"]
              or identity.get("catalog_hash") != bindings["catalog_hash"]
              or identity.get("sidecar_header_sha256")
              != bindings["sidecar_header_sha256"]
              or identity.get("sidecar_release_digest")
              != bindings["sidecar_release_digest"]
          ):
              fail(f"telemetry identity mismatch steps={steps} rank={rank}")
          before = len(records) - 1
          if (
              closure.get("next_step") != steps
              or closure.get("records_before_closure") != before
              or closure.get("records_enqueued_before_closure") != before
              or closure.get("telemetry_fatal") is not False
              or closure.get("dropped_emits") != 0
              or closure.get("runtime_errors") != 0
              or closure.get("rejected_emits_before_closure") != 0
              or closure.get("rejected_emits_observed_by_writer") != 0
          ):
              fail(f"telemetry closure accounting mismatch steps={steps} rank={rank}")
          if (
              evidence.get("rank") != rank
              or evidence.get("shared_path") != str(path)
              or evidence.get("bytes") != len(raw)
              or evidence.get("sha256") != digest(raw)
              or evidence.get("records") != len(records)
              or evidence.get("windows") != windows
              or evidence.get("identity") != identity
              or evidence.get("closure") != closure
          ):
              fail(f"telemetry file evidence mismatch steps={steps} rank={rank}")
          rank_summaries.append(
              {
                  "rank": rank,
                  "bytes": len(raw),
                  "sha256": digest(raw),
                  "records": len(records),
                  "windows": windows,
                  "closure_zero_loss": True,
              }
          )
      if comparison.get("telemetry_on") != telemetry:
          fail(f"aggregate telemetry evidence differs from arm file steps={steps}")
      summary_steps[str(steps)] = {
          "identity": smoke_identities[0],
          "per_rank_hashes": per_rank_hashes,
          "item_trace_exact_per_arm": expected_items,
      }
      telemetry_summary[str(steps)] = {
          "manifest": str(manifest_path),
          "manifest_sha256": digest(manifest_raw),
          "rank_files": rank_summaries,
      }

  audit = {
      "status": "PASS",
      "schema_version":
      "offline_arb_caption_thread_telemetry_semantic_independent_audit_v1",
      "source_jobtag": source_jobtag,
      "source_root": str(root),
      "aggregate": {
          "path": str(root / "thread_aggregate.json"),
          "bytes": len(aggregate_raw),
          "sha256": digest(aggregate_raw),
      },
      "bindings": bindings,
      "matched_hashes": list(hash_keys),
      "steps": summary_steps,
      "telemetry": telemetry_summary,
      "telemetry_rank_jsonl_files_checked": 8,
      "closure_guard": {
          "telemetry_fatal": False,
          "dropped_emits": 0,
          "runtime_errors": 0,
          "rejected_emits_before_closure": 0,
          "rejected_emits_observed_by_writer": 0,
      },
  }
  output_path.parent.mkdir(parents=True, exist_ok=True)
  temporary = output_path.with_name(f".{output_path.name}.tmp")
  payload = (
      json.dumps(audit, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False)
      + "\n"
  ).encode("utf-8")
  with temporary.open("xb", buffering=0) as handle:
      view = memoryview(payload)
      while view:
          written = handle.write(view)
          if not written:
              fail("short write of audit artifact")
          view = view[written:]
      os.fsync(handle.fileno())
  os.replace(temporary, output_path)
  print(json.dumps(audit, ensure_ascii=False, indent=2, sort_keys=True))
  PYEOF
  echo "CAPTION_THREAD_TELEMETRY_INDEPENDENT_AUDIT_PASS result=$AUDIT_ROOT/independent_audit.json"
