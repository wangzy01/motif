# CPU-only, fully mocked static/synthetic gate for the GPIC mount/S3 probe.
# This job does not install packages, contact S3, or read image payloads.
name: evan-mot-crop-offlinearb-gpic-mount-s3-abba-static
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export AWS_EC2_METADATA_DISABLED=true
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  JOBTAG="${JCC_TASK_NAME:-gpic-mount-s3-abba-static}.${JCC_TASK_INSTANCE:-0}.$(hostname).$$"
  LOCAL_ROOT="/local/evan/offline_arb_gpic_mount_s3_abba_static/$JOBTAG"
  [ ! -e "$LOCAL_ROOT" ] && [ ! -L "$LOCAL_ROOT" ] \
    || { echo "FATAL: static local namespace is not fresh"; exit 1; }
  mkdir -m 700 -p "$LOCAL_ROOT/tmp" "$LOCAL_ROOT/pycache"
  export TMPDIR="$LOCAL_ROOT/tmp"
  export PYTHONPYCACHEPREFIX="$LOCAL_ROOT/pycache"

  unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_PROFILE
  unset AWS_ROLE_ARN AWS_WEB_IDENTITY_TOKEN_FILE AWS_CONTAINER_CREDENTIALS_FULL_URI
  unset AWS_CONTAINER_CREDENTIALS_RELATIVE_URI

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER="$REPO/scripts/offline_arb/run_gpic_mount_s3_abba_probe.py"
  ANALYZER="$REPO/scripts/offline_arb/analyze_gpic_mount_s3_abba_probe.py"
  SELFTEST="$REPO/scripts/offline_arb/test_gpic_mount_s3_abba_probe_static.py"
  CAPTURE_YAML="$REPO/jobs/offline_arb_gpic_mount_s3_abba_probe.yaml"
  ANALYZE_YAML="$REPO/jobs/offline_arb_gpic_mount_s3_abba_analyze.yaml"
  STATIC_YAML="$REPO/jobs/offline_arb_gpic_mount_s3_abba_static.yaml"
  CACHE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_phase2b_20260710T052630Z_evan-mot-crop-offlinearb-p2c-gpictune-gtnv-0_26335/gpic_items_cache.json

  for FILE in "$RUNNER" "$ANALYZER" "$SELFTEST" "$CAPTURE_YAML" "$ANALYZE_YAML" "$STATIC_YAML" "$CACHE"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: invalid static input"; exit 1; }
  done

  "$PY" -m py_compile "$RUNNER" "$ANALYZER" "$SELFTEST"
  "$PY" - "$CAPTURE_YAML" "$ANALYZE_YAML" "$STATIC_YAML" <<'PYEOF'
  import subprocess
  import sys
  from pathlib import Path

  import yaml

  parsed = {}
  for raw_path in sys.argv[1:]:
      path = Path(raw_path)
      value = yaml.safe_load(path.read_text(encoding="utf-8"))
      parsed[path.name] = value
      for key, wanted in {
          "numWorkers": 1,
          "gpuPerWorker": 0,
          "cpuPerWorker": 16,
          "maxRetries": 0,
      }.items():
          if value.get(key) != wanted:
              raise SystemExit(f"FATAL: {path.name} {key} drift")
      command = value.get("command")
      if not isinstance(command, str):
          raise SystemExit(f"FATAL: {path.name} command missing")
      trace_tokens = ("set " + "-x", "set " + "-eux")
      install_tokens = ("pip " + "install", "python -m " + "pip")
      if any(token in command for token in trace_tokens):
          raise SystemExit(f"FATAL: shell tracing in {path.name}")
      if any(token in command for token in install_tokens):
          raise SystemExit(f"FATAL: package installation in {path.name}")
      subprocess.run(["bash", "-n"], input=command, text=True, check=True)
  capture = parsed["offline_arb_gpic_mount_s3_abba_probe.yaml"]["command"]
  analyze = parsed["offline_arb_gpic_mount_s3_abba_analyze.yaml"]["command"]
  if "OUTPUT_PARENT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop\n" not in capture:
      raise SystemExit("FATAL: capture OUTPUT_PARENT/RUN_ID hierarchy drift")
  if "AWS_EC2_METADATA_DISABLED" in capture:
      raise SystemExit("FATAL: capture disabled a default credential provider")
  for token in (
      "BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop",
      "RUN_ID=offline_arb_gpic_mount_s3_abba_probe_20260712r1",
      "RUN_ROOT=$BASE/$RUN_ID",
  ):
      if token not in analyze:
          raise SystemExit(f"FATAL: analyze hierarchy token missing: {token}")
  PYEOF

  timeout --preserve-status --signal=TERM --kill-after=30s 900s "$PY" "$SELFTEST"
  echo "GPIC_MOUNT_S3_ABBA_STATIC_JCC_PASS"
