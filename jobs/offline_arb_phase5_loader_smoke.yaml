# OFFLINE_ARB_V1 Phase-5 CPU loader smoke.  PLAN_ROOT must be a formal W=4 plan
# built from CATALOG_ROOT's materialized-after-exclusion N and real upstream hashes.
name: evan-mot-crop-offlinearb-p5-loader-smoke
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 96
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  # fable 审查(2026-07-10):anime general_freq 冷启动会同步扫 caption shard,默认 600s
  # 可能在 step0 假性超时——冒烟期调高;长跑前须解决 P1#1(freq 成本/缓存上界)。
  export OFFLINE_ARB_STEP_TIMEOUT_S=1800
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  # 默认指向 2026-07-11 生产 catalog(hash b5f83014…)绑定的 w4_smoke plan(validate PASS)
  PLAN_ROOT=${PLAN_ROOT:-$BASE/offline_arb_plans_v1/w4_smoke/plan}
  CATALOG_ROOT=${CATALOG_ROOT:-$BASE/offline_arb_catalog_v1}
  ANIME_FREQ_ROOT=${ANIME_FREQ_ROOT:-$BASE/offline_arb_animefreq_v1}
  test -f "$ANIME_FREQ_ROOT/_SUCCESS" || { echo "FATAL: animefreq _SUCCESS missing"; exit 36; }
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  # 先跑合成 self-test(秒级,不触真实数据),再进真实 plan 冒烟。
  "$PY" scripts/offline_arb/smoke_offline_loader.py --self-test
  # TERM grace is included in the 3600s hard wall: 3570 + 30 = 3600.
  timeout --signal=TERM --kill-after=30s 3570s \
    "$PY" scripts/offline_arb/smoke_offline_loader.py \
      --plan-root "$PLAN_ROOT" \
      --catalog-root "$CATALOG_ROOT" \
      --anime-freq-root "$ANIME_FREQ_ROOT" \
      --ranks 4 \
      --steps 6
