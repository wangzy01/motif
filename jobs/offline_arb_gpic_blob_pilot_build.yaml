# CPU16 builder-only GPIC blob pilot.  No replay runs in this pod: performance
# replay must be submitted as a separate JCC job to avoid builder cache warmth.
# Evidence binds the live bytes of this YAML; do not edit it after submission
# until the independent analyzer has closed the chain.
name: evan-mot-crop-offlinearb-gpic-blob-pilot-build
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  FSX_FULL_ROWS=100000
  COMPARE_ROWS=20000
  SOURCE_SCAN_ROWS_PER_ARM=4000
  HOST=$(hostname)
  [ "${HOST##*-}" = 0 ] || { echo "FATAL: single-worker hostname must end in -0"; exit 2; }
  JOBTAG=${HOST%-0}
  [ "$HOST" = "$JOBTAG-0" ] || { echo "FATAL: hostname/jobtag binding drift"; exit 2; }

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER=$REPO/scripts/offline_arb/run_offline_gpic_blob_pilot.py
  SELF=$REPO/jobs/offline_arb_gpic_blob_pilot_build.yaml
  CATALOG=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  RUN_ID=offline_gpic_blob_pilot_20260712r2
  ARTIFACT_PREFIX=$BASE/$RUN_ID
  ARTIFACT_JOB_ROOT=$ARTIFACT_PREFIX/$JOBTAG
  EVIDENCE=$BASE/${RUN_ID}_build_evidence/$JOBTAG

  for FILE in "$RUNNER" "$SELF" "$CATALOG/header.json" "$CATALOG/gpic.parquet"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: invalid builder input"; exit 2; }
  done
  [ ! -e "$ARTIFACT_JOB_ROOT" ] && [ ! -L "$ARTIFACT_JOB_ROOT" ] \
    || { echo "FATAL: artifact namespace is not fresh"; exit 2; }
  [ ! -e "$EVIDENCE" ] && [ ! -L "$EVIDENCE" ] \
    || { echo "FATAL: build evidence namespace is not fresh"; exit 2; }
  mkdir -m 700 -p "$ARTIFACT_PREFIX" "$EVIDENCE"

  "$PY" -m py_compile "$RUNNER"
  if command -v lfs >/dev/null 2>&1; then
    LFS_AVAILABLE=true
    LFS_PATH=$(command -v lfs)
  else
    LFS_AVAILABLE=false
    LFS_PATH=""
  fi
  echo "GPIC blob pilot lfs_available=$LFS_AVAILABLE; first pilot records default stripe_count=0"

  # Every arm gets a mutually exclusive, full-range formal-catalog sample.
  # The 40k scan rows are mathematically disjoint from the 100k build midpoint
  # selection, so the concurrency scan cannot warm the full pilot payload.
  timeout --preserve-status --signal=TERM --kill-after=30s 10800s \
    "$PY" "$RUNNER" source-scan \
      --catalog-root "$CATALOG" \
      --sample-rows "$SOURCE_SCAN_ROWS_PER_ARM" \
      --coverage-intervals 256 \
      --min-unique-shards 2500 \
      --source-attempts 3 \
      --source-order path \
      --threads-matrix 8,16,24,32,48 \
      --abba \
      --exclude-sample-rows "$FSX_FULL_ROWS" \
      --max-byte-imbalance 1.10 \
      --job-spec "$SELF" \
      --output "$EVIDENCE/source_scan.json"

  THREADS=$("$PY" - "$EVIDENCE/source_scan.json" <<'PYEOF'
  import json, sys
  with open(sys.argv[1], encoding="utf-8") as handle:
      value=json.load(handle)
  if value.get("samples_mutually_exclusive") is not True:
      raise SystemExit("FATAL: source scan sample isolation missing")
  if value.get("excluded_build_selection_overlap_rows") != 0:
      raise SystemExit("FATAL: source scan warmed build selection")
  threads=value.get("recommended_threads_by_median")
  if threads not in {8,16,24,32,48}:
      raise SystemExit("FATAL: invalid source-scan recommendation")
  print(threads)
  PYEOF
  )

  build_fsx() {
    NAME=$1
    ROWS=$2
    BLOB_BYTES=$3
    MIN_SHARDS=$4
    timeout --preserve-status --signal=TERM --kill-after=30s 21600s \
      "$PY" "$RUNNER" build \
        --catalog-root "$CATALOG" \
        --sample-rows "$ROWS" \
        --coverage-intervals 256 \
        --min-unique-shards "$MIN_SHARDS" \
        --source-attempts 3 \
        --source-order path \
        --threads "$THREADS" \
        --blob-target-bytes "$BLOB_BYTES" \
        --max-total-source-bytes 0 \
        --stripe-count 0 \
        --backend fsx_posix \
        --allowed-output-prefix "$ARTIFACT_PREFIX" \
        --output-root "$ARTIFACT_JOB_ROOT/$NAME" \
        --write-authority offline-gpic-blob-v1-pilot-write-authorized \
        --job-spec "$SELF"
  }

  # First run is deliberately default-stripe only.  The runner supports an
  # explicit 1/4 stripe sweep, but it is not assumed until lfs is proven in JCC.
  build_fsx full100k_s0_b4g "$FSX_FULL_ROWS" 4294967296 7800
  build_fsx compare20k_s0_b1g "$COMPARE_ROWS" 1073741824 6500
  build_fsx compare20k_s0_b4g "$COMPARE_ROWS" 4294967296 6500

  "$PY" - "$EVIDENCE/build_receipt.json" "$JOBTAG" "$THREADS" "$LFS_AVAILABLE" "$LFS_PATH" \
    "$EVIDENCE/source_scan.json" "$ARTIFACT_JOB_ROOT/full100k_s0_b4g" \
    "$ARTIFACT_JOB_ROOT/compare20k_s0_b1g" "$ARTIFACT_JOB_ROOT/compare20k_s0_b4g" <<'PYEOF'
  import hashlib, json, os, sys
  from datetime import datetime, timezone
  from pathlib import Path

  output=Path(sys.argv[1])
  roots=[Path(value) for value in sys.argv[7:]]
  artifacts=[]
  for root in roots:
      raw=(root/"manifest.json").read_bytes()
      value=json.loads(raw)
      success=(root/"_SUCCESS").read_text(encoding="ascii").strip()
      if success != value.get("manifest_sha256"):
          raise SystemExit("FATAL: builder receipt manifest/success mismatch")
      artifacts.append({
          "root":str(root),
          "manifest_raw_sha256":hashlib.sha256(raw).hexdigest(),
          "manifest_sha256":value["manifest_sha256"],
          "sample_rows":value["selection"]["sample_rows"],
      })
  source=Path(sys.argv[6]).read_bytes()
  source_value=json.loads(source)
  receipt={
      "schema_version":"offline_gpic_blob_build_receipt_v1",
      "generated_at":datetime.now(timezone.utc).isoformat(),
      "jobtag":sys.argv[2],
      "selected_source_threads":int(sys.argv[3]),
      "lfs_available":sys.argv[4] == "true",
      "lfs_path":sys.argv[5],
      "stripe_scope":"default_stripe_count_0_only",
      "source_scan_raw_sha256":hashlib.sha256(source).hexdigest(),
      "source_scan_report_sha256":source_value["report_sha256"],
      "artifacts":artifacts,
  }
  receipt["receipt_sha256"]=hashlib.sha256((json.dumps(receipt,sort_keys=True,separators=(",",":"),allow_nan=False)+"\n").encode()).hexdigest()
  raw=(json.dumps(receipt,sort_keys=True,separators=(",",":"),allow_nan=False)+"\n").encode()
  fd=os.open(output,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
  try:
      view=memoryview(raw)
      while view:
          count=os.write(fd,view)
          if count <= 0: raise SystemExit("FATAL: short build receipt write")
          view=view[count:]
      os.fsync(fd)
  finally:
      os.close(fd)
  directory=os.open(output.parent,os.O_RDONLY|os.O_DIRECTORY)
  try: os.fsync(directory)
  finally: os.close(directory)
  PYEOF
  echo "OFFLINE_GPIC_BLOB_PILOT_BUILD_JOB_PASS artifacts=$ARTIFACT_JOB_ROOT evidence=$EVIDENCE"
