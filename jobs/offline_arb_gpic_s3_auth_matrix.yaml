# CPU16 one-object GPIC S3 authorization matrix. No package installation.
name: evan-mot-crop-offlinearb-gpic-s3-auth-matrix
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop/scripts/offline_arb
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export AWS_REGION=us-west-2
  export AWS_DEFAULT_REGION=us-west-2
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  HOST=$(hostname)
  [ "${HOST##*-}" = 0 ] || { echo "FATAL: single-worker hostname must end in -0"; exit 2; }
  JOBTAG=${HOST%-0}
  [ "$HOST" = "$JOBTAG-0" ] || { echo "FATAL: hostname/jobtag binding drift"; exit 2; }

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  SCRIPT=$REPO/scripts/offline_arb/diagnose_gpic_s3_auth_matrix.py
  STATIC=$REPO/scripts/offline_arb/test_gpic_s3_auth_matrix_static.py
  SELF=$REPO/jobs/offline_arb_gpic_s3_auth_matrix.yaml
  CACHE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_phase2b_20260710T052630Z_evan-mot-crop-offlinearb-p2c-gpictune-gtnv-0_26335/gpic_items_cache.json
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_gpic_s3_auth_matrix_v1
  OUTDIR=$BASE/$JOBTAG
  OUTPUT=$OUTDIR/result.json

  for FILE in "$SCRIPT" "$STATIC" "$SELF" "$CACHE"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: diagnostic input invalid"; exit 2; }
  done
  [ "$(sha256sum "$SCRIPT" | awk '{print $1}')" = b78e3a183dd1c3e5475abf2c116f2feb2fba026b5d72f0803ce0f764ef9bdb0a ]
  [ "$(sha256sum "$STATIC" | awk '{print $1}')" = 79a5cd7474ee3ffa2f0ff0b48ddd4ef60369a7514c997d44fad36b3b3401f82c ]
  [ "$(stat -c %s "$CACHE")" = 6220043 ]
  [ "$(sha256sum "$CACHE" | awk '{print $1}')" = 3c45ba6e3898b546dbc191e6b708e0bffc7047fd059708b7af8cc0e190cfa298 ]
  [ ! -e "$OUTDIR" ] && [ ! -L "$OUTDIR" ] \
    || { echo "FATAL: diagnostic output namespace is not fresh"; exit 2; }
  mkdir -m 700 -p "$OUTDIR"

  "$PY" -m py_compile "$SCRIPT" "$STATIC"
  "$PY" "$STATIC" "$SCRIPT" "$SELF"
  timeout --preserve-status --signal=TERM --kill-after=30s 600s \
    "$PY" "$SCRIPT" --cache "$CACHE" --output "$OUTPUT"
  [ -f "$OUTPUT" ] && [ ! -L "$OUTPUT" ] && [ -s "$OUTPUT" ]
  echo "GPIC_S3_AUTH_MATRIX_JOB_COMPLETE"
