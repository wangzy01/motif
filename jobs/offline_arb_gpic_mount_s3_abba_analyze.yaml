# Independent CPU-only analyzer for the GPIC mountpoint/S3 GetObject ABBA probe.
# Exit 0=GO, 3=NO_GO, 4=INCONCLUSIVE, 2=invalid/tampered evidence.
name: evan-mot-crop-offlinearb-gpic-mount-s3-abba-analyze
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  umask 077

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  RUN_ID=offline_arb_gpic_mount_s3_abba_probe_20260712r1
  RUN_ROOT=$BASE/$RUN_ID
  CACHE=$BASE/offline_arb_phase2b_20260710T052630Z_evan-mot-crop-offlinearb-p2c-gpictune-gtnv-0_26335/gpic_items_cache.json
  ANALYZER=$REPO/scripts/offline_arb/analyze_gpic_mount_s3_abba_probe.py
  ANALYZE_YAML=$REPO/jobs/offline_arb_gpic_mount_s3_abba_analyze.yaml
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  export PYTHONPATH=$REPO
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONDONTWRITEBYTECODE=1
  export PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  [ -d "$RUN_ROOT" ] && [ ! -L "$RUN_ROOT" ] \
    || { echo "FATAL: probe run root is unavailable"; exit 2; }
  for FILE in "$CACHE" "$ANALYZER" "$ANALYZE_YAML"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: required analyzer input is invalid"; exit 2; }
  done
  [ "$(stat -c '%s' "$CACHE")" = 6220043 ] \
    && [ "$(sha256sum "$CACHE" | awk '{print $1}')" = 3c45ba6e3898b546dbc191e6b708e0bffc7047fd059708b7af8cc0e190cfa298 ] \
    || { echo "FATAL: frozen source cache identity mismatch"; exit 2; }

  ANALYZER_HOST=$(hostname)
  case "$ANALYZER_HOST" in
    *-0) ANALYZER_JOBTAG=${ANALYZER_HOST%-0} ;;
    *) echo "FATAL: analyzer hostname is not a one-worker JCC identity"; exit 2 ;;
  esac
  case "$ANALYZER_JOBTAG" in
    ''|*[!A-Za-z0-9_.-]*) echo "FATAL: malformed analyzer jobtag"; exit 2 ;;
  esac
  [ "$ANALYZER_HOST" = "$ANALYZER_JOBTAG-0" ] \
    || { echo "FATAL: analyzer hostname/jobtag mismatch"; exit 2; }

  CAPTURE_ROOT=${OFFLINE_ARB_GPIC_MOUNT_S3_SOURCE_ATTEMPT_ROOT:-}
  if [ -z "$CAPTURE_ROOT" ]; then
    mapfile -t COMPLETES < <(
      find "$RUN_ROOT" -mindepth 3 -maxdepth 3 -type f -name capture_complete.json \
        -not -path "$RUN_ROOT/_analysis/*" -print | sort
    )
    [ "${#COMPLETES[@]}" -eq 1 ] \
      || { echo "FATAL: select one capture with OFFLINE_ARB_GPIC_MOUNT_S3_SOURCE_ATTEMPT_ROOT"; exit 2; }
    CAPTURE_ROOT=$(dirname "${COMPLETES[0]}")
  fi
  [ -d "$CAPTURE_ROOT" ] && [ ! -L "$CAPTURE_ROOT" ] \
    && [ -f "$CAPTURE_ROOT/capture_complete.json" ] \
    && [ ! -L "$CAPTURE_ROOT/capture_complete.json" ] \
    || { echo "FATAL: selected capture attempt is invalid"; exit 2; }
  case "$CAPTURE_ROOT/" in
    "$RUN_ROOT"/*/) ;;
    *) echo "FATAL: selected capture is outside the frozen run root"; exit 2 ;;
  esac
  SOURCE_NONCE=$(basename "$CAPTURE_ROOT")
  SOURCE_JOBTAG=$(basename "$(dirname "$CAPTURE_ROOT")")
  case "$SOURCE_JOBTAG" in
    ''|.|..|*[!A-Za-z0-9_.-]*) echo "FATAL: malformed source jobtag"; exit 2 ;;
  esac
  case "$SOURCE_NONCE" in
    *[!0-9a-f]*|'') echo "FATAL: malformed source attempt nonce"; exit 2 ;;
  esac
  [ "${#SOURCE_NONCE}" -eq 64 ] \
    || { echo "FATAL: malformed source attempt nonce length"; exit 2; }
  [ "$CAPTURE_ROOT" = "$RUN_ROOT/$SOURCE_JOBTAG/$SOURCE_NONCE" ] \
    || { echo "FATAL: non-canonical capture hierarchy"; exit 2; }

  LOCAL_ROOT=/local/evan/offline_arb_gpic_mount_s3_analyze.$ANALYZER_HOST.$$
  [ ! -e "$LOCAL_ROOT" ] && [ ! -L "$LOCAL_ROOT" ] \
    || { echo "FATAL: analyzer local namespace is not fresh"; exit 2; }
  mkdir -m 700 "$LOCAL_ROOT"
  export TMPDIR=$LOCAL_ROOT/tmp
  export PYTHONPYCACHEPREFIX=$LOCAL_ROOT/pycache
  mkdir -m 700 "$TMPDIR" "$PYTHONPYCACHEPREFIX"
  "$PY" -m py_compile "$ANALYZER"

  COMPLETE_SHA=$(sha256sum "$CAPTURE_ROOT/capture_complete.json" | awk '{print $1}')
  ANALYSIS_NONCE=$(
    "$PY" - "$RUN_ID" "$SOURCE_JOBTAG" "$SOURCE_NONCE" "$ANALYZER_JOBTAG" "$COMPLETE_SHA" <<'NONCEPY'
  import hashlib
  import json
  import sys
  run_id, source_jobtag, source_nonce, analyzer_jobtag, complete_sha = sys.argv[1:]
  value = {
      "schema_version": "offline_arb_gpic_mount_s3_abba_analysis_attempt_v1",
      "run_id": run_id,
      "source_jobtag": source_jobtag,
      "source_attempt_nonce": source_nonce,
      "analyzer_jobtag": analyzer_jobtag,
      "capture_complete_sha256": complete_sha,
  }
  raw = json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False).encode("utf-8")
  print(hashlib.sha256(raw).hexdigest())
  NONCEPY
  )
  case "$ANALYSIS_NONCE" in
    *[!0-9a-f]*|'') echo "FATAL: malformed analysis nonce"; exit 2 ;;
  esac
  [ "${#ANALYSIS_NONCE}" -eq 64 ] \
    || { echo "FATAL: malformed analysis nonce length"; exit 2; }

  ensure_real_dir() {
    DIR=$1
    if [ ! -e "$DIR" ] && [ ! -L "$DIR" ]; then
      mkdir "$DIR" 2>/dev/null \
        || { [ -d "$DIR" ] && [ ! -L "$DIR" ]; } \
        || return 1
    fi
    [ -d "$DIR" ] && [ ! -L "$DIR" ]
  }
  ANALYSIS_BASE=$RUN_ROOT/_analysis
  ANALYSIS_SOURCE=$ANALYSIS_BASE/$SOURCE_JOBTAG
  ANALYSIS_JOB=$ANALYSIS_SOURCE/$ANALYZER_JOBTAG
  ensure_real_dir "$ANALYSIS_BASE" \
    && ensure_real_dir "$ANALYSIS_SOURCE" \
    && ensure_real_dir "$ANALYSIS_JOB" \
    || { echo "FATAL: analysis hierarchy is invalid"; exit 2; }
  ANALYSIS_ROOT=$ANALYSIS_JOB/$ANALYSIS_NONCE
  [ ! -e "$ANALYSIS_ROOT" ] && [ ! -L "$ANALYSIS_ROOT" ] \
    || { echo "FATAL: refusing to reuse analysis attempt namespace"; exit 2; }
  mkdir -m 700 "$ANALYSIS_ROOT"
  ATTESTATION=$ANALYSIS_ROOT/analysis_input_attestation.json
  OUTPUT=$ANALYSIS_ROOT/analysis.json

  "$PY" - "$ANALYZER" "$ANALYZE_YAML" "$ATTESTATION" <<'ATTESTPY'
  import hashlib
  import json
  import os
  import stat
  import sys
  from pathlib import Path
  analyzer, analyze_yaml, output = map(Path, sys.argv[1:])
  files = {}
  for label, path in (("analyzer", analyzer), ("analyze_yaml", analyze_yaml)):
      if path.is_symlink() or not path.is_file() or path.resolve(strict=True) != path:
          raise SystemExit("FATAL: analysis input is not canonical regular data")
      raw = path.read_bytes()
      files[label] = {"path": str(path), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
  value = {"schema_version": "offline_arb_gpic_mount_s3_abba_analysis_input_v1", "files": files}
  payload = (json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True, allow_nan=False) + "\n").encode("utf-8")
  descriptor = os.open(output, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o400)
  try:
      view = memoryview(payload)
      while view:
          written = os.write(descriptor, view)
          if written <= 0:
              raise SystemExit("FATAL: analysis attestation write did not progress")
          view = view[written:]
      os.fsync(descriptor)
  finally:
      os.close(descriptor)
  os.chmod(output, 0o444, follow_symlinks=False)
  directory = os.open(output.parent, os.O_RDONLY | os.O_DIRECTORY)
  try:
      os.fsync(directory)
  finally:
      os.close(directory)
  ATTESTPY

  if timeout --preserve-status --signal=TERM --kill-after=120s 900s \
    "$PY" "$ANALYZER" \
      --capture-root "$CAPTURE_ROOT" \
      --cache "$CACHE" \
      --analysis-input-attestation "$ATTESTATION" \
      --output "$OUTPUT"; then
    ANALYZER_RC=0
  else
    ANALYZER_RC=$?
  fi

  "$PY" - "$ATTESTATION" <<'VERIFYATTESTPY'
  import hashlib
  import json
  import sys
  from pathlib import Path
  value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
  if value.get("schema_version") != "offline_arb_gpic_mount_s3_abba_analysis_input_v1":
      raise SystemExit("FATAL: analysis attestation schema drift")
  for declaration in value.get("files", {}).values():
      path = Path(declaration["path"])
      raw = path.read_bytes()
      if path.is_symlink() or len(raw) != declaration["bytes"] or hashlib.sha256(raw).hexdigest() != declaration["sha256"]:
          raise SystemExit("FATAL: analysis input changed during execution")
  VERIFYATTESTPY
  if [ ! -f "$OUTPUT" ] || [ -L "$OUTPUT" ]; then
    [ "$ANALYZER_RC" -ne 0 ] && exit "$ANALYZER_RC"
    echo "FATAL: analysis output was not published"
    exit 2
  fi
  [ "$(stat -c '%a' "$OUTPUT")" = 444 ] \
    || { echo "FATAL: analysis output mode is not immutable"; exit 2; }
  exit "$ANALYZER_RC"
