# Dedicated CPU16 static/synthetic validation for the fd crossover harness.
name: evan-mot-crop-offlinearb-w16-gpic-fd-crossover-static
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_arb_w16_fd_crossover_static.$(hostname).$$
  export OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 NUMEXPR_NUM_THREADS=2 ARROW_NUM_THREADS=2
  [ ! -e "$PYTHONPYCACHEPREFIX" ] && [ ! -L "$PYTHONPYCACHEPREFIX" ] \
    || { echo "FATAL: crossover static pycache prefix is not fresh"; exit 1; }
  mkdir -p "$PYTHONPYCACHEPREFIX"

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  RUNNER=$REPO/scripts/offline_arb/run_w16_gpic_fd_crossover_abba.py
  ANALYZER=$REPO/scripts/offline_arb/analyze_w16_gpic_fd_crossover_abba.py
  SELFTEST=$REPO/scripts/offline_arb/test_w16_gpic_fd_crossover_abba_static.py
  CAPTURE=$REPO/jobs/offline_arb_w16_gpic_fd_crossover_abba.yaml
  ANALYZE=$REPO/jobs/offline_arb_w16_gpic_fd_crossover_abba_analyze.yaml
  STATIC=$REPO/jobs/offline_arb_w16_gpic_fd_crossover_static.yaml
  CORE_RUNNER=$REPO/scripts/offline_arb/run_w16_gpic_abba_raw_gate.py
  CORE_ANALYZER=$REPO/scripts/offline_arb/analyze_w16_gpic_abba_raw_gate.py
  DATASET=$REPO/training/dataline_offline/offline_dataset.py
  CONFIG=$REPO/configs/stage256_offline_exact_v1.yaml
  for FILE in "$RUNNER" "$ANALYZER" "$SELFTEST" "$CAPTURE" "$ANALYZE" "$STATIC" \
              "$CORE_RUNNER" "$CORE_ANALYZER" "$DATASET" "$CONFIG"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: crossover static input invalid: $FILE"; exit 1; }
  done
  [ "$(grep -m1 '^numWorkers:' "$CAPTURE" | awk '{print $2}')" = 2 ]
  [ "$(grep -m1 '^gpuPerWorker:' "$CAPTURE" | awk '{print $2}')" = 0 ]
  [ "$(grep -m1 '^cpuPerWorker:' "$CAPTURE" | awk '{print $2}')" = 16 ]
  [ "$(grep -m1 '^numWorkers:' "$ANALYZE" | awk '{print $2}')" = 1 ]
  [ "$(grep -m1 '^gpuPerWorker:' "$ANALYZE" | awk '{print $2}')" = 0 ]
  [ "$(grep -m1 '^cpuPerWorker:' "$ANALYZE" | awk '{print $2}')" = 16 ]
  [ "$(grep -m1 '^numWorkers:' "$STATIC" | awk '{print $2}')" = 1 ]
  [ "$(grep -m1 '^gpuPerWorker:' "$STATIC" | awk '{print $2}')" = 0 ]
  [ "$(grep -m1 '^cpuPerWorker:' "$STATIC" | awk '{print $2}')" = 16 ]
  grep -q 'gpic_source_consistency_mode' "$DATASET"
  grep -q 'fd_stable' "$DATASET"
  grep -q 'path_stat_calls' "$DATASET"
  grep -q 'fstat_calls' "$DATASET"
  grep -q 'gpic_source_consistency_mode: strict_path' "$CONFIG"
  grep -q 'gpic_threads_per_node: 16' "$CONFIG"
  grep -q 'export OFFLINE_ARB_GPIC_THREADS_PER_NODE=16' "$CAPTURE"
  grep -q 'environment_threads != "16"' "$RUNNER"
  grep -q 'args.gpic_threads_per_node != 16' "$RUNNER"
  grep -q 'gpic_threads_resolution' "$RUNNER"
  grep -q '_publication_atomic_write_json' "$RUNNER"
  grep -q 'LOCAL_PUBLICATION_BASE' "$RUNNER"
  grep -q 'foreign canonical path' "$RUNNER"
  grep -q 'master arm publication identity is malformed' "$RUNNER"
  grep -q 'was not final on first publish' "$RUNNER"
  grep -q 'semantic_external_gate.*PENDING' "$RUNNER"
  grep -q 'production_selection_qualified' "$RUNNER"
  [ "$(grep -c 'atomic_write_json(' "$RUNNER")" -eq 1 ]
  grep -q 'GPIC thread-resolution identity mismatch' "$ANALYZER"
  grep -q '"strict_x"' "$RUNNER"
  grep -q '"fd_x"' "$RUNNER"
  grep -q '"fd_y"' "$RUNNER"
  grep -q '"strict_y"' "$RUNNER"
  grep -q 'FD_PAIR_DRIFT_MAX = 0.05' "$ANALYZER"
  grep -q 'STRICT_ENV_DRIFT_MAX = 0.10' "$ANALYZER"
  grep -q 'path_stat_timing_zero' "$ANALYZER"
  grep -q 'same_slice_plan_domain_raw_bytes_exact' "$ANALYZER"
  grep -q '"semantic_external_gate": "PENDING"' "$ANALYZER"
  grep -q '"production_selection_qualified": False' "$ANALYZER"
  grep -q 'GPUVAL_CANDIDATE' "$ANALYZER"
  grep -q 'analysis_output_attestation' "$ANALYZER"
  grep -q '_CROSSOVER_ANALYSIS_ATTEMPT_ROOT' "$ANALYZER"
  grep -q 'analyzer retry requires explicit OFFLINE_ARB_FD_CROSSOVER_SOURCE_JOBTAG' "$ANALYZE"
  grep -q 'capture_input_attestation.json' "$ANALYZE"
  grep -q 'analysis-attempt-nonce' "$ANALYZE"
  grep -q 'analyzer hierarchy contains symlink/non-directory' "$ANALYZE"
  grep -q 'analysis attempt hierarchy contains a symlink/non-directory' "$ANALYZER"
  grep -q 'resolve(strict=True) != expected_root.resolve(strict=True)' "$ANALYZER"
  ! grep -q 'jobs/offline_arb_final_static_validate.yaml' "$RUNNER" "$ANALYZER" "$SELFTEST"

  "$PY" -m py_compile "$RUNNER" "$ANALYZER" "$SELFTEST"
  "$PY" - "$CAPTURE" "$ANALYZE" "$STATIC" <<'PYEOF'
  import sys
  from pathlib import Path
  import yaml
  for raw in sys.argv[1:]:
      path = Path(raw)
      value = yaml.safe_load(path.read_text(encoding="utf-8"))
      if not isinstance(value, dict) or not isinstance(value.get("command"), str):
          raise SystemExit(f"FATAL: invalid JCC YAML: {path}")
      if value.get("cpuPerWorker") != 16 or value.get("gpuPerWorker") != 0:
          raise SystemExit(f"FATAL: CPU16/no-GPU contract drift: {path}")
  PYEOF
  timeout --signal=TERM --kill-after=10s 600s "$PY" "$SELFTEST"
  echo "W16_GPIC_FD_CROSSOVER_STATIC_PASS"
