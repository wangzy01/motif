# EXP2 — 真实数据 IO 压测（2×H100）。覆盖 256/512/1024 × 小/大 buffer，测 data_wait vs compute、
# GPU util、各域实际抽样比例、失败样本。判断正式训练是否被 IO 卡住。
# 提交: jcc job submit jobs/exp2_iostress.yaml ; 日志: jcc job log evan-mot-exp2-iostress -p all -n 400
name: evan-mot-exp2-iostress
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 2
cpuPerWorker: 48
memGBPerWorker: 500
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=8 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/exp2_iostress
  mkdir -p $RES
  date -u; hostname; nvidia-smi
  $PY -c "import torch;print('torch',torch.__version__,'ndev',torch.cuda.device_count())"

  echo "##### TRIAL (256 tiny, gate) #####"
  timeout 15m $PY -m torch.distributed.run --nproc_per_node=2 --master_port=29630 \
    experiments/exp_scripts/io_stress.py --config configs/stage1a_t2i_256.yaml \
    --stage 256 --image-size 256 --batch-size 16 --buffer-size 128 --queue-size 64 --anime-nrows 8000 \
    --warmup 2 --measure 4 --stats-cache $STATS 2>&1 | tee $RES/trial.log
  if ! grep -q "IO_STRESS_JSON" $RES/trial.log; then echo "TRIAL FAILED — abort"; exit 1; fi

  run() { # stage size bs buf q nrows port tag
    timeout 30m $PY -m torch.distributed.run --nproc_per_node=2 --master_port=$7 \
      experiments/exp_scripts/io_stress.py --config configs/stage1a_t2i_$1.yaml \
      --stage $1 --image-size $2 --batch-size $3 --buffer-size $4 --queue-size $5 --anime-nrows $6 \
      --warmup 8 --measure 50 --stats-cache $STATS 2>&1 | tee -a $RES/sweep_$1_$8.log
  }
  echo "##### SWEEP: 256/512/1024 × {small,large} buffers #####"
  for cfg in "256 256 64" "512 512 32" "1024 1024 8"; do
    set -- $cfg; ST=$1; SZ=$2; BS=$3
    run $ST $SZ $BS 128 64 8000 29631 small || true
    run $ST $SZ $BS 768 384 40000 29632 large || true
  done

  echo "##### SUSTAINED 256 (200 batches, catch occasional R2/tar stalls) #####"
  timeout 45m $PY -m torch.distributed.run --nproc_per_node=2 --master_port=29650 \
    experiments/exp_scripts/io_stress.py --config configs/stage1a_t2i_256.yaml \
    --stage 256 --image-size 256 --batch-size 64 --buffer-size 512 --queue-size 256 --anime-nrows 20000 \
    --warmup 10 --measure 200 --stats-cache $STATS 2>&1 | tee $RES/sustained_256.log || true

  echo "##### grep summary #####"
  grep -h "IO_STRESS_JSON" $RES/*.log > $RES/all_results.jsonl || true
  wc -l $RES/all_results.jsonl
  echo "##### DONE #####"; date -u
