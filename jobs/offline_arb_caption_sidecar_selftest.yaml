# Tiny Arrow typed null/list/unicode + fixed-row-group semantic-digest round trip.
# This is the first JCC gate and never reads or writes the production sidecar.
name: evan-mot-crop-offlinearb-caption-sidecar-selftest-v3
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_caption_sidecar/selftest.$(hostname)
  mkdir -p "$PYTHONPYCACHEPREFIX"
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  "$PY" -m py_compile \
    scripts/offline_arb/caption_sidecar_contract.py \
    scripts/offline_arb/build_caption_sidecar.py
  "$PY" scripts/offline_arb/build_caption_sidecar.py --self-test
