# 2026-07-09 ARB 修复的纯逻辑单测（prune 恒等式/nearest/schedule/流式 chunk/Bucketer.allowed/square-only 护栏）
name: evan-mot-crop-naifu-arb-fix-unittest
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 8
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export OMP_NUM_THREADS=1 ARROW_NUM_THREADS=1 PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  $PY -m py_compile train.py training/diagnostics.py \
    training/dataline/complete_dataset.py training/dataline/multi_ar.py \
    training/dataline/image_fetch.py training/dataline/manifest_index.py \
    scripts/stress_naifu_arb_real_dataline.py scripts/audit_naifu_arb_bucketdist_fast.py \
    scripts/test_naifu_arb_fixes.py
  $PY scripts/test_naifu_arb_fixes.py
