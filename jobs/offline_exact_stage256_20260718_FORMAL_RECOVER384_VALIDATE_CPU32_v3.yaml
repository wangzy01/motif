# CPU32 deep validation after the formal-v3 RECOVER384 writer.
name: evan-offarb-s256-20260718-recover384-validate-v3
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 32
memGBPerWorker: 384
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch PYTHONUNBUFFERED=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=32 MKL_NUM_THREADS=32
  export PYTHONPYCACHEPREFIX="/local/evan/stage256_20260718_pycache/${JCC_JOB_ID:-v3post}/$(hostname)"
  mkdir -p "$PYTHONPYCACHEPREFIX"
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ROOT=$BASE/offline_arb_stage256_20260718_semantic_v1
  CK=/fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/stage256_20260718_causalmlf_offline_exact_v2
  RES=$BASE/stage256_20260718_causalmlf_offline_exact_v2
  PRE=$ROOT/formal_v3/PRE_RECOVER256_SUCCESS.json
  OUT=$ROOT/formal_v3/RECOVER384_CHECKPOINT_SUCCESS.json
  SCRIPT=scripts/offline_arb/verify_stage256_20260718_formal_v3_recovery.py
  RUNNER=scripts/offline_arb/run_stage256_20260718_formal_v3.sh
  CFG=configs/stage256_20260718_causalmlf_offline_exact_v1.yaml
  V1=jobs/offline_exact_stage256_20260718_FORMAL_8x8.yaml
  V2=jobs/offline_exact_stage256_20260718_FORMAL_RESUME_8x8_v2.yaml
  RECOVER=jobs/offline_exact_stage256_20260718_FORMAL_RECOVER384_8x8_v3.yaml
  MAIN=jobs/offline_exact_stage256_20260718_FORMAL_RESUME_8x8_v3.yaml
  ADDENDUM=docs/FORMAL_V3_RECOVERY_ADDENDUM.md
  BOOT=$ROOT/formal_v2/BOOT256_CHECKPOINT_SUCCESS.json
  PRE_YAML=jobs/offline_exact_stage256_20260718_FORMAL_RECOVERY_PREFLIGHT_CPU32_v3.yaml
  POST_YAML=jobs/offline_exact_stage256_20260718_FORMAL_RECOVER384_VALIDATE_CPU32_v3.yaml
  test -f "$PRE" && test ! -L "$PRE"
  test ! -e "$OUT" && test ! -L "$OUT"
  "$PY" "$SCRIPT" --phase post \
    --checkpoint "$CK/last.pt" --metrics "$CK/metrics.jsonl" \
    --result-root "$RES" --release-root "$ROOT" --config "$CFG" \
    --v1-yaml "$V1" --v2-yaml "$V2" --recover-yaml "$RECOVER" \
    --main-yaml "$MAIN" --runner "$RUNNER" --addendum "$ADDENDUM" \
    --boot-receipt "$BOOT" --pre-receipt "$PRE" \
    --pre-validator-yaml "$PRE_YAML" --post-validator-yaml "$POST_YAML" \
    --output "$OUT"
  test -f "$OUT" && test ! -L "$OUT"
  "$PY" - "$OUT" <<'PYEOF'
  import json,sys
  value=json.load(open(sys.argv[1],encoding="utf-8"))
  assert value.get("status")=="PASS"
  assert value.get("schema")=="stage256_20260718_formal_v3_recover384_checkpoint_v1"
  assert int(value.get("expected_checkpoint_step",-1))==384
  assert int(value.get("exact_target_step",-1))==166667
  print("FORMAL_V3_RECOVER384_VALIDATION_PASS",value["checkpoint"]["sha256"])
  PYEOF
