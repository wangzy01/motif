# Phase-1 leg 2/3: DPG-Bench prompt-following on the 4 running runs, Qwen3-VL judge.
# Uses a STRIDED ~152-prompt subset of the 1065 DPG prompts (every 7th -> spans all
# categories, deterministic; avoids the first-150 partiprompts skew). generate_dpg.py
# (venv-gpu) samples one image/prompt/run; run_dpg.py (venv-dpg) scores with Qwen3-VL.
# Single GPU, read-only. Launch only after jobs/eval_dpg_smoke.yaml passes.
name: evan-mot-eval-dpg-4runs
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 16
memGBPerWorker: 220
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PYG=/fsx/evan/mot_code/venv-gpu/bin/python
  PYD=/fsx/evan/mot_code/venv-dpg/bin/python
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  export HF_HOME=/local/evan/cache/huggingface TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  mkdir -p $HF_HOME $TORCH_HOME $TRITON_CACHE_DIR
  OUT=experiments/results/eval_dpg_4runs
  SAMP=$OUT/samples
  RUNS="b1 ab1causal ab2fusion ab3lora"
  mkdir -p $SAMP
  SUBSET=$OUT/dpg_subset.jsonl
  awk 'NR%7==1' experiments/eval/dpg/dpg_prompts.jsonl > $SUBSET
  echo "[subset] $(wc -l < $SUBSET) DPG prompts (strided every 7th of 1065)"
  nvidia-smi -L || true

  echo "===== GENERATE DPG images (venv-gpu) ====="
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 150m $PYG experiments/eval/dpg/generate_dpg.py \
    --runs $RUNS --prompts $SUBSET --out-dir $SAMP --size 256 --steps 64 --cfg 4.0 \
    --seed 7 --weights ema --batch-size 8 --grid 1

  echo "===== SCORE DPG (venv-dpg, Qwen3-VL judge) ====="
  set +e
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 120m $PYD experiments/eval/dpg/run_dpg.py \
    --samples-dir $SAMP --data $SUBSET --runs $RUNS --backend qwen3vl --out-dir $OUT
  echo "[dpg-score] rc=$?"
  set -e
  echo "===== DONE ====="
  cat $OUT/comparison.md || true
