# Ab3 und_lora grad-flow 复核（gradient_checkpointing=True，与产线一致）。单卡，~2 分钟。
# 通过 = 日志末行 "ALL OK" 且 rc=0。失败 = AssertionError（梯度流断/冻结参数有梯度）→ 不上 Ab3 2×8。
name: evan-mot-test-ab3-ckpt-gradflow
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 8
memGBPerWorker: 120
maxRetries: 1
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_ablations
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_ablations
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  $PY scripts/test_ab3_ckpt_gradflow.py
  RC=$?; echo "===== ab3-ckpt-gradflow exited rc=$RC $(date -u) ====="; exit $RC
