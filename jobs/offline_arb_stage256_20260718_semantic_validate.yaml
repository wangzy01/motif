# Independent full-slot audit of both materialized semantic plans.
name: evan-offarb-s256-20260718-semantic-validate-v1
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 160
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  CACHE_TAG=${JCC_JOB_ID:-${JOB_ID:-manual}}
  export PYTHONPYCACHEPREFIX="/local/evan/stage256_20260718_pycache/$CACHE_TAG/$(hostname)"
  mkdir -p "$PYTHONPYCACHEPREFIX"
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=8 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=8
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  RUN_ID=stage256_20260718_causalmlf_offline_exact_v1
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ROOT=$BASE/offline_arb_stage256_20260718_semantic_v1
  OVERLAY=$ROOT/overlay
  CAT=$BASE/offline_arb_catalog_v1
  SCRIPT=scripts/offline_arb/audit_semantic_plan.py
  RECEIPT=$ROOT/SEMANTIC_VALIDATE_SUCCESS.json

  test -f "$ROOT/SEMANTIC_MATERIALIZE_SUCCESS.json" && test ! -L "$ROOT/SEMANTIC_MATERIALIZE_SUCCESS.json"
  test -f "$SCRIPT" && test ! -L "$SCRIPT"
  test ! -e "$RECEIPT" && test ! -L "$RECEIPT" \
    || { echo "FATAL: semantic validation receipt already exists"; exit 40; }
  "$PY" -m py_compile "$SCRIPT" stage256_20260718/semantic_plan.py

  validate_one() {
    local TAG=$1
    local PLAN=$ROOT/$TAG/plan
    local PREFIX_STEPS=$2
    local PREFIX_EXPOSURES=$3
    local EXPECTED_ACTIVE=$4
    if [ "$EXPECTED_ACTIVE" = dynamic ]; then
      EXPECTED_ACTIVE=$("$PY" - "$PLAN/header.json" <<'PYEOF'
  import json, sys
  h=json.load(open(sys.argv[1],encoding="utf-8")); s=[int(x) for x in h["S"]]
  active=sum(x>0 for x in s); square=int(h["square_bucket_idx"])
  assert active > 1, active
  assert s[square] > 0, (square,s[square])
  assert any(x>0 for i,x in enumerate(s) if i != square), s
  print(active)
  PYEOF
      )
    fi
    timeout --signal=TERM --kill-after=60s 10800s \
      "$PY" "$SCRIPT" \
        --plan "$PLAN" \
        --prefix-steps "$PREFIX_STEPS" \
        --expected-prefix-exposures "$PREFIX_EXPOSURES" \
        --expected-active-buckets "$EXPECTED_ACTIVE" \
        --expected-exclusions 11
    test -f "$PLAN/PLAN_AUDIT_SUCCESS.json" && test ! -L "$PLAN/PLAN_AUDIT_SUCCESS.json"
  }

  validate_one w8_smoke 3 864 dynamic
  validate_one w64_prod 166667 384000768 20

  "$PY" - "$ROOT" "$RECEIPT" "$RUN_ID" <<'PYEOF'
  import hashlib, json, os, pathlib, sys
  root, output, run_id = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3]
  reports = {}
  for tag in ("w8_smoke", "w64_prod"):
      semantic_path = root / tag / "plan" / "PLAN_AUDIT_SUCCESS.json"
      semantic = json.load(open(semantic_path, encoding="utf-8"))
      assert semantic.get("status") == "PASS", semantic
      assert int(semantic["full_stage"]["anime_tag_only_exposures"]) == 0, semantic
      if tag == "w64_prod":
          expected = {"anime":103680207,"monet_real":155520311,"gpic":99456199,"synthetic":19584039,"textatlas":5760012}
          observed = {str(k):int(v) for k,v in semantic["formal_prefix"]["domain_totals"].items()}
          assert observed == expected, observed
          assert sum(observed.values()) == 384000768
          assert {str(k):int(v) for k,v in semantic["full_stage"]["domain_totals"].items()} == observed
      reports[tag] = {
          "semantic_sha256": hashlib.sha256(semantic_path.read_bytes()).hexdigest(),
          "tag_only_exposure": 0,
      }
  value = {
      "status": "PASS", "run_id": run_id, "tag_only_exposure": 0, "reports": reports,
  }
  fd = os.open(output, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o444)
  with os.fdopen(fd, "w", encoding="utf-8") as f:
      json.dump(value, f, indent=2, sort_keys=True); f.write("\n"); f.flush(); os.fsync(f.fileno())
  print(json.dumps(value, indent=2, sort_keys=True))
  PYEOF
