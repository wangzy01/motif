# Run only after the formal five-domain sidecar and independent validator are
# green.  This job atomically creates freeze v3, then performs the same complete
# live-versus-freeze gate that FORMAL node 0 will run.
name: evan-offarb-freeze-v3
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  OUTDIR=$BASE/offline_arb_plans_v1
  FREEZE=$OUTDIR/FREEZE_MANIFEST.json
  HOST=$(hostname); JOBTAG=${HOST%-*}; STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  PREFIX=$OUTDIR/freeze_v3.$JOBTAG.$STAMP
  mkdir -p "$OUTDIR"

  # Refuse concurrent publishers.  make_freeze_manifest.py itself writes a
  # sibling tmp, fsyncs it, atomically replaces FREEZE, and fsyncs OUTDIR.
  exec 9>"$OUTDIR/.freeze_v3.lock"
  flock -n 9 || { echo "FATAL: another freeze v3 publisher holds the lock"; exit 39; }
  rm -f "$PREFIX.create.json.tmp" "$PREFIX.verify.json.tmp" "$PREFIX.pass.tmp"

  set +e
  timeout --signal=TERM --kill-after=30s 14400s \
    "$PY" scripts/offline_arb/make_freeze_manifest.py \
    2>&1 | tee "$PREFIX.create.json.tmp"
  CREATE_PIPE=("${PIPESTATUS[@]}")
  set -e
  CREATE_RC=${CREATE_PIPE[0]}; CREATE_TEE_RC=${CREATE_PIPE[1]}
  if [ "$CREATE_TEE_RC" -ne 0 ]; then
    echo "FATAL: freeze create evidence tee rc=$CREATE_TEE_RC"; exit "$CREATE_TEE_RC"
  fi
  [ "$CREATE_RC" -eq 0 ] || { echo "FATAL: freeze create rc=$CREATE_RC"; exit "$CREATE_RC"; }
  mv "$PREFIX.create.json.tmp" "$PREFIX.create.json"
  test -f "$FREEZE" && test ! -L "$FREEZE" || { echo "FATAL: freeze output is not a regular file"; exit 39; }
  CREATE_JSON_SHA=$(sha256sum "$PREFIX.create.json" | awk '{print $1}')
  read -r CREATE_STATUS CREATE_MODE CREATE_RELEASE CREATE_FREEZE_SHA < <(
    "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); print(x.get("status"),x.get("mode"),x.get("release_digest"),x.get("freeze_sha256"))' "$PREFIX.create.json"
  )
  [ "$CREATE_STATUS" = PASS ] && [ "$CREATE_MODE" = create-freeze ] \
    || { echo "FATAL: malformed freeze create JSON"; exit 39; }

  set +e
  timeout --signal=TERM --kill-after=30s 14400s \
    "$PY" scripts/offline_arb/make_freeze_manifest.py --verify-freeze \
    2>&1 | tee "$PREFIX.verify.json.tmp"
  VERIFY_PIPE=("${PIPESTATUS[@]}")
  set -e
  VERIFY_RC=${VERIFY_PIPE[0]}; VERIFY_TEE_RC=${VERIFY_PIPE[1]}
  if [ "$VERIFY_TEE_RC" -ne 0 ]; then
    echo "FATAL: freeze verify evidence tee rc=$VERIFY_TEE_RC"; exit "$VERIFY_TEE_RC"
  fi
  [ "$VERIFY_RC" -eq 0 ] || { echo "FATAL: freeze verify rc=$VERIFY_RC"; exit "$VERIFY_RC"; }
  mv "$PREFIX.verify.json.tmp" "$PREFIX.verify.json"

  FREEZE_SHA=$(sha256sum "$FREEZE" | awk '{print $1}')
  VERIFY_JSON_SHA=$(sha256sum "$PREFIX.verify.json" | awk '{print $1}')
  read -r VERIFY_STATUS VERIFY_MODE VERIFY_RELEASE VERIFY_FREEZE_SHA < <(
    "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); print(x.get("status"),x.get("mode"),x.get("release_digest"),x.get("freeze_sha256"))' "$PREFIX.verify.json"
  )
  [ "$VERIFY_STATUS" = PASS ] && [ "$VERIFY_MODE" = verify-freeze ] \
    && [ "$CREATE_RELEASE" = "$VERIFY_RELEASE" ] \
    && [ "$CREATE_FREEZE_SHA" = "$FREEZE_SHA" ] \
    && [ "$VERIFY_FREEZE_SHA" = "$FREEZE_SHA" ] \
    || { echo "FATAL: create/verify release or freeze identity mismatch"; exit 39; }
  for VALUE in "$FREEZE_SHA" "$VERIFY_RELEASE" "$CREATE_JSON_SHA" "$VERIFY_JSON_SHA"; do
    case "$VALUE" in (*[!0-9a-f]*|'') echo "FATAL: malformed freeze PASS hash"; exit 39;; esac
    [ "${#VALUE}" -eq 64 ] || { echo "FATAL: malformed freeze PASS hash length"; exit 39; }
  done
  printf 'PASS|%s|%s|%s|%s|%s|%s\n' \
    "$JOBTAG" "$STAMP" "$FREEZE_SHA" "$VERIFY_RELEASE" \
    "$CREATE_JSON_SHA" "$VERIFY_JSON_SHA" > "$PREFIX.pass.tmp"
  mv "$PREFIX.pass.tmp" "$PREFIX.pass"
  echo "FREEZE_V3_PASS jobtag=$JOBTAG freeze_sha256=$FREEZE_SHA release_digest=$VERIFY_RELEASE create_json_sha256=$CREATE_JSON_SHA verify_json_sha256=$VERIFY_JSON_SHA"
