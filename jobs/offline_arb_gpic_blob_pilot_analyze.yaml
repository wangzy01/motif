# Independent metadata/report analyzer; it never reads blob payloads.
# This is patched last.  All earlier submitted YAMLs must remain byte-frozen
# until this job finishes its before/after live-file closure.
name: evan-mot-crop-offlinearb-gpic-blob-pilot-analyze
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES="" PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1

  SOURCE_BUILD_JOBTAG=evan-mot-crop-offlinearb-gpic-blob-pilot-build-m86c
  SOURCE_REPLAY_JOBTAG=evan-mot-crop-offlinearb-gpic-blob-pilot-replay-nqmh
  INCLUDE_S3=true
  SOURCE_S3_BUILD_JOBTAG=evan-mot-crop-offlinearb-gpic-blob-pilot-s3-build-vhgz
  [ -n "$SOURCE_BUILD_JOBTAG" ] && [ -n "$SOURCE_REPLAY_JOBTAG" ] \
    || { echo "FATAL: explicit build/replay jobtags are required"; exit 2; }
  if [ "$INCLUDE_S3" = true ]; then
    [ -n "$SOURCE_S3_BUILD_JOBTAG" ] || { echo "FATAL: S3 build jobtag required"; exit 2; }
  elif [ "$INCLUDE_S3" != false ]; then
    echo "FATAL: INCLUDE_S3 must be literal true or false"; exit 2
  fi

  HOST=$(hostname); [ "${HOST##*-}" = 0 ] || { echo "FATAL: worker identity drift"; exit 2; }
  JOBTAG=${HOST%-0}
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  ANALYZER=$REPO/scripts/offline_arb/analyze_offline_gpic_blob_pilot.py
  SELF=$REPO/jobs/offline_arb_gpic_blob_pilot_analyze.yaml
  RUNNER=$REPO/scripts/offline_arb/run_offline_gpic_blob_pilot.py
  BUILD_SPEC=$REPO/jobs/offline_arb_gpic_blob_pilot_build.yaml
  S3_BUILD_SPEC=$REPO/jobs/offline_arb_gpic_blob_pilot_s3_build.yaml
  REPLAY_SPEC=$REPO/jobs/offline_arb_gpic_blob_pilot_replay.yaml
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  RUN_ID=offline_gpic_blob_pilot_20260712r2
  FSX_ROOT=$BASE/$RUN_ID/$SOURCE_BUILD_JOBTAG
  BUILD_EVIDENCE=$BASE/${RUN_ID}_build_evidence/$SOURCE_BUILD_JOBTAG
  REPLAY_EVIDENCE=$BASE/${RUN_ID}_replay_evidence/$SOURCE_REPLAY_JOBTAG
  S3_BUILD_EVIDENCE=$BASE/${RUN_ID}_s3_build_evidence/$SOURCE_S3_BUILD_JOBTAG
  S3_ROOT=/s3/evan/artifacts/$RUN_ID/$SOURCE_S3_BUILD_JOBTAG/s3_20k_s0_b4g
  OUTPUT_ROOT=$BASE/${RUN_ID}_analysis/$JOBTAG
  [ ! -e "$OUTPUT_ROOT" ] && [ ! -L "$OUTPUT_ROOT" ] || { echo "FATAL: analysis namespace exists"; exit 2; }
  mkdir -m 700 -p "$OUTPUT_ROOT"

  if [ "$INCLUDE_S3" = true ]; then
    "$PY" "$ANALYZER" \
      --source-scan "$BUILD_EVIDENCE/source_scan.json" \
      --artifact full100k="$FSX_ROOT/full100k_s0_b4g" \
      --artifact fsx_s0b1="$FSX_ROOT/compare20k_s0_b1g" \
      --artifact fsx_s0b4="$FSX_ROOT/compare20k_s0_b4g" \
      --artifact s3_s0b4="$S3_ROOT" \
      --replay full100k_capacity="$REPLAY_EVIDENCE/full100k_capacity.json" \
      --replay full100k_integrity="$REPLAY_EVIDENCE/full100k_integrity.json" \
      --replay fsx_s0b1_capacity="$REPLAY_EVIDENCE/fsx_s0b1_capacity.json" \
      --replay fsx_s0b1_integrity="$REPLAY_EVIDENCE/fsx_s0b1_integrity.json" \
      --replay fsx_s0b4_capacity="$REPLAY_EVIDENCE/fsx_s0b4_capacity.json" \
      --replay fsx_s0b4_integrity="$REPLAY_EVIDENCE/fsx_s0b4_integrity.json" \
      --replay s3_s0b4_capacity="$REPLAY_EVIDENCE/s3_s0b4_capacity.json" \
      --replay s3_s0b4_integrity="$REPLAY_EVIDENCE/s3_s0b4_integrity.json" \
      --exact-pair fsx_s0b4=s3_s0b4 \
      --require-distinct-runtime-hosts \
      --enforce-pilot-shape \
      --runner "$RUNNER" --build-job-spec "$BUILD_SPEC" \
      --s3-build-job-spec "$S3_BUILD_SPEC" --replay-job-spec "$REPLAY_SPEC" \
      --build-receipt "$BUILD_EVIDENCE/build_receipt.json" \
      --s3-build-receipt "$S3_BUILD_EVIDENCE/s3_build_receipt.json" \
      --job-spec "$SELF" \
      --output "$OUTPUT_ROOT/analysis.json"
  else
    "$PY" "$ANALYZER" \
      --source-scan "$BUILD_EVIDENCE/source_scan.json" \
      --artifact full100k="$FSX_ROOT/full100k_s0_b4g" \
      --artifact fsx_s0b1="$FSX_ROOT/compare20k_s0_b1g" \
      --artifact fsx_s0b4="$FSX_ROOT/compare20k_s0_b4g" \
      --replay full100k_capacity="$REPLAY_EVIDENCE/full100k_capacity.json" \
      --replay full100k_integrity="$REPLAY_EVIDENCE/full100k_integrity.json" \
      --replay fsx_s0b1_capacity="$REPLAY_EVIDENCE/fsx_s0b1_capacity.json" \
      --replay fsx_s0b1_integrity="$REPLAY_EVIDENCE/fsx_s0b1_integrity.json" \
      --replay fsx_s0b4_capacity="$REPLAY_EVIDENCE/fsx_s0b4_capacity.json" \
      --replay fsx_s0b4_integrity="$REPLAY_EVIDENCE/fsx_s0b4_integrity.json" \
      --require-distinct-runtime-hosts \
      --enforce-pilot-shape \
      --runner "$RUNNER" --build-job-spec "$BUILD_SPEC" \
      --replay-job-spec "$REPLAY_SPEC" \
      --build-receipt "$BUILD_EVIDENCE/build_receipt.json" \
      --job-spec "$SELF" \
      --output "$OUTPUT_ROOT/analysis.json"
  fi
  echo "OFFLINE_GPIC_BLOB_PILOT_ANALYZE_JOB_PASS output=$OUTPUT_ROOT/analysis.json"
