# OFFLINE_ARB_V1 Phase-5:构建权威 L1/L2 catalog(§11 契约,floor=0.005 折叠,row_id=虚拟 catalog 连续行号)。
# 前置:offline_arb_tarindex_v1/_SUCCESS 必须存在(taridx 三分片 c job --verify-only PASS 后 touch);
#       缺失时脚本 exit 33(预检约定),不产生任何部分输出。
# 输出(脚本强制唯一合法 output-dir):
#   /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1/
#     {anime,monet_real,gpic,synthetic,textatlas}.parquet + bad_rows.parquet + N_diff.json + header.json
# 集群新规(2026-07-10):禁 64cpu/0gpu;单 job 16cpu,--workers 14。
name: evan-mot-crop-offlinearb-p5-catalog
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 96
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1
  IDX=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_tarindex_v1
  mkdir -p "$ROOT"
  echo "ROOT=$ROOT host=$(hostname) started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "$ROOT/run_info.txt"
  test -f "$IDX/_SUCCESS" || { echo "FATAL: tarindex _SUCCESS missing, aborting (exit 33)"; exit 33; }
  "$PY" -m py_compile scripts/offline_arb/phase5_build_catalog.py
  RC=0
  set +e
  # 墙钟预算 <=5h(D6 单 job 原则):17400s + kill-after 60s。
  T0=$SECONDS
  timeout --signal=TERM --kill-after=60s 17400s \
    "$PY" scripts/offline_arb/phase5_build_catalog.py \
      --config configs/stage256_redesign_naifu_arb_v1.yaml \
      --workers 14 \
    2>&1 | tee "$ROOT/run.log"
  RC=${PIPESTATUS[0]}
  set -e
  BUILD_WALL=$((SECONDS - T0))
  echo "==== OFFLINE_ARB PHASE5 CATALOG exit_code=$RC wall=${BUILD_WALL}s ===="
  GATE_PY='
  import json, sys
  from pathlib import Path
  root = Path(sys.argv[1])
  header = root / "header.json"
  if not header.is_file():
      print("GATE: header.json missing -> FAIL"); sys.exit(1)
  with open(header, encoding="utf-8") as f:
      h = json.load(f)
  keys = ["catalog_hash", "assignment_hash", "row_count", "kept_bucket_indices", "duration_seconds"]
  summary = {k: h.get(k) for k in keys if k in h}
  summary["domain_rows"] = {d: h["files"][d]["rows"] for d in h.get("domains", []) if d in h.get("files", {})}
  # self_checks 里 cell_counts 带 95x5 大矩阵,只打各项布尔,防截断吞掉后续项
  summary["self_checks"] = {k: (v.get("pass") if isinstance(v, dict) else v)
                            for k, v in (h.get("self_checks") or {}).items()}
  print(json.dumps(summary, indent=2, ensure_ascii=False, default=str)[:4000])
  ndiff = root / "N_diff.json"
  if ndiff.is_file():
      with open(ndiff, encoding="utf-8") as f:
          nd = json.load(f)
      print("tar_join_by_domain:", json.dumps(nd.get("tar_join_by_domain"), indent=2, ensure_ascii=False))
      print("reconciliation_pass:", nd.get("reconciliation_pass"))
  '
  # 失败场景(如 miss gate RC=2)N_diff/bad_rows 已先落盘,同样打印尸检材料
  "$PY" -c "$GATE_PY" "$ROOT" || true
  exit "$RC"
