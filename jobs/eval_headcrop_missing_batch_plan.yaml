name: evan-hc-missing-plan
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 2
memGBPerWorker: 8
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup:/fsx/evan/mot_code/mot_pilot_v1_cleanup/experiments/eval
  MAIN=/fsx/evan/mot_code/data_analysis/outputs/headcrop_matrix_now_comprehensive
  $PY -m py_compile experiments/eval/plan_missing_headcrop_subagent_batches.py
  $PY experiments/eval/plan_missing_headcrop_subagent_batches.py \
    --manifests $(cat "$MAIN/final_dedup_manifests.txt") \
    --scores "$MAIN/subagent_scores_partial/*.jsonl" \
    --out-dir "$MAIN/missing_subagent_batches" \
    --batch-size 18
