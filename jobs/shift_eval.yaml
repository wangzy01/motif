# 固定-sigma noise-shift eval（4×8=32卡/4节点）。每个 worker 独立训一个 (分辨率,shift) 短段
# (单机 8卡 torchrun，无需跨节点 rendezvous) → 再在【固定 sigma 网格+固定 batch+固定噪声】上评，
# 消除 exp4『跨 shift 训练 loss 不可比』confound。同分辨率两 shift 用同一固定 eval batch → 干净可比。
#   idx0=512/shift3.0  idx1=512/shift3.33  idx2=1024/shift3.33  idx3=1024/shift4.0
# ⚠️ ~350 步从零短训，早期信号偏弱；看 fixed-sigma loss(σ) 曲线的【相对】高低，不看绝对。
# 提交: jcc job submit jobs/shift_eval.yaml ; 日志: jcc job log evan-mot-shift-eval -p all -n 400
# 产物(/fsx): experiments/results/shift_eval/{eval_<label>.json, metrics_<label>.jsonl, train_<label>.log}
name: evan-mot-shift-eval
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 4
gpuPerWorker: 8
cpuPerWorker: 64
memGBPerWorker: 800
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=8 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/shift_eval; mkdir -p $RES

  # 每个 worker 据 hostname 末段序号选一个 (分辨率,shift)
  # 实测 jcc pod hostname = <jobname>-<rank>（无随机后缀），故 rank = 末段 dash 后内容。
  # （旧版 sed 's/.*-([0-9]+)-[^-]+$/\1/' 假设 ...-rank-suffix，对本集群是错的 → 会全 worker FATAL。）
  IDX=$(hostname); IDX=${IDX##*-}
  case "$IDX" in
    0) CFG=configs/stage1a_t2i_512.yaml; SIZE=512;  BS=32; SHIFT=3.0;  LABEL=512_s3.0 ;;
    1) CFG=configs/stage1a_t2i_512.yaml; SIZE=512;  BS=32; SHIFT=3.33; LABEL=512_s3.33 ;;
    2) CFG=configs/stage2_1024.yaml;     SIZE=1024; BS=8;  SHIFT=3.33; LABEL=1024_s3.33 ;;
    3) CFG=configs/stage2_1024.yaml;     SIZE=1024; BS=8;  SHIFT=4.0;  LABEL=1024_s4.0 ;;
    *) echo "FATAL: 未预期的 worker IDX=$IDX (hostname=$(hostname))"; exit 1 ;;
  esac
  echo "===== WORKER IDX=$IDX -> $LABEL ($SIZE px, shift=$SHIFT) on $(hostname) ====="
  nvidia-smi -L
  DS="dataset.stats_cache=$STATS dataset.buffer_size=384 dataset.queue_size=192 dataset.min_fill=128 dataset.anime_nrows=16000 dataset.anime_cache_dir=/local/evan/anime_img_cache"
  CK=/local/evan/mot_exp/shifteval_$IDX; rm -rf $CK; mkdir -p $CK
  STEPS=350

  echo "##### TRAIN $LABEL ($STEPS steps, 8-GPU FSDP2) #####"
  timeout 35m $PY -m torch.distributed.run --nproc_per_node=8 --master_port=29760 \
    train.py --config $CFG --max-steps $STEPS trainer.batch_size=$BS trainer.seed=42 \
    trainer.log_every=20 scheduler.num_warmup_steps=40 trainer.checkpoint_steps=$STEPS \
    sigma_sampling.shift=$SHIFT trainer.checkpoint_dir=$CK trainer.resume=false $DS 2>&1 | tee $RES/train_$LABEL.log
  cp -f $CK/metrics.jsonl $RES/metrics_$LABEL.jsonl 2>/dev/null || true

  echo "##### FIXED-SIGMA EVAL $LABEL #####"
  timeout 15m $PY experiments/exp_scripts/fixed_sigma_eval.py \
    --config $CFG --ckpt $CK/last.pt --resolution $SIZE --shift-label $LABEL \
    --out $RES/eval_$LABEL.json 2>&1 | tee $RES/eval_$LABEL.log || echo "EVAL FAILED for $LABEL"

  echo "===== WORKER $LABEL DONE ====="
  ls -la $RES/ | grep "$LABEL" || true
