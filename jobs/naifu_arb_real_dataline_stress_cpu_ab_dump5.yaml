# A/B 证伪实验 · B 组（周期 faulthandler dump 压到 5s，预期加速崩）：
#   假设 = 所有 SIGSEGV 由 faulthandler.dump_traceback_later(60s) 从 watchdog 线程遍历
#   【运行中】线程帧栈引起（Py3.12 竞态，22/22 崩溃 rank 均死于 dump 写入中途）。
#   本组复跑昨晚 5 个必崩 case，唯一变量 = --dump-every-s 5（12× 于原 60s 频率）。
#   预期：SIGSEGV 显著加速/更多（剂量-响应）。A 组见 naifu_arb_real_dataline_stress_cpu_ab_dump0.yaml。
name: evan-mot-crop-naifu-arb-abdump5
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 64
memGBPerWorker: 384
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 MALLOC_CHECK_=3
  unset MALLOC_ARENA_MAX MALLOC_TRIM_THRESHOLD_ ARROW_DEFAULT_MEMORY_POOL LD_PRELOAD TCMALLOC_RELEASE_RATE
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  RUN_TAG="$(date -u +%Y%m%dT%H%M%SZ)_${HOSTNAME:-local}_${RANDOM}"
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/naifu_arb_ab_dump5_$RUN_TAG
  mkdir -p "$ROOT"
  echo "[ab-dump5] ROOT=$ROOT"
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  $PY -m py_compile scripts/stress_naifu_arb_real_dataline.py training/dataline/complete_dataset.py training/dataline/image_fetch.py
  SRC_STATS=/fsx/evan/mot_code/data_analysis/outputs/monet_global_stats_rich_v1.json
  if [ ! -s "$SRC_STATS" ]; then
    echo "FATAL: expected existing stats cache missing: $SRC_STATS" | tee "$ROOT/env.log"
    exit 32
  fi
  DUMP=5
  run_case () {
    local CASE="$1" DOMS="$2" WS="$3"
    local OUT="$ROOT/${CASE}_ws${WS}"
    mkdir -p "$OUT"
    local RUN_STATS="$OUT/monet_global_stats_rich_v1.json"
    cp "$SRC_STATS" "$RUN_STATS"
    echo "case=$CASE doms=$DOMS ws=$WS dump=$DUMP" | tee "$OUT/env.log"
    set +e
    timeout --preserve-status --signal=TERM --kill-after=120s 900s \
      $PY scripts/stress_naifu_arb_real_dataline.py \
        --config configs/stage256_redesign_naifu_arb_v1.yaml \
        --out "$OUT" \
        --stats-cache "$RUN_STATS" \
        --world-size "$WS" \
        --batch-size 144 \
        --seconds 420 \
        --max-batches 8 \
        --buffer-size 512 \
        --queue-size 128 \
        --min-fill 64 \
        --fetch-workers 8 \
        --fetch-workers-anime 1 \
        --no-producer-native-io-serial \
        --anime-nrows 20000 \
        --bucket-wait-timeout-s 900 \
        --only-domains "$DOMS" \
        --dump-every-s $DUMP \
      2>&1 | tee "$OUT/stress.log"
    local RC=${PIPESTATUS[0]}
    set -e
    echo "$RC" > "$OUT/rc.txt"
    local NSEGV
    NSEGV=$(grep -c 'SIGSEGV' "$OUT/summary.jsonl" || true)
    echo "case=$CASE ws=$WS dump=$DUMP rc=$RC nsegv_lines=$NSEGV" | tee -a "$ROOT/ab_summary.txt"
  }
  run_case monet8   monet_real            8
  run_case monet16  monet_real            16
  run_case synth8   synthetic             8
  run_case synth16  synthetic             16
  run_case sqtex16  "synthetic,textatlas" 16
  echo "==== AB VERDICT (arm B, dump=5s; expect SIGSEGV fast) ===="
  TOTAL_SEGV=$(grep -h '"exit": "signal:SIGSEGV"' "$ROOT"/*/summary.jsonl 2>/dev/null | wc -l || true)
  echo "total_sigsegv_child_exits=$TOTAL_SEGV" | tee -a "$ROOT/ab_summary.txt"
  cat "$ROOT/ab_summary.txt"
  if [ "$TOTAL_SEGV" -gt 0 ]; then
    echo "[ab-dump5] PASS: SIGSEGV reproduced faster with 5s dump (probe hypothesis SUPPORTED)"
    exit 0
  else
    echo "[ab-dump5] WARN: no SIGSEGV with aggressive 5s dump (weakens dose-response, check hang timing)"
    exit 1
  fi
