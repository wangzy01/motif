name: evan-offarb-textatlas-repair-hash-probe
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  "$PY" - <<'PYEOF'
  import hashlib
  import json
  from pathlib import Path

  import pyarrow.parquet as pq

  allowlist_path = Path(
      "/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/"
      "offline_arb_textatlas_jpeg_missing_eoi_audit_v1/"
      "frozen_allowlist_suggestion.json"
  )
  expected_allowlist_sha = "f4b9b3407695c49eeea6b2a726eeeab633f2b3a34c790792608a44b3872d2796"
  raw_allowlist = allowlist_path.read_bytes()
  assert hashlib.sha256(raw_allowlist).hexdigest() == expected_allowlist_sha
  allowlist = json.loads(raw_allowlist)
  assert len(allowlist["rows"]) == 3
  results = []
  for row in allowlist["rows"]:
      parquet = pq.ParquetFile(row["image_parquet_path"])
      table = parquet.read_row_group(
          int(row["image_row_group"]),
          columns=["image", "image_path"],
          use_threads=False,
      )
      value = table.slice(int(row["image_row_in_group"]), 1).to_pylist()[0]
      assert value["image_path"] == row["image_path"]
      raw = bytes(value["image"]["bytes"])
      assert len(raw) == int(row["payload_bytes"])
      assert hashlib.sha256(raw).hexdigest() == row["payload_sha256"]
      repaired = raw + b"\xff\xd9"
      results.append(
          {
              "row_id": int(row["row_id"]),
              "raw_bytes": len(raw),
              "raw_sha256": hashlib.sha256(raw).hexdigest(),
              "repaired_bytes": len(repaired),
              "repaired_sha256": hashlib.sha256(repaired).hexdigest(),
          }
      )
  print("TEXTATLAS_REPAIR_HASH_PROBE_PASS " + json.dumps(results, sort_keys=True))
  PYEOF
