# Three-arm formal-config semantic proof:
#   source_stage  = source captions + legacy GPIC /local stage/read
#   source_direct = source captions + direct GPIC bytes
#   sidecar_direct= sidecar captions + direct GPIC bytes
# Worker 0 freezes one byte-exact formal-config snapshot and a fresh run nonce;
# all arms derive only from that snapshot, then compare four hashes at 6/12 steps.
name: evan-mot-crop-offlinearb-caption-sidecar-semantic-ab
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 3
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  export OFFLINE_ARB_STEP_TIMEOUT_S=1800
  export OFFLINE_ARB_PREFETCH_STEPS=4
  export OFFLINE_ARB_PROFILE_WINDOWS=1
  unset OFFLINE_ARB_ANIME_CAPTION_WORKERS

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  FORMAL_CFG=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop/configs/stage256_offline_exact_v1.yaml
  PLAN_ROOT=$BASE/offline_arb_plans_v1/w4_smoke/plan
  CATALOG_ROOT=$BASE/offline_arb_catalog_v1
  ANIME_FREQ_ROOT=$BASE/offline_arb_animefreq_v1
  MANIFEST=$BASE/offline_arb_anime_caption_source_manifest_v1/header.json
  SIDECAR_ROOT=$BASE/offline_arb_caption_sidecar_v1

  HOST=$(hostname)
  IDX=${HOST##*-}
  JOBTAG=${HOST%-*}
  case "$IDX" in
    0) ARM=source_stage; EXPECTED_BACKEND=source; EXPECTED_GPIC=false ;;
    1) ARM=source_direct; EXPECTED_BACKEND=source; EXPECTED_GPIC=true ;;
    2) ARM=sidecar_direct; EXPECTED_BACKEND=sidecar; EXPECTED_GPIC=true ;;
    *) echo "FATAL: unexpected worker index $IDX from $HOST" >&2; exit 20 ;;
  esac

  OUT=$BASE/offline_arb_caption_sidecar_semantic_ab_v2
  RUN_DIR=$OUT/$JOBTAG
  LOCAL_TMP=/local/evan/offline_arb_caption_sidecar_ab_${JOBTAG}_${ARM}
  mkdir -p "$OUT" "$LOCAL_TMP/pycache"
  export PYTHONPYCACHEPREFIX=$LOCAL_TMP/pycache

  test -f "$FORMAL_CFG"
  test -d "$PLAN_ROOT"
  test -d "$CATALOG_ROOT"
  test -d "$ANIME_FREQ_ROOT"
  test -f "$MANIFEST"
  if [ "$IDX" = "0" ]; then
    "$PY" - "$RUN_DIR" "$JOBTAG" "$HOST" "$FORMAL_CFG" "$SIDECAR_ROOT" \
      "$PLAN_ROOT" "$CATALOG_ROOT" <<'PYEOF'
  import hashlib
  import json
  import os
  import re
  import secrets
  import sys
  from pathlib import Path
  import yaml

  root = Path(sys.argv[1])
  jobtag, host = sys.argv[2:4]
  formal, sidecar, plan_root, catalog_root = map(Path, sys.argv[4:])
  root.mkdir()
  raw = formal.read_bytes()
  config = yaml.safe_load(raw)
  dataset = config.get("dataset") if isinstance(config, dict) else None
  if not isinstance(dataset, dict):
      raise SystemExit("FATAL formal config dataset is not a mapping")
  if dataset.get("gpic_payload_in_memory") is not True:
      raise SystemExit("FATAL formal config must have gpic_payload_in_memory=true")
  if Path(dataset.get("offline_caption_sidecar_root", "")) != sidecar:
      raise SystemExit("FATAL formal config sidecar root mismatch")
  header_path = sidecar / "header.json"
  success_path = sidecar / "_SUCCESS"
  header_raw = header_path.read_bytes()
  header = json.loads(header_raw)
  header_sha = header.get("header_sha256")
  if not re.fullmatch(r"[0-9a-f]{64}", str(header_sha or "")) or success_path.read_text(encoding="ascii") not in {
      header_sha, header_sha + "\n"
  }:
      raise SystemExit("FATAL sidecar header/_SUCCESS identity mismatch")
  plan_header_raw = (plan_root / "header.json").read_bytes()
  plan_header = json.loads(plan_header_raw)
  catalog_header_raw = (catalog_root / "header.json").read_bytes()
  catalog_header = json.loads(catalog_header_raw)
  if not re.fullmatch(r"[0-9a-f]{64}", str(plan_header.get("plan_hash", ""))):
      raise SystemExit("FATAL frozen plan_hash is malformed")
  if not re.fullmatch(r"[0-9a-f]{64}", str(catalog_header.get("catalog_hash", ""))):
      raise SystemExit("FATAL frozen catalog_hash is malformed")
  snapshot_tmp = root / ".formal.snapshot.yaml.tmp"
  snapshot_tmp.write_bytes(raw)
  os.replace(snapshot_tmp, root / "formal.snapshot.yaml")
  run = {
      "schema_version": "offline_arb_caption_sidecar_semantic_ab_run_v2",
      "jobtag": jobtag,
      "run_nonce": secrets.token_hex(32),
      "worker0_host": host,
      "original_config_path": str(formal),
      "original_config_sha256": hashlib.sha256(raw).hexdigest(),
      "config_snapshot_sha256": hashlib.sha256(raw).hexdigest(),
      "sidecar_header_sha256": header_sha,
      "sidecar_header_file_sha256": hashlib.sha256(header_raw).hexdigest(),
      "plan_hash": plan_header.get("plan_hash"),
      "plan_header_file_sha256": hashlib.sha256(plan_header_raw).hexdigest(),
      "catalog_hash": catalog_header.get("catalog_hash"),
      "catalog_header_file_sha256": hashlib.sha256(catalog_header_raw).hexdigest(),
  }
  temporary = root / ".run.json.tmp"
  temporary.write_text(json.dumps(run, sort_keys=True) + "\n", encoding="utf-8")
  os.replace(temporary, root / "run.json")
  PYEOF
  else
    timeout --signal=TERM --kill-after=10s 600s bash -c '
      set -euo pipefail
      for _ in $(seq 1 120); do
        [ -s "$1/run.json" ] && [ -s "$1/formal.snapshot.yaml" ] && exit 0
        sleep 5
      done
      echo "FATAL: timed out waiting for fresh formal-config snapshot" >&2
      exit 31
    ' _ "$RUN_DIR"
  fi

  IFS=$'\t' read -r RUN_NONCE ORIGINAL_CONFIG_SHA SIDECAR_HEADER_SHA < <(
    "$PY" - "$RUN_DIR/run.json" "$RUN_DIR/formal.snapshot.yaml" "$JOBTAG" <<'PYEOF'
  import hashlib, json, re, sys
  from pathlib import Path
  run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
  raw = Path(sys.argv[2]).read_bytes()
  if (
      run.get("jobtag") != sys.argv[3]
      or not re.fullmatch(r"[0-9a-f]{64}", str(run.get("run_nonce", "")))
      or hashlib.sha256(raw).hexdigest() != run.get("config_snapshot_sha256")
      or run.get("original_config_sha256") != run.get("config_snapshot_sha256")
      or not re.fullmatch(r"[0-9a-f]{64}", str(run.get("sidecar_header_sha256", "")))
  ):
      raise SystemExit("FATAL semantic A/B run snapshot mismatch")
  print(
      run["run_nonce"], run["original_config_sha256"],
      run["sidecar_header_sha256"], sep="\t"
  )
  PYEOF
  )
  record_failure() {
    local rc=$?
    if [ "$rc" -ne 0 ]; then
      printf '%s rc=%s host=%s arm=%s\n' "$RUN_NONCE" "$rc" "$HOST" "$ARM" \
        > "$RUN_DIR/.failed.worker${IDX}.tmp" || true
      mv "$RUN_DIR/.failed.worker${IDX}.tmp" "$RUN_DIR/failed.worker${IDX}" || true
    fi
  }
  trap record_failure EXIT

  CFG=$LOCAL_TMP/stage256_offline_exact_v1.${ARM}.yaml
  ARM_META=$LOCAL_TMP/arm_meta.json
  "$PY" - "$RUN_DIR/formal.snapshot.yaml" "$CFG" "$ARM_META" "$ARM" \
    "$EXPECTED_BACKEND" "$EXPECTED_GPIC" "$ORIGINAL_CONFIG_SHA" "$SIDECAR_HEADER_SHA" \
    "$SIDECAR_ROOT" <<'PYEOF'
  import hashlib
  import json
  import sys
  from copy import deepcopy
  from pathlib import Path
  import yaml

  snapshot, target, meta_path = map(Path, sys.argv[1:4])
  arm, backend, expected_gpic_raw, original_sha, sidecar_header_sha = sys.argv[4:9]
  sidecar_root = Path(sys.argv[9])
  expected_gpic = expected_gpic_raw == "true"
  raw = snapshot.read_bytes()
  if hashlib.sha256(raw).hexdigest() != original_sha:
      raise SystemExit("FATAL arm observed a different config snapshot")
  live_header = json.loads((sidecar_root / "header.json").read_text(encoding="utf-8"))
  if (
      live_header.get("header_sha256") != sidecar_header_sha
      or (sidecar_root / "_SUCCESS").read_text(encoding="ascii")
      not in {sidecar_header_sha, sidecar_header_sha + "\n"}
  ):
      raise SystemExit("FATAL arm observed a different sidecar identity")
  config = yaml.safe_load(raw)
  dataset = config.get("dataset") if isinstance(config, dict) else None
  if not isinstance(dataset, dict):
      raise SystemExit("FATAL snapshot dataset is not a mapping")
  original_dataset = deepcopy(dataset)
  if arm in {"source_stage", "source_direct"}:
      removed = dataset.pop("offline_caption_sidecar_root", None)
      if not isinstance(removed, str) or not removed:
          raise SystemExit("FATAL source arm could not remove sidecar root")
  elif arm == "sidecar_direct":
      if not isinstance(dataset.get("offline_caption_sidecar_root"), str):
          raise SystemExit("FATAL sidecar arm lost required sidecar root")
  else:
      raise SystemExit(f"FATAL unknown arm {arm}")
  dataset["gpic_payload_in_memory"] = expected_gpic

  def canonical_sha(value):
      payload = json.dumps(
          value, ensure_ascii=False, sort_keys=True, separators=(",", ":"),
          allow_nan=False,
      ).encode("utf-8")
      return hashlib.sha256(payload).hexdigest()

  without_sidecar = deepcopy(dataset)
  without_sidecar.pop("offline_caption_sidecar_root", None)
  experiment_base = deepcopy(without_sidecar)
  experiment_base.pop("gpic_payload_in_memory", None)
  meta = {
      "arm": arm,
      "expected_caption_backend": backend,
      "original_config_sha256": original_sha,
      "config_snapshot_sha256": hashlib.sha256(raw).hexdigest(),
      "sidecar_header_sha256": sidecar_header_sha,
      "original_dataset_sha256": canonical_sha(original_dataset),
      "derived_dataset_sha256": canonical_sha(dataset),
      "dataset_without_sidecar_sha256": canonical_sha(without_sidecar),
      "dataset_experiment_base_sha256": canonical_sha(experiment_base),
      "sidecar_root_present": "offline_caption_sidecar_root" in dataset,
      "gpic_payload_in_memory": dataset["gpic_payload_in_memory"],
  }
  target.write_text(
      yaml.safe_dump(config, allow_unicode=True, sort_keys=False), encoding="utf-8"
  )
  meta_path.write_text(
      json.dumps(meta, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
      encoding="utf-8",
  )
  PYEOF
  export OFFLINE_ARB_SMOKE_DATASET_CONFIG=$CFG

  if [ "$EXPECTED_BACKEND" = "source" ]; then
    STAGE_LOG=$RUN_DIR/captionstage.${ARM}.${HOST}.log
    set +e
    CAPTION_ROOT=$(timeout --signal=TERM --kill-after=30s 2400s \
      "$PY" scripts/offline_arb/stage_anime_caption_local.py \
        --manifest "$MANIFEST" --workers 2 2> "$STAGE_LOG")
    STAGE_RC=$?
    set -e
    if [ "$STAGE_RC" -ne 0 ]; then
      tail -n 200 "$STAGE_LOG" >&2 || true
      exit "$STAGE_RC"
    fi
    test -d "$CAPTION_ROOT" || { echo "FATAL staged anime caption root missing"; exit 36; }
    export OFFLINE_ARB_ANIME_CAPTION_ROOT=$CAPTION_ROOT
  else
    # Fail visibly if the required all-domain sidecar accidentally falls back.
    unset OFFLINE_ARB_ANIME_CAPTION_ROOT
  fi

  for STEPS in 6 12; do
    export OFFLINE_ARB_LOCAL_ROOT=$LOCAL_TMP/smoke_steps${STEPS}
    LOG_TMP=$RUN_DIR/.${ARM}.steps${STEPS}.${HOST}.log.tmp
    LOG_FINAL=$RUN_DIR/${ARM}.steps${STEPS}.${HOST}.log
    RESULT_TMP=$RUN_DIR/.${ARM}.steps${STEPS}.${HOST}.json.tmp
    RESULT=$RUN_DIR/${ARM}.steps${STEPS}.json
    set +e
    timeout --signal=TERM --kill-after=60s 7260s \
      "$PY" scripts/offline_arb/smoke_offline_loader.py \
        --plan-root "$PLAN_ROOT" \
        --catalog-root "$CATALOG_ROOT" \
        --anime-freq-root "$ANIME_FREQ_ROOT" \
        --ranks 4 --steps "$STEPS" --worker-timeout-s 7100 \
        2>&1 | tee "$LOG_TMP"
    PIPE_RC=("${PIPESTATUS[@]}")
    set -e
    SMOKE_RC=${PIPE_RC[0]}
    TEE_RC=${PIPE_RC[1]}
    if [ "$TEE_RC" -ne 0 ]; then
      rm -f "$LOG_TMP"
      echo "FATAL smoke log tee failed arm=$ARM steps=$STEPS rc=$TEE_RC" >&2
      exit "$TEE_RC"
    fi
    mv "$LOG_TMP" "$LOG_FINAL"
    if [ "$SMOKE_RC" -ne 0 ]; then
      echo "FATAL smoke failed arm=$ARM steps=$STEPS rc=$SMOKE_RC log=$LOG_FINAL" >&2
      exit "$SMOKE_RC"
    fi

    "$PY" - "$LOG_FINAL" "$RESULT_TMP" "$ARM_META" "$ARM" \
      "$EXPECTED_BACKEND" "$STEPS" "$RUN_NONCE" "$JOBTAG" "$IDX" "$HOST" <<'PYEOF'
  import json
  import re
  import sys
  from pathlib import Path

  log_path, output_path, meta_path = map(Path, sys.argv[1:4])
  arm, expected_backend, steps_raw, run_nonce, jobtag, worker_raw, host = sys.argv[4:]
  expected_steps = int(steps_raw)
  raw = log_path.read_text(encoding="utf-8")
  marker = '{\n  "assertions"'
  start = raw.find(marker)
  if start < 0:
      raise SystemExit(f"FATAL smoke JSON not found: {log_path}")
  result, _end = json.JSONDecoder().raw_decode(raw[start:])
  if result.get("status") != "PASS" or result.get("steps") != expected_steps:
      raise SystemExit("FATAL smoke status/steps mismatch")
  backends = set(re.findall(r"caption_backend=(source|sidecar)", raw))
  if backends != {expected_backend}:
      raise SystemExit(
          f"FATAL merged-log caption backend mismatch: {sorted(backends)!r}"
      )
  hash_keys = (
      "trace_sha256", "prompts_sha256", "pixels_sha256", "cfg_keep_sha256"
  )
  if set(result.get("per_rank", {})) != {"0", "1", "2", "3"}:
      raise SystemExit("FATAL smoke per-rank set mismatch")
  for rank, rank_result in result["per_rank"].items():
      for key in hash_keys:
          if not re.fullmatch(r"[0-9a-f]{64}", str(rank_result.get(key, ""))):
              raise SystemExit(f"FATAL malformed semantic hash rank={rank} key={key}")
  meta = json.loads(meta_path.read_text(encoding="utf-8"))
  wrapped = {
      "status": "PASS",
      "arm": arm,
      "steps": expected_steps,
      "run_context": {
          "run_nonce": run_nonce,
          "jobtag": jobtag,
          "worker_index": int(worker_raw),
          "host": host,
      },
      "config_evidence": meta,
      "caption_backend_evidence": {
          "expected": expected_backend,
          "observed": sorted(backends),
          "scope": "whole_merged_log_not_per_rank",
          "limitation": (
              "current smoke result omits per-rank backend; exact per-rank item rows "
              "and hashes remain independently asserted"
          ),
      },
      "smoke": result,
      "log": str(log_path),
  }
  output_path.write_text(
      json.dumps(wrapped, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
      encoding="utf-8",
  )
  PYEOF
    mv "$RESULT_TMP" "$RESULT"
    echo "CAPTION_SIDECAR_AB_ARM_DONE arm=$ARM steps=$STEPS result=$RESULT" >&2
  done

  if [ "$IDX" != "0" ]; then
    exit 0
  fi

  timeout --signal=TERM --kill-after=30s 28800s bash -c '
    set -euo pipefail
    for _ in $(seq 1 2880); do
      for index in 0 1 2; do
        if [ -s "$1/failed.worker$index" ] && grep -Fq "$2" "$1/failed.worker$index"; then
          echo "FATAL: semantic A/B peer failed worker=$index" >&2
          exit 32
        fi
      done
      ready=1
      for arm in source_stage source_direct sidecar_direct; do
        for steps in 6 12; do
          [ -s "$1/$arm.steps$steps.json" ] || ready=0
        done
      done
      [ "$ready" -eq 1 ] && exit 0
      sleep 10
    done
    echo "FATAL: timed out waiting for all three semantic arms" >&2
    exit 31
  ' _ "$RUN_DIR" "$RUN_NONCE"

  "$PY" - "$RUN_DIR" "$RUN_NONCE" "$JOBTAG" "$PLAN_ROOT" "$CATALOG_ROOT" <<'PYEOF'
  import hashlib
  import json
  import os
  import sys
  from pathlib import Path

  from training.dataline_offline.planner_v1 import OfflinePlan

  root = Path(sys.argv[1])
  run_nonce, jobtag = sys.argv[2:4]
  plan_root, catalog_root = map(Path, sys.argv[4:])
  run = json.loads((root / "run.json").read_text(encoding="utf-8"))
  if run.get("run_nonce") != run_nonce or run.get("jobtag") != jobtag:
      raise SystemExit("FATAL aggregate run identity mismatch")
  sidecar_root = Path(
      "/fsx/evan/mot_code/data_analysis/outputs/"
      "mot_pilot_v1_cleanup_crop/offline_arb_caption_sidecar_v1"
  )
  live_header_raw = (sidecar_root / "header.json").read_bytes()
  live_header = json.loads(live_header_raw)
  if (
      live_header.get("header_sha256") != run.get("sidecar_header_sha256")
      or hashlib.sha256(live_header_raw).hexdigest()
      != run.get("sidecar_header_file_sha256")
      or (sidecar_root / "_SUCCESS").read_text(encoding="ascii")
      not in {run["sidecar_header_sha256"], run["sidecar_header_sha256"] + "\n"}
  ):
      raise SystemExit("FATAL sidecar identity changed during semantic A/B")
  plan_header_raw = (plan_root / "header.json").read_bytes()
  plan_header = json.loads(plan_header_raw)
  catalog_header_raw = (catalog_root / "header.json").read_bytes()
  catalog = json.loads(catalog_header_raw)
  if (
      hashlib.sha256(plan_header_raw).hexdigest()
      != run.get("plan_header_file_sha256")
      or plan_header.get("plan_hash") != run.get("plan_hash")
      or hashlib.sha256(catalog_header_raw).hexdigest()
      != run.get("catalog_header_file_sha256")
      or catalog.get("catalog_hash") != run.get("catalog_hash")
  ):
      raise SystemExit("FATAL plan/catalog identity changed during semantic A/B")
  arms = ("source_stage", "source_direct", "sidecar_direct")
  expected_workers = {"source_stage": 0, "source_direct": 1, "sidecar_direct": 2}
  expected_backends = {
      "source_stage": "source", "source_direct": "source", "sidecar_direct": "sidecar"
  }
  expected_gpic = {"source_stage": False, "source_direct": True, "sidecar_direct": True}
  by_steps = {
      steps: {
          arm: json.loads((root / f"{arm}.steps{steps}.json").read_text(encoding="utf-8"))
          for arm in arms
      }
      for steps in (6, 12)
  }
  all_results = [value for group in by_steps.values() for value in group.values()]
  for result in all_results:
      arm = result.get("arm")
      context = result.get("run_context", {})
      evidence = result.get("config_evidence", {})
      backend = result.get("caption_backend_evidence", {})
      if (
          result.get("status") != "PASS"
          or arm not in arms
          or context.get("run_nonce") != run_nonce
          or context.get("jobtag") != jobtag
          or context.get("worker_index") != expected_workers[arm]
          or not context.get("host")
          or evidence.get("arm") != arm
          or evidence.get("original_config_sha256") != run["original_config_sha256"]
          or evidence.get("config_snapshot_sha256") != run["config_snapshot_sha256"]
          or evidence.get("sidecar_header_sha256") != run["sidecar_header_sha256"]
          or evidence.get("gpic_payload_in_memory") is not expected_gpic[arm]
          or backend.get("expected") != expected_backends[arm]
          or backend.get("observed") != [expected_backends[arm]]
          or backend.get("scope") != "whole_merged_log_not_per_rank"
      ):
          raise SystemExit(f"FATAL arm evidence mismatch: {arm}")
      if evidence.get("sidecar_root_present") is not (arm == "sidecar_direct"):
          raise SystemExit(f"FATAL sidecar presence mismatch: {arm}")

  config_evidence = {arm: by_steps[6][arm]["config_evidence"] for arm in arms}
  if len({value["original_dataset_sha256"] for value in config_evidence.values()}) != 1:
      raise SystemExit("FATAL arms did not derive from one dataset snapshot")
  if len({value["dataset_experiment_base_sha256"] for value in config_evidence.values()}) != 1:
      raise SystemExit("FATAL arms differ outside isolated sidecar/GPIC switches")
  if (
      config_evidence["source_direct"]["dataset_without_sidecar_sha256"]
      != config_evidence["sidecar_direct"]["dataset_without_sidecar_sha256"]
  ):
      raise SystemExit("FATAL source_direct/sidecar_direct differ beyond sidecar root")
  for arm in arms:
      if by_steps[12][arm]["config_evidence"] != config_evidence[arm]:
          raise SystemExit(f"FATAL arm config changed between 6/12 steps: {arm}")

  cursor = 0
  ranges = {}
  for domain in catalog["domain_order"]:
      rows = int(catalog["files"][domain]["rows"])
      ranges[domain] = (cursor, cursor + rows)
      cursor += rows
  gpic_start, gpic_stop = ranges["gpic"]
  plan = OfflinePlan(plan_root, world_size=4, verify_checksums=True)
  gpic_evidence = {}
  for steps in (6, 12):
      per_rank = {str(rank): 0 for rank in range(4)}
      row_ids = []
      for step in range(steps):
          for rank in range(4):
              _hw, rows = plan.batch(step, rank)
              values = [int(value) for value in rows.tolist()]
              row_ids.extend(values)
              per_rank[str(rank)] += sum(gpic_start <= value < gpic_stop for value in values)
      total_gpic = sum(per_rank.values())
      if total_gpic <= 0:
          raise SystemExit(f"FATAL w4 first {steps} steps consume no GPIC rows")
      gpic_evidence[str(steps)] = {
          "method": (
              "OfflinePlan.batch row_ids classified by frozen catalog domain ranges; "
              "smoke item_trace_exact asserts those exact rows were consumed"
          ),
          "gpic_row_range": [gpic_start, gpic_stop],
          "gpic_rows": total_gpic,
          "per_rank_gpic_rows": per_rank,
          "all_planned_rows": len(row_ids),
          "planned_row_ids_sha256": hashlib.sha256(
              json.dumps(row_ids, separators=(",", ":")).encode("ascii")
          ).hexdigest(),
      }

  hash_keys = (
      "trace_sha256", "prompts_sha256", "pixels_sha256", "cfg_keep_sha256"
  )
  identity_keys = (
      "plan_id", "plan_hash", "catalog_hash", "assignment_hash",
      "semantic_hash_schema", "ranks", "per_rank_bs", "start_step", "steps",
  )
  comparisons = {}
  for steps in (6, 12):
      smokes = {arm: by_steps[steps][arm]["smoke"] for arm in arms}
      identities = [
          {key: smokes[arm].get(key) for key in identity_keys} for arm in arms
      ]
      if identities[1:] != identities[:-1]:
          raise SystemExit(f"FATAL three-arm smoke identity mismatch steps={steps}")
      expected_items = int(smokes[arms[0]]["ranks"]) * steps * int(
          smokes[arms[0]]["per_rank_bs"]
      )
      for arm in arms:
          if smokes[arm].get("assertions", {}).get("item_trace_exact") != expected_items:
              raise SystemExit(f"FATAL exact item trace evidence missing {arm}/{steps}")
          if (
              smokes[arm].get("plan_hash") != run["plan_hash"]
              or smokes[arm].get("catalog_hash") != run["catalog_hash"]
          ):
              raise SystemExit(f"FATAL smoke plan/catalog snapshot mismatch {arm}/{steps}")
      per_rank = {}
      for rank in sorted(smokes[arms[0]]["per_rank"]):
          per_rank[rank] = {}
          for key in hash_keys:
              values = [smokes[arm]["per_rank"][rank].get(key) for arm in arms]
              if len(set(values)) != 1:
                  raise SystemExit(
                      f"FATAL semantic drift steps={steps} rank={rank} key={key}: {values}"
                  )
              per_rank[rank][key] = values[0]
      comparisons[str(steps)] = {
          "identity": identities[0],
          "per_rank_hashes": per_rank,
          "gpic_consumption": gpic_evidence[str(steps)],
          "logs": {arm: by_steps[steps][arm]["log"] for arm in arms},
      }

  aggregate = {
      "status": "PASS",
      "schema_version": "offline_arb_caption_sidecar_semantic_ab_v2",
      "run_context": {
          "run_nonce": run_nonce,
          "jobtag": jobtag,
          "workers": {
              arm: by_steps[6][arm]["run_context"] for arm in arms
          },
      },
      "original_config_path": run["original_config_path"],
      "original_config_sha256": run["original_config_sha256"],
      "config_snapshot_sha256": run["config_snapshot_sha256"],
      "sidecar_header_sha256": run["sidecar_header_sha256"],
      "sidecar_header_file_sha256": run["sidecar_header_file_sha256"],
      "plan_hash": run["plan_hash"],
      "plan_header_file_sha256": run["plan_header_file_sha256"],
      "catalog_hash": run["catalog_hash"],
      "catalog_header_file_sha256": run["catalog_header_file_sha256"],
      "config_evidence": config_evidence,
      "steps": [6, 12],
      "arms": list(arms),
      "matched_hashes": list(hash_keys),
      "backend_evidence_scope": "whole_merged_log_not_per_rank",
      "backend_evidence_limitation": (
          "smoke currently omits a per-rank backend field; merged-log backend is "
          "combined with exact plan-row and four-hash evidence"
      ),
      "comparisons": comparisons,
  }
  temporary = root / ".aggregate.json.tmp"
  final = root / "aggregate.json"
  temporary.write_text(
      json.dumps(aggregate, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
      encoding="utf-8",
  )
  os.replace(temporary, final)
  print(json.dumps(aggregate, ensure_ascii=False, indent=2, sort_keys=True))
  PYEOF
  echo "CAPTION_SIDECAR_SEMANTIC_AB_ALL_PASS result=$RUN_DIR/aggregate.json" >&2
