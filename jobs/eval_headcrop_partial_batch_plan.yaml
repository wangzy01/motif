name: evan-hc-partial-plan
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 2
memGBPerWorker: 8
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  ROOT=/fsx/evan/mot_code/data_analysis/outputs
  MAIN="$ROOT/headcrop_matrix_now_comprehensive"
  SHARDS="$ROOT/headcrop_matrix_now_shards"
  OUT="$MAIN/partial_subagent_batches"
  MANIFEST_LIST="$MAIN/partial_manifests.txt"
  IMAGE_LIST="$MAIN/partial_images.txt"
  find "$MAIN" "$SHARDS" -name 'sample_manifest.json' | sort > "$MANIFEST_LIST"
  find "$MAIN" "$SHARDS" -name '*.png' | sort > "$IMAGE_LIST"
  $PY experiments/eval/plan_headcrop_subagent_batches.py --manifests $(cat "$MANIFEST_LIST") --out-dir "$OUT" --batch-size 18
  echo "partial_manifest_count=$(wc -l < "$MANIFEST_LIST")"
  echo "partial_png_count=$(wc -l < "$IMAGE_LIST")"
  echo "partial_batch_plan=$OUT/subagent_batch_plan.json"
