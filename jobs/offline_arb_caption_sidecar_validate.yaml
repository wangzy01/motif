# Five-domain full-sidecar gate with a two-worker snapshot barrier.  Original
# caption sources are compared through deterministic typed samples; this is not
# an independent full-source digest.  After both workers finish decoding, each
# revalidates its own ctime-inclusive fingerprints, then worker 0 hashes the
# complete sidecar root once more and closes all fingerprints/control files.
name: evan-mot-crop-offlinearb-caption-sidecar-validate
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 2
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 96
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1

  HOST=$(hostname)
  IDX=${HOST##*-}
  JOBTAG=${HOST%-*}
  case "$IDX" in
    0) DOMAINS=(anime gpic textatlas) ;;
    1) DOMAINS=(monet_real synthetic) ;;
    *) echo "FATAL: unexpected worker index $IDX from $HOST" >&2; exit 20 ;;
  esac

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  SIDECAR_ROOT=${SIDECAR_ROOT:-$BASE/offline_arb_caption_sidecar_v1}
  CATALOG_ROOT=${CATALOG_ROOT:-$BASE/offline_arb_catalog_v1}
  OUT=$BASE/offline_arb_caption_sidecar_validation_v2
  RUN_DIR=$OUT/$JOBTAG
  LOCAL_TMP=/local/evan/offline_arb_caption_sidecar_validate_${JOBTAG}_w${IDX}
  mkdir -p "$OUT" "$LOCAL_TMP/pycache"
  export PYTHONPYCACHEPREFIX=$LOCAL_TMP/pycache

  if [ "$IDX" = "0" ]; then
    "$PY" - "$RUN_DIR" "$JOBTAG" "$HOST" <<'PYEOF'
  import json
  import os
  import secrets
  import sys
  from pathlib import Path

  root = Path(sys.argv[1])
  root.mkdir()
  value = {
      "schema_version": "offline_arb_caption_sidecar_validation_run_v1",
      "jobtag": sys.argv[2],
      "run_nonce": secrets.token_hex(32),
      "worker0_host": sys.argv[3],
  }
  temporary = root / ".run.json.tmp"
  temporary.write_text(json.dumps(value, sort_keys=True) + "\n", encoding="utf-8")
  os.replace(temporary, root / "run.json")
  PYEOF
  else
    timeout --signal=TERM --kill-after=10s 600s bash -c '
      set -euo pipefail
      for _ in $(seq 1 120); do
        [ -s "$1/run.json" ] && exit 0
        sleep 5
      done
      echo "FATAL: timed out waiting for fresh validator run metadata" >&2
      exit 31
    ' _ "$RUN_DIR"
  fi

  RUN_NONCE=$("$PY" - "$RUN_DIR/run.json" "$JOBTAG" <<'PYEOF'
  import json, re, sys
  from pathlib import Path
  value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
  if value.get("jobtag") != sys.argv[2] or not re.fullmatch(
      r"[0-9a-f]{64}", str(value.get("run_nonce", ""))
  ):
      raise SystemExit("FATAL malformed validator run metadata")
  print(value["run_nonce"])
  PYEOF
  )
  record_failure() {
    local rc=$?
    if [ "$rc" -ne 0 ]; then
      printf '%s rc=%s host=%s\n' "$RUN_NONCE" "$rc" "$HOST" \
        > "$RUN_DIR/.failed.worker${IDX}.tmp" || true
      mv "$RUN_DIR/.failed.worker${IDX}.tmp" "$RUN_DIR/failed.worker${IDX}" || true
    fi
  }
  trap record_failure EXIT

  "$PY" -m py_compile \
    scripts/offline_arb/caption_sidecar_contract.py \
    scripts/offline_arb/verify_caption_sidecar.py
  if [ "$IDX" = "0" ]; then
    "$PY" scripts/offline_arb/verify_caption_sidecar.py --self-test \
      > "$RUN_DIR/selftest.json"
  fi

  DOMAIN_ARGS=()
  for DOMAIN in "${DOMAINS[@]}"; do
    DOMAIN_ARGS+=(--domain "$DOMAIN")
  done
  PRE=$RUN_DIR/pre.worker${IDX}.json
  PRE_TMP=$RUN_DIR/.pre.worker${IDX}.${HOST}.json.tmp
  RESULT=$RUN_DIR/worker${IDX}.json
  RESULT_TMP=$RUN_DIR/.worker${IDX}.${HOST}.json.tmp
  STDERR_LOG=$RUN_DIR/worker${IDX}.${HOST}.stderr.log

  set +e
  timeout --signal=TERM --kill-after=120s 172680s \
    "$PY" scripts/offline_arb/verify_caption_sidecar.py \
      --root "$SIDECAR_ROOT" \
      --catalog-root "$CATALOG_ROOT" \
      "${DOMAIN_ARGS[@]}" \
      --sample-rows 128 \
      --seed 20260711 \
      --hash-workers 8 \
      --sample-workers 8 \
      --run-nonce "$RUN_NONCE" \
      --jobtag "$JOBTAG" \
      --worker-index "$IDX" \
      --evidence-host "$HOST" \
      2> "$STDERR_LOG" | tee "$PRE_TMP"
  PIPE_RC=("${PIPESTATUS[@]}")
  set -e
  VALIDATE_RC=${PIPE_RC[0]}
  TEE_RC=${PIPE_RC[1]}
  if [ "$TEE_RC" -ne 0 ]; then
    rm -f "$PRE_TMP"
    echo "FATAL: validator stdout tee failed worker=$IDX rc=$TEE_RC" >&2
    exit "$TEE_RC"
  fi
  if [ "$VALIDATE_RC" -ne 0 ]; then
    rm -f "$PRE_TMP"
    tail -n 200 "$STDERR_LOG" >&2 || true
    echo "FATAL: initial sidecar validation failed worker=$IDX rc=$VALIDATE_RC" >&2
    exit "$VALIDATE_RC"
  fi
  mv "$PRE_TMP" "$PRE"
  printf '%s\n' "$RUN_NONCE" > "$RUN_DIR/.decoded.worker${IDX}.tmp"
  mv "$RUN_DIR/.decoded.worker${IDX}.tmp" "$RUN_DIR/decoded.worker${IDX}.ready"
  echo "CAPTION_SIDECAR_DECODE_DONE worker=$IDX domains=${DOMAINS[*]} pre=$PRE" >&2

  timeout --signal=TERM --kill-after=30s 172800s bash -c '
    set -euo pipefail
    for _ in $(seq 1 17280); do
      if { [ -s "$1/failed.worker0" ] && grep -Fq "$2" "$1/failed.worker0"; } \
         || { [ -s "$1/failed.worker1" ] && grep -Fq "$2" "$1/failed.worker1"; }; then
        echo "FATAL: peer failed before decoded-worker barrier" >&2
        exit 32
      fi
      if [ -s "$1/decoded.worker0.ready" ] && [ -s "$1/decoded.worker1.ready" ] \
         && grep -Fqx "$2" "$1/decoded.worker0.ready" \
         && grep -Fqx "$2" "$1/decoded.worker1.ready"; then
        exit 0
      fi
      sleep 10
    done
    echo "FATAL: timed out at decoded-worker barrier" >&2
    exit 31
  ' _ "$RUN_DIR" "$RUN_NONCE"

  set +e
  timeout --signal=TERM --kill-after=30s 3600s \
    "$PY" scripts/offline_arb/verify_caption_sidecar.py \
      --root "$SIDECAR_ROOT" \
      --catalog-root "$CATALOG_ROOT" \
      --revalidate-result "$PRE" \
      --run-nonce "$RUN_NONCE" \
      --jobtag "$JOBTAG" \
      --worker-index "$IDX" \
      --evidence-host "$HOST" \
      > "$RESULT_TMP" 2>> "$STDERR_LOG"
  REVALIDATE_RC=$?
  set -e
  if [ "$REVALIDATE_RC" -ne 0 ]; then
    rm -f "$RESULT_TMP"
    tail -n 200 "$STDERR_LOG" >&2 || true
    echo "FATAL: post-barrier fingerprint revalidation failed worker=$IDX" >&2
    exit "$REVALIDATE_RC"
  fi
  mv "$RESULT_TMP" "$RESULT"
  printf '%s\n' "$RUN_NONCE" > "$RUN_DIR/.closed.worker${IDX}.tmp"
  mv "$RUN_DIR/.closed.worker${IDX}.tmp" "$RUN_DIR/closed.worker${IDX}.ready"
  echo "CAPTION_SIDECAR_WORKER_CLOSED worker=$IDX result=$RESULT" >&2

  if [ "$IDX" != "0" ]; then
    exit 0
  fi

  timeout --signal=TERM --kill-after=30s 172800s bash -c '
    set -euo pipefail
    for _ in $(seq 1 17280); do
      if { [ -s "$1/failed.worker0" ] && grep -Fq "$2" "$1/failed.worker0"; } \
         || { [ -s "$1/failed.worker1" ] && grep -Fq "$2" "$1/failed.worker1"; }; then
        echo "FATAL: peer failed before post-barrier closure" >&2
        exit 32
      fi
      if [ -s "$1/closed.worker0.ready" ] && [ -s "$1/closed.worker1.ready" ] \
         && grep -Fqx "$2" "$1/closed.worker0.ready" \
         && grep -Fqx "$2" "$1/closed.worker1.ready"; then
        exit 0
      fi
      sleep 10
    done
    echo "FATAL: timed out waiting for post-barrier worker closure" >&2
    exit 31
  ' _ "$RUN_DIR" "$RUN_NONCE"

  CLOSURE=$RUN_DIR/full_root_closure.json
  CLOSURE_TMP=$RUN_DIR/.full_root_closure.json.tmp
  CLOSURE_LOG=$RUN_DIR/full_root_closure.stderr.log
  set +e
  timeout --signal=TERM --kill-after=120s 172680s \
    "$PY" scripts/offline_arb/verify_caption_sidecar.py \
      --root "$SIDECAR_ROOT" \
      --catalog-root "$CATALOG_ROOT" \
      --close-results "$RUN_DIR/worker0.json" "$RUN_DIR/worker1.json" \
      --hash-workers 8 \
      --run-nonce "$RUN_NONCE" \
      --jobtag "$JOBTAG" \
      --worker-index 0 \
      --evidence-host "$HOST" \
      > "$CLOSURE_TMP" 2> "$CLOSURE_LOG"
  CLOSURE_RC=$?
  set -e
  if [ "$CLOSURE_RC" -ne 0 ]; then
    rm -f "$CLOSURE_TMP"
    tail -n 200 "$CLOSURE_LOG" >&2 || true
    echo "FATAL: full-root closure failed rc=$CLOSURE_RC" >&2
    exit "$CLOSURE_RC"
  fi
  mv "$CLOSURE_TMP" "$CLOSURE"

  "$PY" - "$RUN_DIR" "$RUN_NONCE" "$JOBTAG" <<'PYEOF'
  import hashlib
  import json
  import os
  import re
  import sys
  from pathlib import Path

  root = Path(sys.argv[1])
  run_nonce, jobtag = sys.argv[2:]
  run = json.loads((root / "run.json").read_text(encoding="utf-8"))
  results = [
      json.loads((root / f"worker{index}.json").read_text(encoding="utf-8"))
      for index in range(2)
  ]
  closure = json.loads((root / "full_root_closure.json").read_text(encoding="utf-8"))
  if run.get("run_nonce") != run_nonce or run.get("jobtag") != jobtag:
      raise SystemExit("FATAL aggregate run metadata mismatch")
  for index, result in enumerate(results):
      context = result.get("run_context", {})
      if (
          result.get("status") != "PASS"
          or context.get("run_nonce") != run_nonce
          or context.get("jobtag") != jobtag
          or context.get("worker_index") != index
          or not context.get("host")
          or result.get("post_barrier_revalidation", {}).get("status") != "PASS"
      ):
          raise SystemExit(f"FATAL validator worker {index} evidence mismatch")
      if "not_full_source_digest" not in result.get("evidence_scope", ""):
          raise SystemExit("FATAL validator evidence scope overclaims source proof")
  identity = (
      "sidecar_schema_version",
      "builder_build_id",
      "caption_schema_contract_sha256",
      "header_sha256",
      "catalog_hash",
      "catalog_header_sha256",
      "semantic_digest_algorithm",
  )
  if {key: results[0].get(key) for key in identity} != {
      key: results[1].get(key) for key in identity
  }:
      raise SystemExit("FATAL validator workers observed different frozen identities")
  expected_domains = {"anime", "monet_real", "gpic", "synthetic", "textatlas"}
  covered = [domain for result in results for domain in result["validated_domains"]]
  if len(covered) != len(set(covered)) or set(covered) != expected_domains:
      raise SystemExit(f"FATAL five-domain coverage mismatch: {covered!r}")
  reports = {
      domain: report
      for result in results
      for domain, report in result["domains"].items()
  }
  witness_kinds = {
      kind for result in results for kind in result.get("witness_kinds", [])
  }
  required_witnesses = {"null", "list", "unicode"}
  if set(reports) != expected_domains or not required_witnesses.issubset(witness_kinds):
      raise SystemExit("FATAL domain or typed source witness coverage mismatch")
  if (
      closure.get("status") != "PASS"
      or closure.get("run_context", {}).get("run_nonce") != run_nonce
      or set(closure.get("validated_domains", [])) != expected_domains
      or closure.get("header_sha256") != results[0]["header_sha256"]
      or closure.get("builder_build_id") != results[0]["builder_build_id"]
      or closure.get("caption_schema_contract_sha256")
      != results[0]["caption_schema_contract_sha256"]
      or closure.get("files") != sum(result["files"] for result in results)
      or closure.get("bytes") != sum(result["bytes"] for result in results)
      or closure.get("control_snapshot_revalidated_after_full_hash") is not True
  ):
      raise SystemExit("FATAL full-root closure evidence mismatch")
  for index in range(2):
      raw = (root / f"worker{index}.json").read_bytes()
      if closure["worker_result_sha256"].get(str(index)) != hashlib.sha256(raw).hexdigest():
          raise SystemExit(f"FATAL closure worker-result binding mismatch: {index}")
  aggregate = {
      "status": "PASS",
      "schema_version": "offline_arb_caption_sidecar_validation_aggregate_v2",
      "run_context": {
          "run_nonce": run_nonce,
          "jobtag": jobtag,
          "workers": [result["run_context"] for result in results],
      },
      **{key: results[0][key] for key in identity},
      "evidence_scope": results[0]["evidence_scope"],
      "validated_domains": sorted(reports),
      "files": sum(result["files"] for result in results),
      "bytes": sum(result["bytes"] for result in results),
      "rows": sum(result["rows"] for result in results),
      "typed_source_witness_kinds": sorted(witness_kinds),
      "semantic_digest_sha256": {
          domain: reports[domain]["semantic_digest_sha256"]
          for domain in sorted(reports)
      },
      "full_root_closure": closure,
      "worker_results": [str(root / f"worker{index}.json") for index in range(2)],
  }
  temporary = root / ".aggregate.json.tmp"
  final = root / "aggregate.json"
  temporary.write_text(
      json.dumps(aggregate, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
      encoding="utf-8",
  )
  os.replace(temporary, final)
  print(json.dumps(aggregate, ensure_ascii=False, indent=2, sort_keys=True))
  PYEOF
  echo "CAPTION_SIDECAR_VALIDATION_ALL_PASS result=$RUN_DIR/aggregate.json" >&2
