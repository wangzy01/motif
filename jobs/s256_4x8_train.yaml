# stage1a@256 v2 —— 4×8=32卡 训练（canonical / 最常用）。多机最优解：EFA 镜像 + plain FSDP。
# 依据：experiments/results/multinode_scaling_20260623.md §6（image C 自带 aws-ofi-nccl → 跨节点
#   走 EFA NET/OFI，plain FSDP @512 ≈ 单机 3.7×/93%；FSDP==HSDP on EFA 故不开 HSDP、无需改代码）。
# global batch 1536（强扩展）→ 4×8 每卡 mb=48（1536/32）。lr 1.73e-4 / warmup 1000（v2 config 已设）。
# 提交：jcc job submit jobs/s256_4x8_train.yaml ；进度：tail .../experiments/results/$RUN_ID/train.n0.log
name: evan-mot-s256v2-4x8
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129  # ★EFA镜像(固化)；venv-gpu 在此镜像下 NCCL ABI 兼容能加载 OFI 插件
numWorkers: 4
gpuPerWorker: 8
cpuPerWorker: 48
memGBPerWorker: 900
maxRetries: 50                       # 保活续训；崩溃自动 resume（RUN_ID/checkpoint_dir 写死）
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=6 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN
  export FI_EFA_USE_DEVICE_RDMA=1    # EFA：image C 自带 OFI 插件自动走 NET/OFI；★不要设 NCCL_IB_DISABLE（会逼回 socket）
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  # ===== 每个新版本改这两行：唯一 RUN_ID + 消融开关（如 B1: ABLATION="model.text_adapter.enabled=true model.text_adapter.bidirectional=true"）=====
  RUN_ID=s256v2_4x8_baseline_20260623
  ABLATION=""
  # ==============================================================================================================================

  CFG=configs/stage1a_t2i_256_v2.yaml
  BS=48; NNODES=4; PORT=29677       # 4×8: mb=48 (global 1536/32)
  CK=/fsx/evan/checkpoints/mot_pilot_v1/$RUN_ID
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/$RUN_ID
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  RDZV=$CK/rdzv.addr
  mkdir -p "$CK" "$RES"

  HOST=$(hostname); NODE_RANK=${HOST##*-}
  # ---- /fsx 文件法 rendezvous（4 节点 pod-DNS 会 FATAL master dns；文件法稳）----
  if [ "$NODE_RANK" = "0" ]; then
    rm -f "$RDZV"; MYIP=$(hostname -i | awk '{print $1}')
    echo "$MYIP" > "$RDZV.tmp" && mv "$RDZV.tmp" "$RDZV"; MASTER_ADDR=$MYIP
  else
    sleep 5                          # 让 node-0 先 rm+写，避免读到上次 run 的旧 IP（配 maxRetries 兜底）
    for i in $(seq 1 150); do [ -s "$RDZV" ] && break; sleep 2; done
    [ -s "$RDZV" ] || { echo "FATAL rdzv file missing"; exit 20; }
    MASTER_ADDR=$(cat "$RDZV")
  fi
  echo "node=$NODE_RANK master=$MASTER_ADDR world=$((NNODES*8)) $(date -u)"
  { echo "===== $RUN_ID 4x8 @256 v2 $(date -u) ====="; hostname; nvidia-smi -L; } 2>&1 | tee "$RES/probe.n$NODE_RANK.log"

  DOTS="trainer.checkpoint_dir=$CK trainer.resume=true trainer.batch_size=$BS dataset.stats_cache=$STATS dataset.anime_cache_dir=/local/evan/anime_img_cache $ABLATION"
  $PY -m torch.distributed.run --nnodes=$NNODES --nproc_per_node=8 --node_rank=$NODE_RANK \
      --master_addr=$MASTER_ADDR --master_port=$PORT \
      train.py --config $CFG --max-steps 133000 $DOTS 2>&1 | tee "$RES/train.n$NODE_RANK.log"
  RC=${PIPESTATUS[0]}; echo "===== $RUN_ID node=$NODE_RANK exited rc=$RC $(date -u) ====="; exit $RC
