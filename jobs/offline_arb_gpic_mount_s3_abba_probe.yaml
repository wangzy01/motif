# CPU16 GPIC mountpoint/S3 GetObject ABBA capture.  No package installation.
name: evan-mot-crop-offlinearb-gpic-mount-s3-abba-probe
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export AWS_REGION=us-west-2
  export AWS_DEFAULT_REGION=us-west-2
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  HOST=$(hostname)
  [ "${HOST##*-}" = 0 ] || { echo "FATAL: single-worker hostname must end in -0"; exit 2; }
  JOBTAG=${HOST%-0}
  [ "$HOST" = "$JOBTAG-0" ] || { echo "FATAL: hostname/jobtag binding drift"; exit 2; }
  LOCAL_ROOT="/local/evan/offline_arb_gpic_mount_s3_abba/$JOBTAG"
  [ ! -e "$LOCAL_ROOT" ] && [ ! -L "$LOCAL_ROOT" ] \
    || { echo "FATAL: capture local namespace is not fresh"; exit 2; }
  mkdir -m 700 -p "$LOCAL_ROOT/tmp" "$LOCAL_ROOT/pycache"
  export TMPDIR="$LOCAL_ROOT/tmp"
  export PYTHONPYCACHEPREFIX="$LOCAL_ROOT/pycache"

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER="$REPO/scripts/offline_arb/run_gpic_mount_s3_abba_probe.py"
  ANALYZER="$REPO/scripts/offline_arb/analyze_gpic_mount_s3_abba_probe.py"
  SELF="$REPO/jobs/offline_arb_gpic_mount_s3_abba_probe.yaml"
  CACHE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_phase2b_20260710T052630Z_evan-mot-crop-offlinearb-p2c-gpictune-gtnv-0_26335/gpic_items_cache.json
  OUTPUT_PARENT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop

  for FILE in "$RUNNER" "$ANALYZER" "$SELF" "$CACHE"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: capture input is missing/non-regular"; exit 2; }
  done
  [ "$(stat -c %s "$CACHE")" = 6220043 ]
  [ "$(sha256sum "$CACHE" | awk '{print $1}')" = 3c45ba6e3898b546dbc191e6b708e0bffc7047fd059708b7af8cc0e190cfa298 ]

  timeout --preserve-status --signal=TERM --kill-after=120s 8400s \
    "$PY" "$RUNNER" capture \
      --cache "$CACHE" \
      --cache-sha256 3c45ba6e3898b546dbc191e6b708e0bffc7047fd059708b7af8cc0e190cfa298 \
      --output-parent "$OUTPUT_PARENT" \
      --run-id offline_arb_gpic_mount_s3_abba_probe_20260712r1 \
      --jobtag "$JOBTAG" \
      --processes 8 \
      --threads-per-process 2 \
      --chunk-bytes 8388608 \
      --object-attempts 3 \
      --preflight-timeout-s 600 \
      --arm-timeout-s 1800 \
      --progress-interval-s 60
