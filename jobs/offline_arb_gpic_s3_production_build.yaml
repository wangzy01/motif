# Frozen production build.  Submission still requires an explicit fresh JCC
# launch; all source, parser, partition, and storage authorities are bound.
name: evan-mot-crop-offlinearb-gpic-s3-production-build
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 8
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  HOST=$(hostname)
  NODE_RANK=${HOST##*-}
  BUILD_JOBTAG=${HOST%-*}
  case "$NODE_RANK" in 0|1|2|3|4|5|6|7) ;; *) echo "FATAL: invalid builder rank"; exit 2 ;; esac
  [ "$HOST" = "$BUILD_JOBTAG-$NODE_RANK" ] || { echo "FATAL: hostname/rank drift"; exit 2; }

  PARTITION_MODE=shard_modulo
  SOURCE_MODE=tar_sequential
  TAR_WORKERS=8

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER=$REPO/scripts/offline_arb/build_offline_gpic_s3_production.py
  COMMON=$REPO/scripts/offline_arb/offline_gpic_s3_production_common.py
  TAR_SOURCE=$REPO/scripts/offline_arb/offline_gpic_tar_sequential.py
  PILOT=$REPO/scripts/offline_arb/run_offline_gpic_blob_pilot.py
  SCALE=$REPO/scripts/offline_arb/run_offline_gpic_scale_probe.py
  SELF=$REPO/jobs/offline_arb_gpic_s3_production_build.yaml
  CATALOG=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ARTIFACT_PREFIX=$BASE/offline_gpic_blob_v1_production
  COORD_PREFIX=$BASE/offline_gpic_blob_v1_production_coord
  LOCAL_PREFIX=/local/evan/offline_gpic_blob_v1_production
  S3_PREFIX=/s3/evan/artifacts/offline_gpic_blob_v1
  TOPOLOGY=$BASE/offline_arb_local_topology_v1/evan-mot-crop-offlinearb-local-topology-94ns/summary.json
  TAR_MAPPING=$BASE/offline_gpic_tar_mapping_probe_20260712v1/evan-mot-crop-offlinearb-gpic-tar-mapping-probe-wvsq/report.json
  TAR_QUICK=$BASE/offline_gpic_tar_seq_quick_v1/evan-mot-crop-offlinearb-gpic-tar-seq-quick-vpfq/summary.json
  TAR_PARSER_GATE=$BASE/offline_gpic_tar_parser_gate_20260712v1/evan-mot-crop-offlinearb-gpic-tar-parser-gate-p5gm/summary.json
  TAR_ROOT=/s3-mewtant-raw-datasets/stanford-vision-lab/gpic/train
  EXPECTED_RUNNER_SHA=6f015558b38231e6398eb26a7b3267178f81ec47d8c95b5666bdfedfef8716cd
  EXPECTED_COMMON_SHA=1f31ee29409fad2e44f240e03fb4a78ada732bc288441ae670cdbef3b11c2485
  EXPECTED_TAR_SOURCE_SHA=5a32fbec3fa8b164f8e2ca4192cd861da5206cf8cfe7e9dd91269b8b7a5bd06e
  EXPECTED_PILOT_SHA=3a3917844cdd1688e635eef5c3f1de6699de86ab4a45e42f2012cb52de61e137
  EXPECTED_SCALE_SHA=11459bfdcf3f07b710a420aa9cb739b8547dfa3accf8c9a64299b507d1d4c1fe

  for FILE in "$RUNNER" "$COMMON" "$TAR_SOURCE" "$PILOT" "$SCALE" "$SELF" \
              "$CATALOG/header.json" "$CATALOG/gpic.parquet" "$TOPOLOGY" \
              "$TAR_MAPPING" "${TAR_MAPPING%/*}/_COMPLETE" "$TAR_QUICK" \
              "$TAR_PARSER_GATE" "${TAR_PARSER_GATE%/*}/_COMPLETE"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: invalid production builder input"; exit 2; }
  done
  [ "$(sha256sum "$RUNNER" | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA" ] \
    || { echo "FATAL: frozen production runner SHA drift"; exit 2; }
  [ "$(sha256sum "$COMMON" | awk '{print $1}')" = "$EXPECTED_COMMON_SHA" ] \
    || { echo "FATAL: frozen production common SHA drift"; exit 2; }
  [ "$(sha256sum "$TAR_SOURCE" | awk '{print $1}')" = "$EXPECTED_TAR_SOURCE_SHA" ] \
    || { echo "FATAL: frozen tar source SHA drift"; exit 2; }
  [ "$(sha256sum "$PILOT" | awk '{print $1}')" = "$EXPECTED_PILOT_SHA" ] \
    || { echo "FATAL: frozen pilot core SHA drift"; exit 2; }
  [ "$(sha256sum "$SCALE" | awk '{print $1}')" = "$EXPECTED_SCALE_SHA" ] \
    || { echo "FATAL: frozen scale core SHA drift"; exit 2; }
  mkdir -m 700 -p "$ARTIFACT_PREFIX" "$COORD_PREFIX" "$LOCAL_PREFIX" "$S3_PREFIX"
  "$PY" -m py_compile "$RUNNER" "$COMMON" "$TAR_SOURCE"

  timeout --preserve-status --signal=TERM --kill-after=60s 172800s \
    "$PY" "$RUNNER" \
      --catalog-root "$CATALOG" \
      --artifact-prefix "$ARTIFACT_PREFIX" \
      --coord-prefix "$COORD_PREFIX" \
      --local-prefix "$LOCAL_PREFIX" \
      --s3-prefix "$S3_PREFIX" \
      --topology-summary "$TOPOLOGY" \
      --topology-jobtag evan-mot-crop-offlinearb-local-topology-94ns \
      --topology-summary-raw-sha256 27c48e9d6438d992fa850a0da9192c7043ccb6714e65ffa33460a755b4c5d73a \
      --build-jobtag "$BUILD_JOBTAG" \
      --worker-id "$NODE_RANK" \
      --workers 8 \
      --partition-mode "$PARTITION_MODE" \
      --source-mode "$SOURCE_MODE" \
      --source-prefix /s3-mewtant-raw-datasets/stanford-vision-lab/gpic_umziped/images/train/ \
      --source-threads 1 \
      --tar-workers "$TAR_WORKERS" \
      --tar-root "$TAR_ROOT" \
      --tar-mapping-manifest "$TAR_MAPPING" \
      --tar-mapping-raw-sha256 11f680e771b8f636d3125dbce095b3b780fc29b30d9f102091febc9a0393dc92 \
      --tar-quick-summary "$TAR_QUICK" \
      --tar-quick-raw-sha256 8b5c31121e8a7c7240744396fa56a0950fa9d2f90cb93a5f4e513859031e29d0 \
      --tar-parser-gate-summary "$TAR_PARSER_GATE" \
      --tar-parser-gate-raw-sha256 a8f8b02db06cadffab80a73f2a898880ae1da0c35d2fe602e500d6495484ef9e \
      --source-attempts 1 \
      --source-block-bytes 1048576 \
      --retry-base-seconds 0 \
      --blob-target-bytes 4294967296 \
      --max-local-bytes-per-worker 1000000000000 \
      --max-source-archive-bytes-per-worker 1800000000000 \
      --max-s3-bytes-per-worker 399875000000 \
      --max-s3-payload-bytes 3199000000000 \
      --max-s3-total-bytes 3200000000000 \
      --s3-controls-reserve-bytes 1000000000 \
      --max-fsx-incremental-bytes 50000000000 \
      --max-byte-imbalance 1.10 \
      --s3-block-bytes 8388608 \
      --barrier-timeout-seconds 43200 \
      --write-authority offline-gpic-s3-production-v1-write-authorized \
      --job-spec "$SELF" \
      --cleanup-local-after-receipt \
      --production-gate

  echo "OFFLINE_GPIC_S3_PRODUCTION_BUILD_JCC_PASS build_jobtag=$BUILD_JOBTAG worker=$NODE_RANK"
