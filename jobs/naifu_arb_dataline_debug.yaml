name: evan-mot-cleanup-crop-naifu-arb-dataline-debug
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 24
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1 PYTHONUNBUFFERED=1
  OUT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/naifu_arb_dataline_debug_20260708
  mkdir -p "$OUT"
  /fsx/evan/mot_code/venv-gpu/bin/python - <<'PY' 2>&1 | tee "$OUT/debug.log"
  import faulthandler
  import json
  import os
  import sys
  import time

  faulthandler.enable(all_threads=True)
  faulthandler.dump_traceback_later(60, repeat=True, file=sys.stderr)

  def mark(msg):
      print(json.dumps({"t": round(time.time(), 3), "msg": msg}, ensure_ascii=False), flush=True)

  mark("start")
  from omegaconf import OmegaConf
  mark("import_omegaconf_done")
  from training.dataline.complete_dataset import CompleteV1Dataset
  mark("import_dataset_done")

  cfg = OmegaConf.load("configs/stage256_redesign_naifu_arb_v1.yaml")
  mark("cfg_loaded")
  kwargs = OmegaConf.to_container(cfg.dataset, resolve=True)
  kwargs.update({
      "rank": 0,
      "world_size": 1,
      "buffer_size": 768,
      "queue_size": 256,
      "min_fill": 16,
      "max_shards": 4,
      "max_rows_per_shard": 512,
      "anime_nrows": 4000,
  })
  mark("before_dataset_init")
  ds = CompleteV1Dataset(**kwargs)
  mark("after_dataset_init")
  mark(f"domains={ds.domains} shards=" + json.dumps({d: len(v) for d, v in ds.shards.items()}, ensure_ascii=False))
  loader = ds.loader(16)
  mark("before_next_batch")
  batch = next(loader)
  mark("after_next_batch")
  pix = batch["pixels"]
  mark(f"batch_shape={tuple(pix.shape)} produced={dict(ds.produced)} sampled={dict(ds.domain_counter)} reresize={dict(ds._mar_reresize_by_domain)}")
  faulthandler.cancel_dump_traceback_later()
  mark("PASS")
  PY
