name: evan-mot-crop-offlinearb-r5-postmortem
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/stage256_offline_exact_2x8_gpuval_20260711r5
  "$PY" - "$ROOT" <<'PYEOF'
  import json, math, re, statistics, sys
  from collections import defaultdict
  from pathlib import Path

  root = Path(sys.argv[1])
  metrics_path = root / "ckpt/metrics.jsonl"
  rows = [json.loads(line) for line in metrics_path.read_text().splitlines() if line.strip()]
  if not rows or rows[-1]["step"] < 29:
      raise SystemExit(f"FATAL insufficient r5 evidence: last={rows[-1]['step'] if rows else None}")

  def percentile(values, q):
      values = sorted(values)
      return values[max(0, math.ceil(q * len(values)) - 1)]

  def stats(rows):
      iters = [float(row["iter_s"]) for row in rows]
      waits = [float(row["data_wait_s"]) for row in rows]
      mean = statistics.fmean(iters)
      return {
          "steps": [int(rows[0]["step"]), int(rows[-1]["step"])],
          "n": len(rows),
          "iter_mean_s": round(mean, 4),
          "iter_median_s": round(statistics.median(iters), 4),
          "iter_p95_s": round(percentile(iters, 0.95), 4),
          "iter_max_s": round(max(iters), 4),
          "data_wait_mean_s": round(statistics.fmean(waits), 4),
          "eta_days_at_166667": round(mean * 166_667 / 86_400, 3),
      }

  steady = [row for row in rows if int(row["step"]) >= 2]
  post_warm = [row for row in rows if int(row["step"]) >= 9]
  phase = {}
  for remainder in range(4):
      selected = [row for row in post_warm if int(row["step"]) % 4 == remainder]
      phase[str(remainder)] = stats(selected) if selected else None

  profile_re = re.compile(
      r"OFFLINE_ARB_WINDOW_PROFILE rank=(?P<rank>\d+) domain=(?P<domain>\w+) "
      r"start=(?P<start>\d+).*? caption_s=(?P<caption>[0-9.]+) "
      r"image_s=(?P<image>[0-9.]+) total_s=(?P<total>[0-9.]+)"
  )
  windows = defaultdict(list)
  logs = sorted(root.glob("train.rA.n*.log"))
  for log in logs:
      node = re.search(r"\.n(\d+)\.", log.name).group(1)
      for match in profile_re.finditer(log.read_text(encoding="utf-8")):
          key = (match.group("domain"), int(match.group("start")))
          windows[key].append({
              "node": int(node),
              "rank": int(match.group("rank")),
              "caption": float(match.group("caption")),
              "image": float(match.group("image")),
              "total": float(match.group("total")),
          })
  domain_windows = defaultdict(list)
  for (domain, start), values in windows.items():
      slowest = max(values, key=lambda value: value["total"])
      domain_windows[domain].append({"start": start, **slowest})
  profile = {}
  for domain, values in sorted(domain_windows.items()):
      values.sort(key=lambda value: value["start"])
      profile[domain] = {
          "windows": values,
          "max_total_s": round(max(value["total"] for value in values), 3),
          "mean_cross_rank_max_total_s": round(
              statistics.fmean(value["total"] for value in values), 3
          ),
      }

  result = {
      "status": "CONFIRMED_NO_GO",
      "target_iter_s": 2.592,
      "two_x_target_s": 5.184,
      "all_after_cold": stats(steady),
      "post_step8": stats(post_warm),
      "phase_step_mod_4_post_step8": phase,
      "spikes_over_10s": [
          {"step": int(row["step"]), "iter_s": row["iter_s"], "data_wait_s": row["data_wait_s"]}
          for row in steady if float(row["iter_s"]) > 10.0
      ],
      "window_profiles": profile,
  }
  if result["post_step8"]["iter_mean_s"] <= result["two_x_target_s"]:
      raise SystemExit(f"FATAL expected confirmed >2x target, got {result}")
  print(json.dumps(result, indent=2, sort_keys=True))
  PYEOF
