# One-node CPU16 GPIC mount concurrency-shape capture; no GPU/model/decode work.
name: evan-mot-crop-offlinearb-gpic-concurrency-shape
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  HOST=$(hostname)
  [ "${HOST##*-}" = 0 ] || { echo "FATAL: single-worker hostname binding drift"; exit 2; }
  JOBTAG=${HOST%-0}
  [ "$HOST" = "$JOBTAG-0" ] || { echo "FATAL: hostname/jobtag binding drift"; exit 2; }
  LOCAL_NAMESPACE="/local/evan/offline_arb_gpic_concurrency_shape/$JOBTAG"
  [ ! -e "$LOCAL_NAMESPACE" ] && [ ! -L "$LOCAL_NAMESPACE" ] \
    || { echo "FATAL: local namespace is not fresh"; exit 2; }
  mkdir -m 700 -p "$LOCAL_NAMESPACE/runtime/tmp" "$LOCAL_NAMESPACE/runtime/pycache"
  trap 'rm -rf -- "$LOCAL_NAMESPACE"' EXIT
  export TMPDIR="$LOCAL_NAMESPACE/runtime/tmp"
  export PYTHONPYCACHEPREFIX="$LOCAL_NAMESPACE/runtime/pycache"

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER="$REPO/scripts/offline_arb/run_gpic_mount_concurrency_shape_probe.py"
  SELF="$REPO/jobs/offline_arb_gpic_mount_concurrency_shape_probe.yaml"
  CACHE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_phase2b_20260710T052630Z_evan-mot-crop-offlinearb-p2c-gpictune-gtnv-0_26335/gpic_items_cache.json
  CATALOG_ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1
  OUTPUT_PARENT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  RUNNER_BYTES=50711
  RUNNER_SHA256=79219e6b7c265482cdf9bfc48678f3002d984dedf4a65e1dc5e349a40186c132

  for FILE in "$RUNNER" "$SELF" "$CACHE" "$CATALOG_ROOT/header.json" "$CATALOG_ROOT/gpic.parquet"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: capture input is missing/non-regular"; exit 2; }
  done
  [ "$(stat -c %s "$RUNNER")" = "$RUNNER_BYTES" ]
  [ "$(sha256sum "$RUNNER" | awk '{print $1}')" = "$RUNNER_SHA256" ]
  SELF_BYTES=$(stat -c %s "$SELF")
  SELF_SHA256=$(sha256sum "$SELF" | awk '{print $1}')

  timeout --preserve-status --signal=TERM --kill-after=120s 10800s \
    "$PY" "$RUNNER" capture \
      --cache "$CACHE" \
      --catalog-header "$CATALOG_ROOT/header.json" \
      --catalog-gpic "$CATALOG_ROOT/gpic.parquet" \
      --runner "$RUNNER" \
      --runner-bytes "$RUNNER_BYTES" \
      --runner-sha256 "$RUNNER_SHA256" \
      --capture-yaml "$SELF" \
      --capture-yaml-bytes "$SELF_BYTES" \
      --capture-yaml-sha256 "$SELF_SHA256" \
      --output-parent "$OUTPUT_PARENT" \
      --local-root "$LOCAL_NAMESPACE/stage" \
      --run-id offline_arb_gpic_mount_concurrency_shape_20260712r1 \
      --jobtag "$JOBTAG"
