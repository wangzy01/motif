# Eight-node CPU16 read-only real-data gate for the frozen tar adapter.  It
# writes compact evidence only below a fresh FSx jobtag and never submits the
# production build.
name: evan-mot-crop-offlinearb-gpic-tar-parser-gate
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 8
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  HOST=$(hostname)
  NODE_RANK=${HOST##*-}
  JOBTAG=${HOST%-*}
  case "$NODE_RANK" in 0|1|2|3|4|5|6|7) ;; *) echo "FATAL: invalid parser-gate rank"; exit 2 ;; esac
  [ "$HOST" = "$JOBTAG-$NODE_RANK" ] || { echo "FATAL: hostname/rank drift"; exit 2; }

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER=$REPO/scripts/offline_arb/run_offline_gpic_tar_parser_gate.py
  TAR_SOURCE=$REPO/scripts/offline_arb/offline_gpic_tar_sequential.py
  COMMON=$REPO/scripts/offline_arb/offline_gpic_s3_production_common.py
  PILOT=$REPO/scripts/offline_arb/run_offline_gpic_blob_pilot.py
  SELF=$REPO/jobs/offline_arb_gpic_tar_parser_gate.yaml
  CATALOG=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1
  TAR_ROOT=/s3-mewtant-raw-datasets/stanford-vision-lab/gpic/train
  SAMPLE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_gpic_tar_mapping_probe_20260712v1/evan-mot-crop-offlinearb-gpic-tar-mapping-probe-wvsq/report.json
  OUTPUT_PREFIX=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_gpic_tar_parser_gate_20260712v1
  EXPECTED_RUNNER_SHA=a5f0222fb5044572c9140297470e8389f306bfd593132e77ed7ef672e7fdc41f
  EXPECTED_COMMON_SHA=e47896a0c29456025cdaaabaa6ba1ef7d157333d3869579fbc63806a72a83f87
  EXPECTED_TAR_SOURCE_SHA=5a32fbec3fa8b164f8e2ca4192cd861da5206cf8cfe7e9dd91269b8b7a5bd06e
  EXPECTED_PILOT_SHA=3a3917844cdd1688e635eef5c3f1de6699de86ab4a45e42f2012cb52de61e137
  SAMPLE_RAW_SHA=11f680e771b8f636d3125dbce095b3b780fc29b30d9f102091febc9a0393dc92

  for FILE in "$RUNNER" "$TAR_SOURCE" "$COMMON" "$PILOT" "$SELF" \
              "$CATALOG/header.json" "$CATALOG/gpic.parquet" "$SAMPLE"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: invalid parser-gate input"; exit 2; }
  done
  [ -d "$TAR_ROOT" ] && [ ! -L "$TAR_ROOT" ] \
    || { echo "FATAL: invalid read-only tar root"; exit 2; }
  [ "$(sha256sum "$RUNNER" | awk '{print $1}')" = "$EXPECTED_RUNNER_SHA" ] \
    || { echo "FATAL: parser-gate runner SHA drift"; exit 2; }
  [ "$(sha256sum "$TAR_SOURCE" | awk '{print $1}')" = "$EXPECTED_TAR_SOURCE_SHA" ] \
    || { echo "FATAL: frozen tar-source SHA drift"; exit 2; }
  [ "$(sha256sum "$COMMON" | awk '{print $1}')" = "$EXPECTED_COMMON_SHA" ] \
    || { echo "FATAL: frozen production common SHA drift"; exit 2; }
  [ "$(sha256sum "$PILOT" | awk '{print $1}')" = "$EXPECTED_PILOT_SHA" ] \
    || { echo "FATAL: frozen pilot-core SHA drift"; exit 2; }
  mkdir -m 700 -p "$OUTPUT_PREFIX" "/local/evan/pycache/$JOBTAG-$NODE_RANK"
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/$JOBTAG-$NODE_RANK
  "$PY" -m py_compile "$RUNNER" "$TAR_SOURCE"

  timeout --preserve-status --signal=TERM --kill-after=60s 7200s \
    "$PY" "$RUNNER" \
      --catalog-root "$CATALOG" \
      --tar-root "$TAR_ROOT" \
      --sample-report "$SAMPLE" \
      --sample-report-raw-sha256 "$SAMPLE_RAW_SHA" \
      --output-prefix "$OUTPUT_PREFIX" \
      --jobtag "$JOBTAG" \
      --worker-id "$NODE_RANK" \
      --workers 8 \
      --tars-per-worker 8 \
      --barrier-timeout-seconds 3600 \
      --read-authority offline-gpic-tar-parser-gate-read-only-v1 \
      --job-spec "$SELF" \
      --expected-runner-sha256 "$EXPECTED_RUNNER_SHA" \
      --expected-tar-source-sha256 "$EXPECTED_TAR_SOURCE_SHA"

  echo "OFFLINE_GPIC_TAR_PARSER_GATE_JCC_PASS jobtag=$JOBTAG worker=$NODE_RANK"
