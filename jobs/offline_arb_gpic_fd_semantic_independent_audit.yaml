# Read-only independent recomputation.  A retry gets a new JCC host/jobtag
# attempt namespace and refuses to overwrite any prior independent_audit.json.
# AUTO selection is fail-closed: exactly one completed capture must exist.
name: evan-offarb-gpic-fd-semantic-audit
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  cd "$REPO"
  export PYTHONPATH="$REPO"
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  SOURCE_BASE=$BASE/offline_arb_gpic_fd_semantic_v1
  AUDIT_BASE=$BASE/offline_arb_gpic_fd_semantic_audit_v1
  HOST=$(hostname)
  case "$HOST" in (*[!A-Za-z0-9_.-]*|'') echo "FATAL: malformed audit host $HOST" >&2; exit 20;; esac

  CANDIDATES=()
  if [ -d "$SOURCE_BASE" ] && [ ! -L "$SOURCE_BASE" ]; then
    for candidate in "$SOURCE_BASE"/*; do
      [ -d "$candidate" ] && [ ! -L "$candidate" ] && [ -s "$candidate/aggregate.json" ] \
        && CANDIDATES+=("$candidate")
    done
  fi
  if [ "${#CANDIDATES[@]}" -ne 1 ]; then
    echo "FATAL: auto audit requires exactly one completed capture; found ${#CANDIDATES[@]}" >&2
    printf '%s\n' "${CANDIDATES[@]}" >&2
    exit 30
  fi
  SOURCE_ROOT=${CANDIDATES[0]}
  SOURCE_JOBTAG=${SOURCE_ROOT##*/}
  case "$SOURCE_JOBTAG" in (*[!A-Za-z0-9_.-]*|'') echo "FATAL: malformed source jobtag" >&2; exit 31;; esac

  AUDIT_ROOT=$AUDIT_BASE/$HOST
  test ! -e "$AUDIT_ROOT" && test ! -L "$AUDIT_ROOT"
  mkdir -p "$AUDIT_BASE"
  mkdir -m 0700 "$AUDIT_ROOT"
  test ! -e "$AUDIT_ROOT/independent_audit.json" \
    && test ! -L "$AUDIT_ROOT/independent_audit.json"
  export PYTHONPYCACHEPREFIX=$AUDIT_ROOT/pycache
  "$PY" scripts/offline_arb/audit_gpic_fd_semantic_gate.py \
    --source-root "$SOURCE_ROOT" --source-jobtag "$SOURCE_JOBTAG" \
    --audit-host "$HOST" --output "$AUDIT_ROOT/independent_audit.json"
  echo "GPIC_FD_SEMANTIC_INDEPENDENT_AUDIT_JOB_PASS result=$AUDIT_ROOT/independent_audit.json"
