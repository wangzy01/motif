# Read-only, multi-node probe for the two Anime CDN objects that failed
# simultaneously while nlcz was preparing formal plan step 6355.
name: evan-offarb-anime-incident-6355-probe
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 2
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONUNBUFFERED=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  "$PY" - <<'PYEOF'
  import hashlib
  import io
  import json
  import socket
  import time
  import urllib.error
  import urllib.request

  from PIL import Image

  urls = {
      2901694: "https://img.metanomaly.co/r2/ZGFuYm9vcnVfY2h1bmtfMDA3MTYkMjY4MDM1MDcyJDM3NTk5OA",
      3225847: "https://img.metanomaly.co/r2/ZGFuYm9vcnVfY2h1bmtfMDA5MzUkMzE0NzUxNDg4MCQ0NDQxNDA",
  }
  host = socket.gethostname()
  records = []
  for attempt in range(1, 6):
      for row_id, url in urls.items():
          started = time.monotonic()
          record = {"host": host, "attempt": attempt, "row_id": row_id}
          try:
              request = urllib.request.Request(url, headers={"User-Agent": "mot-loader/1"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read()
                  record.update(
                      status="PASS",
                      http_status=response.status,
                      content_type=response.headers.get("Content-Type"),
                      bytes=len(raw),
                      sha256=hashlib.sha256(raw).hexdigest(),
                  )
              with Image.open(io.BytesIO(raw)) as image:
                  image.verify()
              with Image.open(io.BytesIO(raw)) as image:
                  record.update(format=image.format, width=image.width, height=image.height)
          except Exception as exc:  # evidence probe must preserve the exact transport failure
              record.update(
                  status="FAIL",
                  error_type=type(exc).__name__,
                  error=str(exc),
                  http_code=getattr(exc, "code", None),
                  reason=repr(getattr(exc, "reason", None)),
              )
          record["elapsed_s"] = round(time.monotonic() - started, 6)
          records.append(record)
          print("ANIME_INCIDENT_PROBE " + json.dumps(record, sort_keys=True), flush=True)
      if attempt != 5:
          time.sleep(5)
  if not all(record["status"] == "PASS" for record in records):
      raise SystemExit("PROBE_FAIL: at least one GET/decode attempt failed")
  identities = {}
  for row_id in urls:
      values = {(r["bytes"], r["sha256"], r["width"], r["height"]) for r in records if r["row_id"] == row_id}
      if len(values) != 1:
          raise SystemExit(f"PROBE_FAIL: payload identity drift row_id={row_id}: {values}")
      identities[row_id] = list(values)[0]
  print("ANIME_INCIDENT_PROBE_PASS " + json.dumps({"host": host, "identities": identities}, sort_keys=True), flush=True)
  PYEOF
