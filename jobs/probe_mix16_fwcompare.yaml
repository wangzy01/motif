# 根因确认 probe：并发取图 fetch_workers 对 16-rank realized mix 的因果对照（fw=1 vs fw=8）。
# 假设：fetch_workers=8 在 8进程/节点下反噬——只加速 R2 域 anime→过供，并发随机读打爆
#       mountpoint-s3→饿死 monet/synth tar 顺序流。预期：fw=1（≈修复前）恢复 monet/synth，
#       fw=8 复现 12:44 的坏 mix（anime~57% / gpic~42% / monet~0 / synth~0）。
# 设计：同 2 节点(2×8=16 rank) 逐次跑两 arm（控制节点/挂载一致；外部负载时漂为已知次要混淆）。
#       每 arm 用独立 cold anime 缓存目录（隔离缓存预热对 anime 供给的影响）。0 GPU。
# 基线对照：experiments/results/probe_mix16_datafix（fw=8，审计修复后）+ 审计 §1.1（修复前）。
# 事后聚合：scripts/aggregate_probe_mix.py 分别对 fw1/ fw8/ 目录跑。
name: evan-mot-probe-mix16-fwcompare
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 2
gpuPerWorker: 0
cpuPerWorker: 40
memGBPerWorker: 380
maxRetries: 1
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  export OMP_NUM_THREADS=4
  mkdir -p /local/evan/cache/huggingface
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  CFG=configs/stage1a_t2i_256_v2.yaml
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  HOST=$(hostname); NODE_RANK=${HOST##*-}
  echo "node=$NODE_RANK 开始 fw 对照 $(date -u)"
  for FW in 1 8; do
    RES=/fsx/evan/mot_code/mot_pilot_v1_cleanup/experiments/results/probe_mix16_fwcompare/fw$FW
    CACHE=/local/evan/anime_cache_fw$FW          # 每 arm 独立 cold 缓存，隔离缓存预热偏置
    mkdir -p "$RES"; rm -rf "$CACHE"; mkdir -p "$CACHE"
    echo "===== node=$NODE_RANK ARM fetch_workers=$FW 起 8 进程 $(date -u) ====="
    for L in 0 1 2 3 4 5 6 7; do
      GR=$((NODE_RANK*8 + L))
      $PY scripts/probe_realized_mix.py --config $CFG \
          --rank $GR --world 16 --batch-size 96 --warmup 60 --count 150 --sleep 2.5 \
          dataset.stats_cache=$STATS dataset.anime_cache_dir=$CACHE \
          dataset.fetch_workers=$FW \
          > "$RES/rank$GR.log" 2>&1 &
    done
    wait
    echo "===== node=$NODE_RANK ARM fw=$FW 结束 $(date -u) ====="
    grep -L "probe-json" "$RES"/rank*.log 2>/dev/null | sed 's/^/  未完成: /' || true
    grep -h "probe-json" "$RES"/rank*.log 2>/dev/null || true
  done
  echo "===== node=$NODE_RANK 全部 arm 结束 $(date -u) ====="
