name: evan-hc-624x416
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 8
memGBPerWorker: 160
maxRetries: 0
command: |
  set -euo pipefail
  set -x
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  export HF_HOME=/local/evan/cache/huggingface TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  mkdir -p "$HF_HOME" "$TORCH_HOME" "$TRITON_CACHE_DIR"
  set +x
  if [ -f /fsx/evan/.hf_token ]; then export HF_TOKEN=$(tr -d '[:space:]' < /fsx/evan/.hf_token); echo "[token] len=${#HF_TOKEN}"; else echo "[token] MISSING"; fi
  set -x

  export RD512A_LATEST_CKPT=/fsx/evan/mot_code/data_analysis/outputs/headcrop_matrix_now_comprehensive/ckpts/rd512a_latest_eval_snapshot.pt
  export RD512A_LATEST_MIN_STEP=18001
  test -s "$RD512A_LATEST_CKPT"
  test -s /fsx/evan/checkpoints/mot_pilot_v1/redesign_512a_gates/gate_g1.pt
  $PY -m py_compile experiments/eval/sample_headcrop_matrix.py
  $PY -m py_compile experiments/eval/plan_headcrop_subagent_batches.py

  BASE=/fsx/evan/mot_code/data_analysis/outputs/headcrop_matrix_now_shards/624x416
  TAG13=/fsx/evan/mot_code/data_analysis/configs/anime_evalset_tag13_headcrop.jsonl
  NL13=/fsx/evan/mot_code/data_analysis/configs/anime_evalset_nl13_headcrop.jsonl
  NLPLAIN=experiments/eval/prompts/anime_evalset_nl13_plain_headcrop.jsonl
  REAL12=experiments/eval/prompts/real_headcrop_12.jsonl
  RUNS="rd256_final rd512a_g1 rd512a_latest"
  COMMON="--runs $RUNS --steps 64 --cfg 4.0 --seeds 7 1007 --weights ema --batch-size 4 --out-dir $BASE --width 624 --height 416"

  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 120m $PY experiments/eval/sample_headcrop_matrix.py $COMMON --evalset "$TAG13"    --label anime_tag13_ar
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 120m $PY experiments/eval/sample_headcrop_matrix.py $COMMON --evalset "$NLPLAIN" --label anime_nl_plain13_ar
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 120m $PY experiments/eval/sample_headcrop_matrix.py $COMMON --evalset "$NL13"     --label anime_nl_emph13_ar
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 120m $PY experiments/eval/sample_headcrop_matrix.py $COMMON --evalset "$REAL12"   --label real12_ar

  find "$BASE" -name '*.png' | sort > "$BASE/all_images.txt"
  find "$BASE" -name 'sample_manifest.json' | sort > "$BASE/all_manifests.txt"
  $PY experiments/eval/plan_headcrop_subagent_batches.py --manifests $(cat "$BASE/all_manifests.txt") --out-dir "$BASE/subagent_batches" --batch-size 18
  echo "DONE shard 624x416 $(wc -l < "$BASE/all_images.txt") images"
