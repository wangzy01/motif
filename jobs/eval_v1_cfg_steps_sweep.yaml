# Eval doc: v1 baseline CFG/steps sensitivity sweep at current ckpt, EMA weights, same 16 prompts.
# Single-GPU, read-only. Out: experiments/results/eval_doc_v1_sweep/index.html
# Submit: jcc job submit jobs/eval_v1_cfg_steps_sweep.yaml
name: evan-mot-s256-evalsweep
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 16
memGBPerWorker: 260
maxRetries: 1
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=4 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  OUT=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/eval_doc_v1_sweep
  echo "===== EVAL v1 cfg/steps sweep $(date -u) ====="; hostname; nvidia-smi -L
  timeout --signal=TERM --kill-after=5m 6h \
    $PY experiments/exp_scripts/sweep_v1_cfg_steps.py \
      --out-dir "$OUT" --size 256 --seed 7 --batch-size 4 --weights ema
  echo "$OUT/index.html" | tee experiments/results/eval_doc_v1_sweep_path.txt
  echo "===== evalsweep done $(date -u) ====="
