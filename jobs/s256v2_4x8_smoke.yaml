# v2 全链路 smoke（cache+流水线修复）：4×8 / mb=48 / 80步 / use_latent_cache=true（并行 get_many 已修）。
# 纯测试：save_final=false、checkpoint_steps=0、ckpt 写 /local → 零 fsx ckpt 写、不动在跑任务。
# 目的：实测“修流水线后”的 latent-cache 吞吐，与对照 online(s256v2_4x8_smoke_online,同mb=48) 比；
#   若仍明显慢于 online → 按 Evan 规则回退 use_latent_cache=false。行缓冲 tee 到 /fsx 文件直接读。
name: evan-mot-s256v2-4x8-smkc
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 4
gpuPerWorker: 8
cpuPerWorker: 48
memGBPerWorker: 900
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=6 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN
  export FI_EFA_USE_DEVICE_RDMA=1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache /local/evan/s256v2_smoke
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  CFG=configs/stage1a_t2i_256_v2.yaml
  BS=48; NNODES=4; PORT=29690
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/s256v2_4x8_smoke_cache
  RDZV=$RES/rdzv.addr
  mkdir -p "$RES"

  HOST=$(hostname); NODE_RANK=${HOST##*-}
  if [ "$NODE_RANK" = "0" ]; then
    rm -f "$RDZV"; MYIP=$(hostname -i | awk '{print $1}')
    echo "$MYIP" > "$RDZV.tmp" && mv "$RDZV.tmp" "$RDZV"; MASTER_ADDR=$MYIP
  else
    sleep 5
    for i in $(seq 1 150); do [ -s "$RDZV" ] && break; sleep 2; done
    [ -s "$RDZV" ] || { echo "FATAL rdzv file missing"; exit 20; }
    MASTER_ADDR=$(cat "$RDZV")
  fi
  echo "===== SMKC node=$NODE_RANK master=$MASTER_ADDR world=$((NNODES*8)) $(date -u) ====="

  $PY -m torch.distributed.run --nnodes=$NNODES --nproc_per_node=8 --node_rank=$NODE_RANK \
      --master_addr=$MASTER_ADDR --master_port=$PORT \
      train.py --config $CFG --max-steps 80 \
      trainer.batch_size=$BS trainer.save_final=false trainer.checkpoint_steps=0 trainer.resume=false \
      trainer.log_every=5 trainer.checkpoint_dir=/local/evan/s256v2_smoke \
      dataset.use_latent_cache=true \
      dataset.stats_cache=$STATS dataset.anime_cache_dir=/local/evan/anime_img_cache 2>&1 \
      | grep --line-buffered -E "\[train\] step|model built|latent cache|低水位|OutOfMemory|Traceback|Error" \
      | stdbuf -oL tee "$RES/train.n$NODE_RANK.log"
  RC=${PIPESTATUS[0]}; echo "===== SMKC node=$NODE_RANK rc=$RC $(date -u) ====="; exit $RC
