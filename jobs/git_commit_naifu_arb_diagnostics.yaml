name: evan-mot-cleanup-crop-git-diag-commit
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 4
memGBPerWorker: 16
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  git status --short
  git add \
    scripts/stress_naifu_arb_real_dataline.py \
    jobs/naifu_arb_real_dataline_stress_cpu.yaml \
    jobs/naifu_arb_real_dataline_stress_cpu_formal_pressure.yaml \
    jobs/naifu_arb_real_dataline_stress_cpu_only_gpic.yaml \
    jobs/naifu_arb_real_dataline_stress_cpu_only_anime.yaml \
    jobs/naifu_arb_real_dataline_stress_cpu_only_monet_real.yaml \
    jobs/naifu_arb_real_dataline_stress_cpu_only_square.yaml \
    jobs/naifu_arb_real_dataline_stress_cpu_matrix_monet_real.yaml \
    jobs/naifu_arb_real_dataline_stress_cpu_matrix_synthetic.yaml \
    jobs/naifu_arb_real_dataline_stress_cpu_matrix_textatlas.yaml \
    jobs/git_commit_naifu_arb_diagnostics.yaml
  if git diff --cached --quiet; then
    echo "No staged changes."
    exit 0
  fi
  git commit -m "Add NAI ARB dataline stress diagnostics"
  git rev-parse HEAD
