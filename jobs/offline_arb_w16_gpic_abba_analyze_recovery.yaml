# Post-hoc, diagnostic-only recovery for the immutable r4 capture analyzer.
# It cannot select a production winner; it exists to preserve exact NO_GO
# metrics after the capture-bound analyzer exposed a declaration-schema bug.
name: evan-mot-crop-offlinearb-w16-gpic-abba-analyze-recovery
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 OPENBLAS_NUM_THREADS=2 NUMEXPR_NUM_THREADS=2 ARROW_NUM_THREADS=2
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_arb_w16_abba_recovery.$(hostname)
  [ ! -e "$PYTHONPYCACHEPREFIX" ] && [ ! -L "$PYTHONPYCACHEPREFIX" ]
  mkdir -p "$PYTHONPYCACHEPREFIX"

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  RUN_ID=stage256_offline_exact_w16_gpic_abba_raw_20260712r4
  SOURCE_JOBTAG=evan-mot-crop-offlinearb-w16-gpic-abba-raw-ztk7
  RESULT_ROOT=$BASE/$RUN_ID/$SOURCE_JOBTAG
  MASTER=$RESULT_ROOT/abba.$SOURCE_JOBTAG.aggregate.json
  MASTER_SHA=97307271156222d2a4adb2d4bf770c273d172b644d223a9d192b616bf6e70c98
  CAPTURE_ANALYZER=$REPO/scripts/offline_arb/analyze_w16_gpic_abba_raw_gate.py
  CAPTURE_ANALYZER_SHA=9451471ddc77cc5c831b68a6fb5c03abe5cfd93173d332a5355008e643cb848f
  CAPTURE_ANALYZE_YAML=$REPO/jobs/offline_arb_w16_gpic_abba_analyze.yaml
  CAPTURE_ANALYZE_YAML_SHA=cf642f344ccf9159a4f9826262e7974a0ab899f95906004d06ab086206c41990
  WRAPPER=$REPO/scripts/offline_arb/recover_w16_gpic_abba_analysis.py
  YAML_SELF=$REPO/jobs/offline_arb_w16_gpic_abba_analyze_recovery.yaml
  PRESERVED_SIDECAR=$RESULT_ROOT/sidecarfull.analysis.$SOURCE_JOBTAG.json
  PRESERVED_SIDECAR_SHA=e063af3e212a7f64230583ccf95ab75e50abcdaaf2285d0b63c4cb9e0ec4d456
  FAILED_OUTPUT=$RESULT_ROOT/w16_gpic_abba_analysis.$SOURCE_JOBTAG.json
  FAILED_OUTPUT_SHA=b010ffad074993aea081fabf97befbdf8be5697b7574d0f2265a26c23eb6e7ca
  PLAN=$BASE/offline_arb_plans_v1/w16_gpuval/plan
  CATALOG=$BASE/offline_arb_catalog_v1
  ANIMEFREQ=$BASE/offline_arb_animefreq_v1
  SIDECAR=$BASE/offline_arb_caption_sidecar_v1

  [ "$(grep -m1 '^numWorkers:' "$YAML_SELF" | awk '{print $2}')" = 1 ]
  [ "$(grep -m1 '^gpuPerWorker:' "$YAML_SELF" | awk '{print $2}')" = 0 ]
  [ "$(grep -m1 '^cpuPerWorker:' "$YAML_SELF" | awk '{print $2}')" = 16 ]
  [ "$(sha256sum "$MASTER" | awk '{print $1}')" = "$MASTER_SHA" ]
  [ "$(sha256sum "$CAPTURE_ANALYZER" | awk '{print $1}')" = "$CAPTURE_ANALYZER_SHA" ]
  [ "$(sha256sum "$CAPTURE_ANALYZE_YAML" | awk '{print $1}')" = "$CAPTURE_ANALYZE_YAML_SHA" ]
  [ "$(sha256sum "$PRESERVED_SIDECAR" | awk '{print $1}')" = "$PRESERVED_SIDECAR_SHA" ]
  [ "$(sha256sum "$FAILED_OUTPUT" | awk '{print $1}')" = "$FAILED_OUTPUT_SHA" ]
  for FILE in "$MASTER" "$CAPTURE_ANALYZER" "$CAPTURE_ANALYZE_YAML" "$WRAPPER" \
              "$YAML_SELF" "$PRESERVED_SIDECAR" "$FAILED_OUTPUT"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ]
  done
  WRAPPER_SHA=$(sha256sum "$WRAPPER" | awk '{print $1}')
  YAML_SHA=$(sha256sum "$YAML_SELF" | awk '{print $1}')
  "$PY" -m py_compile "$WRAPPER" "$CAPTURE_ANALYZER"

  "$PY" - <<'PYEOF'
  import shutil
  from pathlib import Path
  from scripts.offline_arb import recover_w16_gpic_abba_analysis as recovery

  module = recovery._load_capture_analyzer()
  if len(recovery._expected_recovery_labels()) != 24:
      raise SystemExit("recovery exact-label cardinality drift")
  root = Path("/local/evan/w16_abba_recovery_selftest") / Path("/proc/sys/kernel/random/uuid").read_text().strip()
  root.mkdir(parents=True)
  artifact = root / "control.json"
  artifact.write_text("{}\n", encoding="utf-8")
  label = "l16_a node 0 sidecar control"
  declaration = {"path": str(artifact.resolve()), "sha256": recovery.sha256_file(artifact)}
  if recovery.validate_unsized_reference(module, artifact, declaration, label) != declaration["sha256"]:
      raise SystemExit("recovery unsized-reference positive case failed")

  bad_cases = []
  extra = dict(declaration, bytes=artifact.stat().st_size)
  bad_cases.append((artifact, extra, label))
  bad_cases.append((artifact, dict(declaration, path=str(root / "wrong")), label))
  bad_cases.append((artifact, dict(declaration, sha256="0" * 64), label))
  bad_cases.append((artifact, declaration, "unapproved label"))
  link = root / "link.json"
  link.symlink_to(artifact)
  bad_cases.append((link, {"path": str(artifact.resolve()), "sha256": declaration["sha256"]}, label))
  for path, value, case_label in bad_cases:
      try:
          recovery.validate_unsized_reference(module, path, value, case_label)
      except ValueError:
          pass
      else:
          raise SystemExit(f"recovery negative case accepted: {case_label}")
  recovery.validate_reusable_snapshot(module, artifact, {})
  for snapshot_path, snapshot_value in ((artifact, {"wrong": 1}), (link, {})):
      try:
          recovery.validate_reusable_snapshot(module, snapshot_path, snapshot_value)
      except ValueError:
          pass
      else:
          raise SystemExit("recovery snapshot negative case accepted")
  artifact.write_text('{"value": 1}\n', encoding="utf-8")
  recovery.validate_reusable_snapshot(module, artifact, {"value": 1})
  try:
      recovery.validate_reusable_snapshot(module, artifact, {"value": 1.0})
  except ValueError:
      pass
  else:
      raise SystemExit("recovery snapshot type-exact mismatch accepted")
  shutil.rmtree(root)
  print("W16_ABBA_RECOVERY_SELFTEST_PASS labels=24 negatives=5 snapshot_negatives=3")
  PYEOF

  case "$(hostname)" in
    *-0) ANALYSIS_JOBTAG=${HOSTNAME%-0} ;;
    *) echo "FATAL: recovery hostname is not a one-worker JCC identity"; exit 1 ;;
  esac
  case "$ANALYSIS_JOBTAG" in (*[!A-Za-z0-9_.-]*) echo "FATAL: malformed recovery jobtag"; exit 1;; esac
  OUTPUT=$RESULT_ROOT/w16_gpic_abba_posthoc_diagnostic.$SOURCE_JOBTAG.$ANALYSIS_JOBTAG.json
  ATTESTATION=$RESULT_ROOT/w16_gpic_abba_analysis.recovery_attestation.$SOURCE_JOBTAG.$ANALYSIS_JOBTAG.json
  [ ! -e "$OUTPUT" ] && [ ! -L "$OUTPUT" ] && [ ! -e "$ATTESTATION" ] && [ ! -L "$ATTESTATION" ]

  set +e
  timeout --signal=TERM --kill-after=30s 7200s \
    "$PY" "$WRAPPER" \
      --master "$MASTER" --repo "$REPO" --plan "$PLAN" \
      --catalog "$CATALOG" --animefreq "$ANIMEFREQ" --sidecar "$SIDECAR" \
      --run-id "$RUN_ID" --output "$OUTPUT"
  ANALYZE_RC=$?
  set -e

  [ "$ANALYZE_RC" -eq 3 ]
  [ -f "$OUTPUT" ] && [ ! -L "$OUTPUT" ] && [ -s "$OUTPUT" ]
  [ "$(sha256sum "$MASTER" | awk '{print $1}')" = "$MASTER_SHA" ]
  [ "$(sha256sum "$CAPTURE_ANALYZER" | awk '{print $1}')" = "$CAPTURE_ANALYZER_SHA" ]
  [ "$(sha256sum "$CAPTURE_ANALYZE_YAML" | awk '{print $1}')" = "$CAPTURE_ANALYZE_YAML_SHA" ]
  [ "$(sha256sum "$PRESERVED_SIDECAR" | awk '{print $1}')" = "$PRESERVED_SIDECAR_SHA" ]
  [ "$(sha256sum "$FAILED_OUTPUT" | awk '{print $1}')" = "$FAILED_OUTPUT_SHA" ]
  [ "$(sha256sum "$WRAPPER" | awk '{print $1}')" = "$WRAPPER_SHA" ]
  [ "$(sha256sum "$YAML_SELF" | awk '{print $1}')" = "$YAML_SHA" ]

  "$PY" - "$OUTPUT" "$ATTESTATION" "$ANALYZE_RC" "$MASTER" "$MASTER_SHA" \
             "$WRAPPER" "$WRAPPER_SHA" "$CAPTURE_ANALYZER" "$CAPTURE_ANALYZER_SHA" \
             "$CAPTURE_ANALYZE_YAML" "$CAPTURE_ANALYZE_YAML_SHA" \
             "$PRESERVED_SIDECAR" "$PRESERVED_SIDECAR_SHA" \
             "$FAILED_OUTPUT" "$FAILED_OUTPUT_SHA" "$YAML_SELF" "$YAML_SHA" \
             "$RUN_ID" "$SOURCE_JOBTAG" "$ANALYSIS_JOBTAG" <<'PYEOF'
  import hashlib
  import json
  import math
  import os
  import sys
  from pathlib import Path

  (
      output_raw,
      attestation_raw,
      rc_raw,
      master_raw,
      master_sha,
      wrapper_raw,
      wrapper_sha,
      capture_analyzer_raw,
      capture_analyzer_sha,
      capture_analyze_yaml_raw,
      capture_analyze_yaml_sha,
      preserved_sidecar_raw,
      preserved_sidecar_sha,
      failed_output_raw,
      failed_output_sha,
      recovery_yaml_raw,
      recovery_yaml_sha,
      run_id,
      source_jobtag,
      analysis_jobtag,
  ) = sys.argv[1:]
  output = Path(output_raw)
  value = json.loads(output.read_text(encoding="utf-8"))
  rc = int(rc_raw)
  if rc != 3:
      raise SystemExit("post-hoc recovery must return diagnostic NO_GO rc=3")
  if set(value) != {
      "schema_version",
      "status",
      "production_selector_eligible",
      "identity",
      "recovery",
      "source_analysis",
  }:
      raise SystemExit("post-hoc diagnostic envelope key set mismatch")
  if (
      value.get("schema_version") != "offline_arb_w16_gpic_abba_posthoc_diagnostic_v1"
      or value.get("status") != "POSTHOC_DIAGNOSTIC"
      or value.get("production_selector_eligible") is not False
  ):
      raise SystemExit("post-hoc diagnostic envelope identity mismatch")
  if value.get("identity") != {
      "run_id": run_id,
      "source_jobtag": source_jobtag,
      "master": master_raw,
      "master_sha256": master_sha,
  }:
      raise SystemExit("post-hoc diagnostic identity mismatch")
  expected_labels = sorted(
      f"{arm} node {node} sidecar {suffix}"
      for arm in ("l16_a", "l8_a", "l8_b", "l16_b")
      for node in range(2)
      for suffix in ("control", "ledger before", "ledger after")
  )
  recovery = value.get("recovery")
  if (
      not isinstance(recovery, dict)
      or set(recovery) != {
          "reason",
          "capture_analyzer",
          "capture_analyzer_sha256",
          "wrapper",
          "wrapper_sha256",
          "recovered_declaration_labels",
          "reused_analysis_sidecar_snapshot",
          "reused_analysis_sidecar_snapshot_sha256",
      }
      or recovery.get("capture_analyzer") != capture_analyzer_raw
      or recovery.get("capture_analyzer_sha256") != capture_analyzer_sha
      or recovery.get("wrapper") != wrapper_raw
      or recovery.get("wrapper_sha256") != wrapper_sha
      or recovery.get("recovered_declaration_labels") != expected_labels
      or recovery.get("reused_analysis_sidecar_snapshot") != preserved_sidecar_raw
      or recovery.get("reused_analysis_sidecar_snapshot_sha256") != preserved_sidecar_sha
  ):
      raise SystemExit("post-hoc diagnostic recovery binding mismatch")
  source = value.get("source_analysis")
  if not isinstance(source, dict) or source.get("schema_version") != "offline_arb_w16_gpic_abba_analysis_v1":
      raise SystemExit("post-hoc source analysis schema mismatch")
  if source.get("status") != "NO_GO" or source.get("selection_candidates") != []:
      raise SystemExit("post-hoc source analysis must be a non-selectable NO_GO")
  evidence = source.get("evidence")
  arms = source.get("arms")
  qualifications = source.get("thread_qualification")
  candidates = source.get("selection_candidates")
  if not isinstance(evidence, dict) or evidence.get("master") != master_raw or evidence.get("master_sha256") != master_sha:
      raise SystemExit("recovery master evidence mismatch")
  identity = source.get("identity")
  if (
      not isinstance(identity, dict)
      or identity.get("run_id") != run_id
      or identity.get("jobtag") != source_jobtag
      or identity.get("world_size") != 16
      or identity.get("local_world_size") != 8
      or identity.get("per_rank_bs") != 36
      or identity.get("prefetch_steps") != 4
      or identity.get("target_seconds_per_step") != 2.592
  ):
      raise SystemExit("recovery source identity mismatch")
  expected_thresholds = {
      "capacity_headroom_ratio": 1.0 / 0.9,
      "global_wait_mean_max_s": 2.592 * 0.9,
      "global_wait_p95_max_s": 2.592 * 2.0,
      "global_wait_max_s": 2.592 * 4.0,
      "global_wait_over_target_fraction_max": 0.10,
      "critical_window_mean_max_s": 4 * 2.592 * 0.9,
      "critical_window_tail_max_s": 4 * 2.592 * 2.0,
      "runner_elapsed_per_step_max_s": 2.75,
      "pair_drift_max": 0.05,
  }
  if source.get("thresholds") != expected_thresholds:
      raise SystemExit("recovery source threshold contract mismatch")
  expected_arms = {
      "l16_a": (16, 0, 192),
      "l8_a": (8, 192, 384),
      "l8_b": (8, 384, 576),
      "l16_b": (16, 576, 768),
  }
  expected_gate_names = {
      "global_wait_mean_s",
      "global_wait_p95_s",
      "global_wait_max_s",
      "global_wait_over_target_fraction",
      "critical_window_mean_s",
      "critical_window_p95_s",
      "critical_window_max_s",
      "max_rank_runner_elapsed_per_step_s",
      "anime_min_rank_capacity_ratio",
      "monet_real_min_rank_capacity_ratio",
      "gpic_min_rank_capacity_ratio",
      "synthetic_min_rank_capacity_ratio",
      "textatlas_min_rank_capacity_ratio",
  }
  expected_gate_specs = {
      "global_wait_mean_s": ("<=", expected_thresholds["global_wait_mean_max_s"]),
      "global_wait_p95_s": ("<=", expected_thresholds["global_wait_p95_max_s"]),
      "global_wait_max_s": ("<=", expected_thresholds["global_wait_max_s"]),
      "global_wait_over_target_fraction": ("<=", expected_thresholds["global_wait_over_target_fraction_max"]),
      "critical_window_mean_s": ("<=", expected_thresholds["critical_window_mean_max_s"]),
      "critical_window_p95_s": ("<=", expected_thresholds["critical_window_tail_max_s"]),
      "critical_window_max_s": ("<=", expected_thresholds["critical_window_tail_max_s"]),
      "max_rank_runner_elapsed_per_step_s": ("<=", expected_thresholds["runner_elapsed_per_step_max_s"]),
      **{
          f"{domain}_min_rank_capacity_ratio": (">=", expected_thresholds["capacity_headroom_ratio"])
          for domain in ("anime", "monet_real", "gpic", "synthetic", "textatlas")
      },
  }
  if not isinstance(arms, dict) or set(arms) != set(expected_arms):
      raise SystemExit("recovery arm set mismatch")
  for arm, expected_arm in expected_arms.items():
      arm_value = arms[arm]
      if (arm_value.get("threads"), arm_value.get("start_step"), arm_value.get("stop_step")) != expected_arm:
          raise SystemExit(f"recovery {arm} identity mismatch")
      gates = arm_value.get("gates")
      failed = arm_value.get("failed_gates")
      if not isinstance(gates, list) or not isinstance(failed, list) or not gates:
          raise SystemExit(f"recovery {arm} gates missing")
      if {gate.get("name") for gate in gates if isinstance(gate, dict)} != expected_gate_names:
          raise SystemExit(f"recovery {arm} gate-name set mismatch")
      gates_by_name = {gate["name"]: gate for gate in gates}
      for gate in gates:
          if not isinstance(gate, dict) or set(gate) != {"name", "value", "operator", "threshold", "pass"}:
              raise SystemExit(f"recovery {arm} gate schema mismatch")
          gate_name = gate["name"]
          number = gate["value"]
          threshold = gate["threshold"]
          operator = gate["operator"]
          if (
              not isinstance(gate_name, str)
              or isinstance(number, bool)
              or not isinstance(number, (int, float))
              or isinstance(threshold, bool)
              or not isinstance(threshold, (int, float))
              or not math.isfinite(float(number))
              or not math.isfinite(float(threshold))
              or operator not in {"<=", ">="}
              or type(gate["pass"]) is not bool
              or (operator, threshold) != expected_gate_specs.get(gate_name)
          ):
              raise SystemExit(f"recovery {arm}/{gate_name} non-finite gate")
          recomputed = number <= threshold if operator == "<=" else number >= threshold
          if gate["pass"] is not recomputed:
              raise SystemExit(f"recovery {arm}/{gate_name} gate mismatch")
      expected_failed = [gate["name"] for gate in gates if not gate["pass"]]
      expected_arm_status = "PASS" if not expected_failed else "NO_GO"
      if (
          len({gate["name"] for gate in gates}) != len(gates)
          or failed != expected_failed
          or arm_value.get("status") != expected_arm_status
      ):
          raise SystemExit(f"recovery {arm} status mismatch")
      capacity = arm_value.get("domain_min_rank_capacity_ratio")
      expected_domains = {"anime", "monet_real", "gpic", "synthetic", "textatlas"}
      if not isinstance(capacity, dict) or set(capacity) != expected_domains:
          raise SystemExit(f"recovery {arm} capacity domain set mismatch")
      for domain, capacity_value in capacity.items():
          if (
              isinstance(capacity_value, bool)
              or not isinstance(capacity_value, (int, float))
              or not math.isfinite(float(capacity_value))
              or capacity_value <= 0
              or gates_by_name[f"{domain}_min_rank_capacity_ratio"]["value"] != capacity_value
          ):
              raise SystemExit(f"recovery {arm}/{domain} capacity/gate binding mismatch")
      global_wait = arm_value.get("global_critical_wait")
      critical_windows = arm_value.get("combined_critical_windows")
      runner_elapsed = arm_value.get("rank_runner_elapsed_per_step_s")
      if (
          not isinstance(global_wait, dict)
          or not isinstance(critical_windows, dict)
          or not isinstance(runner_elapsed, dict)
          or gates_by_name["global_wait_mean_s"]["value"] != global_wait.get("mean_s")
          or gates_by_name["global_wait_p95_s"]["value"] != global_wait.get("p95_s")
          or gates_by_name["global_wait_max_s"]["value"] != global_wait.get("max_s")
          or gates_by_name["global_wait_over_target_fraction"]["value"]
          != global_wait.get("over_target_fraction")
          or gates_by_name["critical_window_mean_s"]["value"] != critical_windows.get("mean_s")
          or gates_by_name["critical_window_p95_s"]["value"] != critical_windows.get("p95_s")
          or gates_by_name["critical_window_max_s"]["value"] != critical_windows.get("max_s")
          or not runner_elapsed
          or gates_by_name["max_rank_runner_elapsed_per_step_s"]["value"]
          != max(runner_elapsed.values())
      ):
          raise SystemExit(f"recovery {arm} gate/source-summary binding mismatch")
  if not isinstance(qualifications, dict) or set(qualifications) != {"L8", "L16"}:
      raise SystemExit("recovery qualification set mismatch")
  expected_groups = {"L8": ["l8_a", "l8_b"], "L16": ["l16_a", "l16_b"]}
  expected_candidates = []
  expected_inconclusive = []
  for group, group_arms in expected_groups.items():
      left, right = group_arms
      left_capacity = arms[left]["domain_min_rank_capacity_ratio"]["gpic"]
      right_capacity = arms[right]["domain_min_rank_capacity_ratio"]["gpic"]
      drift = abs(left_capacity - right_capacity) / max(left_capacity, right_capacity)
      stable = drift <= 0.05
      arms_pass = all(arms[arm]["status"] == "PASS" for arm in group_arms)
      qualified = arms_pass and stable
      qualification = qualifications[group]
      if (
          qualification.get("arms") != group_arms
          or qualification.get("gpic_min_rank_capacity_ratio") != {left: left_capacity, right: right_capacity}
          or qualification.get("pair_drift_formula") != "abs(a-b)/max(a,b)"
          or qualification.get("pair_drift") != drift
          or qualification.get("pair_drift_max") != 0.05
          or qualification.get("stable") is not stable
          or qualification.get("inconclusive") is not (not stable)
          or qualification.get("arms_pass") is not arms_pass
          or qualification.get("qualified") is not qualified
          or qualification.get("arm_statuses") != {arm: arms[arm]["status"] for arm in group_arms}
          or qualification.get("worst_gpic_min_rank_capacity_ratio") != min(left_capacity, right_capacity)
      ):
          raise SystemExit(f"recovery {group} qualification mismatch")
      if qualified:
          expected_candidates.append(group)
      if not stable:
          expected_inconclusive.append(group)
  expected_decision = "INCONCLUSIVE" if expected_inconclusive else "NO_GO"
  expected_failed_arms = [arm for arm in expected_arms if arms[arm]["status"] != "PASS"]
  if (
      expected_candidates
      or candidates != []
      or source.get("inconclusive_groups") != expected_inconclusive
      or source.get("decision") != expected_decision
      or source.get("failed_arms") != expected_failed_arms
  ):
      raise SystemExit("recovery selection/status mismatch")
  attestation = {
      "schema_version": "offline_arb_w16_gpic_abba_posthoc_attestation_v1",
      "status": "POSTHOC_DIAGNOSTIC",
      "observed_status": source["status"],
      "observed_decision": source["decision"],
      "production_selector_eligible": False,
      "scope": "POSTHOC_DIAGNOSTIC_ONLY_NOT_A_PRODUCTION_SELECTOR",
      "reason": "capture declarations use exact {path,sha256}; immutable analyzer expected {path,bytes,sha256}",
      "analysis": {"path": str(output), "sha256": hashlib.sha256(output.read_bytes()).hexdigest()},
      "master": {"path": master_raw, "sha256": master_sha},
      "wrapper": {"path": wrapper_raw, "sha256": wrapper_sha},
      "capture_analyzer": {"path": capture_analyzer_raw, "sha256": capture_analyzer_sha},
      "capture_analyze_yaml": {"path": capture_analyze_yaml_raw, "sha256": capture_analyze_yaml_sha},
      "preserved_analysis_sidecar": {"path": preserved_sidecar_raw, "sha256": preserved_sidecar_sha},
      "prior_failed_analysis": {"path": failed_output_raw, "sha256": failed_output_sha},
      "recovery_yaml": {"path": recovery_yaml_raw, "sha256": recovery_yaml_sha},
      "identity": {
          "run_id": run_id,
          "source_jobtag": source_jobtag,
          "analysis_jobtag": analysis_jobtag,
          "analyzer_rc": rc,
          "recovered_declaration_labels": 24,
          "reused_existing_analysis_sidecar_snapshot": True,
      },
  }
  target = Path(attestation_raw)
  temporary = target.with_name(f".{target.name}.tmp.{os.getpid()}")
  with temporary.open("x", encoding="utf-8") as handle:
      json.dump(attestation, handle, ensure_ascii=False, indent=2, sort_keys=True)
      handle.write("\n")
      handle.flush()
      os.fsync(handle.fileno())
  os.link(temporary, target, follow_symlinks=False)
  temporary.unlink()
  directory_fd = os.open(target.parent, os.O_RDONLY | os.O_DIRECTORY)
  try:
      os.fsync(directory_fd)
  finally:
      os.close(directory_fd)
  if target.is_symlink() or not target.is_file() or target.stat().st_size <= 0:
      raise SystemExit("post-hoc attestation did not close atomically")
  attestation_sha = hashlib.sha256(target.read_bytes()).hexdigest()
  print(
      f"W16_GPIC_ABBA_RECOVERY_DIAGNOSTIC output={output} "
      f"attestation={target} attestation_sha256={attestation_sha} "
      f"decision={source['decision']} candidates=[]"
  )
  PYEOF

  [ -f "$ATTESTATION" ] && [ ! -L "$ATTESTATION" ] && [ -s "$ATTESTATION" ]
  [ "$(sha256sum "$MASTER" | awk '{print $1}')" = "$MASTER_SHA" ]
  [ "$(sha256sum "$CAPTURE_ANALYZER" | awk '{print $1}')" = "$CAPTURE_ANALYZER_SHA" ]
  [ "$(sha256sum "$CAPTURE_ANALYZE_YAML" | awk '{print $1}')" = "$CAPTURE_ANALYZE_YAML_SHA" ]
  [ "$(sha256sum "$PRESERVED_SIDECAR" | awk '{print $1}')" = "$PRESERVED_SIDECAR_SHA" ]
  [ "$(sha256sum "$FAILED_OUTPUT" | awk '{print $1}')" = "$FAILED_OUTPUT_SHA" ]
  [ "$(sha256sum "$WRAPPER" | awk '{print $1}')" = "$WRAPPER_SHA" ]
  [ "$(sha256sum "$YAML_SELF" | awk '{print $1}')" = "$YAML_SHA" ]
  echo "W16_GPIC_ABBA_RECOVERY_CLOSURE_PASS attestation_sha256=$(sha256sum "$ATTESTATION" | awk '{print $1}')"
  exit "$ANALYZE_RC"
