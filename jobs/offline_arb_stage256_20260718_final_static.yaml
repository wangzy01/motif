# Final light static check. Submit after FINAL_HEALTH exists and after replacing
# __PIN_FINAL_HEALTH_SHA256__ in the formal YAML with its actual SHA-256.
name: evan-offarb-s256-20260718-final-static-v1
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  CACHE_TAG=${JCC_JOB_ID:-${JOB_ID:-manual}}
  export PYTHONPYCACHEPREFIX="/local/evan/stage256_20260718_pycache/$CACHE_TAG/$(hostname)"
  mkdir -p "$PYTHONPYCACHEPREFIX"
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ROOT=$BASE/offline_arb_stage256_20260718_semantic_v1
  CFG=configs/stage256_20260718_causalmlf_offline_exact_v1.yaml
  SMOKE=jobs/offline_exact_stage256_20260718_smoke_1x8.yaml
  FORMAL=jobs/offline_exact_stage256_20260718_FORMAL_8x8.yaml
  OUT=$ROOT/STATIC_SUCCESS.json
  CONTRACT_OUT=$ROOT/STATIC_CONTRACT_SUCCESS.json

  test -f "$ROOT/FINAL_HEALTH_SUCCESS.json" && test ! -L "$ROOT/FINAL_HEALTH_SUCCESS.json"
  ! grep -q '__PIN_FINAL_HEALTH_SHA256__' "$FORMAL" \
    || { echo "FATAL: formal final-health hash has not been pinned"; exit 41; }
  for OUTFILE in "$OUT" "$CONTRACT_OUT"; do
    test ! -e "$OUTFILE" && test ! -L "$OUTFILE" \
      || { echo "FATAL: create-once static receipt exists: $OUTFILE"; exit 40; }
  done

  "$PY" -m py_compile \
    scripts/offline_arb/validate_stage256_20260718_static.py \
    scripts/offline_arb/verify_stage256_20260718_contract.py \
    stage256_20260718/offline_semantic_dataset.py
  "$PY" scripts/offline_arb/validate_stage256_20260718_static.py \
    --config "$CFG" \
    --baseline-config configs/stage256_offline_exact_v1.yaml \
    --previous-config configs/stage256_redesign_v1.yaml \
    --sampling /fsx/evan/mot_code/data_analysis/configs/t5_sampling_redesign_v1.json \
    --smoke-job "$SMOKE" \
    --formal-job "$FORMAL" \
    --output "$OUT"
  "$PY" scripts/offline_arb/verify_stage256_20260718_contract.py \
    --config "$CFG" \
    --baseline-config configs/stage256_offline_exact_v1.yaml \
    --jobs-dir jobs \
    --receipt "$ROOT/OVERLAY_VERIFY_SUCCESS.json" \
    --receipt "$ROOT/SEMANTIC_MATERIALIZE_SUCCESS.json" \
    --receipt "$ROOT/SEMANTIC_VALIDATE_SUCCESS.json" \
    --receipt "$ROOT/FREEZE_VERIFY_SUCCESS.json" \
    --receipt "$ROOT/SMOKE_SUCCESS.json" \
    --receipt "$ROOT/FINAL_HEALTH_SUCCESS.json" \
    --emit "$CONTRACT_OUT"
  echo "STAGE256_20260718_FINAL_STATIC_PASS"
