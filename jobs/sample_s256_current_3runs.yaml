# Single-GPU sampler for the current comparable stage256 runs.
# It reads checkpoints only and writes PNG/HTML under experiments/results.
# Submit: jcc job submit jobs/sample_s256_current_3runs.yaml
name: evan-mot-s256-samples-current
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 16
memGBPerWorker: 260
maxRetries: 1
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=4 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  OUT=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/s256_current_samples_$(date -u +%Y%m%d_%H%M%S)
  echo "===== sample current stage256 runs $(date -u) ====="
  hostname
  nvidia-smi -L
  df -h /fsx/evan | tail -1
  timeout --signal=TERM --kill-after=5m 8h \
    $PY experiments/exp_scripts/sample_current_s256_runs_html.py \
      --out-dir "$OUT" --size 256 --steps 64 --cfg 4.0 --batch-size 4 --seeds 7 123
  echo "$OUT/index.html" | tee /fsx/evan/mot_code/mot_pilot_v1/experiments/results/latest_s256_samples_path.txt
  echo "===== sample done $(date -u) ====="
