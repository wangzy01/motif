# 8xH100 benchmark for the "offline VAE latents already available" inner loop.
# This uses StubT2IDataset(mode=latents): same model/FSDP2/EMA/optimizer, no online VAE encode.
name: evan-mot-complete-v1-8h100-latent-stub-bench
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 8
cpuPerWorker: 80
memGBPerWorker: 1200
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1

  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=4
  export PYTHONUNBUFFERED=1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/mot_bench
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  echo "===== STACK PROBE ====="
  date -u
  hostname
  nvidia-smi
  $PY -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available(), 'ndev', torch.cuda.device_count())"

  COMMON="dataset.store_cls=training.stub_data.StubT2IDataset dataset.mode=latents dataset.latent_channels=128 dataset.downsample_factor=16 trainer.resume=false trainer.save_final=false trainer.checkpoint_steps=0 trainer.log_every=1"

  echo "===== LATENT STUB TRAIN BENCH stage 256 ====="
  $PY -m torch.distributed.run --nproc_per_node=8 --master_port=29921 \
    train.py --config configs/stage1a_t2i_256.yaml --max-steps 12 \
    $COMMON dataset.image_size=256 trainer.checkpoint_dir=/local/evan/mot_bench/latent_stub_stage256

  echo "===== LATENT STUB TRAIN BENCH stage 512 ====="
  $PY -m torch.distributed.run --nproc_per_node=8 --master_port=29922 \
    train.py --config configs/stage1a_t2i_512.yaml --max-steps 12 \
    $COMMON dataset.image_size=512 trainer.checkpoint_dir=/local/evan/mot_bench/latent_stub_stage512

  echo "===== LATENT STUB TRAIN BENCH stage 1024 ====="
  $PY -m torch.distributed.run --nproc_per_node=8 --master_port=29923 \
    train.py --config configs/stage2_1024.yaml --max-steps 8 \
    $COMMON dataset.image_size=1024 trainer.checkpoint_dir=/local/evan/mot_bench/latent_stub_stage1024

  echo "===== DONE ====="
  date -u
