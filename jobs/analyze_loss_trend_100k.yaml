# Loss-trend / marginal-return analysis for the 4 running stage256 runs.
# 纯 CPU 解析 metrics.jsonl（只读 /fsx ckpt），零模型加载、零训练干扰；上 JCC（坑点#28）。
# GPU 只为蹭节点；numWorkers=1、用量克制；不碰任何在跑 job。
name: evan-mot-loss-trend-100k
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 8
memGBPerWorker: 64
maxRetries: 1
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  echo "===== loss-trend analysis start $(date -u) ====="
  $PY experiments/exp_scripts/analyze_loss_trend_100k.py
  echo "===== loss-trend analysis done rc=$? $(date -u) ====="
