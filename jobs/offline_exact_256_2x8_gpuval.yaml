# OFFLINE_ARB_V1 2×8 GPU validation.  Round A runs 350 steps and writes the
# step-200 checkpoint; Round B must resume exactly at 200 and finish step 500.
# Before either round, node 0 alone hashes and footer-checks the immutable
# five-domain caption sidecar.  Every node verifies the JOBTAG/nonce-bound PASS
# evidence and rechecks the small control plane before allocating model state.
name: evan-mot-crop-offline-exact-256-2x8-gpuval
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 2
gpuPerWorker: 8
cpuPerWorker: 48
memGBPerWorker: 900
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=6 PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN
  export FI_EFA_USE_DEVICE_RDMA=1
  export OFFLINE_ARB_STEP_TIMEOUT_S=1800 OFFLINE_ARB_PROFILE_WINDOWS=1
  unset OFFLINE_ARB_SMOKE_DATASET_CONFIG
  unset OFFLINE_ARB_GPIC_THREADS_PER_NODE
  unset MALLOC_ARENA_MAX MALLOC_TRIM_THRESHOLD_ ARROW_DEFAULT_MEMORY_POOL LD_PRELOAD TCMALLOC_RELEASE_RATE
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  # r6 is a clean namespace: never reuse r5 checkpoints or logs.
  RUN_ID=stage256_offline_exact_2x8_gpuval_20260711r6
  CFG=configs/stage256_offline_exact_v1.yaml
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  PLAN=$BASE/offline_arb_plans_v1/w16_gpuval/plan
  CAT=$BASE/offline_arb_catalog_v1
  SIDECAR=$BASE/offline_arb_caption_sidecar_v1
  BS=36; NNODES=2
  YAML_SELF=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop/jobs/offline_exact_256_2x8_gpuval.yaml
  test -f "$PLAN/header.json" || { echo "FATAL: w16_gpuval plan missing"; exit 34; }
  test -f "$CAT/header.json" || { echo "FATAL: catalog header missing"; exit 34; }
  test -f "$SIDECAR/header.json" || { echo "FATAL: caption sidecar missing"; exit 34; }
  NW_DECL=$(grep -m1 '^numWorkers:' "$YAML_SELF" | awk '{print $2}')
  if [ -n "$NW_DECL" ] && [ "$NW_DECL" != "$NNODES" ]; then
    echo "FATAL: yaml numWorkers($NW_DECL) != script NNODES($NNODES)"; exit 21
  fi

  HOST=$(hostname); NODE_RANK=${HOST##*-}; JOBTAG=${HOST%-*}; STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  if [ "$NODE_RANK" -ge "$NNODES" ]; then echo "FATAL: node_rank $NODE_RANK >= NNODES $NNODES"; exit 21; fi
  RES=$BASE/$RUN_ID
  CK=$RES/ckpt
  mkdir -p "$RES" "$CK"
  if find "$CK" -mindepth 1 -print -quit | grep -q .; then
    echo "FATAL: r6 checkpoint namespace is not empty; use a new RUN_ID"; exit 37
  fi

  # Every node first publishes a fresh marker. Node 0 waits for all markers, so
  # its later PASS is provably newer than every node's own startup boundary.
  PREFLIGHT_JSON=$RES/sidecarpreflight.$JOBTAG.json
  PREFLIGHT_PASS=$RES/sidecarpreflight.$JOBTAG.pass
  FRESH_MARKER=$RES/sidecarpreflight.$JOBTAG.n$NODE_RANK.fresh
  rm -f "$FRESH_MARKER" "$FRESH_MARKER.tmp"
  MARK_TS=$(date +%s)
  printf 'READY|%s|%s|%s|%s\n' "$JOBTAG" "$NODE_RANK" "$MARK_TS" "$HOST" > "$FRESH_MARKER.tmp"
  mv "$FRESH_MARKER.tmp" "$FRESH_MARKER"
  if [ "$NODE_RANK" = "0" ]; then
    rm -f "$PREFLIGHT_JSON" "$PREFLIGHT_JSON.tmp" "$PREFLIGHT_PASS" "$PREFLIGHT_PASS.tmp"
    MARKERS_READY=0
    for _ in $(seq 1 600); do
      READY=1; NOW=$(date +%s)
      for RANK in $(seq 0 $((NNODES - 1))); do
        MARKER=$RES/sidecarpreflight.$JOBTAG.n$RANK.fresh
        M_STATUS=""; M_JOBTAG=""; M_RANK=""; M_TS=""; M_HOST=""
        if [ -f "$MARKER" ] && [ ! -L "$MARKER" ]; then
          IFS='|' read -r M_STATUS M_JOBTAG M_RANK M_TS M_HOST < "$MARKER" || true
        fi
        case "$M_TS" in (*[!0-9]*|'') READY=0 ;; esac
        if [ "$M_STATUS" != READY ] || [ "$M_JOBTAG" != "$JOBTAG" ] \
           || [ "$M_RANK" != "$RANK" ] || [ -z "$M_HOST" ] \
           || [ "$READY" -ne 1 ] || [ "$M_TS" -gt $((NOW + 60)) ] \
           || [ $((NOW - M_TS)) -ge 1800 ]; then READY=0; fi
      done
      if [ "$READY" -eq 1 ]; then MARKERS_READY=1; break; fi
      sleep 2
    done
    [ "$MARKERS_READY" -eq 1 ] || { echo "FATAL: all-node fresh marker barrier timed out"; exit 35; }
    timeout --signal=TERM --kill-after=30s 7200s \
      "$PY" scripts/offline_arb/make_freeze_manifest.py \
        --verify-sidecar --sidecar-root "$SIDECAR" --catalog-root "$CAT" \
        > "$PREFLIGHT_JSON.tmp"
    mv "$PREFLIGHT_JSON.tmp" "$PREFLIGHT_JSON"
    PREFLIGHT_JSON_SHA=$(sha256sum "$PREFLIGHT_JSON" | awk '{print $1}')
    read -r SIDE_HEADER SIDE_HEADER_FILE SIDE_SUCCESS_FILE SIDE_CATALOG_HEADER SIDE_RELEASE < <(
      "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x.get("status")=="PASS" and x.get("mode")=="verify-sidecar"; print(x["header_sha256"],x["header_file_sha256"],x["success_file_sha256"],x["catalog_header_sha256"],x["release_digest"])' "$PREFLIGHT_JSON"
    )
    NONCE=$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')
    NOW=$(date +%s)
    printf 'PASS|%s|%s|%s|%s|%s|%s|%s|%s|%s\n' \
      "$JOBTAG" "$NONCE" "$NOW" "$SIDE_HEADER" "$SIDE_HEADER_FILE" \
      "$SIDE_SUCCESS_FILE" "$SIDE_CATALOG_HEADER" "$SIDE_RELEASE" \
      "$PREFLIGHT_JSON_SHA" > "$PREFLIGHT_PASS.tmp"
    mv "$PREFLIGHT_PASS.tmp" "$PREFLIGHT_PASS"
  fi

  # Budget covers the 20-minute all-node marker barrier plus the full 2-hour
  # sidecar verification timeout, with 20 minutes of scheduling/FS jitter.
  for _ in $(seq 1 2400); do
    [ -f "$PREFLIGHT_PASS" ] && [ ! -L "$PREFLIGHT_PASS" ] \
      && [ "$PREFLIGHT_PASS" -nt "$FRESH_MARKER" ] && break
    sleep 4
  done
  [ -f "$PREFLIGHT_PASS" ] && [ ! -L "$PREFLIGHT_PASS" ] \
    && [ "$PREFLIGHT_PASS" -nt "$FRESH_MARKER" ] \
    || { echo "FATAL: sidecar PASS is missing or not newer than local fresh marker"; exit 35; }
  IFS='|' read -r PASS_STATUS PASS_JOBTAG PASS_NONCE PASS_TS PASS_HEADER PASS_HEADER_FILE PASS_SUCCESS_FILE PASS_CATALOG_HEADER PASS_RELEASE PASS_JSON_SHA < "$PREFLIGHT_PASS"
  [ "$PASS_STATUS" = PASS ] && [ "$PASS_JOBTAG" = "$JOBTAG" ] || { echo "FATAL: sidecar PASS JOBTAG mismatch"; exit 35; }
  case "$PASS_NONCE" in (*[!0-9a-f]*|'') echo "FATAL: malformed sidecar PASS nonce"; exit 35;; esac
  [ "${#PASS_NONCE}" -eq 64 ] || { echo "FATAL: malformed sidecar PASS nonce length"; exit 35; }
  case "$PASS_TS" in (*[!0-9]*|'') echo "FATAL: malformed sidecar PASS timestamp"; exit 35;; esac
  NOW=$(date +%s)
  [ "$PASS_TS" -le $((NOW + 60)) ] && [ $((NOW - PASS_TS)) -lt 10800 ] || { echo "FATAL: stale/future sidecar PASS"; exit 35; }
  for VALUE in "$PASS_HEADER" "$PASS_HEADER_FILE" "$PASS_SUCCESS_FILE" "$PASS_CATALOG_HEADER" "$PASS_RELEASE" "$PASS_JSON_SHA"; do
    case "$VALUE" in (*[!0-9a-f]*|'') echo "FATAL: malformed sidecar PASS hash"; exit 35;; esac
    [ "${#VALUE}" -eq 64 ] || { echo "FATAL: malformed sidecar PASS hash length"; exit 35; }
  done
  [ -f "$PREFLIGHT_JSON" ] && [ ! -L "$PREFLIGHT_JSON" ] || { echo "FATAL: shared preflight JSON missing"; exit 35; }
  LIVE_JSON_SHA=$(sha256sum "$PREFLIGHT_JSON" | awk '{print $1}')
  [ "$LIVE_JSON_SHA" = "$PASS_JSON_SHA" ] || { echo "FATAL: shared preflight JSON SHA mismatch"; exit 35; }
  read -r JSON_STATUS JSON_MODE JSON_HEADER JSON_HEADER_FILE JSON_SUCCESS_FILE JSON_CATALOG_HEADER JSON_RELEASE < <(
    "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); print(x.get("status"),x.get("mode"),x.get("header_sha256"),x.get("header_file_sha256"),x.get("success_file_sha256"),x.get("catalog_header_sha256"),x.get("release_digest"))' "$PREFLIGHT_JSON"
  )
  [ "$JSON_STATUS" = PASS ] && [ "$JSON_MODE" = verify-sidecar ] \
    && [ "$JSON_HEADER" = "$PASS_HEADER" ] \
    && [ "$JSON_HEADER_FILE" = "$PASS_HEADER_FILE" ] \
    && [ "$JSON_SUCCESS_FILE" = "$PASS_SUCCESS_FILE" ] \
    && [ "$JSON_CATALOG_HEADER" = "$PASS_CATALOG_HEADER" ] \
    && [ "$JSON_RELEASE" = "$PASS_RELEASE" ] \
    || { echo "FATAL: shared preflight JSON/PASS binding mismatch"; exit 35; }

  CONTROL_JSON=$RES/sidecarcontrol.$JOBTAG.n$NODE_RANK.$STAMP.json
  rm -f "$CONTROL_JSON" "$CONTROL_JSON.tmp"
  "$PY" scripts/offline_arb/make_freeze_manifest.py \
    --verify-sidecar-control --sidecar-root "$SIDECAR" --catalog-root "$CAT" \
    > "$CONTROL_JSON.tmp"
  mv "$CONTROL_JSON.tmp" "$CONTROL_JSON"
  read -r LIVE_HEADER LIVE_HEADER_FILE LIVE_SUCCESS_FILE LIVE_CATALOG_HEADER LIVE_RELEASE < <(
    "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x.get("status")=="PASS" and x.get("mode")=="verify-sidecar-control"; print(x["header_sha256"],x["header_file_sha256"],x["success_file_sha256"],x["catalog_header_sha256"],x["release_digest"])' "$CONTROL_JSON"
  )
  [ "$LIVE_HEADER" = "$PASS_HEADER" ] \
    && [ "$LIVE_HEADER_FILE" = "$PASS_HEADER_FILE" ] \
    && [ "$LIVE_SUCCESS_FILE" = "$PASS_SUCCESS_FILE" ] \
    && [ "$LIVE_CATALOG_HEADER" = "$PASS_CATALOG_HEADER" ] \
    && [ "$LIVE_RELEASE" = "$PASS_RELEASE" ] \
    || { echo "FATAL: sidecar controls changed after node0 preflight"; exit 35; }
  POST_JSON_SHA=$(sha256sum "$PREFLIGHT_JSON" | awk '{print $1}')
  [ "$POST_JSON_SHA" = "$PASS_JSON_SHA" ] \
    || { echo "FATAL: shared preflight JSON changed during per-node control close"; exit 35; }
  echo "sidecar preflight PASS jobtag=$JOBTAG nonce=$PASS_NONCE header=$PASS_HEADER release=$PASS_RELEASE json_sha=$PASS_JSON_SHA"

  # File name and content both bind rendezvous to this JCC attempt.
  rendezvous() {
    local ROUND=$1
    local RDZV=$RES/rdzv.$JOBTAG.r$ROUND.addr
    if [ "$NODE_RANK" = "0" ]; then
      local MYIP; MYIP=$(hostname -i | awk '{print $1}')
      printf '%s %s %s %s\n' "$MYIP" "$(date +%s)" "$JOBTAG" "$PASS_NONCE" > "$RDZV.tmp"
      mv "$RDZV.tmp" "$RDZV"; MASTER_ADDR=$MYIP
    else
      MASTER_ADDR=""
      for _ in $(seq 1 2100); do
        if [ -s "$RDZV" ] && [ ! -L "$RDZV" ]; then
          local TS TOKEN TOKEN_NONCE NOW_R
          TS=$(awk '{print $2}' "$RDZV" 2>/dev/null || true)
          TOKEN=$(awk '{print $3}' "$RDZV" 2>/dev/null || true)
          TOKEN_NONCE=$(awk '{print $4}' "$RDZV" 2>/dev/null || true)
          case "$TS" in (*[!0-9]*|'') TS="" ;; esac
          NOW_R=$(date +%s)
          if [ -n "$TS" ] && [ "$TOKEN" = "$JOBTAG" ] && [ "$TOKEN_NONCE" = "$PASS_NONCE" ] \
             && [ $((NOW_R - TS)) -lt 7200 ] && [ "$TS" -le $((NOW_R + 60)) ]; then
            MASTER_ADDR=$(awk '{print $1}' "$RDZV"); break
          fi
        fi
        sleep 2
      done
      [ -n "$MASTER_ADDR" ] || { echo "FATAL: fresh rendezvous missing round $ROUND"; exit 20; }
    fi
  }
  [ "$NODE_RANK" = "0" ] && rm -f "$RES"/rdzv.$JOBTAG.*.addr

  DOTS_COMMON="dataset.offline_plan_root=$PLAN \
        trainer.checkpoint_dir=$CK trainer.batch_size=$BS \
        trainer.checkpoint_steps=200 trainer.checkpoint_keep_max=3 trainer.save_final=false \
        trainer.log_every=5 trainer.dataline_metrics_every=10"

  run_round() {
    local ROUND=$1 MAXSTEPS=$2 RESUME=$3 PORT=$4
    rendezvous "$ROUND"
    echo "===== OFFLINE-EXACT 2x8 GPUVAL round=$ROUND node=$NODE_RANK master=$MASTER_ADDR max_steps=$MAXSTEPS resume=$RESUME $(date -u) ====="
    set +e
    "$PY" -m torch.distributed.run \
      --nnodes "$NNODES" --nproc-per-node 8 --node-rank "$NODE_RANK" \
      --master-addr "$MASTER_ADDR" --master-port "$PORT" \
      train.py --config "$CFG" --max-steps "$MAXSTEPS" \
      trainer.resume=$RESUME $DOTS_COMMON \
      2>&1 | tee "$RES/train.$JOBTAG.r$ROUND.n$NODE_RANK.$STAMP.log"
    local PIPE_RC=("${PIPESTATUS[@]}")
    set -e
    local RCR=${PIPE_RC[0]} TEE_RC=${PIPE_RC[1]}
    if [ "$TEE_RC" -ne 0 ]; then
      echo "===== round=$ROUND node=$NODE_RANK evidence tee rc=$TEE_RC ====="; return "$TEE_RC"
    fi
    echo "===== round=$ROUND node=$NODE_RANK rc=$RCR ====="
    return "$RCR"
  }

  { echo "RUN_ID=$RUN_ID cfg=$CFG plan=$PLAN sidecar_header_sha256=$PASS_HEADER sidecar_release_digest=$PASS_RELEASE preflight_json_sha256=$PASS_JSON_SHA sidecar_nonce=$PASS_NONCE"; hostname; nvidia-smi -L; df -h /local | tail -1; } \
    2>&1 | tee "$RES/probe.$JOBTAG.n$NODE_RANK.$STAMP.log"

  run_round A 350 false 29761
  run_round B 500 true  29762

  if [ "$NODE_RANK" = "0" ]; then
    ROUND_B_LOG=$RES/train.$JOBTAG.rB.n0.$STAMP.log
    if grep -qF "[train] resumed from $CK/last.pt at step 200" "$ROUND_B_LOG" \
       && grep -qE '^\[train\] step 500/500 ' "$ROUND_B_LOG"; then
      echo "==== GPUVAL PASS: two rounds rc=0, exact resume step=200 and step500 found ===="
    else
      echo "==== GPUVAL FAIL: exact resume/done evidence missing ===="; exit 38
    fi
  fi
