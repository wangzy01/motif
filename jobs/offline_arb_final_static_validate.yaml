# JCC-only static and synthetic gate.  It never requires the production
# caption sidecar to exist and never performs CPU work on the login host.
name: evan-mot-crop-offlinearb-final-static-validate
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_arb_final_static.$(hostname)
  mkdir -p "$PYTHONPYCACHEPREFIX"
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  "$PY" -m py_compile \
    scripts/offline_arb/caption_sidecar_contract.py \
    scripts/offline_arb/build_caption_sidecar.py \
    scripts/offline_arb/verify_caption_sidecar.py \
    scripts/offline_arb/test_caption_sidecar_runtime.py \
    scripts/offline_arb/make_freeze_manifest.py \
    scripts/offline_arb/analyze_gpuval_r6.py \
    scripts/offline_arb/analyze_r7_l16_diag.py \
    scripts/offline_arb/run_w64_raw_supply_gate.py \
    scripts/offline_arb/analyze_w64_raw_supply_gate.py \
    scripts/offline_arb/run_w16_gpic_abba_raw_gate.py \
    scripts/offline_arb/analyze_w16_gpic_abba_raw_gate.py \
    scripts/offline_arb/recover_w16_gpic_abba_analysis.py \
    scripts/offline_arb/smoke_offline_loader.py \
    scripts/offline_arb/audit_planned_caption_availability.py \
    scripts/offline_arb/test_caption_exceptions_v1.py \
    scripts/offline_arb/test_anime_exact_refetch.py \
    scripts/offline_arb/test_image_exceptions_v1.py \
    scripts/offline_arb/test_auto_resume_reconcile.py \
    training/auto_resume_reconcile.py \
    training/dataline_offline/caption_sidecar.py \
    training/dataline_offline/caption_exceptions_v1.py \
    training/dataline_offline/image_exceptions_v1.py \
    training/dataline_offline/offline_dataset.py \
    training/dataline/native_safety.py \
    training/dataline/pil_safety.py \
    training/dataline/caption_build.py \
    training/dataline/sampler.py \
    training/config_schema.py \
    train.py

  "$PY" scripts/offline_arb/test_anime_exact_refetch.py
  "$PY" scripts/offline_arb/test_image_exceptions_v1.py
  "$PY" scripts/offline_arb/test_auto_resume_reconcile.py

  "$PY" - <<'PYEOF'
  import ast
  import hashlib
  import json
  import os
  import re
  import shutil
  import subprocess
  import sys
  from argparse import Namespace
  from pathlib import Path

  import yaml

  repo = Path("/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop")
  jobs = repo / "jobs"

  def compile_python_heredocs(command, label, expected_count):
      lines = command.splitlines()
      count = 0
      cursor = 0
      while cursor < len(lines):
          if "<<'PYEOF'" not in lines[cursor]:
              cursor += 1
              continue
          start = cursor + 1
          try:
              stop = lines.index("PYEOF", start)
          except ValueError as exc:
              raise RuntimeError(f"unterminated Python heredoc in {label}") from exc
          compile(
              "\n".join(lines[start:stop]) + "\n",
              f"{label}-heredoc-{count}",
              "exec",
          )
          count += 1
          cursor = stop + 1
      if count != expected_count:
          raise RuntimeError(
              f"unexpected Python heredoc count in {label}: {count} != {expected_count}"
          )

  paths = set(jobs.glob("offline_arb_caption_sidecar*.yaml"))
  paths.update(
      {
          jobs / "offline_exact_256_2x8_gpuval.yaml",
          jobs / "offline_exact_256_8x8_FORMAL.yaml",
          jobs / "offline_arb_freeze_v3.yaml",
          jobs / "offline_arb_gpuval_r6_postmortem.yaml",
          jobs / "offline_exact_256_2x8_r7_l16_diag.yaml",
          jobs / "offline_arb_r7_l16_analyze.yaml",
          jobs / "offline_arb_w64_raw_supply_gate.yaml",
          jobs / "offline_arb_w64_raw_supply_analyze.yaml",
          jobs / "offline_arb_w16_gpic_abba_raw_gate.yaml",
          jobs / "offline_arb_w16_gpic_abba_analyze.yaml",
          jobs / "offline_arb_w16_gpic_abba_analyze_recovery.yaml",
          jobs / "offline_arb_caption_thread_telemetry_independent_audit.yaml",
          jobs / "offline_arb_planned_caption_availability_audit.yaml",
          jobs / "offline_arb_caption_exceptions_v1_test.yaml",
          jobs / "offline_arb_anime_exact_refetch_test.yaml",
          jobs / "offline_arb_image_exceptions_v1_test.yaml",
          jobs / "offline_arb_auto_resume_reconcile_test.yaml",
          jobs / "offline_arb_checkpoint51000_audit.yaml",
          jobs / "offline_arb_metrics52940_audit.yaml",
          jobs / "offline_arb_formal_resume_prepare_8frz.yaml",
          jobs / "offline_arb_probation_relaxed_acceptance_s657.yaml",
          jobs / "offline_arb_final_static_validate.yaml",
      }
  )
  missing = sorted(str(path) for path in paths if not path.is_file())
  if missing:
      raise RuntimeError(f"missing required JCC yaml: {missing}")
  for path in sorted(paths):
      value = yaml.safe_load(path.read_text(encoding="utf-8"))
      if not isinstance(value, dict) or not isinstance(value.get("command"), str):
          raise RuntimeError(f"malformed JCC yaml: {path}")
      if value.get("cpuPerWorker", 0) < 16 and value.get("gpuPerWorker", 0) == 0:
          raise RuntimeError(f"CPU JCC must request at least 16 CPUs: {path}")
      subprocess.run(
          ["bash", "-n"], input=value["command"], text=True, check=True
      )
      print(f"YAML+BASH PASS {path.relative_to(repo)}")

  relaxed_policy = yaml.safe_load(
      (jobs / "offline_arb_probation_relaxed_acceptance_s657.yaml").read_text(
          encoding="utf-8"
      )
  )
  compile_python_heredocs(
      relaxed_policy["command"], "probation-relaxed-acceptance", 1
  )
  for relative, label in (
      ("offline_arb_checkpoint51000_audit.yaml", "checkpoint51000-audit"),
      ("offline_arb_metrics52940_audit.yaml", "metrics52940-audit"),
      ("offline_arb_formal_resume_prepare_8frz.yaml", "formal-8frz-resume-prepare"),
  ):
      value = yaml.safe_load((jobs / relative).read_text(encoding="utf-8"))
      compile_python_heredocs(value["command"], label, 1)

  for relative in (
      "jobs/offline_exact_256_2x8_gpuval.yaml",
      "jobs/offline_exact_256_8x8_FORMAL.yaml",
  ):
      path = repo / relative
      text = path.read_text(encoding="utf-8")
      parsed = yaml.safe_load(text)
      expected_retries = 3 if relative.endswith("8x8_FORMAL.yaml") else 0
      if parsed.get("maxRetries") != expected_retries:
          raise RuntimeError(
              f"GPU launch maxRetries drift: {relative}: "
              f"{parsed.get('maxRetries')} != {expected_retries}"
          )
      lowered = text.lower()
      if any(
          token in lowered
          for token in ("anime_caption", "caption_required_bytes", "caption_stage_log")
      ):
          raise RuntimeError(f"legacy anime-caption staging leaked into {relative}")
      if "offline_arb_caption_sidecar_v1" not in text:
          raise RuntimeError(f"caption sidecar gate missing from {relative}")
      for token in ("release_digest", "PREFLIGHT_JSON_SHA", "FRESH_MARKER", '-nt "$FRESH_MARKER"'):
          if token not in text:
              raise RuntimeError(f"fresh/release preflight binding missing from {relative}: {token}")
      if "unset OFFLINE_ARB_GPIC_THREADS_PER_NODE" not in text:
          raise RuntimeError(
              f"GPU launch must clear GPIC thread env and use frozen config authority: {relative}"
          )
      if re.search(
          r"(?m)^\s*(?:export\s+)?OFFLINE_ARB_GPIC_THREADS_PER_NODE\s*=",
          text,
      ):
          raise RuntimeError(
              f"GPU launch must not override config-owned GPIC threads: {relative}"
          )
      if relative.endswith("8x8_FORMAL.yaml"):
          for token in (
              "OFFLINE_ARB_AUTO_RESUME_RECONCILE=1",
              "OFFLINE_ARB_ATTEMPT_JOBTAG=$JOBTAG",
              "OFFLINE_ARB_ATTEMPT_NONCE=$PASS_NONCE",
              "OFFLINE_ARB_AUTO_RESUME_FREEZE_SHA256=$PASS_FREEZE_SHA",
              "OFFLINE_ARB_AUTO_RESUME_PLAN_HEADER_SHA256=$PLAN_HEADER_SHA",
          ):
              if token not in text:
                  raise RuntimeError(f"FORMAL auto-resume binding missing: {token}")
  freeze_text = (jobs / "offline_arb_freeze_v3.yaml").read_text(encoding="utf-8")
  if any(token not in freeze_text for token in ("release_digest", "VERIFY_JSON_SHA", "FREEZE_SHA")):
      raise RuntimeError("freeze v3 PASS does not bind release/freeze/verify JSON identities")
  gpuval = (repo / "jobs/offline_exact_256_2x8_gpuval.yaml").read_text(
      encoding="utf-8"
  )
  if "gpuval_20260711r6" not in gpuval:
      raise RuntimeError("GPUVAL is not using the clean r6 namespace")
  r7 = (jobs / "offline_exact_256_2x8_r7_l16_diag.yaml").read_text(
      encoding="utf-8"
  )
  for token in (
      "OFFLINE_ARB_GPIC_THREADS_PER_NODE=16",
      "OFFLINE_ARB_PREFETCH_STEPS=4",
      "OFFLINE_ARB_WAIT_LOG_THRESHOLD_S=2",
      "OFFLINE_ARB_IO_STATE_EVERY_STEPS=4",
      "OFFLINE_ARB_PROFILE_WINDOWS=0",
      "OFFLINE_ARB_IO_TELEMETRY_DIR=$TELEM_LOCAL",
      "OFFLINE_ARB_ATTEMPT_JOBTAG=$JOBTAG",
      "OFFLINE_ARB_ATTEMPT_NONCE=$PASS_NONCE",
      "OFFLINE_ARB_ATTEMPT_HOST=$HOST",
      "OFFLINE_ARB_SIDECAR_HEADER_SHA256=$PASS_HEADER",
      "OFFLINE_ARB_SIDECAR_RELEASE_DIGEST=$PASS_RELEASE",
      "--max-steps 192",
      "trainer.checkpoint_steps=0",
      "trainer.save_final=false",
      "trainer.resume=false",
      "trainer.force_os_exit_after_train=true",
      "trainer.skip_distributed_teardown=true",
      "offline_arb_r7_l16_telemetry_aggregate_v1",
  ):
      if token not in r7:
          raise RuntimeError(f"r7-L16 diagnostic contract token missing: {token}")
  analyzer = (repo / "scripts/offline_arb/analyze_r7_l16_diag.py").read_text(
      encoding="utf-8"
  )
  for token in (
      "STEADY_METRIC_STEPS = range(41, 193)",
      "STEADY_WINDOW_STARTS = range(40, 192, 4)",
      "TARGET_SECONDS_PER_STEP = 2.592",
      "MIN_CAPACITY_RATIO = 1.0 / 0.9",
      '"metrics_iter_max_s"',
      '"metrics_iter_gt_5s_count"',
      '"metrics_data_wait_time_weighted_frac"',
      '"combined_critical_mean_s"',
      '"combined_critical_p95_s"',
      '"combined_critical_max_s"',
      '"gpic_min_rank_capacity_ratio"',
      '"monet_real_min_rank_capacity_ratio"',
      'closure reports rejected telemetry',
      'return 0 if result["status"] == "PASS" else 3',
  ):
      if token not in analyzer:
          raise RuntimeError(f"r7-L16 analyzer contract token missing: {token}")
  w64_capture_path = jobs / "offline_arb_w64_raw_supply_gate.yaml"
  w64_capture = w64_capture_path.read_text(encoding="utf-8")
  w64_capture_value = yaml.safe_load(w64_capture)
  if (
      w64_capture_value.get("numWorkers") != 8
      or w64_capture_value.get("gpuPerWorker") != 0
      or w64_capture_value.get("cpuPerWorker") != 16
      or w64_capture_value.get("maxRetries") != 0
  ):
      raise RuntimeError("W64 capture topology is not strict 8x16-CPU/maxRetries=0")
  w64_capture_command = w64_capture_value["command"]
  compile_python_heredocs(w64_capture_command, "w64-capture", 6)
  if "--create" in w64_capture_command or "--verify-freeze" not in w64_capture_command:
      raise RuntimeError("W64 capture must only verify an externally rebuilt formal freeze")
  for token in (
      "RUN_ID=stage256_offline_exact_w64_raw_supply_gate_20260712",
      "NNODES=8",
      "LOCAL_RANKS=8",
      "OFFLINE_ARB_GPIC_THREADS_PER_NODE=16",
      "OFFLINE_ARB_PREFETCH_STEPS=4",
      "OFFLINE_ARB_WAIT_LOG_THRESHOLD_S=0.000001",
      "OFFLINE_ARB_IO_STATE_EVERY_STEPS=1",
      'OFFLINE_ARB_IO_TELEMETRY_DIR=$TELEM_LOCAL',
      'read -r GPIC_MODE GPIC_THREADS',
      'assert mode in {"strict_path","fd_stable"} and threads == 16',
      '[ "$OFFLINE_ARB_GPIC_THREADS_PER_NODE" = "$GPIC_THREADS" ]',
      '"gpic_threads_per_node": threads',
      "--nproc-per-node \"$LOCAL_RANKS\"",
      "--expected-runner-sha256 \"$PASS_RUNNER_SHA\"",
      "--expected-runtime-contract-sha256 \"$PASS_CONTRACT_SHA\"",
      "--expected-gpic-source-consistency-mode \"$PASS_GPIC_MODE\"",
      "--expected-gpic-threads-per-node \"$OFFLINE_ARB_GPIC_THREADS_PER_NODE\"",
      'empty_artifact_keys = {"training_package_source", "dataline_package_source"}',
      'allow_empty=name in empty_artifact_keys',
      '"namespace_packages": {',
      'POSTFLIGHT_JSON=$RES/freezepost.$JOBTAG.json',
      'CLOSURE_READY=$RES/closure.$JOBTAG.n$NODE_RANK.ready',
      "expected_exactly_8_dataset_jsonl",
      'artifact(Path(run_log_raw), "runner.log")',
      '"offline_arb_w64_raw_supply_node_manifest_v1"',
      '"offline_arb_w64_raw_supply_aggregate_v1"',
      "W64_RAW_SUPPLY_CAPTURE_PASS",
  ):
      if token not in w64_capture:
          raise RuntimeError(f"W64 capture contract token missing: {token}")
  w64_runner = (
      repo / "scripts/offline_arb/run_w64_raw_supply_gate.py"
  ).read_text(encoding="utf-8")
  for token in (
      "EXPECTED_WORLD_SIZE = 64",
      "EXPECTED_LOCAL_WORLD_SIZE = 8",
      "START_STEP = 0",
      "STOP_STEP = 192",
      'backend="gloo"',
      "offline_module.decode_rgb = _decode_is_forbidden",
      "offline_module.resize_u8_to_bucket = _decode_is_forbidden",
      "offline_module.uint8_to_norm_tensor = _decode_is_forbidden",
      "_maintain_bounded_prefetch(dataset)",
      "--expected-runner-sha256",
      "--expected-runtime-contract-sha256",
      "--expected-gpic-source-consistency-mode",
      "--expected-gpic-threads-per-node",
      'GPIC_CONSISTENCY_MODES = frozenset({"strict_path", "fd_stable"})',
      'EMPTY_RUNTIME_ARTIFACT_KEYS = frozenset(',
      '"caption_contract_source"',
      '"training_package_source"',
      '"dataline_package_source"',
      'RUNTIME_NAMESPACE_PACKAGES = {',
      '"before_import"',
      '"after_import"',
      '"before_run"',
      '"after_run"',
      '"after_close"',
      'if observed == expected_window_keys:',
      'value["gpic_threads_per_node"] != 16',
      'int(getattr(dataset, "_gpic_threads_per_node", -1)) != 16',
      '"gpic_threads_per_node": int(dataset._gpic_threads_per_node)',
      "W64_RAW_STEP_RETIRED",
      "W64_RAW_RANK_PASS",
      '"decode_calls": 0',
  ):
      if token not in w64_runner:
          raise RuntimeError(f"W64 raw runner contract token missing: {token}")
  w64_analyzer = (
      repo / "scripts/offline_arb/analyze_w64_raw_supply_gate.py"
  ).read_text(encoding="utf-8")
  for token in (
      'TELEMETRY_SCHEMA = "offline_arb_io_profile_v1"',
      'AGGREGATE_SCHEMA = "offline_arb_w64_raw_supply_aggregate_v1"',
      'MANIFEST_SCHEMA = "offline_arb_w64_raw_supply_node_manifest_v1"',
      'ANALYSIS_SCHEMA = "offline_arb_w64_raw_supply_analysis_v1"',
      "WORLD_SIZE = 64",
      "LOCAL_WORLD_SIZE = 8",
      "NODES = 8",
      "PER_RANK_BS = 36",
      'EXPECTED_PLAN_ID = "stage256_offline_exact_v1_w64_prod"',
      'EXPECTED_DOMAINS = ("anime", "monet_real", "gpic", "synthetic", "textatlas")',
      "STEADY_STEPS = range(40, STOP_STEP)",
      "STEADY_WINDOW_STARTS = range(40, STOP_STEP, PREFETCH_STEPS)",
      "TARGET_SECONDS_PER_STEP = 2.592",
      "CAPACITY_HEADROOM_RATIO = 1.0 / 0.9",
      "WAIT_MEAN_MAX_S = TARGET_SECONDS_PER_STEP * 0.9",
      "WAIT_P95_MAX_S = TARGET_SECONDS_PER_STEP * 2.0",
      "WAIT_MAX_S = TARGET_SECONDS_PER_STEP * 4.0",
      "WAIT_OVER_TARGET_FRACTION_MAX = 0.10",
      "WINDOW_MEAN_MAX_S = PREFETCH_STEPS * TARGET_SECONDS_PER_STEP * 0.9",
      "WINDOW_TAIL_MAX_S = PREFETCH_STEPS * TARGET_SECONDS_PER_STEP * 2.0",
      "FORMAL_STEPS = 166_667",
      'GPIC_CONSISTENCY_MODES = frozenset({"strict_path", "fd_stable"})',
      'EMPTY_RUNTIME_ARTIFACT_KEYS = frozenset(',
      'RUNTIME_NAMESPACE_PACKAGES = {',
      'def validated_jobtag(',
      'def validated_analysis_output(',
      'aggregate_supplied.resolve(strict=True)',
      'analysis_verify_supplied.resolve(strict=True)',
      'def atomic_publish_bytes(',
      'os.link(temporary, path, follow_symlinks=False)',
      'def atomic_no_clobber_self_test(',
      'runtime contract/config GPIC threads-per-node mismatch',
      '"gpic_threads_per_node": 16,',
      'analysis-time full freeze verify',
      "FROZEN_GATE_FILES = (",
      'closure_artifacts: dict[str, tuple[Path, str]] = {',
      'raise ValueError(f"final immutable-evidence closure mismatch: {label}")',
      'status = "PASS" if not failed else "NO_GO"',
      '"status": "FATAL"',
      'return 0 if result["status"] == "PASS" else 3',
  ):
      if token not in w64_analyzer:
          raise RuntimeError(f"W64 analyzer contract token missing: {token}")
  w64_analyze_path = jobs / "offline_arb_w64_raw_supply_analyze.yaml"
  w64_analyze = w64_analyze_path.read_text(encoding="utf-8")
  w64_analyze_value = yaml.safe_load(w64_analyze)
  compile_python_heredocs(w64_analyze_value["command"], "w64-analyze", 1)
  if (
      w64_analyze_value.get("numWorkers") != 1
      or w64_analyze_value.get("gpuPerWorker") != 0
      or w64_analyze_value.get("cpuPerWorker") != 16
      or w64_analyze_value.get("maxRetries") != 0
  ):
      raise RuntimeError("W64 analyzer JCC topology is not strict 1x16-CPU/maxRetries=0")
  for token in (
      "RUN_ID=stage256_offline_exact_w64_raw_supply_gate_20260712",
      "scripts/offline_arb/analyze_w64_raw_supply_gate.py",
      'SOURCE_JOBTAG=${OFFLINE_ARB_W64_SOURCE_JOBTAG:-}',
      "(''|.|..|*[!A-Za-z0-9_.-]*)",
      'RUN_ROOT_REAL=$(realpath -e "$RUN_ROOT")',
      '[ "$RES" = "$RUN_ROOT_REAL/$SOURCE_JOBTAG" ]',
      'w64_raw_supply_analysis.$SOURCE_JOBTAG.$ANALYSIS_JOBTAG.json',
      'analysis_freeze_verify.$SOURCE_JOBTAG.$ANALYSIS_JOBTAG.pre.json',
      'W64_ATOMIC_NO_CLOBBER_SELF_TEST_PASS',
      'from scripts.offline_arb.analyze_w64_raw_supply_gate import atomic_publish_bytes',
      '"gpic_threads_per_node": 16,',
      "--capture-yaml \"$CAPTURE_YAML\"",
      "--analyze-yaml \"$ANALYZE_YAML\"",
      '0: "PASS", 3: "NO_GO"',
      "*) exit 1 ;;",
  ):
      if token not in w64_analyze:
          raise RuntimeError(f"W64 analyzer JCC token missing: {token}")
  if 'find "$RUN_ROOT"' in w64_analyze or "AGGREGATES" in w64_analyze:
      raise RuntimeError("W64 analyzer retry source regressed to ambiguous attempt discovery")
  if '--expected-gpic-source-consistency-mode "strict_path"' in w64_capture:
      raise RuntimeError("W64 capture hardcoded a selector winner instead of frozen config mode")
  if "os.replace" in w64_analyzer:
      raise RuntimeError("W64 analyzer publication regressed to clobbering os.replace")
  if 'closure.open("x"' in w64_analyze:
      raise RuntimeError("W64 analysis closure is visible before its payload is durable")

  from scripts.offline_arb import analyze_w64_raw_supply_gate as w64_analyzer_module
  from scripts.offline_arb import run_w64_raw_supply_gate as w64_runner_module

  expected_w64_runtime_artifacts = {
      "runner",
      "capture_yaml",
      "config",
      "freeze_manifest",
      "preflight_verify",
      "plan_header",
      "plan_checksums",
      "catalog_header",
      "animefreq_header",
      "sidecar_header",
      "sampling",
      "freeze_builder_source",
      "caption_contract_source",
      "training_package_source",
      "dataline_package_source",
      "offline_package_source",
      "dataset_source",
      "planner_source",
      "sidecar_runtime_source",
      "complete_dataset_source",
      "dataline_config_source",
      "image_fetch_source",
      "manifest_index_source",
      "multi_ar_source",
      "native_safety_source",
      "pil_safety_source",
      "caption_build_source",
      "sampler_source",
  }
  expected_empty_runtime_artifacts = {
      "training_package_source",
      "dataline_package_source",
  }
  expected_namespace_packages = {
      "scripts": "scripts",
      "scripts.offline_arb": "scripts/offline_arb",
  }
  if (
      len(expected_w64_runtime_artifacts) != 28
      or w64_runner_module.RUNTIME_ARTIFACT_KEYS != expected_w64_runtime_artifacts
      or w64_analyzer_module.RUNTIME_ARTIFACT_KEYS != expected_w64_runtime_artifacts
      or w64_runner_module.EMPTY_RUNTIME_ARTIFACT_KEYS
      != expected_empty_runtime_artifacts
      or w64_analyzer_module.EMPTY_RUNTIME_ARTIFACT_KEYS
      != expected_empty_runtime_artifacts
      or w64_runner_module.RUNTIME_NAMESPACE_PACKAGES
      != expected_namespace_packages
      or w64_analyzer_module.RUNTIME_NAMESPACE_PACKAGES
      != expected_namespace_packages
  ):
      raise RuntimeError("W64 runner/analyzer recursive runtime closure set drift")
  for key in expected_empty_runtime_artifacts:
      relative = w64_runner_module.RUNTIME_MODULES[key][1]
      path = repo / relative
      if (
          path.stat().st_size != 0
          or hashlib.sha256(path.read_bytes()).hexdigest()
          != "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      ):
          raise RuntimeError(f"W64 zero-byte runtime artifact contract drift: {key}")
  for relative in ("scripts/__init__.py", "scripts/offline_arb/__init__.py"):
      if (repo / relative).exists():
          raise RuntimeError(
