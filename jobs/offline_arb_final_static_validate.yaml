  stamp = "20260712T000000Z"

  def run_case(label, mean_a, mean_b, expected_status, expected_rc):
      run_id = f"gpuval-postmortem-selftest-{label}"
      ckpt = root / label / run_id / "ckpt"
      ckpt.mkdir(parents=True)
      metrics = ckpt / "metrics.jsonl"
      rows = []
      for round_name, steps, base, checkpoint_carried in (
          ("A", range(1, 351), mean_a, 201),
          ("B", range(201, 501), mean_b, 401),
      ):
          for step in steps:
              iter_s = base + (8.0 if step == checkpoint_carried else 0.0)
              wait_s = iter_s * 0.05
              rows.append({
                  "step": step,
                  "iter_s": round(iter_s, 3),
                  "data_wait_s": round(wait_s, 3),
                  "data_wait_frac": round(wait_s / iter_s, 3),
              })
      metrics.write_text(
          "".join(json.dumps(row, sort_keys=True) + "\n" for row in rows),
          encoding="utf-8",
      )
      jobtag = f"selftest-{label}"
      log_a = ckpt.parent / f"train.{jobtag}.rA.n0.{stamp}.log"
      log_b = ckpt.parent / f"train.{jobtag}.rB.n0.{stamp}.log"
      last = ckpt / "last.pt"
      log_a.write_text(
          f"[train] checkpoint saved at step 200 -> {last}\n"
          "[train] step 350/350 loss 1.0 iter 2.5s\n",
          encoding="utf-8",
      )
      log_b.write_text(
          f"[train] resumed from {last} at step 200\n"
          f"[train] checkpoint saved at step 400 -> {last}\n"
          "[train] step 500/500 loss 1.0 iter 2.5s\n",
          encoding="utf-8",
      )
      command = [
          str(repo.parent / "venv-gpu/bin/python"),
          str(repo / "scripts/offline_arb/analyze_gpuval_r6.py"),
          "--metrics", str(metrics),
          "--round-a-log", str(log_a),
          "--round-b-log", str(log_b),
          "--config", str(repo / "configs/stage256_offline_exact_v1.yaml"),
          "--gpuval-yaml", str(repo / "jobs/offline_exact_256_2x8_gpuval.yaml"),
          "--formal-yaml", str(repo / "jobs/offline_exact_256_8x8_FORMAL.yaml"),
          "--run-id", run_id,
          "--formal-world-size", "64",
          "--formal-checkpoint-steps", "3000",
          "--formal-final-save", "true",
          "--setup-budget-s", "1800",
      ]
      result = subprocess.run(command, text=True, capture_output=True, check=False)
      if result.returncode != expected_rc:
          raise RuntimeError(
              f"{label}: rc={result.returncode} expected={expected_rc} stderr={result.stderr}"
          )
      value = json.loads(result.stdout)
      if value.get("status") != expected_status:
          raise RuntimeError(f"{label}: status={value.get('status')} expected={expected_status}")
      print(f"GPUVAL POSTMORTEM SELFTEST PASS case={label} status={expected_status} rc={expected_rc}")

