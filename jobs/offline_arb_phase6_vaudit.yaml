# OFFLINE_ARB_V1 Phase-6 visual-audit tooling only: fetch-free bbox quant, then
# deliberately small five-domain contact sheets.  Streaming ARB is archive-only
# documentary context and is not executed.  Total wall clock is capped below 5400s.
name: evan-mot-crop-offlinearb-p6-vaudit
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 96
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_vaudit_v1
  mkdir -p "$ROOT"
  echo "ROOT=$ROOT host=$(hostname) started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "$ROOT/run_info.txt"

  # 5280s + TERM->KILL 60s leaves scheduler/startup margin inside the 5400s rule.
  timeout --signal=TERM --kill-after=60s 5280s \
    env PY="$PY" ROOT="$ROOT" bash -s <<'PHASE6'
  set -euxo pipefail
  "$PY" -m py_compile scripts/offline_arb/phase6_visual_audit.py
  "$PY" -m unittest scripts.offline_arb.phase6_visual_audit.GeometryFixtureTests -v \
    2>&1 | tee "$ROOT/geometry_tests.log"
  "$PY" scripts/offline_arb/phase6_visual_audit.py quant \
    --config configs/stage256_redesign_naifu_arb_v1.yaml \
    --n-matrix /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_bucketstats_v1/N_matrix.parquet \
    --sample-rows 50000 \
    --face-improvement-gate 0.15 \
    --output-dir "$ROOT" \
    2>&1 | tee "$ROOT/quant.log"
  "$PY" scripts/offline_arb/phase6_visual_audit.py sheets \
    --config configs/stage256_redesign_naifu_arb_v1.yaml \
    --n-matrix /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_bucketstats_v1/N_matrix.parquet \
    --per-band 12 \
    --fetch-workers 8 \
    --output-dir "$ROOT" \
    2>&1 | tee "$ROOT/sheets.log"
  PHASE6
