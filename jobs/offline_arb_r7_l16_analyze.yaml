# JCC-only close for the r7-L16 2x8 diagnostic.  It accepts exactly one
# attempt-bound dual-node aggregate and returns zero only for strict PASS.
name: evan-offarb-r7-l16-analyze
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_arb_r7_l16_analyze.$(hostname)
  mkdir -p "$PYTHONPYCACHEPREFIX"
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  RUN_ID=stage256_offline_exact_2x8_r7_l16_diag_20260712
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  RUN_ROOT=$BASE/$RUN_ID
  PLAN=$BASE/offline_arb_plans_v1/w16_gpuval/plan
  SCRIPT=scripts/offline_arb/analyze_r7_l16_diag.py
  test -d "$RUN_ROOT" && test ! -L "$RUN_ROOT" \
    || { echo "FATAL: r7-L16 run root missing/non-directory"; exit 1; }
  test -d "$PLAN" && test ! -L "$PLAN" \
    || { echo "FATAL: w16 plan missing/non-directory"; exit 1; }
  "$PY" -m py_compile "$SCRIPT"

  mapfile -t AGGREGATES < <(
    find "$RUN_ROOT" -mindepth 2 -maxdepth 2 -type f \
      -name 'telemetry.*.aggregate.json' -print | sort
  )
  [ "${#AGGREGATES[@]}" -eq 1 ] \
    || { echo "FATAL: expected exactly one r7-L16 aggregate, found ${#AGGREGATES[@]}"; exit 1; }
  AGGREGATE=${AGGREGATES[0]}
  test -f "$AGGREGATE" && test ! -L "$AGGREGATE" \
    || { echo "FATAL: aggregate missing/non-regular/symlink"; exit 1; }
  RES=$(dirname "$AGGREGATE")
  JOBTAG=$(basename "$RES")
  case "$JOBTAG" in (""|*/*) echo "FATAL: malformed JOBTAG directory"; exit 1;; esac
  METRICS=$RES/ckpt/metrics.jsonl
  test -f "$METRICS" && test ! -L "$METRICS" \
    || { echo "FATAL: exact rank-0 metrics missing/non-regular"; exit 1; }

  shopt -s nullglob
  LOGS=("$RES"/train."$JOBTAG".rR7.n0.*.log)
  shopt -u nullglob
  [ "${#LOGS[@]}" -eq 1 ] && test -f "${LOGS[0]}" && test ! -L "${LOGS[0]}" \
    || { echo "FATAL: expected exactly one regular node-0 r7 train log"; exit 1; }
  TRAIN_LOG=${LOGS[0]}
  OUTPUT=$RES/r7_l16_analysis.$JOBTAG.json
  test ! -e "$OUTPUT" && test ! -L "$OUTPUT" \
    || { echo "FATAL: refusing to overwrite prior r7-L16 analysis"; exit 1; }

  echo "R7_L16_ANALYZE_START run_id=$RUN_ID jobtag=$JOBTAG aggregate=$AGGREGATE"
  set +e
  "$PY" "$SCRIPT" \
    --aggregate "$AGGREGATE" \
    --metrics "$METRICS" \
    --train-log "$TRAIN_LOG" \
    --plan "$PLAN" \
    --run-id "$RUN_ID" \
    --output "$OUTPUT"
  ANALYZE_RC=$?
  set -e
  [ -f "$OUTPUT" ] && [ ! -L "$OUTPUT" ] \
    || { echo "FATAL: analyzer did not atomically publish output"; exit 1; }

  RESULT_STATUS=$(
    "$PY" - "$OUTPUT" "$RUN_ID" "$JOBTAG" "$AGGREGATE" <<'PYEOF'
  import hashlib
  import json
  import sys
  from pathlib import Path

  output, run_id, jobtag, aggregate = sys.argv[1:]
  value = json.loads(Path(output).read_text(encoding="utf-8"))
  if value.get("schema_version") != "offline_arb_r7_l16_analysis_v1":
      raise SystemExit("FATAL: analysis schema mismatch")
  status = value.get("status")
  if status in {"PASS", "NO_GO"}:
      identity = value.get("identity")
      evidence = value.get("evidence")
      if not isinstance(identity, dict) or not isinstance(evidence, dict):
          raise SystemExit("FATAL: analysis identity/evidence missing")
      if identity.get("run_id") != run_id or identity.get("jobtag") != jobtag:
          raise SystemExit("FATAL: analysis run/JOBTAG binding mismatch")
      if evidence.get("aggregate") != aggregate:
          raise SystemExit("FATAL: analysis aggregate path binding mismatch")
      digest = hashlib.sha256(Path(aggregate).read_bytes()).hexdigest()
      if evidence.get("aggregate_sha256") != digest:
          raise SystemExit("FATAL: analysis aggregate SHA binding mismatch")
  print(status)
  PYEOF
  )
  if [ "$ANALYZE_RC" -eq 0 ] && [ "$RESULT_STATUS" = PASS ]; then
    echo "R7_L16_ANALYSIS_PASS output=$OUTPUT sha256=$(sha256sum "$OUTPUT" | awk '{print $1}')"
    exit 0
  fi
  if [ "$ANALYZE_RC" -eq 3 ] && [ "$RESULT_STATUS" = NO_GO ]; then
    echo "R7_L16_ANALYSIS_NO_GO output=$OUTPUT sha256=$(sha256sum "$OUTPUT" | awk '{print $1}')"
    exit 3
  fi
  echo "FATAL: analyzer rc/status mismatch rc=$ANALYZE_RC status=$RESULT_STATUS output=$OUTPUT"
  exit 1
