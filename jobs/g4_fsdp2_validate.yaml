# G4 FSDP2 多卡验证 job（2 卡，单节点）。
# 提交: jcc job submit jobs/g4_fsdp2_validate.yaml
# 看日志: jcc job log evan-mot-g4-fsdp2 -f
# 资源按 T2 踩坑文档放进单节点（2卡远小于整机，CPU/mem 保守避免 Pending）。
name: evan-mot-g4-fsdp2
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 2
cpuPerWorker: 24
memGBPerWorker: 200
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  mkdir -p /local/evan/cache/huggingface
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  echo "===== STACK PROBE ====="
  nvidia-smi
  $PY -c "import torch; print('torch', torch.__version__, 'cuda', torch.cuda.is_available(), 'ndev', torch.cuda.device_count())"

  # RUN A: nproc=1 FSDP2 baseline（rank_indep；与 RUN B 同 per-GPU batch/同噪声 → 轨迹应吻合）
  echo "===== RUN A: nproc=1 FSDP2 (rank_indep, overfit latents bs4) ====="
  $PY -m torch.distributed.run --nproc_per_node=1 --master_port=29511 \
    train.py --config configs/stage1a_t2i_512.yaml --max-steps 30 \
    dataset.overfit_one=true dataset.mode=latents trainer.batch_size=4 \
    model.rank_independent_seed=true scheduler.num_warmup_steps=2 model.gradient_checkpointing=false \
    trainer.checkpoint_dir=/local/g4_n1 trainer.resume=false trainer.log_every=3

  # RUN B: nproc=2 FSDP2 一致性（rank_indep，同 per-GPU bs4 → 平均梯度=1卡 → loss 应≈RUN A）
  echo "===== RUN B: nproc=2 FSDP2 (rank_indep, same per-GPU bs4, consistency) ====="
  $PY -m torch.distributed.run --nproc_per_node=2 --master_port=29512 \
    train.py --config configs/stage1a_t2i_512.yaml --max-steps 30 \
    dataset.overfit_one=true dataset.mode=latents trainer.batch_size=4 \
    model.rank_independent_seed=true scheduler.num_warmup_steps=2 model.gradient_checkpointing=false \
    trainer.checkpoint_dir=/local/g4_n2 trainer.resume=false trainer.log_every=3

  # RUN C: nproc=2 FSDP2 真实（rank-dependent 噪声 + grad_ckpt，bs32/GPU）→ 吞吐 + 分片显存收益
  echo "===== RUN C: nproc=2 FSDP2 realistic (bs32/GPU, grad_ckpt, throughput+mem) ====="
  $PY -m torch.distributed.run --nproc_per_node=2 --master_port=29513 \
    train.py --config configs/stage1a_t2i_512.yaml --max-steps 25 \
    dataset.overfit_one=true dataset.mode=latents trainer.batch_size=32 \
    scheduler.num_warmup_steps=2 trainer.checkpoint_dir=/local/g4_n2c trainer.resume=false trainer.log_every=5

  echo "===== DONE ====="
