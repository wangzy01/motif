# OFFLINE_ARB_V1 Phase-5 catalog DIAG 冒烟:--max-shards-per-domain 2,全产物带 .diag 后缀
# (脚本保证不可能覆盖正式产物)。目的:taridx 分片 manifest 合并修复(P0-1,2026-07-10)后,
# 验证 monet_real/synthetic 的 tar-join 命中率恢复正常(miss gate 0.1% 在 diag 同样生效)。
# 绿 → 提交全量 offline_arb_phase5_catalog.yaml。
# 前置:offline_arb_tarindex_v1/_SUCCESS(缺失 exit 33)。
name: evan-mot-crop-offlinearb-p5-catalog-diag
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 96
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1
  IDX=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_tarindex_v1
  mkdir -p "$ROOT"
  test -f "$IDX/_SUCCESS" || { echo "FATAL: tarindex _SUCCESS missing, aborting (exit 33)"; exit 33; }
  "$PY" -m py_compile scripts/offline_arb/phase5_build_catalog.py
  RC=0
  set +e
  timeout --signal=TERM --kill-after=60s 5340s \
    "$PY" scripts/offline_arb/phase5_build_catalog.py \
      --config configs/stage256_redesign_naifu_arb_v1.yaml \
      --workers 14 \
      --max-shards-per-domain 2 \
    2>&1 | tee "$ROOT/run_diag.log"
  RC=${PIPESTATUS[0]}
  set -e
  echo "==== OFFLINE_ARB PHASE5 CATALOG-DIAG exit_code=$RC ===="
  GATE_PY='
  import json, sys
  from pathlib import Path
  p = Path(sys.argv[1]) / "N_diff.diag.json"
  if not p.is_file():
      print("GATE: N_diff.diag.json missing"); sys.exit(1)
  with open(p, encoding="utf-8") as f:
      r = json.load(f)
  print("tar_join_by_domain:", json.dumps(r.get("tar_join_by_domain"), indent=2))
  print("reconciliation_pass:", r.get("reconciliation_pass"))
  '
  # RC!=0(miss gate 失败=RC 2)时 N_diff.diag.json 已先落盘——同样打印,这正是最需要尸检的场景
  "$PY" -c "$GATE_PY" "$ROOT" || true
  exit "$RC"
