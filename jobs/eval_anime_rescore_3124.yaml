# Re-score the ALREADY-SAMPLED anime images (eval_anime_pf_4runs/samples) with the
# upgraded tagger (incantor/tagger_3_1_24, auto-fallback 3_1_13) + naifu-aligned
# coverage tiers (cov0/cov50/cov80). No re-sampling (seed-7 images unchanged). CLIP
# re-run too (cheap) for a full table. Single GPU, read-only w.r.t. training.
# Tagger is gated -> needs HF_TOKEN + online (NOT offline) for the tagging step.
name: evan-mot-eval-anime-rescore-3124
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 16
memGBPerWorker: 220
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  export HF_HOME=/local/evan/cache/huggingface TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  set +x
  if [ -f /fsx/evan/.hf_token ]; then export HF_TOKEN=$(tr -d '[:space:]' < /fsx/evan/.hf_token); echo "[token] HF_TOKEN loaded (len=${#HF_TOKEN})"; else echo "[token] NO /fsx/evan/.hf_token -> tagger will fail"; fi
  set -x
  OUT=experiments/results/eval_anime_pf_4runs
  SAMP=$OUT/samples
  RUNS="b1 ab1causal ab2fusion ab3lora"
  mkdir -p /local/evan/cache/huggingface/open_clip $TORCH_HOME $TRITON_CACHE_DIR
  cp -rn /fsx/hf_cache/open_clip/. /local/evan/cache/huggingface/open_clip/ || true
  for r in $RUNS; do echo "  $r: $(ls $SAMP/$r/*.png 2>/dev/null | wc -l) imgs"; done
  nvidia-smi -L || true

  echo "===== RE-SCORE: company tagger (3_1_24 -> 3_1_13 fallback) + CLIP, aligned tiers ====="
  set +e
  timeout 60m $PY experiments/eval/run_prompt_following.py \
    --samples-dir $SAMP --runs $RUNS --tagger-backend company --out-dir $OUT
  echo "[rescore] rc=$?"
  set -e
  echo "===== DONE ====="
  cat $OUT/comparison.md || true
