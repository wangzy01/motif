# stage1a@256 正式训练 — 消融3替补 = B3 去噪声条件（noise_condition=false）。消融指南 §4.3 优先级③。
# 【替补原因】原计划消融1=B1 adapter 因 FSDP2/DTensor bug（arch_mot.py:729 _forward_und 未触发 all-gather）多卡崩，
#   需谨慎代码修复+验证（非无人值守安全项），故先用 B3 填第三槽保持 3 版同时训。B1 修好后可换回。
# B3 = baseline 路径去掉 t_emb 注入（不构造 time_embed），是 working baseline 的子集 → FSDP2 安全。
# 与 baseline 同：1×8 / global 512 / LR 1e-4 / 400k 步 / EMA。独立 checkpoint_dir。
# 提交: jcc job submit jobs/s256_1x8_b3_nonoise.yaml
name: evan-mot-s256-b3-nonoise
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 8
cpuPerWorker: 48
memGBPerWorker: 900
maxRetries: 50
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=6 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUN_ID=s256_1x8_b3nonoise_20260618
  CK=/fsx/evan/checkpoints/mot_pilot_v1/$RUN_ID
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/$RUN_ID
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  mkdir -p "$CK" "$RES"
  { echo "===== B3 去噪声条件 1x8 @256 $(date -u) ====="; hostname; nvidia-smi -L; df -h /fsx/evan | tail -1; } 2>&1 | tee "$RES/probe.log"
  DOTS="trainer.checkpoint_dir=$CK trainer.resume=true dataset.stats_cache=$STATS dataset.anime_cache_dir=/local/evan/anime_img_cache model.noise_condition=false"
  $PY -m torch.distributed.run --nproc_per_node=8 --master_port=29624 \
      train.py --config configs/stage1a_t2i_256.yaml --max-steps 400000 \
      $DOTS 2>&1 | tee "$RES/train.log"
  RC=${PIPESTATUS[0]}; echo "===== B3 exited rc=$RC $(date -u) ====="; exit $RC
