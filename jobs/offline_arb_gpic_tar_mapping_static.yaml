# One-node CPU16 synthetic gate.  It creates only tiny local tar fixtures and
# performs no source-mount reads or writes.
name: evan-mot-crop-offlinearb-gpic-tar-mapping-static
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 16
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  HOST=$(hostname)
  [ "${HOST##*-}" = 0 ] || { echo "FATAL: static must be one worker"; exit 2; }
  JOBTAG=${HOST%-0}
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER=$REPO/scripts/offline_arb/probe_gpic_tar_mapping.py
  TEST=$REPO/scripts/offline_arb/test_gpic_tar_mapping_static.py
  SELF=$REPO/jobs/offline_arb_gpic_tar_mapping_static.yaml
  PROBE_JOB=$REPO/jobs/offline_arb_gpic_tar_mapping_probe.yaml
  ROOT=/local/evan/offline_gpic_tar_mapping_static/$JOBTAG

  for FILE in "$RUNNER" "$TEST" "$SELF" "$PROBE_JOB"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: invalid tar-mapping static input"; exit 2; }
  done
  [ ! -e "$ROOT" ] && [ ! -L "$ROOT" ] \
    || { echo "FATAL: tar-mapping static namespace is not fresh"; exit 2; }
  cleanup() {
    case "$ROOT" in
      /local/evan/offline_gpic_tar_mapping_static/*) rm -rf -- "$ROOT" ;;
      *) echo "FATAL: unsafe static cleanup target" >&2; return 1 ;;
    esac
  }
  trap cleanup EXIT

  "$PY" -m py_compile "$RUNNER" "$TEST"
  timeout --preserve-status --signal=TERM --kill-after=30s 900s \
    "$PY" "$TEST" --root "$ROOT" --probe-job-spec "$PROBE_JOB"
  echo "OFFLINE_GPIC_TAR_MAPPING_STATIC_JCC_PASS"
