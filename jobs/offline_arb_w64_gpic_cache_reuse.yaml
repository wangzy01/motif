# Evidence-only, no-image W64 plan analysis.  It streams one NPZ block at a
# time and places all large temporary node sequences under /local.  It cannot
# authorize FORMAL training; its capacity-limited LRU table is an equal-size,
# deterministic logical-order sensitivity analysis.
name: evan-mot-crop-offlinearb-w64-gpic-cache-reuse
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_arb_w64_gpic_cache_reuse.$(hostname)

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  PLAN=$BASE/offline_arb_plans_v1/w64_prod/plan
  FREEZE=$BASE/offline_arb_plans_v1/FREEZE_MANIFEST.json
  SCRIPT=$REPO/scripts/offline_arb/analyze_w64_gpic_cache_reuse.py
  YAML_SELF=$REPO/jobs/offline_arb_w64_gpic_cache_reuse.yaml
  RUN_ROOT=$BASE/offline_arb_w64_gpic_cache_reuse_v1
  WORK_ROOT=/local/evan/offline_arb_w64_gpic_cache_reuse

  HOST=$(hostname)
  NODE_RANK=${HOST##*-}
  JOBTAG=${HOST%-*}
  [ "$NODE_RANK" = 0 ] && [ "$HOST" = "$JOBTAG-0" ] \
    || { echo "FATAL: expected one-node JCC hostname ending in -0"; exit 21; }
  case "$JOBTAG" in
    (''|.|..|*[!A-Za-z0-9_.-]*) echo "FATAL: unsafe JCC jobtag"; exit 21 ;;
  esac
  [ "$(basename -- "$JOBTAG")" = "$JOBTAG" ] \
    || { echo "FATAL: JCC jobtag is not a basename"; exit 21; }

  for FILE in "$PLAN/header.json" "$PLAN/checksums.json" "$FREEZE" "$SCRIPT" "$YAML_SELF"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] \
      || { echo "FATAL: required regular non-symlink input missing: $FILE"; exit 22; }
  done
  [ -d "$PLAN/blocks" ] && [ ! -L "$PLAN" ] && [ ! -L "$PLAN/blocks" ] \
    || { echo "FATAL: canonical plan directories missing/symlinked"; exit 22; }
  [ "$(find "$PLAN/blocks" -maxdepth 1 -type f -name 'block_*.npz' | wc -l)" = 168 ] \
    || { echo "FATAL: w64 plan does not expose exactly 168 regular NPZ blocks"; exit 22; }
  NW_DECL=$(grep -m1 '^numWorkers:' "$YAML_SELF" | awk '{print $2}')
  GPU_DECL=$(grep -m1 '^gpuPerWorker:' "$YAML_SELF" | awk '{print $2}')
  CPU_DECL=$(grep -m1 '^cpuPerWorker:' "$YAML_SELF" | awk '{print $2}')
  [ "$NW_DECL" = 1 ] && [ "$GPU_DECL" = 0 ] && [ "$CPU_DECL" = 16 ] \
    || { echo "FATAL: job topology declaration drift"; exit 23; }

  mkdir -p "$RUN_ROOT" "$WORK_ROOT" "$PYTHONPYCACHEPREFIX"
  [ -d "$RUN_ROOT" ] && [ ! -L "$RUN_ROOT" ] && [ "$(realpath -e "$RUN_ROOT")" = "$RUN_ROOT" ] \
    || { echo "FATAL: run root must be canonical"; exit 23; }
  ATTEMPT=$RUN_ROOT/$JOBTAG
  mkdir "$ATTEMPT"
  OUTPUT=$ATTEMPT/cache_reuse.$JOBTAG.json
  [ ! -e "$OUTPUT" ] && [ ! -L "$OUTPUT" ] \
    || { echo "FATAL: refusing to overwrite cache-reuse evidence"; exit 24; }

  "$PY" -m py_compile "$SCRIPT"
  timeout --signal=TERM --kill-after=30s 600s \
    "$PY" "$SCRIPT" --self-test --work-root "$WORK_ROOT"

  SCRIPT_SHA_BEFORE=$(sha256sum "$SCRIPT" | awk '{print $1}')
  YAML_SHA_BEFORE=$(sha256sum "$YAML_SELF" | awk '{print $1}')
  FREEZE_SHA_BEFORE=$(sha256sum "$FREEZE" | awk '{print $1}')
  HEADER_SHA_BEFORE=$(sha256sum "$PLAN/header.json" | awk '{print $1}')
  CHECKSUMS_SHA_BEFORE=$(sha256sum "$PLAN/checksums.json" | awk '{print $1}')

  timeout --signal=TERM --kill-after=60s 21600s \
    "$PY" "$SCRIPT" \
      --plan-root "$PLAN" \
      --freeze "$FREEZE" \
      --job-yaml "$YAML_SELF" \
      --output "$OUTPUT" \
      --work-root "$WORK_ROOT" \
      --workers 8 \
      --worker-timeout-s 14400 \
      --average-object-bytes 65536,131072,262144,524288,1048576,2097152,4194304,8388608

  [ -f "$OUTPUT" ] && [ ! -L "$OUTPUT" ] && [ -s "$OUTPUT" ] \
    || { echo "FATAL: analyzer did not atomically publish output"; exit 25; }
  [ "$(sha256sum "$SCRIPT" | awk '{print $1}')" = "$SCRIPT_SHA_BEFORE" ] \
    && [ "$(sha256sum "$YAML_SELF" | awk '{print $1}')" = "$YAML_SHA_BEFORE" ] \
    && [ "$(sha256sum "$FREEZE" | awk '{print $1}')" = "$FREEZE_SHA_BEFORE" ] \
    && [ "$(sha256sum "$PLAN/header.json" | awk '{print $1}')" = "$HEADER_SHA_BEFORE" ] \
    && [ "$(sha256sum "$PLAN/checksums.json" | awk '{print $1}')" = "$CHECKSUMS_SHA_BEFORE" ] \
    || { echo "FATAL: bound source/plan inputs changed during analysis"; exit 26; }

  "$PY" - "$OUTPUT" <<'PYEOF'
  import hashlib
  import json
  import sys
  from pathlib import Path

  path = Path(sys.argv[1])
  payload = path.read_bytes()
  result = json.loads(payload)
  def require(condition, message):
      if not condition:
          raise SystemExit(f"FATAL: {message}")

  require(result.get("schema_version") == "offline_arb_w64_gpic_node_cache_reuse_v1", "schema drift")
  require(result.get("status") == "PASS", "analysis is not PASS")
  require(result["scope"]["formal_steps"] == {
      "start_inclusive": 0,
      "stop_exclusive": 166667,
      "count": 166667,
  }, "formal step interval drift")
  require(result["scope"]["formal_global_exposures"] == 384000768, "formal exposure drift")
  require(result["scope"]["image_payload_reads"] == 0, "image payload read contract drift")
  require(result["inputs"]["all_plan_blocks_sha256_verified"] is True, "block SHA verification absent")
  require(result["inputs"]["all_plan_block_count"] == 168, "block count drift")
  require(result["inputs"]["formal_array_blocks_streamed"] == 163, "formal streamed block count drift")
  require(result["inputs"]["formal_array_block_index_range_inclusive"] == [0, 162], "formal block range drift")
  require(len(result["gpic_results"]["per_rank"]) == 64, "rank result count drift")
  require(len(result["gpic_results"]["per_node"]) == 8, "node result count drift")
  print(json.dumps({
      "status": "PASS",
      "output": str(path),
      "output_sha256": hashlib.sha256(payload).hexdigest(),
      "gpic_exposures": result["gpic_results"]["total_exposures"],
      "global_unique_gpic": result["gpic_results"]["global_unique_row_ids"],
  }, sort_keys=True))
  PYEOF
