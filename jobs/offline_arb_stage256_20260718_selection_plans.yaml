# Build overlay-aware OFFLINE_ARB_V1 selection plans for W8 smoke and W64 formal.
# The semantic materializer consumes these immutable schedules and substitutes
# only catalog row selection; bucket/domain quotas and multi-AR stay unchanged.
name: evan-offarb-s256-20260718-selection-plans-v1
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  CACHE_TAG=${JCC_JOB_ID:-${JOB_ID:-manual}}
  export PYTHONPYCACHEPREFIX="/local/evan/stage256_20260718_pycache/$CACHE_TAG/$(hostname)"
  mkdir -p "$PYTHONPYCACHEPREFIX"
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=8 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  RUN_ID=stage256_20260718_causalmlf_offline_exact_v1
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ROOT=$BASE/offline_arb_stage256_20260718_semantic_v1
  CAT=$BASE/offline_arb_catalog_v1
  CFG=configs/stage256_20260718_causalmlf_offline_exact_v1.yaml
  OVERLAY=$ROOT/overlay
  SAMPLING=/fsx/evan/mot_code/data_analysis/configs/t5_sampling_redesign_v1.json
  RECEIPT=$ROOT/SELECTION_PLANS_SUCCESS.json

  test -f "$ROOT/OVERLAY_VERIFY_SUCCESS.json" && test ! -L "$ROOT/OVERLAY_VERIFY_SUCCESS.json"
  test -f "$CAT/header.json" && test ! -L "$CAT/header.json"
  test -f "$OVERLAY/header.json" && test ! -L "$OVERLAY/header.json"
  test -f "$OVERLAY/_SUCCESS" && test ! -L "$OVERLAY/_SUCCESS"
  test -f "$CFG" && test ! -L "$CFG"
  test ! -e "$RECEIPT" && test ! -L "$RECEIPT" \
    || { echo "FATAL: selection plan receipt already exists"; exit 40; }
  "$PY" -m py_compile \
    scripts/offline_arb/make_stage256_semantic_planner_input.py \
    scripts/offline_arb/build_plan.py \
    scripts/offline_arb/validate_plan.py

  build_one() {
    local TAG=$1 W=$2 BS=$3 H=$4
    local DIR=$ROOT/$TAG
    local INPUT=$DIR/planner_input.json
    local BINDING=$DIR/planner_input_binding.json
    local PLAN=$DIR/selection_plan
    local REPORT=$DIR/selection_validate_report.json
    test ! -e "$DIR" && test ! -L "$DIR" \
      || { echo "FATAL: create-once selection leaf exists: $DIR"; exit 40; }
    mkdir -p "$DIR"
    "$PY" scripts/offline_arb/make_stage256_semantic_planner_input.py \
      --overlay "$OVERLAY" \
      --catalog-header "$CAT/header.json" \
      --sampling-config "$SAMPLING" \
      --config "$CFG" \
      --total-steps "$H" --world-size "$W" --per-rank-bs "$BS" \
      --seed 20260718 \
      --plan-id "${RUN_ID}_${TAG}_selection" \
      --output "$INPUT" --binding-output "$BINDING"
    "$PY" scripts/offline_arb/build_plan.py --input "$INPUT" --out "$PLAN"
    "$PY" scripts/offline_arb/validate_plan.py \
      --input "$INPUT" --plan "$PLAN" --report "$REPORT"
    test -f "$PLAN/header.json" && test -f "$PLAN/checksums.json" && test -f "$REPORT"
  }

  # 32 steps provides margin beyond the exact 3-step smoke while remaining tiny.
  build_one w8_smoke 8 36 32
  build_one w64_prod 64 36 166667

  "$PY" - "$ROOT" "$RECEIPT" "$RUN_ID" <<'PYEOF'
  import hashlib, json, os, pathlib, sys
  root, output, run_id = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3]
  plans = {}
  for tag, world, steps in (("w8_smoke", 8, 32), ("w64_prod", 64, 166667)):
      plan = root / tag / "selection_plan"
      header_path = plan / "header.json"
      checksums_path = plan / "checksums.json"
      binding_path = root / tag / "planner_input_binding.json"
      header = json.load(open(header_path, encoding="utf-8"))
      assert int(header["world_size"]) == world, header
      assert int(header["per_rank_bs"]) == 36, header
      assert int(header["total_steps"]) == steps, header
      plans[tag] = {
          "header_sha256": hashlib.sha256(header_path.read_bytes()).hexdigest(),
          "checksums_sha256": hashlib.sha256(checksums_path.read_bytes()).hexdigest(),
          "planner_input_binding_sha256": hashlib.sha256(binding_path.read_bytes()).hexdigest(),
          "world_size": world,
          "per_rank_bs": 36,
          "total_steps": steps,
      }
  value = {"status": "PASS", "run_id": run_id, "plans": plans}
  flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL
  fd = os.open(output, flags, 0o444)
  with os.fdopen(fd, "w", encoding="utf-8") as f:
      json.dump(value, f, indent=2, sort_keys=True); f.write("\n"); f.flush(); os.fsync(f.fileno())
  print(json.dumps(value, indent=2, sort_keys=True))
  PYEOF
