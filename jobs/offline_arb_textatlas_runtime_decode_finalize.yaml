name: evan-offarb-textatlas-runtime-decode-finalize
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_arb_textatlas_runtime_finalize.$(hostname)
  mkdir -p "$PYTHONPYCACHEPREFIX"
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_textatlas_full_strict_decode_audit_v1
  RESULT=$ROOT/runtime_policy_reclassification.json
  for INDEX in $(seq 0 3); do
    test -f "$ROOT/_RUNTIME_RECHECK_SHARD_${INDEX}_SUCCESS" \
      && test -f "$ROOT/runtime_recheck_shard_${INDEX}.json" \
      || { echo "FATAL: runtime recheck shard $INDEX incomplete"; exit 34; }
  done
  test ! -e "$RESULT" || { echo "FATAL: immutable output exists: $RESULT"; exit 34; }
  "$PY" -m py_compile scripts/offline_arb/finalize_textatlas_runtime_decode_recheck.py
  "$PY" scripts/offline_arb/finalize_textatlas_runtime_decode_recheck.py \
    --root "$ROOT" \
    --audit "$ROOT/integrity_audit.json" \
    --neutral-suggestion "$ROOT/frozen_neutral_skip_suggestion.json" \
    --bindings "$ROOT/repaired_payload_bindings.json" \
    --image-fetch training/dataline/image_fetch.py \
    --shard-count 4 --historical-progress-step 52940 \
    --output "$RESULT"
  sha256sum "$RESULT" > "$RESULT.sha256"
  touch "$ROOT/_RUNTIME_POLICY_RECLASSIFICATION_SUCCESS"
