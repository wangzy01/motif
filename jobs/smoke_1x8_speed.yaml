# 1×8 单节点速度探针：实测 8-GPU NVLink 每步时间（验证"1×8 比 4×8 划算"的唯一未实测数）。
# 单机不需要跨节点 rendezvous，直接 torchrun --nproc_per_node=8。~15 步即可读稳态。
# 提交: jcc job submit jobs/smoke_1x8_speed.yaml ; 日志: jcc job log evan-mot-1x8-smoke -p all -n 80
name: evan-mot-1x8-smoke
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 8
cpuPerWorker: 48
memGBPerWorker: 900
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=6 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  CK=/local/evan/mot_1x8_smoke; rm -rf $CK; mkdir -p $CK
  echo "===== 1x8 SPEED SMOKE $(date -u) ====="; hostname; nvidia-smi -L | head -1
  timeout 20m $PY -m torch.distributed.run --nproc_per_node=8 --master_port=29611 \
    train.py --config configs/stage1a_t2i_256.yaml --max-steps 15 \
    trainer.save_final=false trainer.checkpoint_steps=0 trainer.log_every=1 \
    trainer.checkpoint_dir=$CK trainer.resume=false \
    dataset.stats_cache=$STATS dataset.anime_cache_dir=/local/evan/anime_img_cache 2>&1
  echo "===== 1x8 SMOKE DONE $(date -u) ====="
