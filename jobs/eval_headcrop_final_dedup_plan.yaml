name: evan-hc-final-plan
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 2
memGBPerWorker: 8
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  ROOT=/fsx/evan/mot_code/data_analysis/outputs
  MAIN="$ROOT/headcrop_matrix_now_comprehensive"
  SHARDS="$ROOT/headcrop_matrix_now_shards"
  OUT="$MAIN/final_subagent_batches"
  MANIFEST_LIST="$MAIN/final_dedup_manifests.txt"
  IMAGE_LIST="$MAIN/final_dedup_images.txt"
  : > "$MANIFEST_LIST"

  for label in anime_tag13_square anime_nl_plain13_square anime_nl_emph13_square real12_square; do
    p="$MAIN/$label/512x512/sample_manifest.json"
    test -s "$p"
    echo "$p" >> "$MANIFEST_LIST"
  done
  for label in anime_tag13_ar anime_nl_plain13_ar anime_nl_emph13_ar real12_ar; do
    p="$MAIN/$label/416x624/sample_manifest.json"
    test -s "$p"
    echo "$p" >> "$MANIFEST_LIST"
  done
  for wh in 624x416 384x688 688x384; do
    for label in anime_tag13_ar anime_nl_plain13_ar anime_nl_emph13_ar real12_ar; do
      p="$SHARDS/$wh/$label/$wh/sample_manifest.json"
      test -s "$p"
      echo "$p" >> "$MANIFEST_LIST"
    done
  done

  if [ "$(wc -l < "$MANIFEST_LIST")" -ne 20 ]; then
    echo "expected 20 manifests" >&2
    cat "$MANIFEST_LIST" >&2
    exit 2
  fi

  $PY experiments/eval/plan_headcrop_subagent_batches.py --manifests $(cat "$MANIFEST_LIST") --out-dir "$OUT" --batch-size 18
  find "$OUT" -name 'batch_*.json' | sort > "$MAIN/final_batch_jsons.txt"
  find "$OUT" -name 'batch_*.md' | sort > "$MAIN/final_batch_mds.txt"
  find "$MAIN" "$SHARDS" -name '*.png' | sort > "$IMAGE_LIST"
  echo "final_manifest_count=$(wc -l < "$MANIFEST_LIST")"
  echo "available_png_count=$(wc -l < "$IMAGE_LIST")"
  echo "final_batch_plan=$OUT/subagent_batch_plan.json"
