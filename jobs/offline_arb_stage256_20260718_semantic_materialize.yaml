# Materialize W8/W64 semantic plans from immutable selection schedules and the
# verified Stage256 overlay.  This rewrites multi-GB plan blocks on CPU JCC.
name: evan-offarb-s256-20260718-semantic-materialize-v1
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 192
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  CACHE_TAG=${JCC_JOB_ID:-${JOB_ID:-manual}}
  export PYTHONPYCACHEPREFIX="/local/evan/stage256_20260718_pycache/$CACHE_TAG/$(hostname)"
  mkdir -p "$PYTHONPYCACHEPREFIX"
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=8 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=8
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  RUN_ID=stage256_20260718_causalmlf_offline_exact_v1
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ROOT=$BASE/offline_arb_stage256_20260718_semantic_v1
  OVERLAY=$ROOT/overlay
  CAT=$BASE/offline_arb_catalog_v1
  BASE_PLAN=$BASE/offline_arb_plans_v1/w64_prod/plan
  SAMPLING=/fsx/evan/mot_code/data_analysis/configs/t5_sampling_redesign_v1.json
  SCRIPT=scripts/offline_arb/materialize_semantic_plan.py
  RECEIPT=$ROOT/SEMANTIC_MATERIALIZE_SUCCESS.json

  test -f "$ROOT/OVERLAY_VERIFY_SUCCESS.json" && test ! -L "$ROOT/OVERLAY_VERIFY_SUCCESS.json"
  test -f "$ROOT/SELECTION_PLANS_SUCCESS.json" && test ! -L "$ROOT/SELECTION_PLANS_SUCCESS.json"
  test -f "$SCRIPT" && test ! -L "$SCRIPT"
  test ! -e "$RECEIPT" && test ! -L "$RECEIPT" \
    || { echo "FATAL: semantic materialization receipt already exists"; exit 40; }
  "$PY" -m py_compile "$SCRIPT"

  materialize_one() {
    local TAG=$1
    local PREFIX_STEPS=$2
    local SELECT=$ROOT/$TAG/selection_plan
    local OUT=$ROOT/$TAG/plan
    test -f "$SELECT/header.json" && test ! -L "$SELECT/header.json"
    test ! -e "$OUT" && test ! -L "$OUT" \
      || { echo "FATAL: create-once semantic plan leaf exists: $OUT"; exit 40; }
    timeout --signal=TERM --kill-after=60s 14400s \
      "$PY" "$SCRIPT" \
        --base-plan "$BASE_PLAN" \
        --selection-plan "$SELECT" \
        --overlay "$OVERLAY" \
        --catalog-root "$CAT" \
        --sampling-config "$SAMPLING" \
        --output "$OUT" \
        --plan-id "${RUN_ID}_${TAG}_semantic" \
        --formal-prefix-steps "$PREFIX_STEPS"
    test -f "$OUT/header.json" && test -f "$OUT/checksums.json"
    test -f "$OUT/MATERIALIZE_SUCCESS.json" && test ! -L "$OUT/MATERIALIZE_SUCCESS.json"
  }

  materialize_one w8_smoke 3
  materialize_one w64_prod 166667

  "$PY" - "$ROOT" "$RECEIPT" "$RUN_ID" <<'PYEOF'
  import hashlib, json, os, pathlib, sys
  root, output, run_id = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]), sys.argv[3]
  plans = {}
  for tag in ("w8_smoke", "w64_prod"):
      plan = root / tag / "plan"
      proof_path = plan / "MATERIALIZE_SUCCESS.json"
      proof = json.load(open(proof_path, encoding="utf-8"))
      assert proof.get("status") == "PASS", proof
      plans[tag] = {
          "header_sha256": hashlib.sha256((plan / "header.json").read_bytes()).hexdigest(),
          "checksums_sha256": hashlib.sha256((plan / "checksums.json").read_bytes()).hexdigest(),
          "materialize_success_sha256": hashlib.sha256(proof_path.read_bytes()).hexdigest(),
          "tag_only_exposure": 0,
      }
  value = {
      "status": "PASS", "run_id": run_id, "tag_only_exposure": 0, "plans": plans,
  }
  fd = os.open(output, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o444)
  with os.fdopen(fd, "w", encoding="utf-8") as f:
      json.dump(value, f, indent=2, sort_keys=True); f.write("\n"); f.flush(); os.fsync(f.fileno())
  print(json.dumps(value, indent=2, sort_keys=True))
  PYEOF
