# Patch exact build jobtag and frozen source/partition modes only after all
# eight builder worker receipts are durable.  This job never writes S3 success.
name: evan-mot-crop-offlinearb-gpic-s3-production-coordinate
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1

  [ "${HOSTNAME##*-}" = 0 ] || { echo "FATAL: coordinator must be one worker"; exit 2; }
  SOURCE_BUILD_JOBTAG=evan-mot-crop-offlinearb-gpic-s3-production-build-zg8g
  PARTITION_MODE=shard_modulo
  SOURCE_MODE=tar_sequential
  [ -n "$SOURCE_BUILD_JOBTAG" ] && [ "$SOURCE_BUILD_JOBTAG" != latest ] \
    || { echo "FATAL: patch exact SOURCE_BUILD_JOBTAG"; exit 2; }
  [ -n "$PARTITION_MODE" ] && [ -n "$SOURCE_MODE" ] \
    || { echo "FATAL: patch frozen partition/source modes"; exit 2; }

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER=$REPO/scripts/offline_arb/coordinate_offline_gpic_s3_production.py
  BUILDER=$REPO/scripts/offline_arb/build_offline_gpic_s3_production.py
  TAR_SOURCE=$REPO/scripts/offline_arb/offline_gpic_tar_sequential.py
  BUILDER_JOB=$REPO/jobs/offline_arb_gpic_s3_production_build.yaml
  SELF=$REPO/jobs/offline_arb_gpic_s3_production_coordinate.yaml
  CATALOG=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ARTIFACT_ROOT=$BASE/offline_gpic_blob_v1_production/$SOURCE_BUILD_JOBTAG
  COORD_ROOT=$BASE/offline_gpic_blob_v1_production_coord/$SOURCE_BUILD_JOBTAG
  S3_ROOT=/s3/evan/artifacts/offline_gpic_blob_v1/$SOURCE_BUILD_JOBTAG
  TOPOLOGY=$BASE/offline_arb_local_topology_v1/evan-mot-crop-offlinearb-local-topology-94ns/summary.json
  for FILE in "$RUNNER" "$BUILDER" "$TAR_SOURCE" "$BUILDER_JOB" "$SELF" \
              "$ARTIFACT_ROOT/workers/worker-0/_SUCCESS" \
              "$COORD_ROOT/UPLOAD_APPROVED.json" "$S3_ROOT/_INIT.json"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: invalid coordinator input"; exit 2; }
  done
  "$PY" -m py_compile "$RUNNER" "$BUILDER" "$TAR_SOURCE"
  timeout --preserve-status --signal=TERM --kill-after=60s 43200s \
    "$PY" "$RUNNER" \
      --artifact-root "$ARTIFACT_ROOT" --coord-root "$COORD_ROOT" \
      --s3-root "$S3_ROOT" --catalog-root "$CATALOG" \
      --topology-summary "$TOPOLOGY" \
      --topology-jobtag evan-mot-crop-offlinearb-local-topology-94ns \
      --topology-summary-raw-sha256 27c48e9d6438d992fa850a0da9192c7043ccb6714e65ffa33460a755b4c5d73a \
      --build-jobtag "$SOURCE_BUILD_JOBTAG" \
      --builder-runner "$BUILDER" --builder-job-spec "$BUILDER_JOB" \
      --job-spec "$SELF" --workers 8 --gpic-rows 20000000 \
      --partition-mode "$PARTITION_MODE" --source-mode "$SOURCE_MODE" \
      --source-prefix /s3-mewtant-raw-datasets/stanford-vision-lab/gpic_umziped/images/train/ \
      --blob-target-bytes 4294967296 \
      --max-local-bytes-per-worker 1000000000000 \
      --max-source-archive-bytes-per-worker 1800000000000 \
      --max-s3-bytes-per-worker 399875000000 \
      --max-s3-payload-bytes 3199000000000 \
      --max-s3-total-bytes 3200000000000 \
      --s3-controls-reserve-bytes 1000000000 \
      --max-fsx-incremental-bytes 50000000000 \
      --max-byte-imbalance 1.10 --wait-timeout-seconds 43200 \
      --production-gate
  echo "OFFLINE_GPIC_S3_PRODUCTION_COORDINATE_JCC_PASS build_jobtag=$SOURCE_BUILD_JOBTAG"
