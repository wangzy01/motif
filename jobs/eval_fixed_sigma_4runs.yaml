# Phase-1 leg 3/3 (AUXILIARY per Evan): fixed-sigma MSE grid for the 4 running runs.
# Removes the noise-shift / sigma confound: identical eval batch + fixed noise + fixed
# sigma grid; lower curve = better. Expected to be near-identical across ablations
# (prior eval: 0.13% spread) -> auxiliary signal only, NOT the go/no-go decider.
# Each run uses its own training base config + exact ablation switches; sampling_config
# is pinned to the SAME 4-domain JSON so the anime eval batch is byte-identical across runs.
# Single GPU, read-only w.r.t. training.
name: evan-mot-eval-fixed-sigma-4runs
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 16
memGBPerWorker: 220
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  export HF_HOME=/local/evan/cache/huggingface TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  mkdir -p $HF_HOME $TORCH_HOME $TRITON_CACHE_DIR /local/evan/anime_img_cache
  OUT=experiments/results/eval_fixed_sigma_4runs
  mkdir -p $OUT
  CKR=/fsx/evan/checkpoints/mot_pilot_v1
  SC=/fsx/evan/mot_code/data_analysis/configs/t5_sampling_complete_v1.json   # 4-domain, identical batch across runs
  CV1=configs/stage1a_t2i_256.yaml
  CV2=configs/stage1a_t2i_256_v2.yaml
  nvidia-smi -L || true

  run_fs () { # $1=key $2=config $3=ckpt_subdir ; $4.. = ablation overrides
    local key=$1 cfg=$2 sub=$3; shift 3
    echo "===== fixed-sigma $key ====="
    HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 25m $PY experiments/exp_scripts/fixed_sigma_eval.py \
      --config $cfg --ckpt $CKR/$sub/last.pt --resolution 256 --shift-label $key \
      --out $OUT/fixed_sigma_$key.json --weights ema --seed 1234 \
      --overrides dataset.sampling_config=$SC "$@" || echo "[fs] $key FAILED rc=$?"
  }
  run_fs b1        $CV1 s256_1x8_b1adapter_20260618   model.text_adapter.enabled=true model.text_adapter.bidirectional=true
  run_fs ab1causal $CV2 s256v2_2x8_ab1causal_20260623 model.text_adapter.enabled=true model.text_adapter.bidirectional=false
  run_fs ab2fusion $CV2 s256v2_2x8_ab2fusion_20260623 model.text_adapter.enabled=true model.text_adapter.multi_layer_fusion.enabled=true
  run_fs ab3lora   $CV2 s256v2_2x8_ab3lora_20260623   model.und_lora.enabled=true

  echo "===== SUMMARY (mean_loss_over_grid; lower=better, expect near-identical) ====="
  for k in b1 ab1causal ab2fusion ab3lora; do
    echo "--- $k ---"
    cat $OUT/fixed_sigma_$k.json 2>/dev/null || echo "  (missing $k)"
  done
