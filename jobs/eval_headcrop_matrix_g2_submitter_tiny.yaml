name: evan-mot-eval-headcrop-matrix-g2-submitter-tiny
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 1
memGBPerWorker: 1
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  JCC=/fsx/evan/bin/jcc
  G2=/fsx/evan/checkpoints/mot_pilot_v1/redesign_512a_gates/gate_g2.pt
  OUT=/fsx/evan/mot_code/data_analysis/outputs/headcrop_matrix_g2
  STATE=/fsx/evan/mot_code/data_analysis/outputs/headcrop_matrix_g2_submitter_tiny.state
  LOG=/fsx/evan/mot_code/data_analysis/outputs/headcrop_matrix_g2_submitter_tiny.log
  mkdir -p "$(dirname "$STATE")"
  log(){ echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*" | tee -a "$LOG"; }
  if [ -s "$STATE" ]; then log "state exists: $(cat "$STATE")"; exit 0; fi
  if [ -s "$OUT/all_images.txt" ]; then
    log "matrix output already exists; not submitting"
    echo "already_done $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$STATE"
    exit 0
  fi
  deadline=$(( $(date +%s) + 60*60*12 ))
  log "watching for $G2 (deadline 12h)"
  while [ "$(date +%s)" -lt "$deadline" ]; do
    if [ -s "$G2" ]; then
      log "found gate_g2: $(ls -lh "$G2")"
      out=$("$JCC" job submit jobs/eval_headcrop_matrix_g2.yaml 2>&1)
      rc=$?
      log "submit rc=$rc -> $out"
      if [ "$rc" -eq 0 ]; then
        echo "submitted $(date -u +%Y-%m-%dT%H:%M:%SZ) $out" > "$STATE"
        exit 0
      fi
      exit "$rc"
    fi
    log "gate_g2 not ready; sleep 300s"
    sleep 300
  done
  log "deadline reached without gate_g2"
  exit 2
