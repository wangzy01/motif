# Eight-node CPU16 GPIC source->/local staging->Mountpoint-S3 scale probe.
# 4 mutually exclusive arms x 100k rows/worker = 3.2M main source reads; only
# the two B arms write blobs (1.6M rows).  A larger confirmation is deliberately
# not authorized here: it needs a separate storage/backend decision.
# Do not edit this YAML after submission until the exact-jobtag analyzer closes.
name: evan-mot-crop-offlinearb-gpic-scale-probe
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 8
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_gpic_scale.$(hostname)
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  HOST=$(hostname)
  NODE_RANK=${HOST##*-}
  JOBTAG=${HOST%-*}
  case "$NODE_RANK" in 0|1|2|3|4|5|6|7) ;; *) echo "FATAL: invalid 8-worker rank"; exit 2 ;; esac
  [ "$HOST" = "$JOBTAG-$NODE_RANK" ] || { echo "FATAL: hostname/jobtag mapping drift"; exit 2; }

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER=$REPO/scripts/offline_arb/run_offline_gpic_scale_probe.py
  PUBLISHER=$REPO/scripts/offline_arb/run_offline_gpic_blob_pilot.py
  SELF=$REPO/jobs/offline_arb_gpic_scale_probe.yaml
  CATALOG=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  RUN_ID=offline_gpic_scale_probe_20260712v1
  ARTIFACT_PREFIX=$BASE/$RUN_ID
  COORD_PREFIX=$BASE/${RUN_ID}_coord
  LOCAL_PREFIX=/local/evan/offline_gpic_scale_probe_20260712v1
  S3_PREFIX=/s3/evan/offline_gpic_scale_probe_20260712v1
  TOPOLOGY=$BASE/offline_arb_local_topology_v1/evan-mot-crop-offlinearb-local-topology-94ns/summary.json

  for FILE in "$RUNNER" "$PUBLISHER" "$SELF" "$CATALOG/header.json" "$CATALOG/gpic.parquet" "$TOPOLOGY"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: invalid scale-probe input"; exit 2; }
  done
  mkdir -m 700 -p "$ARTIFACT_PREFIX" "$COORD_PREFIX" "$LOCAL_PREFIX" "$S3_PREFIX" "$PYTHONPYCACHEPREFIX"
  "$PY" -m py_compile "$RUNNER"

  timeout --preserve-status --signal=TERM --kill-after=30s 21600s \
    "$PY" "$RUNNER" \
      --catalog-root "$CATALOG" \
      --artifact-prefix "$ARTIFACT_PREFIX" \
      --coord-prefix "$COORD_PREFIX" \
      --local-prefix "$LOCAL_PREFIX" \
      --s3-prefix "$S3_PREFIX" \
      --topology-summary "$TOPOLOGY" \
      --topology-jobtag evan-mot-crop-offlinearb-local-topology-94ns \
      --topology-summary-raw-sha256 27c48e9d6438d992fa850a0da9192c7043ccb6714e65ffa33460a755b4c5d73a \
      --jobtag "$JOBTAG" \
      --worker-id "$NODE_RANK" \
      --workers 8 \
      --main-rows 400000 \
      --control-rows-per-arm 60000 \
      --exclude-build-rows 100000 \
      --exclude-scan-rows 40000 \
      --source-prefix /s3-mewtant-raw-datasets/stanford-vision-lab/gpic_umziped/images/train/ \
      --source-threads 32 \
      --source-attempts 3 \
      --source-block-bytes 1048576 \
      --retry-base-seconds 0.25 \
      --blob-target-bytes 4294967296 \
      --max-s3-bytes-per-worker 31000000000 \
      --max-local-staging-bytes-per-worker 8589934592 \
      --max-fsx-evidence-bytes-per-worker 134217728 \
      --local-free-floor-bytes 1000000000000 \
      --full-partition-local-budget-bytes 500000000000 \
      --telemetry-interval-seconds 60 \
      --barrier-timeout-seconds 10800 \
      --max-byte-imbalance 1.10 \
      --write-authority offline-gpic-scale-probe-v1-write-authorized \
      --job-spec "$SELF" \
      --production-shape

  echo "OFFLINE_GPIC_SCALE_PROBE_JCC_PASS jobtag=$JOBTAG worker=$NODE_RANK"
