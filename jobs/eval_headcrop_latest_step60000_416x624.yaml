name: evan-hc-latest60-416x624
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 8
memGBPerWorker: 160
maxRetries: 0
command: |
  set -euo pipefail
  set -x
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  export HF_HOME=/local/evan/cache/huggingface TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  mkdir -p "$HF_HOME" "$TORCH_HOME" "$TRITON_CACHE_DIR"
  export RD512A_LATEST_CKPT=/fsx/evan/checkpoints/mot_pilot_v1/redesign_512a_multiar_anchor_global1536_20260705/step_60000.pt
  export RD512A_LATEST_MIN_STEP=60000
  BASE=/fsx/evan/mot_code/data_analysis/outputs/headcrop_latest_step60000_20260708
  TAG13=/fsx/evan/mot_code/data_analysis/configs/anime_evalset_tag13_headcrop.jsonl
  NL13=/fsx/evan/mot_code/data_analysis/configs/anime_evalset_nl13_headcrop.jsonl
  NLPLAIN=experiments/eval/prompts/anime_evalset_nl13_plain_headcrop.jsonl
  REAL12=experiments/eval/prompts/real_headcrop_12.jsonl
  COMMON="--runs rd512a_latest --steps 64 --cfg 4.0 --seeds 7 1007 --weights ema --batch-size 4 --out-dir $BASE"
  $PY -m py_compile experiments/eval/sample_headcrop_matrix.py
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 120m $PY experiments/eval/sample_headcrop_matrix.py $COMMON --evalset "$TAG13"    --label anime_tag13_ar      --width 416 --height 624
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 120m $PY experiments/eval/sample_headcrop_matrix.py $COMMON --evalset "$NLPLAIN" --label anime_nl_plain13_ar --width 416 --height 624
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 120m $PY experiments/eval/sample_headcrop_matrix.py $COMMON --evalset "$NL13"     --label anime_nl_emph13_ar  --width 416 --height 624
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 120m $PY experiments/eval/sample_headcrop_matrix.py $COMMON --evalset "$REAL12"   --label real12_ar           --width 416 --height 624
  echo DONE 416x624
