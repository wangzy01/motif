# EXP5 — checkpoint / resume / 故障恢复 演练（2×H100 FSDP2）。分段：跑→存→重启续→存→再续→存，
# 然后验证 optimizer/scheduler/EMA/global_step/metrics 连续性、ckpt 跨 stage 可加载。
# 提交: jcc job submit jobs/exp5_resume.yaml ; 日志: jcc job log evan-mot-exp5-resume -p all -n 400
name: evan-mot-exp5-resume
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 2
cpuPerWorker: 48
memGBPerWorker: 500
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=8 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  CK=/local/evan/mot_exp/exp5; rm -rf $CK; mkdir -p $CK
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/exp5; mkdir -p $RES
  date -u; hostname; nvidia-smi
  DS="dataset.stats_cache=$STATS dataset.buffer_size=384 dataset.queue_size=192 dataset.min_fill=128 dataset.anime_nrows=16000 dataset.anime_cache_dir=/local/evan/anime_img_cache"
  # ⚠️ argparse：--config/--max-steps（optionals）必须在所有 dotlist positionals 之前，
  # 且 dotlist 连续放末尾，否则 positional 被 --max-steps 切断 → "unrecognized arguments"。
  DOTS="trainer.batch_size=64 trainer.log_every=20 scheduler.num_warmup_steps=300 trainer.checkpoint_steps=300 trainer.checkpoint_dir=$CK $DS"

  seg() { # max-steps resume port
    timeout 2h $PY -m torch.distributed.run --nproc_per_node=2 --master_port=$3 \
      train.py --config configs/stage1a_t2i_256.yaml --max-steps $1 $DOTS trainer.resume=$2 2>&1 | tee -a $RES/train.log
  }
  echo "##### SEG1 -> 600 (fresh) #####"; seg 600 false 29730
  if ! grep -q "step 600/600" $RES/train.log; then echo "SEG1 FAILED — abort"; exit 1; fi
  cp -f $CK/last.pt $RES/ckpt_step600.meta 2>/dev/null; ls -la $CK
  echo "##### SEG2 -> 1200 (resume, simulate restart) #####"; seg 1200 true 29731
  echo "##### SEG3 -> 1800 (resume again) #####"; seg 1800 true 29732
  cp -f $CK/metrics.jsonl $RES/metrics.jsonl 2>/dev/null || true

  echo "##### VERIFY (single-proc): A roundtrip + B metrics 连续 + C 跨stage加载 #####"
  $PY experiments/exp_scripts/verify_resume.py \
    --ckpt $CK/last.pt --config configs/stage1a_t2i_256.yaml \
    --metrics $CK/metrics.jsonl --segments 600,1200,1800 \
    --next-config configs/stage1a_t2i_512.yaml 2>&1 | tee $RES/verify.log
  echo "##### DONE #####"; date -u
