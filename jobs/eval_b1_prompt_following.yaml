# B6: B1 prompt-following eval on the anime evalset (150 prompts).
# Single-GPU, READ-ONLY w.r.t. training: snapshots ckpts to /local (avoids the
# training atomic-replace race), samples v1+b1 (b2/b3 if --runs extended), then
# scores with CLIP (offline, local cache) and the anime tagger (best-effort).
#
# Submit:  jcc job submit jobs/eval_b1_prompt_following.yaml
# Logs:    jcc job log evan-mot-eval-b1-pf -f
# Outputs (/fsx, small): experiments/results/eval_b1_prompt_following/
#   comparison.md / comparison.json, clip_<run>.json, tagger_<run>.json, samples/
#
# READINESS NOTES (read before submitting):
#  * CLIP scorer: ready offline. open_clip ViT-L/14 (openai) loads from the
#    /fsx/hf_cache/open_clip cache (timm/vit_large_patch14_clip_224.openai),
#    which we copy into the job's HF_HOME below.
#  * Tagger scorer: the company tagger incantor/tagger_3_1_13 is GATED on HF.
#    It is NOT cached and needs HF_TOKEN + a one-time online download. This job
#    therefore runs the tagger step WITHOUT offline mode and tolerates failure
#    (CLIP still produces a full comparison). To enable the company tagger, set
#    HF_TOKEN in the job env. Public fallback kiriyamaX/mld-caformer additionally
#    needs scikit-learn (not in venv-gpu) — left disabled by default.
name: evan-mot-eval-b1-pf
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 16
memGBPerWorker: 220
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  # HF_TOKEN for the gated company tagger — read from a 600 file so it is never
  # echoed by `set -x` and never committed. If the file is absent, tagger is skipped.
  set +x
  if [ -f /fsx/evan/.hf_token ]; then export HF_TOKEN=$(tr -d '[:space:]' < /fsx/evan/.hf_token); echo "[token] HF_TOKEN loaded (len=${#HF_TOKEN})"; else echo "[token] /fsx/evan/.hf_token absent -> tagger will be skipped"; fi
  set -x
  OUT=experiments/results/eval_b1_prompt_following
  SAMP=$OUT/samples
  mkdir -p /local/evan/cache/huggingface/open_clip $TORCH_HOME $TRITON_CACHE_DIR $SAMP
  RUNS="v1 b1 b2 b3"   # Evan: all 4 runs

  nvidia-smi || true
  echo "===== seed open_clip cache (ViT-L/14 openai) into job HF_HOME ====="
  # copy the prebuilt open_clip cache so the CLIP scorer runs fully offline
  cp -rn /fsx/hf_cache/open_clip/. /local/evan/cache/huggingface/open_clip/ || true

  echo "===== snapshot ckpts to /local (avoid training atomic-replace race) ====="
  declare -A CKPT=( \
    [v1]=/fsx/evan/checkpoints/mot_pilot_v1/s256_1x8_v1_20260618/last.pt \
    [b1]=/fsx/evan/checkpoints/mot_pilot_v1/s256_1x8_b1adapter_20260618/last.pt \
    [b2]=/fsx/evan/checkpoints/mot_pilot_v1/s256_1x8_b2longskip_20260618/last.pt \
    [b3]=/fsx/evan/checkpoints/mot_pilot_v1/s256_1x8_b3nonoise_20260618/last.pt )
  for r in $RUNS; do
    ls -la "${CKPT[$r]}"
    cp "${CKPT[$r]}" /local/eval_${r}.pt
  done

  echo "===== SAMPLE eval set (256px, cfg 4.0, EMA) from /local snapshots ====="
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 120m $PY experiments/eval/sample_evalset.py \
    --runs $RUNS --snapshot-dir /local \
    --out-dir $SAMP --size 256 --steps 64 --cfg 4.0 \
    --seed 7 --weights ema --batch-size 8

  echo "===== SCORE: CLIP (from /fsx cache) + company tagger in ONE pass ====="
  # Single driver call so comparison.md keeps BOTH metrics (two calls would clobber:
  # the driver rewrites comparison.md from only the metrics computed in that call).
  # CLIP reads its own /fsx/hf_cache/open_clip cache (verified: loads w/o network);
  # the company tagger downloads via HF_TOKEN. Per-scorer try/except in the driver ->
  # if the tagger fails (no token or no egress to HF), CLIP still fills the table.
  TFLAG="--tagger-backend company"
  [ -z "${HF_TOKEN:-}" ] && { TFLAG="--skip-tagger"; echo "[score] no HF_TOKEN -> CLIP-only comparison"; }
  set +e
  timeout 60m $PY experiments/eval/run_prompt_following.py \
    --samples-dir $SAMP --runs $RUNS $TFLAG --out-dir $OUT
  echo "[score] driver rc=$?"
  set -e

  echo "===== DONE ====="
  ls -la $OUT
  cat $OUT/comparison.md || true
