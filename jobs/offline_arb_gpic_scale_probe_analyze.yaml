# Exact-jobtag analyzer for the 8-node GPIC scale probe.  Patch the one empty
# SOURCE_PROBE_JOBTAG after the probe has succeeded; never discover "latest".
name: evan-mot-crop-offlinearb-gpic-scale-probe-analyze
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  HOST=$(hostname)
  [ "${HOST##*-}" = 0 ] || { echo "FATAL: analyzer must be one worker"; exit 2; }
  JOBTAG=${HOST%-0}
  SOURCE_PROBE_JOBTAG=
  [ -n "$SOURCE_PROBE_JOBTAG" ] || { echo "FATAL: patch exact SOURCE_PROBE_JOBTAG"; exit 2; }
  [ "$SOURCE_PROBE_JOBTAG" != latest ] || { echo "FATAL: latest discovery is forbidden"; exit 2; }

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  ANALYZER=$REPO/scripts/offline_arb/analyze_offline_gpic_scale_probe.py
  RUNNER=$REPO/scripts/offline_arb/run_offline_gpic_scale_probe.py
  PUBLISHER=$REPO/scripts/offline_arb/run_offline_gpic_blob_pilot.py
  PROBE_JOB=$REPO/jobs/offline_arb_gpic_scale_probe.yaml
  SELF=$REPO/jobs/offline_arb_gpic_scale_probe_analyze.yaml
  CATALOG=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_v1
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  RUN_ID=offline_gpic_scale_probe_20260712v1
  ARTIFACT_ROOT=$BASE/$RUN_ID/$SOURCE_PROBE_JOBTAG
  COORD_ROOT=$BASE/${RUN_ID}_coord/$SOURCE_PROBE_JOBTAG
  S3_ROOT=/s3/evan/offline_gpic_scale_probe_20260712v1/$SOURCE_PROBE_JOBTAG
  OUTPUT_DIR=$BASE/${RUN_ID}_analysis/$SOURCE_PROBE_JOBTAG/$JOBTAG
  OUTPUT=$OUTPUT_DIR/analysis.json
  TOPOLOGY=$BASE/offline_arb_local_topology_v1/evan-mot-crop-offlinearb-local-topology-94ns/summary.json

  for FILE in "$ANALYZER" "$RUNNER" "$PUBLISHER" "$PROBE_JOB" "$SELF" \
              "$CATALOG/header.json" "$CATALOG/gpic.parquet" \
              "$ARTIFACT_ROOT/job_receipt.json" "$ARTIFACT_ROOT/_SUCCESS" \
              "$COORD_ROOT/_INIT.json" "$COORD_ROOT/GLOBAL_APPROVED.json" \
              "$S3_ROOT/_INIT.json" "$S3_ROOT/manifest.json" \
              "$S3_ROOT/_SUCCESS" "$TOPOLOGY"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: invalid analyzer input"; exit 2; }
  done
  [ ! -e "$OUTPUT_DIR" ] && [ ! -L "$OUTPUT_DIR" ] \
    || { echo "FATAL: analysis namespace is not fresh"; exit 2; }
  mkdir -m 700 -p "$OUTPUT_DIR"
  "$PY" -m py_compile "$ANALYZER" "$RUNNER"

  timeout --preserve-status --signal=TERM --kill-after=30s 21600s \
    "$PY" "$ANALYZER" \
      --artifact-root "$ARTIFACT_ROOT" \
      --coord-root "$COORD_ROOT" \
      --s3-root "$S3_ROOT" \
      --catalog-root "$CATALOG" \
      --topology-summary "$TOPOLOGY" \
      --topology-jobtag evan-mot-crop-offlinearb-local-topology-94ns \
      --topology-summary-raw-sha256 27c48e9d6438d992fa850a0da9192c7043ccb6714e65ffa33460a755b4c5d73a \
      --jobtag "$SOURCE_PROBE_JOBTAG" \
      --probe-runner "$RUNNER" \
      --probe-job-spec "$PROBE_JOB" \
      --job-spec "$SELF" \
      --output "$OUTPUT" \
      --expected-workers 8 \
      --expected-physical-nodes 8 \
      --expected-main-rows 400000 \
      --expected-control-rows-per-arm 60000 \
      --expected-exclude-build-rows 100000 \
      --expected-exclude-scan-rows 40000 \
      --expected-source-prefix /s3-mewtant-raw-datasets/stanford-vision-lab/gpic_umziped/images/train/ \
      --max-byte-imbalance 1.10 \
      --max-s3-bytes-per-worker 31000000000 \
      --max-local-staging-bytes-per-worker 8589934592 \
      --max-fsx-evidence-bytes-per-worker 134217728 \
      --local-free-floor-bytes 1000000000000 \
      --full-partition-local-budget-bytes 500000000000 \
      --e8-min 0.75 \
      --e8-target 0.85 \
      --max-node-skew 1.25 \
      --min-combined-over-source 0.85 \
      --max-write-fsync-eta-share 0.15 \
      --eta-safety-factor 1.20 \
      --partial-fraction 0.75 \
      --verify-catalog-sha256 \
      --verify-blob-content \
      --production-gate

  echo "OFFLINE_GPIC_SCALE_ANALYZER_JCC_PASS source_jobtag=$SOURCE_PROBE_JOBTAG output=$OUTPUT"
