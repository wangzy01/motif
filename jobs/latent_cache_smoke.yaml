# latent cache 训练接入端到端验证（1 GPU）：
#   (1) GPU 数值对拍：缓存 moments vs 在线 VAE 重编码（同设备 bf16，mode-path max|Δ|≈0）
#   (2) train.py 真训练步 use_latent_cache=true：dataline 读缓存→model moments 分支→loss/反向，验完全跑通
# 提交: jcc job submit jobs/latent_cache_smoke.yaml ; 看日志: jcc job log evan-mot-latcache-smoke -p all -n 200
name: evan-mot-latcache-smoke
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 32
memGBPerWorker: 400
maxRetries: 1
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=4 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/mot_runs
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  echo "===== probe ====="; date -u; hostname; nvidia-smi -L
  $PY -c "import torch,diffusers; print('torch',torch.__version__,'diffusers',diffusers.__version__)"

  echo "===== (1) GPU 数值对拍 缓存 vs 在线 VAE ====="
  $PY scripts/verify_latent_cache_gpu.py --n 16

  echo "===== (2) train.py 真训练步 use_latent_cache=true (40 step) ====="
  $PY train.py --config configs/stage1a_t2i_256.yaml --max-steps 40 \
    dataset.use_latent_cache=true dataset.max_shards=6 \
    trainer.batch_size=16 scheduler.num_warmup_steps=5 \
    trainer.checkpoint_dir=/local/evan/mot_runs/latcache_smoke trainer.resume=false trainer.save_final=false

  echo "===== latcache smoke done ====="; date -u
