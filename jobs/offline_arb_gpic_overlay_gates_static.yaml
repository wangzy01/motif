name: evan-offarb-gpic-overlay-gates-static
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  "$PY" scripts/offline_arb/test_offline_gpic_overlay_gates_static.py
  "$PY" scripts/offline_arb/test_offline_gpic_compact_controls_static.py
  "$PY" -m py_compile \
    scripts/offline_arb/run_offline_gpic_blob_semantic_ab.py \
    scripts/offline_arb/run_w64_gpic_blob_supply_replay.py \
    scripts/offline_arb/verify_offline_gpic_compact_controls.py \
    scripts/offline_arb/test_offline_gpic_compact_controls_static.py \
    scripts/offline_arb/supervise_offline_gpic_probation.py \
    scripts/offline_arb/analyze_offline_gpic_probation.py
