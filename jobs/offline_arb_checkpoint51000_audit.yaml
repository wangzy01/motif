# Read-only CPU audit of the 8frz FORMAL step-51000 checkpoint.  The 22 GB
# checkpoint is hashed and deserialized only on JCC; this job never opens it
# for writing and publishes only an immutable receipt.
name: evan-offarb-formal-8frz-checkpoint51000-audit
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 256
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  SOURCE_JOBTAG=evan-mot-crop-offline-exact-256-8x8-formal-8frz
  CK=/fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/stage256_offline_exact_v1/last.pt
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  AUDIT_HOST=$(hostname)
  AUDIT_JOBTAG=${AUDIT_HOST%-0}
  OUT=$BASE/offline_formal_checkpoint_audit_v1/step51000/$AUDIT_JOBTAG
  test ! -e "$OUT" && test ! -L "$OUT" \
    || { echo "FATAL: checkpoint-audit output namespace exists: $OUT"; exit 2; }
  mkdir -p "$(dirname "$OUT")"
  mkdir "$OUT"

  "$PY" - "$CK" "$OUT" "$SOURCE_JOBTAG" "$AUDIT_JOBTAG" <<'PYEOF'
  import gc
  import hashlib
  import json
  import os
  import stat
  import sys
  from pathlib import Path

  import torch

  checkpoint = Path(sys.argv[1])
  output_root = Path(sys.argv[2])
  source_jobtag = sys.argv[3]
  audit_jobtag = sys.argv[4]

  expected_identity = {
      "device": 2_985_749_804,
      "inode": 144_116_600_130_240_535,
      "bytes": 22_636_962_042,
      "mtime_ns": 1_784_010_400_000_000_000,
      "ctime_ns": 1_784_010_400_000_000_000,
  }
  expected_step = 51_000
  expected_tensor_count = 373

  def file_identity(path):
      value = path.lstat()
      if path.is_symlink() or not stat.S_ISREG(value.st_mode) or value.st_size <= 0:
          raise SystemExit(f"FATAL: not a nonempty ordinary file: {path}")
      return {
          "device": value.st_dev,
          "inode": value.st_ino,
          "bytes": value.st_size,
          "mtime_ns": value.st_mtime_ns,
          "ctime_ns": value.st_ctime_ns,
      }

  def stable_sha256(path):
      before = file_identity(path)
      digest = hashlib.sha256()
      with path.open("rb", buffering=0) as handle:
          for block in iter(lambda: handle.read(8 << 20), b""):
              digest.update(block)
      after = file_identity(path)
      if after != before:
          raise SystemExit("FATAL: checkpoint changed while hashing")
      return digest.hexdigest(), before

  def atomic_exclusive(path, raw):
      temporary = path.with_name(f".{path.name}.tmp.{os.getpid()}")
      if path.exists() or path.is_symlink() or temporary.exists() or temporary.is_symlink():
          raise SystemExit(f"FATAL: refusing output overwrite: {path}")
      with temporary.open("xb", buffering=0) as handle:
          handle.write(raw)
          handle.flush()
          os.fsync(handle.fileno())
      os.replace(temporary, path)

  checkpoint_sha, checkpoint_identity = stable_sha256(checkpoint)
  if checkpoint_identity != expected_identity:
      raise SystemExit(
          f"FATAL: step-51000 checkpoint identity drift: "
          f"actual={checkpoint_identity}, expected={expected_identity}"
      )

  state = torch.load(checkpoint, map_location="cpu", weights_only=False)
  required = {"trainable_state", "optimizer", "ema", "scheduler", "global_step", "ablation_fp"}
  if not isinstance(state, dict) or set(state) != required:
      raise SystemExit(
          f"FATAL: checkpoint top-level keys drift: "
          f"{sorted(state) if isinstance(state, dict) else type(state)}"
      )
  if type(state["global_step"]) is not int or state["global_step"] != expected_step:
      raise SystemExit(f"FATAL: checkpoint global_step drift: {state.get('global_step')}")

  trainable = state["trainable_state"]
  ema = state["ema"]
  optimizer = state["optimizer"]
  scheduler = state["scheduler"]
  ablation_fp = state["ablation_fp"]
  if not isinstance(trainable, dict) or len(trainable) != expected_tensor_count:
      raise SystemExit(f"FATAL: trainable_state count drift: {len(trainable) if isinstance(trainable, dict) else type(trainable)}")
  if any(not isinstance(key, str) or not torch.is_tensor(value) for key, value in trainable.items()):
      raise SystemExit("FATAL: malformed trainable_state tensor mapping")
  if not isinstance(ema, dict) or len(ema) != expected_tensor_count:
      raise SystemExit(f"FATAL: EMA count drift: {len(ema) if isinstance(ema, dict) else type(ema)}")
  if any(not isinstance(key, str) or not torch.is_tensor(value) for key, value in ema.items()):
      raise SystemExit("FATAL: malformed EMA tensor mapping")
  if set(ema) != set(trainable):
      raise SystemExit("FATAL: EMA/trainable key-set mismatch")
  if any(tuple(ema[key].shape) != tuple(trainable[key].shape) for key in trainable):
      raise SystemExit("FATAL: EMA/trainable tensor-shape mismatch")
  if not isinstance(optimizer, dict) or set(optimizer) != {"state", "param_groups"}:
      raise SystemExit("FATAL: optimizer top-level structure drift")
  if not isinstance(optimizer["state"], dict) or len(optimizer["state"]) != expected_tensor_count:
      raise SystemExit("FATAL: optimizer state entry count drift")
  if not isinstance(optimizer["param_groups"], list) or len(optimizer["param_groups"]) != 1:
      raise SystemExit("FATAL: optimizer param-group structure drift")
  if not all(isinstance(value, dict) and value for value in optimizer["state"].values()):
      raise SystemExit("FATAL: empty/malformed optimizer state entry")
  if not isinstance(scheduler, dict) or not scheduler:
      raise SystemExit("FATAL: empty scheduler state")
  if not isinstance(ablation_fp, dict) or not ablation_fp:
      raise SystemExit("FATAL: empty ablation fingerprint")

  structure = {
      "global_step": state["global_step"],
      "trainable_tensors": len(trainable),
      "trainable_numel": sum(int(value.numel()) for value in trainable.values()),
      "optimizer_state_entries": len(optimizer["state"]),
      "optimizer_param_groups": len(optimizer["param_groups"]),
      "ema_tensors": len(ema),
      "ema_numel": sum(int(value.numel()) for value in ema.values()),
      "scheduler_keys": sorted(scheduler),
      "ablation_fp": ablation_fp,
  }
  del state, trainable, ema, optimizer, scheduler, ablation_fp
  gc.collect()
  if file_identity(checkpoint) != checkpoint_identity:
      raise SystemExit("FATAL: checkpoint changed while loading/validating")

  receipt = {
      "schema_version": "offline_formal_checkpoint_audit_v1",
      "status": "PASS",
      "source_jobtag": source_jobtag,
      "audit_jobtag": audit_jobtag,
      "checkpoint": {
          "path": str(checkpoint.resolve(strict=True)),
          "sha256": checkpoint_sha,
          **checkpoint_identity,
          **structure,
      },
      "read_only": True,
  }
  receipt_raw = json.dumps(
      receipt, sort_keys=True, separators=(",", ":"), allow_nan=False
  ).encode("utf-8")
  atomic_exclusive(output_root / "receipt.json", receipt_raw)
  receipt_sha = hashlib.sha256(receipt_raw).hexdigest()
  marker = (
      f"PASS|{source_jobtag}|{audit_jobtag}|{expected_step}|"
      f"{checkpoint_sha}|{receipt_sha}\n"
  ).encode("ascii")
  atomic_exclusive(output_root / "_SUCCESS", marker)
  directory_fd = os.open(output_root, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
  try:
      os.fsync(directory_fd)
  finally:
      os.close(directory_fd)
  print(
      "OFFLINE_FORMAL_CHECKPOINT_AUDIT_PASS "
      f"source={source_jobtag} step={expected_step} checkpoint_sha256={checkpoint_sha} "
      f"receipt_sha256={receipt_sha}"
  )
  PYEOF
