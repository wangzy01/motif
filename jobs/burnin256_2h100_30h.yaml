# 2xH100 stage256 complete_v1 long burn-in.
# Goal: 20-30h stability signal for NaN, loss trend, memory drift, data stalls, and FSx checkpoint writes.
# Submit: jcc job submit jobs/burnin256_2h100_30h.yaml
name: evan-mot-burnin256-2h100-30h
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 2
cpuPerWorker: 48
memGBPerWorker: 500
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1

  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=8 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUN_ID=burnin256_2h100_30h_20260618_0915
  CK=/fsx/evan/checkpoints/mot_pilot_v1/$RUN_ID
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/$RUN_ID
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  MAX_STEPS=55000

  if [ -e "$CK" ] || [ -e "$RES" ]; then
    echo "Run directory already exists: CK=$CK RES=$RES"
    exit 1
  fi
  mkdir -p "$CK" "$RES"

  {
    date -u
    hostname
    nvidia-smi
    echo "RUN_ID=$RUN_ID"
    echo "CK=$CK"
    echo "RES=$RES"
    echo "MAX_STEPS=$MAX_STEPS"
  } 2>&1 | tee "$RES/probe.log"

  DOTS="trainer.checkpoint_dir=$CK trainer.resume=false dataset.stats_cache=$STATS dataset.anime_cache_dir=/local/evan/anime_img_cache"
  START_S=$(date -u +%s)
  timeout --signal=TERM --kill-after=10m 30h \
    $PY -m torch.distributed.run --nproc_per_node=2 --master_port=29856 \
      train.py --config configs/stage1a_t2i_256.yaml --max-steps $MAX_STEPS \
      $DOTS 2>&1 | tee "$RES/train.log"
  TRAIN_RC=${PIPESTATUS[0]}
  END_S=$(date -u +%s)
  ELAPSED_S=$((END_S - START_S))

  cp -f "$CK/metrics.jsonl" "$RES/metrics.jsonl" 2>/dev/null || true
  ls -lh "$CK" 2>&1 | tee "$RES/checkpoint_ls.txt" || true

  METRICS="$CK/metrics.jsonl" SUMMARY="$RES/burnin_summary.json" ELAPSED_S="$ELAPSED_S" MIN_ELAPSED_S=72000 MIN_STEPS=30000 \
    $PY - <<'PY'
  import json
  import math
  import os
  import statistics
  import sys

  metrics_path = os.environ["METRICS"]
  summary_path = os.environ["SUMMARY"]
  elapsed_s = int(os.environ["ELAPSED_S"])
  min_elapsed_s = int(os.environ["MIN_ELAPSED_S"])
  min_steps = int(os.environ["MIN_STEPS"])

  rows = []
  bad = []
  with open(metrics_path, "r", encoding="utf-8") as f:
      for lineno, line in enumerate(f, 1):
          line = line.strip()
          if not line:
              continue
          try:
              rec = json.loads(line)
          except Exception as exc:
              bad.append(f"line {lineno}: json error {exc}")
              continue
          for key, value in rec.items():
              if isinstance(value, (int, float)) and not math.isfinite(float(value)):
                  bad.append(f"line {lineno}: non-finite {key}={value}")
          rows.append(rec)

  if not rows:
      raise SystemExit("no metrics rows found")

  steps = [int(r["step"]) for r in rows if "step" in r]
  losses = [float(r["loss"]) for r in rows if "loss" in r]
  iters = [float(r["iter_s"]) for r in rows if "iter_s" in r]
  mems = [float(r["peak_mem_gb"]) for r in rows if "peak_mem_gb" in r]
  gaps = [(a, b) for a, b in zip(steps, steps[1:]) if b != a + 1]

  def median(xs):
      return statistics.median(xs) if xs else None

  def quantile(xs, q):
      if not xs:
          return None
      xs = sorted(xs)
      idx = min(len(xs) - 1, max(0, int(round(q * (len(xs) - 1)))))
      return xs[idx]

  win = min(500, max(1, len(losses) // 10))
  head = losses[:win]
  tail = losses[-win:]
  summary = {
      "elapsed_s": elapsed_s,
      "rows": len(rows),
      "first_step": steps[0] if steps else None,
      "last_step": steps[-1] if steps else None,
      "step_gaps": gaps[:10],
      "loss_head_median": median(head),
      "loss_tail_median": median(tail),
      "loss_tail_over_head": (median(tail) / median(head)) if head and tail and median(head) else None,
      "iter_s_median": median(iters),
      "iter_s_p95": quantile(iters, 0.95),
      "iter_s_p99": quantile(iters, 0.99),
      "iter_s_max": max(iters) if iters else None,
      "peak_mem_gb_first": mems[0] if mems else None,
      "peak_mem_gb_last": mems[-1] if mems else None,
      "peak_mem_gb_max": max(mems) if mems else None,
      "peak_mem_gb_delta": (max(mems) - mems[0]) if mems else None,
      "bad_numeric": bad[:20],
  }

  with open(summary_path, "w", encoding="utf-8") as f:
      json.dump(summary, f, indent=2, sort_keys=True)
      f.write("\n")

  print("BURNIN_SUMMARY_JSON", json.dumps(summary, sort_keys=True))

  errors = []
  if bad:
      errors.append(f"non-finite/json problems: {bad[:3]}")
  if gaps:
      errors.append(f"metric step gaps: {gaps[:3]}")
  if steps[-1] < min_steps:
      errors.append(f"last_step {steps[-1]} < min_steps {min_steps}")
  if elapsed_s < min_elapsed_s:
      errors.append(f"elapsed_s {elapsed_s} < min_elapsed_s {min_elapsed_s}")
  if errors:
      print("BURNIN_POSTCHECK_FAILED", "; ".join(errors), file=sys.stderr)
      raise SystemExit(2)
  PY
  POST_RC=$?

  if [ "$TRAIN_RC" -eq 124 ]; then
    echo "30h timeout reached; treating timeout as expected burn-in stop."
    TRAIN_RC=0
  fi

  if [ "$TRAIN_RC" -ne 0 ]; then
    echo "train failed with rc=$TRAIN_RC"
    exit "$TRAIN_RC"
  fi
  exit "$POST_RC"
