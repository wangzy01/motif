# stage512 realized-mix probe（验证 512 是否 supply-starved）：
# 256 实测 supply~20/s/rank < demand~33-38/s → starved；512 步慢(bs32, ~2.4s/step → demand~13/s) < supply
# → 假设 512 不 starve、mix 达标。本 probe 用 512 config + 512 step 节奏(sleep 2.4)验证。
# anime 串行 + gpic fw4 + 行内打乱(新代码) + uniform。1 arm，2×8=16 rank，0 GPU。
# 判据：512 domain_mix(anime0.65/monet0.23/gpic0.08/synth0.04) 聚合 ±5%、不拖速 → 512(TextAtlas 目标)无需 starvation 修复。
name: evan-mot-probe-mix16-512
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 2
gpuPerWorker: 0
cpuPerWorker: 40
memGBPerWorker: 380
maxRetries: 1
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  export OMP_NUM_THREADS=4
  mkdir -p /local/evan/cache/huggingface
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  CFG=configs/stage1a_t2i_512.yaml
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  HOST=$(hostname); NODE_RANK=${HOST##*-}
  RES=/fsx/evan/mot_code/mot_pilot_v1_cleanup/experiments/results/probe_mix16_512/g4
  CACHE=/local/evan/anime_cache_512
  mkdir -p "$RES"; rm -rf "$CACHE"; mkdir -p "$CACHE"
  echo "===== node=$NODE_RANK stage512 anime_fw=1 gpic_fw=4 起 8 进程 $(date -u) ====="
  for L in 0 1 2 3 4 5 6 7; do
    GR=$((NODE_RANK*8 + L))
    $PY scripts/probe_realized_mix.py --config $CFG \
        --rank $GR --world 16 --batch-size 32 --warmup 50 --count 120 --sleep 2.4 \
        dataset.stats_cache=$STATS dataset.anime_cache_dir=$CACHE \
        dataset.drain_mode=uniform dataset.fetch_workers_anime=1 dataset.fetch_workers=4 \
        > "$RES/rank$GR.log" 2>&1 &
  done
  wait
  echo "===== node=$NODE_RANK stage512 结束 $(date -u) ====="
  grep -L "probe-json" "$RES"/rank*.log 2>/dev/null | sed 's/^/  未完成: /' || true
  grep -h "probe-json" "$RES"/rank*.log 2>/dev/null || true
