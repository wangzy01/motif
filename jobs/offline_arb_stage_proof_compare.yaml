name: evan-mot-crop-offlinearb-stage-proof-compare
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  OUT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_anime_caption_stage_proof_20260711r2
  "$PY" - "$OUT" <<'PYEOF'
  import json, re, sys
  from collections import defaultdict
  from pathlib import Path

  root = Path(sys.argv[1])
  patterns = ("*stage-proof-frf2*.PASS.log", "*stage-proof-mcct*.PASS.log")
  paths = []
  for pattern in patterns:
      matches = list(root.glob(pattern))
      if len(matches) != 1:
          raise SystemExit(f"FATAL expected one proof for {pattern}, found {matches}")
      paths.append(matches[0])

  def parse(path):
      raw = path.read_text(encoding="utf-8")
      marker = '{\n  "assertions"'
      start = raw.find(marker)
      if start < 0:
          raise SystemExit(f"FATAL smoke JSON missing: {path}")
      value, _end = json.JSONDecoder().raw_decode(raw[start:])
      return raw, value

  parsed = [parse(path) for path in paths]
  left, right = parsed[0][1], parsed[1][1]
  if left.get("status") != "PASS" or right.get("status") != "PASS":
      raise SystemExit("FATAL non-PASS proof")
  identity_keys = (
      "plan_id", "plan_hash", "catalog_hash", "assignment_hash",
      "semantic_hash_schema", "ranks", "per_rank_bs", "start_step", "steps",
  )
  if {key: left[key] for key in identity_keys} != {key: right[key] for key in identity_keys}:
      raise SystemExit("FATAL proof identity mismatch")
  hash_keys = ("trace_sha256", "prompts_sha256", "cfg_keep_sha256", "pixels_sha256")
  for rank in sorted(left["per_rank"]):
      for key in hash_keys:
          if left["per_rank"][rank][key] != right["per_rank"][rank][key]:
              raise SystemExit(f"FATAL nondeterminism rank={rank} hash={key}")

  profile_re = re.compile(
      r"OFFLINE_ARB_WINDOW_PROFILE rank=(?P<rank>\d+) domain=(?P<domain>\w+) "
      r"start=(?P<start>\d+).*? total_s=(?P<total>[0-9.]+)"
  )
  summaries = []
  for raw, _result in parsed:
      by_window = defaultdict(list)
      for match in profile_re.finditer(raw):
          by_window[(match.group("domain"), int(match.group("start")))].append(
              float(match.group("total"))
          )
      by_domain = defaultdict(list)
      for (domain, _start), values in by_window.items():
          by_domain[domain].append(max(values))
      summaries.append({
          domain: {
              "cross_rank_window_max_s": round(max(values), 3),
              "cross_rank_window_max_mean_s": round(sum(values) / len(values), 3),
              "windows": len(values),
          }
          for domain, values in sorted(by_domain.items())
      })
  print(json.dumps({
      "status": "PASS",
      "proofs": [str(path) for path in paths],
      "exact_repeat_hashes": list(hash_keys),
      "per_rank_hashes": {
          rank: {key: left["per_rank"][rank][key] for key in hash_keys}
          for rank in sorted(left["per_rank"])
      },
      "profile_summaries": summaries,
  }, indent=2, sort_keys=True))
  PYEOF
