name: evan-offarb-textatlas-repaired-bindings
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  export PYTHONPYCACHEPREFIX=/local/evan/pycache/offline_arb_textatlas_repaired_bindings.$(hostname)
  mkdir -p "$PYTHONPYCACHEPREFIX"
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ROOT=$BASE/offline_arb_textatlas_jpeg_missing_eoi_audit_v1
  ALLOWLIST=$ROOT/frozen_allowlist_suggestion.json
  RESULT=$ROOT/repaired_payload_bindings.json
  test -f "$ROOT/_SUCCESS" && test -f "$ALLOWLIST" || { echo "FATAL: broad audit incomplete"; exit 34; }
  test ! -e "$RESULT" || { echo "FATAL: immutable binding output exists"; exit 34; }
  "$PY" -m py_compile scripts/offline_arb/emit_textatlas_repaired_payload_bindings.py
  "$PY" scripts/offline_arb/emit_textatlas_repaired_payload_bindings.py \
    --allowlist "$ALLOWLIST" --output "$RESULT"
  sha256sum "$RESULT" > "$RESULT.sha256"
  touch "$ROOT/_REPAIRED_BINDINGS_SUCCESS"
