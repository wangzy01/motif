# Fresh CPU32 correction after the preserved v4b empty-nonzero-rank-log failure.
name: evan-offarb-s256-20260718-pause-preflight-v4c
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 32
memGBPerWorker: 384
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch PYTHONUNBUFFERED=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=32 MKL_NUM_THREADS=32
  export PYTHONPYCACHEPREFIX="/local/evan/stage256_20260718_pycache/${JCC_JOB_ID:-v4cpausepre}/$(hostname)"
  mkdir -p "$PYTHONPYCACHEPREFIX"
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ROOT=$BASE/offline_arb_stage256_20260718_semantic_v1
  CK=/fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/stage256_20260718_causalmlf_offline_exact_v2
  RES=$BASE/stage256_20260718_causalmlf_offline_exact_v2
  OUT=$ROOT/formal_v4/PRE_RESUME384_SUCCESS.json
  BASE_SCRIPT=scripts/offline_arb/verify_stage256_20260718_formal_v4_pause.py
  WRAPPER=scripts/offline_arb/verify_stage256_20260718_formal_v4_pause_v4c.py
  CORRECTION=docs/FORMAL_V4C_PREFLIGHT_CORRECTION_ADDENDUM.md
  EXPECTED_WRAPPER_SHA256=fa4282209687ea2ad29169bf4228a4dbd1e78ee4e9b5dd99445d3554328b051b
  EXPECTED_CORRECTION_SHA256=e3a6de6f0ce33c6c47d989e7d267011bf1ee724c21b42673609f6eaa236ab6c6
  test "$(sha256sum "$WRAPPER" | awk '{print $1}')" = "$EXPECTED_WRAPPER_SHA256"
  test "$(sha256sum "$CORRECTION" | awk '{print $1}')" = "$EXPECTED_CORRECTION_SHA256"
  test -f "$BASE_SCRIPT" && test ! -L "$BASE_SCRIPT"
  RUNNER=scripts/offline_arb/run_stage256_20260718_formal_v4d.sh
  CFG=configs/stage256_20260718_causalmlf_offline_exact_v1.yaml
  V3=jobs/offline_exact_stage256_20260718_FORMAL_RESUME_8x8_v3.yaml
  V4=jobs/offline_exact_stage256_20260718_FORMAL_RESUME_8x8_v4d.yaml
  SELF=jobs/offline_exact_stage256_20260718_FORMAL_PAUSE_PREFLIGHT_CPU32_v4c.yaml
  ADDENDUM=docs/FORMAL_V4D_USER_RELEASE_OVERRIDE_ADDENDUM.md
  test "$(sha256sum "$RUNNER" | awk '{print $1}')" = 436a54207502008e23eab8f225e468adb2d4e170bba288ce191f0ca758e4d82a
  test "$(sha256sum "$V4" | awk '{print $1}')" = 7d5fc25ac74a9b210457835758277000ed9e77db653b1e34273570f81b24c162
  test "$(sha256sum "$ADDENDUM" | awk '{print $1}')" = 37572eb481e3bb5de62c9b75dfaf5905c4badd53dcfa116b27d784cf5c7d37b9
  V3_RECEIPT=$ROOT/formal_v3/RECOVER384_CHECKPOINT_SUCCESS.json
  BOOT=$ROOT/formal_v2/BOOT256_CHECKPOINT_SUCCESS.json
  test ! -e "$OUT" && test ! -L "$OUT"
  "$PY" "$WRAPPER" \
    --checkpoint "$CK/last.pt" --metrics "$CK/metrics.jsonl" \
    --result-root "$RES" --release-root "$ROOT" --config "$CFG" \
    --v3-main-yaml "$V3" --v4-main-yaml "$V4" \
    --v4-preflight-yaml "$SELF" --runner "$RUNNER" \
    --addendum "$ADDENDUM" --v3-receipt "$V3_RECEIPT" \
    --boot-receipt "$BOOT" --output "$OUT"
  test -f "$OUT" && test ! -L "$OUT"
  "$PY" - "$OUT" <<'PYEOF'
  import json,sys
  value=json.load(open(sys.argv[1],encoding="utf-8"))
  assert value.get("status")=="PASS"
  assert value.get("schema")=="stage256_20260718_formal_v4_pre_resume384_v1"
  assert int(value.get("expected_checkpoint_step",-1))==384
  assert int(value.get("observed_metrics_last_step",-1))==3000
  assert int(value["not_before"]["unix"])==1784442982
  assert value["source"]["logs"]["nonzero_rank_empty_stdout_allowed"] is True
  print("FORMAL_V4C_PAUSE_PREFLIGHT_PASS",value["checkpoint"]["sha256"])
  PYEOF
