# FORMAL: OFFLINE_ARB_V1 stage256, 8 nodes × 8 GPUs.
# Global batch = 64 × 36 = 2304; config stops at 384M exposures / 2304 =
# 166667 steps.  Submit only after the immutable GPIC release's semantic, W64
# supply and 8×8 probation gates are green and the formal freeze is rebuilt.
# The config is the sole training authority; this job supplies only immutable
# preflight, rendezvous and runtime plumbing.
name: evan-mot-crop-offline-exact-256-8x8-formal
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 8
gpuPerWorker: 8
cpuPerWorker: 80
memGBPerWorker: 900
maxRetries: 3
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=4 PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN
  export FI_EFA_USE_DEVICE_RDMA=1
  export OFFLINE_ARB_PREFETCH_STEPS=4
  unset OFFLINE_ARB_STEP_TIMEOUT_S OFFLINE_ARB_PROFILE_WINDOWS OFFLINE_ARB_SMOKE_DATASET_CONFIG OFFLINE_ARB_IO_TELEMETRY_DIR
  unset OFFLINE_ARB_GPIC_THREADS_PER_NODE
  unset MALLOC_ARENA_MAX MALLOC_TRIM_THRESHOLD_ ARROW_DEFAULT_MEMORY_POOL LD_PRELOAD TCMALLOC_RELEASE_RATE
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  RUN_ID=stage256_offline_exact_v1_8x8_formal
  CFG=configs/stage256_offline_exact_v1.yaml
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  ARTIFACT_BUILDTAG=evan-mot-crop-offlinearb-gpic-s3-production-build-zg8g
  ARTIFACT_ROOT=$BASE/offline_gpic_blob_v1_release/$ARTIFACT_BUILDTAG
  MANIFEST_SHA256=a18ba1f1250e3b00abdc1051dc71e08a254b8855d5b61b9975e88d2e6ae2ee05
  PLAN=$BASE/offline_arb_plans_v1/w64_prod/plan
  CAT=$BASE/offline_arb_catalog_v1
  ANIME_FREQ=$BASE/offline_arb_animefreq_v1
  SIDECAR=$BASE/offline_arb_caption_sidecar_v1
  SAMPLING=/fsx/evan/mot_code/data_analysis/configs/t5_sampling_redesign_v1.json
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  FREEZE=$BASE/offline_arb_plans_v1/FREEZE_MANIFEST.json
  YAML_SELF=$REPO/jobs/offline_exact_256_8x8_FORMAL.yaml
  GPIC_PREFLIGHT=$REPO/scripts/offline_arb/verify_offline_gpic_compact_controls.py
  NNODES=8; PORT=29781
  test -f "$PLAN/header.json" || { echo "FATAL: w64_prod plan missing"; exit 34; }
  test -f "$CAT/header.json" || { echo "FATAL: catalog header missing"; exit 34; }
  test -f "$SIDECAR/header.json" || { echo "FATAL: caption sidecar missing"; exit 34; }
  test -f "$FREEZE" && test ! -L "$FREEZE" || { echo "FATAL: freeze manifest missing/non-regular"; exit 34; }
  test -f "$GPIC_PREFLIGHT" && test ! -L "$GPIC_PREFLIGHT" \
    || { echo "FATAL: compact GPIC preflight missing/non-regular"; exit 34; }
  [ "$(basename "$ARTIFACT_ROOT")" = "$ARTIFACT_BUILDTAG" ] \
    && [ "$ARTIFACT_BUILDTAG" != latest ] \
    || { echo "FATAL: immutable GPIC artifact root/buildtag mismatch"; exit 34; }
  case "$MANIFEST_SHA256" in (*[!0-9a-f]*|'') echo "FATAL: malformed GPIC manifest SHA"; exit 34;; esac
  [ "${#MANIFEST_SHA256}" -eq 64 ] \
    || { echo "FATAL: malformed GPIC manifest SHA length"; exit 34; }
  NW_DECL=$(grep -m1 '^numWorkers:' "$YAML_SELF" | awk '{print $2}')
  if [ -n "$NW_DECL" ] && [ "$NW_DECL" != "$NNODES" ]; then
    echo "FATAL: yaml numWorkers($NW_DECL) != script NNODES($NNODES)"; exit 21
  fi

  HOST=$(hostname); NODE_RANK=${HOST##*-}; JOBTAG=${HOST%-*}; STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  BOOT_NONCE=$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')
  if [ "$NODE_RANK" -ge "$NNODES" ]; then echo "FATAL: node_rank $NODE_RANK >= NNODES $NNODES"; exit 21; fi
  RES=$BASE/$RUN_ID
  mkdir -p "$RES"

  # Per-node compact publication close: controls, canonical verifier bindings,
  # catalog/plan/config/YAML identity and copied-index inode/size only.  The
  # 1.12GB index content hash remains deferred to runtime's collective check.
  # maxRetries keeps JOBTAG stable.  A per-launch suffix preserves every
  # compact preflight and prevents a legitimate retry from colliding with the
  # previous launch's immutable evidence file.
  GPIC_PREFLIGHT_JSON=$RES/gpicpreflight.$JOBTAG.n$NODE_RANK.$STAMP.$BOOT_NONCE.json
  test ! -e "$GPIC_PREFLIGHT_JSON" && test ! -L "$GPIC_PREFLIGHT_JSON" \
    || { echo "FATAL: GPIC compact preflight output namespace exists"; exit 34; }
  "$PY" "$GPIC_PREFLIGHT" --artifact-root "$ARTIFACT_ROOT" \
    --buildtag "$ARTIFACT_BUILDTAG" --manifest-sha256 "$MANIFEST_SHA256" \
    --catalog-root "$CAT" --plan-root "$PLAN" --config "$CFG" \
    --job-yaml "$YAML_SELF" --jobtag "$JOBTAG" --node-rank "$NODE_RANK" \
    --output "$GPIC_PREFLIGHT_JSON"

  # Node 0 is the only node that hashes the full production plan, animefreq,
  # training source set and caption sidecar.  verify-freeze compares every live
  # sidecar file byte/SHA/footer range to freeze v3 and reparses controls after
  # the expensive pass.  Other nodes wait for a JOBTAG+nonce-bound atomic PASS.
  PREFLIGHT_JSON=$RES/formalpreflight.$JOBTAG.json
  PREFLIGHT_PASS=$RES/formalpreflight.$JOBTAG.pass
  FRESH_MARKER=$RES/formalpreflight.$JOBTAG.n$NODE_RANK.fresh
  rm -f "$FRESH_MARKER" "$FRESH_MARKER.tmp"
  MARK_TS=$(date +%s)
  printf 'READY|%s|%s|%s|%s\n' "$JOBTAG" "$NODE_RANK" "$MARK_TS" "$HOST" > "$FRESH_MARKER.tmp"
  mv "$FRESH_MARKER.tmp" "$FRESH_MARKER"
  if [ "$NODE_RANK" = "0" ]; then
    rm -f "$PREFLIGHT_JSON" "$PREFLIGHT_JSON.tmp" "$PREFLIGHT_PASS" "$PREFLIGHT_PASS.tmp"
    MARKERS_READY=0
    for _ in $(seq 1 900); do
      READY=1; NOW=$(date +%s)
      for RANK in $(seq 0 $((NNODES - 1))); do
        MARKER=$RES/formalpreflight.$JOBTAG.n$RANK.fresh
        M_STATUS=""; M_JOBTAG=""; M_RANK=""; M_TS=""; M_HOST=""
        if [ -f "$MARKER" ] && [ ! -L "$MARKER" ]; then
          IFS='|' read -r M_STATUS M_JOBTAG M_RANK M_TS M_HOST < "$MARKER" || true
        fi
        case "$M_TS" in (*[!0-9]*|'') READY=0 ;; esac
        if [ "$M_STATUS" != READY ] || [ "$M_JOBTAG" != "$JOBTAG" ] \
           || [ "$M_RANK" != "$RANK" ] || [ -z "$M_HOST" ] \
           || [ "$READY" -ne 1 ] || [ "$M_TS" -gt $((NOW + 60)) ] \
           || [ $((NOW - M_TS)) -ge 2700 ]; then READY=0; fi
      done
      if [ "$READY" -eq 1 ]; then MARKERS_READY=1; break; fi
      sleep 2
    done
    [ "$MARKERS_READY" -eq 1 ] || { echo "FATAL: all-node FORMAL fresh marker barrier timed out"; exit 35; }
    timeout --signal=TERM --kill-after=30s 14400s \
      "$PY" scripts/offline_arb/make_freeze_manifest.py --verify-freeze \
        --freeze "$FREEZE" --repo "$REPO" --plan "$PLAN" \
        --catalog-root "$CAT" --sampling "$SAMPLING" \
        --animefreq-root "$ANIME_FREQ" --sidecar-root "$SIDECAR" \
        > "$PREFLIGHT_JSON.tmp"
    mv "$PREFLIGHT_JSON.tmp" "$PREFLIGHT_JSON"
    PREFLIGHT_JSON_SHA=$(sha256sum "$PREFLIGHT_JSON" | awk '{print $1}')
    read -r SIDE_HEADER SIDE_HEADER_FILE SIDE_SUCCESS_FILE SIDE_CATALOG_HEADER SIDE_RELEASE RELEASE_DIGEST FREEZE_SHA < <(
      "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x.get("status")=="PASS" and x.get("mode")=="verify-freeze"; print(x["header_sha256"],x["header_file_sha256"],x["success_file_sha256"],x["catalog_header_sha256"],x["sidecar_release_digest"],x["release_digest"],x["freeze_sha256"])' "$PREFLIGHT_JSON"
    )
    NONCE=$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')
    NOW=$(date +%s)
    printf 'PASS|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s|%s\n' \
      "$JOBTAG" "$NONCE" "$NOW" "$SIDE_HEADER" "$SIDE_HEADER_FILE" \
      "$SIDE_SUCCESS_FILE" "$SIDE_CATALOG_HEADER" "$SIDE_RELEASE" \
      "$RELEASE_DIGEST" "$PREFLIGHT_JSON_SHA" "$FREEZE_SHA" > "$PREFLIGHT_PASS.tmp"
    mv "$PREFLIGHT_PASS.tmp" "$PREFLIGHT_PASS"
  fi

  for _ in $(seq 1 4500); do
    [ -f "$PREFLIGHT_PASS" ] && [ ! -L "$PREFLIGHT_PASS" ] \
      && [ "$PREFLIGHT_PASS" -nt "$FRESH_MARKER" ] && break
    sleep 4
  done
  [ -f "$PREFLIGHT_PASS" ] && [ ! -L "$PREFLIGHT_PASS" ] \
    && [ "$PREFLIGHT_PASS" -nt "$FRESH_MARKER" ] \
    || { echo "FATAL: FORMAL PASS is missing or not newer than local fresh marker"; exit 35; }
  IFS='|' read -r PASS_STATUS PASS_JOBTAG PASS_NONCE PASS_TS PASS_HEADER PASS_HEADER_FILE PASS_SUCCESS_FILE PASS_CATALOG_HEADER PASS_SIDECAR_RELEASE PASS_RELEASE PASS_JSON_SHA PASS_FREEZE_SHA < "$PREFLIGHT_PASS"
  [ "$PASS_STATUS" = PASS ] && [ "$PASS_JOBTAG" = "$JOBTAG" ] || { echo "FATAL: FORMAL preflight JOBTAG mismatch"; exit 35; }
  case "$PASS_NONCE" in (*[!0-9a-f]*|'') echo "FATAL: malformed FORMAL preflight nonce"; exit 35;; esac
  [ "${#PASS_NONCE}" -eq 64 ] || { echo "FATAL: malformed FORMAL preflight nonce length"; exit 35; }
  case "$PASS_TS" in (*[!0-9]*|'') echo "FATAL: malformed FORMAL preflight timestamp"; exit 35;; esac
  NOW=$(date +%s)
  [ "$PASS_TS" -le $((NOW + 60)) ] && [ $((NOW - PASS_TS)) -lt 21600 ] || { echo "FATAL: stale/future FORMAL preflight PASS"; exit 35; }
  for VALUE in "$PASS_HEADER" "$PASS_HEADER_FILE" "$PASS_SUCCESS_FILE" "$PASS_CATALOG_HEADER" "$PASS_SIDECAR_RELEASE" "$PASS_RELEASE" "$PASS_JSON_SHA" "$PASS_FREEZE_SHA"; do
    case "$VALUE" in (*[!0-9a-f]*|'') echo "FATAL: malformed FORMAL preflight hash"; exit 35;; esac
    [ "${#VALUE}" -eq 64 ] || { echo "FATAL: malformed FORMAL preflight hash length"; exit 35; }
  done
  [ -f "$PREFLIGHT_JSON" ] && [ ! -L "$PREFLIGHT_JSON" ] || { echo "FATAL: shared FORMAL preflight JSON missing"; exit 35; }
  LIVE_JSON_SHA=$(sha256sum "$PREFLIGHT_JSON" | awk '{print $1}')
  LIVE_FREEZE_SHA=$(sha256sum "$FREEZE" | awk '{print $1}')
  [ "$LIVE_JSON_SHA" = "$PASS_JSON_SHA" ] && [ "$LIVE_FREEZE_SHA" = "$PASS_FREEZE_SHA" ] \
    || { echo "FATAL: shared preflight JSON/freeze SHA mismatch"; exit 35; }
  read -r JSON_STATUS JSON_MODE JSON_HEADER JSON_HEADER_FILE JSON_SUCCESS_FILE JSON_CATALOG_HEADER JSON_SIDECAR_RELEASE JSON_RELEASE JSON_FREEZE_SHA < <(
    "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); print(x.get("status"),x.get("mode"),x.get("header_sha256"),x.get("header_file_sha256"),x.get("success_file_sha256"),x.get("catalog_header_sha256"),x.get("sidecar_release_digest"),x.get("release_digest"),x.get("freeze_sha256"))' "$PREFLIGHT_JSON"
  )
  [ "$JSON_STATUS" = PASS ] && [ "$JSON_MODE" = verify-freeze ] \
    && [ "$JSON_HEADER" = "$PASS_HEADER" ] \
    && [ "$JSON_HEADER_FILE" = "$PASS_HEADER_FILE" ] \
    && [ "$JSON_SUCCESS_FILE" = "$PASS_SUCCESS_FILE" ] \
    && [ "$JSON_CATALOG_HEADER" = "$PASS_CATALOG_HEADER" ] \
    && [ "$JSON_SIDECAR_RELEASE" = "$PASS_SIDECAR_RELEASE" ] \
    && [ "$JSON_RELEASE" = "$PASS_RELEASE" ] \
    && [ "$JSON_FREEZE_SHA" = "$PASS_FREEZE_SHA" ] \
    || { echo "FATAL: shared FORMAL preflight JSON/PASS binding mismatch"; exit 35; }

  # This is intentionally control-only on every node: no duplicate full-root
  # hashes.  It binds release to the same header/_SUCCESS/catalog snapshot.
  CONTROL_JSON=$RES/sidecarcontrol.$JOBTAG.n$NODE_RANK.$STAMP.json
  rm -f "$CONTROL_JSON" "$CONTROL_JSON.tmp"
  "$PY" scripts/offline_arb/make_freeze_manifest.py \
    --verify-sidecar-control --sidecar-root "$SIDECAR" --catalog-root "$CAT" \
    > "$CONTROL_JSON.tmp"
  mv "$CONTROL_JSON.tmp" "$CONTROL_JSON"
  read -r LIVE_HEADER LIVE_HEADER_FILE LIVE_SUCCESS_FILE LIVE_CATALOG_HEADER LIVE_SIDECAR_RELEASE < <(
    "$PY" -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x.get("status")=="PASS" and x.get("mode")=="verify-sidecar-control"; print(x["header_sha256"],x["header_file_sha256"],x["success_file_sha256"],x["catalog_header_sha256"],x["release_digest"])' "$CONTROL_JSON"
  )
  [ "$LIVE_HEADER" = "$PASS_HEADER" ] \
    && [ "$LIVE_HEADER_FILE" = "$PASS_HEADER_FILE" ] \
    && [ "$LIVE_SUCCESS_FILE" = "$PASS_SUCCESS_FILE" ] \
    && [ "$LIVE_CATALOG_HEADER" = "$PASS_CATALOG_HEADER" ] \
    && [ "$LIVE_SIDECAR_RELEASE" = "$PASS_SIDECAR_RELEASE" ] \
    || { echo "FATAL: sidecar controls changed after FORMAL node0 preflight"; exit 35; }
  POST_JSON_SHA=$(sha256sum "$PREFLIGHT_JSON" | awk '{print $1}')
  POST_FREEZE_SHA=$(sha256sum "$FREEZE" | awk '{print $1}')
  [ "$POST_JSON_SHA" = "$PASS_JSON_SHA" ] && [ "$POST_FREEZE_SHA" = "$PASS_FREEZE_SHA" ] \
    || { echo "FATAL: preflight JSON/freeze changed during per-node control close"; exit 35; }
  PLAN_HEADER_SHA=$(sha256sum "$PLAN/header.json" | awk '{print $1}')
  case "$PLAN_HEADER_SHA" in (*[!0-9a-f]*|'') echo "FATAL: malformed plan header SHA"; exit 35;; esac
  [ "${#PLAN_HEADER_SHA}" -eq 64 ] || { echo "FATAL: malformed plan header SHA length"; exit 35; }
  export OFFLINE_ARB_AUTO_RESUME_RECONCILE=1
  export OFFLINE_ARB_ATTEMPT_JOBTAG=$JOBTAG
  export OFFLINE_ARB_ATTEMPT_NONCE=$PASS_NONCE
  export OFFLINE_ARB_AUTO_RESUME_FREEZE_SHA256=$PASS_FREEZE_SHA
  export OFFLINE_ARB_AUTO_RESUME_PLAN_HEADER_SHA256=$PLAN_HEADER_SHA
  echo "FORMAL freeze+sidecar preflight PASS jobtag=$JOBTAG nonce=$PASS_NONCE header=$PASS_HEADER sidecar_release=$PASS_SIDECAR_RELEASE release=$PASS_RELEASE freeze_sha=$PASS_FREEZE_SHA json_sha=$PASS_JSON_SHA"

  # Rendezvous is independently bound to the same attempt and nonce.
  RDZV=$RES/rdzv.$JOBTAG.addr
  if [ "$NODE_RANK" = "0" ]; then
    rm -f "$RDZV"
    MYIP=$(hostname -i | awk '{print $1}')
    printf '%s %s %s %s\n' "$MYIP" "$(date +%s)" "$JOBTAG" "$PASS_NONCE" > "$RDZV.tmp"
    mv "$RDZV.tmp" "$RDZV"; MASTER_ADDR=$MYIP
  else
    MASTER_ADDR=""
    for _ in $(seq 1 840); do
      if [ -s "$RDZV" ] && [ ! -L "$RDZV" ]; then
        TS=$(awk '{print $2}' "$RDZV" 2>/dev/null || true)
        TOKEN=$(awk '{print $3}' "$RDZV" 2>/dev/null || true)
        TOKEN_NONCE=$(awk '{print $4}' "$RDZV" 2>/dev/null || true)
        case "$TS" in (*[!0-9]*|'') TS="" ;; esac
        NOW=$(date +%s)
        if [ -n "$TS" ] && [ "$TOKEN" = "$JOBTAG" ] && [ "$TOKEN_NONCE" = "$PASS_NONCE" ] \
           && [ $((NOW - TS)) -lt 7200 ] && [ "$TS" -le $((NOW + 60)) ]; then
          MASTER_ADDR=$(awk '{print $1}' "$RDZV"); break
        fi
      fi
      sleep 5
    done
    [ -n "$MASTER_ADDR" ] || { echo "FATAL: fresh FORMAL rendezvous missing"; exit 20; }
  fi

  echo "===== STAGE256 OFFLINE-EXACT FORMAL 8x8 node=$NODE_RANK master=$MASTER_ADDR world=$((NNODES*8)) global=2304 attempt=$JOBTAG $(date -u) ====="
  { echo "RUN_ID=$RUN_ID cfg=$CFG plan=$PLAN sidecar_header_sha256=$PASS_HEADER sidecar_release_digest=$PASS_SIDECAR_RELEASE release_digest=$PASS_RELEASE preflight_json_sha256=$PASS_JSON_SHA freeze_sha256=$PASS_FREEZE_SHA sidecar_nonce=$PASS_NONCE"; \
    hostname; nvidia-smi -L; df -h /local | tail -1; \
    echo "anime image cache entries (<=60s):"; timeout 60 ls -f /local/evan/anime_img_cache | wc -l || echo "count-timeout"; \
    sha256sum "$CFG" "$PLAN/header.json" "$CAT/header.json" "$SIDECAR/header.json" "$FREEZE"; } \
    2>&1 | tee "$RES/probe.$JOBTAG.n$NODE_RANK.$STAMP.log"

  # Only the image cache is rotated.  Caption sidecar data stays on shared FS;
  # there is no 29.5GB node-local caption staging allocation or cleanup path.
  (while true; do
     use=$(df --output=pcent /local 2>/dev/null | tail -1 | tr -dc '0-9' || true)
     if [ "${use:-0}" -ge 85 ]; then
       ts=$(date +%s); mv /local/evan/anime_img_cache /local/evan/anime_img_cache.old.$ts 2>/dev/null || true
       mkdir -p /local/evan/anime_img_cache
       nice -n 19 rm -rf /local/evan/anime_img_cache.old.$ts &
       echo "$(date -u) rotated anime image cache at ${use}%"
     else
       echo "$(date -u) /local ${use}% ok"
     fi
     sleep 3600
   done) > "$RES/cachejanitor.$JOBTAG.n$NODE_RANK.$STAMP.log" 2>&1 &
  (while true; do date -u
     [ -r /sys/fs/cgroup/memory.current ] && echo "mem.current: $(cat /sys/fs/cgroup/memory.current)"
     [ -r /sys/fs/cgroup/memory.pressure ] && cat /sys/fs/cgroup/memory.pressure
     df --output=avail /local | tail -1
     sleep 120
   done) > "$RES/nodemon.$JOBTAG.n$NODE_RANK.$STAMP.log" 2>&1 &

  set +e
  "$PY" -m torch.distributed.run \
    --nnodes "$NNODES" --nproc-per-node 8 --node-rank "$NODE_RANK" \
    --master-addr "$MASTER_ADDR" --master-port "$PORT" \
    train.py --config "$CFG" \
    dataset.gpic_payload_backend=offline_gpic_blob_v1 \
    dataset.offline_gpic_blob_root="$ARTIFACT_ROOT" \
    dataset.gpic_blob_manifest_sha256="$MANIFEST_SHA256" \
    dataset.gpic_blob_fd_cache_size=1024 \
    2>&1 | tee "$RES/train.$JOBTAG.n$NODE_RANK.$STAMP.log"
  PIPE_RC=("${PIPESTATUS[@]}")
  set -e
  RC=${PIPE_RC[0]}; TEE_RC=${PIPE_RC[1]}
  if [ "$TEE_RC" -ne 0 ]; then
    echo "===== FORMAL node=$NODE_RANK evidence tee rc=$TEE_RC $(date -u) ====="; exit "$TEE_RC"
  fi
  echo "===== FORMAL node=$NODE_RANK rc=$RC $(date -u) ====="
  exit "$RC"
