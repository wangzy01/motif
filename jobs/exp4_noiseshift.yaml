# EXP4 — 512/1024 noise-shift 小扫（2×H100 FSDP2）。顺序短段，每段固定 seed/固定步数，
# 训练后采固定 prompt grid。512: shift 2.0(基线) vs 3.0 vs 3.33；1024: shift 3.33 vs 4.0(基线)。
# ⚠️ 从零训短段、信号偏弱：主看 loss-at-step + 样图结构/糊/锐化的相对趋势，不看绝对质量。
# 提交: jcc job submit jobs/exp4_noiseshift.yaml ; 日志: jcc job log evan-mot-exp4-noiseshift -p all -n 400
name: evan-mot-exp4-noiseshift
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 2
cpuPerWorker: 48
memGBPerWorker: 500
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=8 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/exp4; mkdir -p $RES/samples
  date -u; hostname; nvidia-smi
  DS="dataset.stats_cache=$STATS dataset.buffer_size=384 dataset.queue_size=192 dataset.min_fill=128 dataset.anime_nrows=16000 dataset.anime_cache_dir=/local/evan/anime_img_cache"
  STEPS=2000

  seg() { # config size bs shift port tag
    CK=/local/evan/mot_exp/exp4_$6; rm -rf $CK; mkdir -p $CK
    echo "##### TRAIN $6: $2px shift=$4 -> $STEPS steps #####"
    timeout 3h $PY -m torch.distributed.run --nproc_per_node=2 --master_port=$5 \
      train.py --config $1 --max-steps $STEPS trainer.batch_size=$3 trainer.seed=42 \
      trainer.log_every=20 scheduler.num_warmup_steps=200 trainer.checkpoint_steps=1000 \
      sigma_sampling.shift=$4 trainer.checkpoint_dir=$CK trainer.resume=false $DS 2>&1 | tee $RES/train_$6.log
    cp -f $CK/metrics.jsonl $RES/metrics_$6.jsonl 2>/dev/null || true
    echo "##### SAMPLE $6 (shift=$4 matched) #####"
    timeout 25m $PY experiments/exp_scripts/sample_prompt_grid.py \
      --config $1 --ckpt $CK/last.pt --out $RES/samples/exp4_$6.png \
      --size $2 --steps 50 --cfg 4.0 --seed 7 sigma_sampling.shift=$4 dataset.stats_cache=$STATS 2>&1 | tail -5 || true
  }

  # 512: 基线 2.0 vs 3.0 vs 3.33
  seg configs/stage1a_t2i_512.yaml 512 32 2.0  29740 s512_shift2p0 || true
  seg configs/stage1a_t2i_512.yaml 512 32 3.0  29741 s512_shift3p0 || true
  seg configs/stage1a_t2i_512.yaml 512 32 3.33 29742 s512_shift3p33 || true
  # 1024: 3.33 vs 基线 4.0
  seg configs/stage2_1024.yaml    1024 8 3.33 29743 s1024_shift3p33 || true
  seg configs/stage2_1024.yaml    1024 8 4.0  29744 s1024_shift4p0 || true

  echo "##### loss@final per shift #####"
  for f in $RES/metrics_*.jsonl; do echo -n "$f -> "; tail -1 $f; done | tee $RES/loss_summary.txt
  echo "##### DONE #####"; date -u
