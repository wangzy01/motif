# complete_v1 采样 dry-run 统计（正式版数据线，含 anime）。
# 纯 CPU 任务（驱动 training/dataline 的 sampler，只抽样不取图；回源验证仅小子集真读图）。
# 集群节点都带 GPU、无纯 CPU 池 → 申请 gpuPerWorker:1（不使用，仅为可调度），CPU/内存给足。
# 提交: jcc job submit jobs/dryrun_sampler_stats.yaml
# 看日志: jcc job log evan-mot-dryrun-sampler -f
# 产物(小, 落 /fsx): experiments/results/dryrun/sampler_stats.json + sampler_stats_report.html
name: evan-mot-dryrun-sampler
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 64
memGBPerWorker: 1200
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  mkdir -p /local/evan/cache/huggingface /local/evan/mot_stats /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  echo "===== STACK PROBE ====="
  nproc; free -g | head -2
  $PY -c "import numpy,pyarrow,PIL,transformers; print('np',numpy.__version__,'pa',pyarrow.__version__,'tf',transformers.__version__)"

  echo "===== DRY-RUN SAMPLER STATS (256/512/1024, 1M draws each) ====="
  # 全量 manifest + 全量 anime（with_caption, 多线程加载）；真 Qwen tokenizer 算截断率；回源验证每域 300。
  timeout 5h $PY scripts/dryrun_sampler_stats.py \
    --stages 256,512,1024 \
    --n-draws 1000000 \
    --caption-sample 30000 --caption-max-src 80 \
    --backfetch-per-domain 300 \
    --workers 48 \
    --tokenizer /fsx/models/Qwen3-VL-2B-Instruct \
    --stats-cache /local/evan/mot_stats/monet_global_stats.json \
    --anime-cache /local/evan/anime_img_cache \
    --out experiments/results/dryrun/sampler_stats.json

  echo "===== RENDER HTML ====="
  $PY scripts/dryrun_report_html.py \
    experiments/results/dryrun/sampler_stats.json \
    experiments/results/dryrun/sampler_stats_report.html

  echo "===== DONE ====="
  ls -la experiments/results/dryrun/
