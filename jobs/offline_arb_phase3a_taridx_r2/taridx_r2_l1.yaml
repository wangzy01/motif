# OFFLINE_ARB_V1 Phase-3a taridx r2 分片 l1(2026-07-10 晚重排:tar-range 分片,3 并行滚动)。
# subsources=monet_real__laion tar_shard=1:3 scan_timeout=10800s。
name: evan-mot-crop-offlinearb-p3a-tidx2-l1
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 96
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_tarindex_v1
  mkdir -p "$ROOT"
  echo "JOB=tidx2-l1 host=$(hostname) started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$ROOT/run_info_r2_l1.txt"
  "$PY" -m py_compile scripts/offline_arb/phase3a_tar_index.py
  "$PY" scripts/offline_arb/phase3a_tar_index.py --self-test 2>&1 | tee "$ROOT/selftest_r2_l1.log"
  RC=0
  set +e
  timeout --signal=TERM --kill-after=60s 10800s \
    "$PY" scripts/offline_arb/phase3a_tar_index.py \
      --output-dir "$ROOT" --workers 14 --scan-mode stream \
      --subsources monet_real__laion \
      --tar-shard 1:3 --job-tag r2l1 \
    2>&1 | tee "$ROOT/run_r2_l1.log"
  RC=${PIPESTATUS[0]}
  set -e
  echo "==== TARIDX-R2-l1 scan exit_code=$RC ===="
  exit "$RC"

