# Fresh-job random-pread replay.  Never run this in the builder pod.
# Fill explicit source jobtags before submission and freeze this YAML afterward;
# analyzer rejects live-byte drift or auto/latest selection.
name: evan-mot-crop-offlinearb-gpic-blob-pilot-replay
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES="" PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0 PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1

  # Explicitly edit these bindings after the independent build job completes.
  SOURCE_BUILD_JOBTAG=evan-mot-crop-offlinearb-gpic-blob-pilot-build-m86c
  INCLUDE_S3=true
  SOURCE_S3_BUILD_JOBTAG=evan-mot-crop-offlinearb-gpic-blob-pilot-s3-build-vhgz
  [ -n "$SOURCE_BUILD_JOBTAG" ] \
    || { echo "FATAL: SOURCE_BUILD_JOBTAG is required"; exit 2; }
  if [ "$INCLUDE_S3" = true ]; then
    [ -n "$SOURCE_S3_BUILD_JOBTAG" ] \
      || { echo "FATAL: SOURCE_S3_BUILD_JOBTAG is required when INCLUDE_S3=true"; exit 2; }
  elif [ "$INCLUDE_S3" != false ]; then
    echo "FATAL: INCLUDE_S3 must be literal true or false"; exit 2
  fi

  HOST=$(hostname); [ "${HOST##*-}" = 0 ] || { echo "FATAL: worker identity drift"; exit 2; }
  JOBTAG=${HOST%-0}
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER=$REPO/scripts/offline_arb/run_offline_gpic_blob_pilot.py
  SELF=$REPO/jobs/offline_arb_gpic_blob_pilot_replay.yaml
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  RUN_ID=offline_gpic_blob_pilot_20260712r2
  FSX_ROOT=$BASE/$RUN_ID/$SOURCE_BUILD_JOBTAG
  EVIDENCE=$BASE/${RUN_ID}_replay_evidence/$JOBTAG
  S3_ROOT=/s3/evan/artifacts/$RUN_ID/$SOURCE_S3_BUILD_JOBTAG/s3_20k_s0_b4g
  [ ! -e "$EVIDENCE" ] && [ ! -L "$EVIDENCE" ] || { echo "FATAL: replay evidence exists"; exit 2; }
  for ROOT in "$FSX_ROOT/full100k_s0_b4g" "$FSX_ROOT/compare20k_s0_b1g" "$FSX_ROOT/compare20k_s0_b4g"; do
    [ -f "$ROOT/manifest.json" ] && [ -f "$ROOT/_SUCCESS" ] \
      || { echo "FATAL: FSx replay input missing"; exit 2; }
  done
  if [ "$INCLUDE_S3" = true ]; then
    [ -f "$S3_ROOT/manifest.json" ] && [ -f "$S3_ROOT/_SUCCESS" ] \
      || { echo "FATAL: S3 replay input missing"; exit 2; }
  fi
  mkdir -m 700 -p "$EVIDENCE"

  replay() {
    NAME=$1; ROOT=$2; SEED=$3; MODE=$4; ROLE=$5; SEQUENCE=$6
    timeout --preserve-status --signal=TERM --kill-after=30s 10800s \
      "$PY" "$RUNNER" replay --root "$ROOT" --workers 16 --repeats 1 \
        --seed "$SEED" --timeout-seconds 7200 --job-spec "$SELF" \
        --selection-mode "$MODE" --arm-role "$ROLE" \
        --arm-sequence-index "$SEQUENCE" --min-cold-regions 64 \
        --output "$EVIDENCE/$NAME.json"
  }

  # All capacity authorities run before any full-coverage pass.  Each uses at
  # most one complete segment per 16-MiB guard region with an 8-MiB potential
  # readahead allowance.  Later full passes are integrity-only and never enter
  # the capacity summary.
  replay full100k_capacity "$FSX_ROOT/full100k_s0_b4g" 2026071201 cold_unique_region capacity_authority 0
  replay fsx_s0b1_capacity "$FSX_ROOT/compare20k_s0_b1g" 2026071202 cold_unique_region capacity_authority 0
  replay fsx_s0b4_capacity "$FSX_ROOT/compare20k_s0_b4g" 2026071203 cold_unique_region capacity_authority 0
  if [ "$INCLUDE_S3" = true ]; then
    replay s3_s0b4_capacity "$S3_ROOT" 2026071204 cold_unique_region capacity_authority 0
  fi
  replay full100k_integrity "$FSX_ROOT/full100k_s0_b4g" 2026071201 full_coverage integrity_warm 1
  replay fsx_s0b1_integrity "$FSX_ROOT/compare20k_s0_b1g" 2026071202 full_coverage integrity_warm 1
  replay fsx_s0b4_integrity "$FSX_ROOT/compare20k_s0_b4g" 2026071203 full_coverage integrity_warm 1
  if [ "$INCLUDE_S3" = true ]; then
    replay s3_s0b4_integrity "$S3_ROOT" 2026071204 full_coverage integrity_warm 1
  fi
  echo "OFFLINE_GPIC_BLOB_PILOT_REPLAY_JOB_PASS evidence=$EVIDENCE s3=$INCLUDE_S3"
