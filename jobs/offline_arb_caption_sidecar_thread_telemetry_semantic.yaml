# Additive sidecar-direct semantic matrix:
#   worker0 = L32 telemetry-off
#   worker1 = L16 telemetry-off
#   worker2 = L16 telemetry-on
# All arms consume one byte-identical formal config snapshot, the same w4 plan,
# catalog, caption sidecar, and exact 6/12-step plan prefix.  This job is
# independent from (and does not replace) the source three-arm semantic proof.
name: evan-offarb-caption-thread-semantic
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 3
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  export OFFLINE_ARB_STEP_TIMEOUT_S=1800
  export OFFLINE_ARB_PREFETCH_STEPS=4
  export OFFLINE_ARB_PROFILE_WINDOWS=0
  export OFFLINE_ARB_WAIT_LOG_THRESHOLD_S=2
  export OFFLINE_ARB_IO_STATE_EVERY_STEPS=4
  unset OFFLINE_ARB_ANIME_CAPTION_ROOT OFFLINE_ARB_ANIME_CAPTION_WORKERS
  unset OFFLINE_ARB_IO_TELEMETRY_DIR OFFLINE_ARB_ATTEMPT_JOBTAG
  unset OFFLINE_ARB_ATTEMPT_NONCE OFFLINE_ARB_ATTEMPT_HOST
  unset OFFLINE_ARB_SIDECAR_HEADER_SHA256 OFFLINE_ARB_SIDECAR_RELEASE_DIGEST

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  FORMAL_CFG=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop/configs/stage256_offline_exact_v1.yaml
  PLAN_ROOT=$BASE/offline_arb_plans_v1/w4_smoke/plan
  CATALOG_ROOT=$BASE/offline_arb_catalog_v1
  ANIME_FREQ_ROOT=$BASE/offline_arb_animefreq_v1
  SIDECAR_ROOT=$BASE/offline_arb_caption_sidecar_v1
  HOST=$(hostname)
  IDX=${HOST##*-}
  JOBTAG=${HOST%-*}
  case "$IDX" in
    0) ARM=l32_off; THREADS=32; TELEMETRY=false ;;
    1) ARM=l16_off; THREADS=16; TELEMETRY=false ;;
    2) ARM=l16_on;  THREADS=16; TELEMETRY=true ;;
    *) echo "FATAL: unexpected worker index $IDX from $HOST" >&2; exit 20 ;;
  esac

  OUT=$BASE/offline_arb_caption_thread_telemetry_semantic_v1
  RUN_DIR=$OUT/$JOBTAG
  LOCAL_TMP=/local/evan/offline_arb_caption_thread_semantic_${JOBTAG}_${ARM}
  mkdir -p "$OUT" "$LOCAL_TMP/pycache"
  export PYTHONPYCACHEPREFIX=$LOCAL_TMP/pycache
  test -f "$FORMAL_CFG" && test ! -L "$FORMAL_CFG"
  test -d "$PLAN_ROOT" && test ! -L "$PLAN_ROOT"
  test -d "$CATALOG_ROOT" && test ! -L "$CATALOG_ROOT"
  test -d "$ANIME_FREQ_ROOT" && test ! -L "$ANIME_FREQ_ROOT"
  test -d "$SIDECAR_ROOT" && test ! -L "$SIDECAR_ROOT"

  if [ "$IDX" = 0 ]; then
    CONTROL=$LOCAL_TMP/sidecar_control.json
    "$PY" scripts/offline_arb/make_freeze_manifest.py \
      --verify-sidecar-control --sidecar-root "$SIDECAR_ROOT" \
      --catalog-root "$CATALOG_ROOT" > "$CONTROL.tmp"
    mv "$CONTROL.tmp" "$CONTROL"
    "$PY" - "$RUN_DIR" "$JOBTAG" "$HOST" "$FORMAL_CFG" "$SIDECAR_ROOT" \
      "$PLAN_ROOT" "$CATALOG_ROOT" "$CONTROL" <<'PYEOF'
  import hashlib
  import json
  import os
  import re
  import secrets
  import sys
  from pathlib import Path

  import yaml

  root = Path(sys.argv[1])
  jobtag, host = sys.argv[2:4]
  formal, sidecar, plan_root, catalog_root, control_path = map(Path, sys.argv[4:])
  root.mkdir()
  raw = formal.read_bytes()
  config = yaml.safe_load(raw)
  dataset = config.get("dataset") if isinstance(config, dict) else None
  if not isinstance(dataset, dict):
      raise SystemExit("FATAL formal config dataset is not a mapping")
  if dataset.get("gpic_payload_in_memory") is not True:
      raise SystemExit("FATAL matrix requires formal direct GPIC payloads")
  if Path(dataset.get("offline_caption_sidecar_root", "")) != sidecar:
      raise SystemExit("FATAL matrix requires the formal caption sidecar root")
  sidecar_header_raw = (sidecar / "header.json").read_bytes()
  sidecar_header = json.loads(sidecar_header_raw)
  header_sha = sidecar_header.get("header_sha256")
  if (
      not re.fullmatch(r"[0-9a-f]{64}", str(header_sha or ""))
      or (sidecar / "_SUCCESS").read_text(encoding="ascii")
      not in {header_sha, header_sha + "\n"}
  ):
      raise SystemExit("FATAL sidecar header/_SUCCESS identity mismatch")
  control_raw = control_path.read_bytes()
  control = json.loads(control_raw)
  release = control.get("release_digest")
  if (
      control.get("status") != "PASS"
      or control.get("mode") != "verify-sidecar-control"
      or control.get("header_sha256") != header_sha
      or not re.fullmatch(r"[0-9a-f]{64}", str(release or ""))
  ):
      raise SystemExit("FATAL sidecar control identity mismatch")
  plan_raw = (plan_root / "header.json").read_bytes()
  plan = json.loads(plan_raw)
  catalog_raw = (catalog_root / "header.json").read_bytes()
  catalog = json.loads(catalog_raw)
  for label, value in (
      ("plan_hash", plan.get("plan_hash")),
      ("catalog_hash", catalog.get("catalog_hash")),
  ):
      if not re.fullmatch(r"[0-9a-f]{64}", str(value or "")):
          raise SystemExit(f"FATAL malformed {label}")
  snapshot_tmp = root / ".formal.snapshot.yaml.tmp"
  snapshot_tmp.write_bytes(raw)
  os.replace(snapshot_tmp, root / "formal.snapshot.yaml")
  run = {
      "schema_version": "offline_arb_caption_thread_matrix_run_v1",
      "jobtag": jobtag,
      "run_nonce": secrets.token_hex(32),
      "worker0_host": host,
      "config_sha256": hashlib.sha256(raw).hexdigest(),
      "sidecar_header_sha256": header_sha,
      "sidecar_header_file_sha256": hashlib.sha256(sidecar_header_raw).hexdigest(),
      "sidecar_release_digest": release,
      "sidecar_control_sha256": hashlib.sha256(control_raw).hexdigest(),
      "plan_hash": plan["plan_hash"],
      "plan_header_sha256": hashlib.sha256(plan_raw).hexdigest(),
      "catalog_hash": catalog["catalog_hash"],
      "catalog_header_sha256": hashlib.sha256(catalog_raw).hexdigest(),
  }
  temporary = root / ".run.json.tmp"
  temporary.write_text(json.dumps(run, sort_keys=True) + "\n", encoding="utf-8")
  os.replace(temporary, root / "run.json")
  PYEOF
  else
    timeout --signal=TERM --kill-after=10s 600s bash -c '
      set -euo pipefail
      for _ in $(seq 1 120); do
        [ -s "$1/run.json" ] && [ -s "$1/formal.snapshot.yaml" ] && exit 0
        sleep 5
      done
      echo "FATAL: timed out waiting for thread-matrix snapshot" >&2
      exit 31
    ' _ "$RUN_DIR"
  fi

  IFS=$'\t' read -r RUN_NONCE CONFIG_SHA SIDECAR_HEADER_SHA SIDECAR_RELEASE PLAN_HASH CATALOG_HASH < <(
    "$PY" - "$RUN_DIR/run.json" "$RUN_DIR/formal.snapshot.yaml" "$JOBTAG" <<'PYEOF'
  import hashlib, json, re, sys
  from pathlib import Path
  run = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
  snapshot = Path(sys.argv[2]).read_bytes()
  required = (
      "run_nonce", "config_sha256", "sidecar_header_sha256",
      "sidecar_release_digest", "plan_hash", "catalog_hash",
  )
  if (
      run.get("schema_version") != "offline_arb_caption_thread_matrix_run_v1"
      or run.get("jobtag") != sys.argv[3]
      or any(not re.fullmatch(r"[0-9a-f]{64}", str(run.get(key, ""))) for key in required)
      or hashlib.sha256(snapshot).hexdigest() != run.get("config_sha256")
  ):
      raise SystemExit("FATAL thread-matrix run snapshot mismatch")
  print(*(run[key] for key in required), sep="\t")
  PYEOF
  )
  record_failure() {
    local rc=$?
    if [ "$rc" -ne 0 ]; then
      printf '%s rc=%s host=%s arm=%s\n' "$RUN_NONCE" "$rc" "$HOST" "$ARM" \
        > "$RUN_DIR/.thread.failed.worker${IDX}.tmp" || true
      mv "$RUN_DIR/.thread.failed.worker${IDX}.tmp" \
        "$RUN_DIR/thread.failed.worker${IDX}" || true
    fi
  }
  trap record_failure EXIT

  export OFFLINE_ARB_SMOKE_DATASET_CONFIG=$RUN_DIR/formal.snapshot.yaml
  export OFFLINE_ARB_GPIC_THREADS_PER_NODE=$THREADS
  if [ "$TELEMETRY" = true ]; then
    export OFFLINE_ARB_ATTEMPT_JOBTAG=$JOBTAG
    export OFFLINE_ARB_ATTEMPT_NONCE=$RUN_NONCE
    export OFFLINE_ARB_ATTEMPT_HOST=$HOST
    export OFFLINE_ARB_SIDECAR_HEADER_SHA256=$SIDECAR_HEADER_SHA
    export OFFLINE_ARB_SIDECAR_RELEASE_DIGEST=$SIDECAR_RELEASE
  fi

  for STEPS in 6 12; do
    export OFFLINE_ARB_LOCAL_ROOT=$LOCAL_TMP/payload_steps$STEPS
    LOG_TMP=$RUN_DIR/.thread.${ARM}.steps${STEPS}.${HOST}.log.tmp
    LOG=$RUN_DIR/thread.${ARM}.steps${STEPS}.${HOST}.log
    RESULT_TMP=$RUN_DIR/.thread.${ARM}.steps${STEPS}.json.tmp
    RESULT=$RUN_DIR/thread.${ARM}.steps${STEPS}.json
    TELEMETRY_ROOT=-
    if [ "$TELEMETRY" = true ]; then
      TELEMETRY_ROOT=/local/evan/offline_arb_caption_thread_matrix/$JOBTAG/$RUN_NONCE/$ARM/steps$STEPS
      [ ! -e "$TELEMETRY_ROOT" ] && [ ! -L "$TELEMETRY_ROOT" ] \
        || { echo "FATAL: stale telemetry root $TELEMETRY_ROOT"; exit 40; }
      mkdir -p -m 0700 "$TELEMETRY_ROOT"
      TELEMETRY_REAL=$(realpath -e "$TELEMETRY_ROOT")
      case "$TELEMETRY_REAL" in (/local/*) ;; (*) echo "FATAL: telemetry root escaped /local"; exit 40;; esac
      [ "$TELEMETRY_REAL" = "$TELEMETRY_ROOT" ] \
        || { echo "FATAL: telemetry root resolution drift"; exit 40; }
      export OFFLINE_ARB_IO_TELEMETRY_DIR=$TELEMETRY_ROOT
    else
      unset OFFLINE_ARB_IO_TELEMETRY_DIR
    fi

    set +e
    timeout --signal=TERM --kill-after=60s 7260s \
      "$PY" scripts/offline_arb/smoke_offline_loader.py \
        --plan-root "$PLAN_ROOT" \
        --catalog-root "$CATALOG_ROOT" \
        --anime-freq-root "$ANIME_FREQ_ROOT" \
        --ranks 4 --steps "$STEPS" --worker-timeout-s 7100 \
        2>&1 | tee "$LOG_TMP"
    PIPE_RC=("${PIPESTATUS[@]}")
    set -e
    SMOKE_RC=${PIPE_RC[0]}
    TEE_RC=${PIPE_RC[1]}
    if [ "$TEE_RC" -ne 0 ]; then
      rm -f "$LOG_TMP"
      echo "FATAL matrix tee failed arm=$ARM steps=$STEPS rc=$TEE_RC" >&2
      exit "$TEE_RC"
    fi
    mv "$LOG_TMP" "$LOG"
    if [ "$SMOKE_RC" -ne 0 ]; then
      echo "FATAL matrix smoke failed arm=$ARM steps=$STEPS rc=$SMOKE_RC" >&2
      exit "$SMOKE_RC"
    fi

    "$PY" - "$LOG" "$RESULT_TMP" "$TELEMETRY_ROOT" "$ARM" "$THREADS" \
      "$TELEMETRY" "$STEPS" "$RUN_NONCE" "$JOBTAG" "$IDX" "$HOST" \
      "$CONFIG_SHA" "$SIDECAR_HEADER_SHA" "$SIDECAR_RELEASE" \
      "$PLAN_ROOT" "$CATALOG_ROOT" <<'PYEOF'
  import hashlib
  import json
  import os
  import re
  import stat
  import sys
  from pathlib import Path

  log_path, output_path = map(Path, sys.argv[1:3])
  telemetry_root_raw, arm, threads_raw, telemetry_raw, steps_raw = sys.argv[3:8]
  nonce, jobtag, worker_raw, host = sys.argv[8:12]
  config_sha, sidecar_header, sidecar_release = sys.argv[12:15]
  plan_root, catalog_root = map(Path, sys.argv[15:17])
  threads = int(threads_raw)
  steps = int(steps_raw)
  telemetry_enabled = telemetry_raw == "true"
  raw = log_path.read_text(encoding="utf-8")
  if "OFFLINE_ARB_WINDOW_PROFILE" in raw or re.search(r"caption_backend=(source|sidecar)", raw):
      raise SystemExit("FATAL legacy PROFILE_WINDOWS output in thread matrix")
  marker = '{\n  "assertions"'
  start = raw.find(marker)
  if start < 0:
      raise SystemExit(f"FATAL smoke JSON not found: {log_path}")
  smoke, _end = json.JSONDecoder().raw_decode(raw[start:])
  if smoke.get("status") != "PASS" or smoke.get("steps") != steps:
      raise SystemExit("FATAL smoke status/steps mismatch")
  if set(smoke.get("per_rank", {})) != {"0", "1", "2", "3"}:
      raise SystemExit("FATAL smoke per-rank set mismatch")
  hash_keys = ("trace_sha256", "prompts_sha256", "pixels_sha256", "cfg_keep_sha256")
  for rank, rank_value in smoke["per_rank"].items():
      for key in hash_keys:
          if not re.fullmatch(r"[0-9a-f]{64}", str(rank_value.get(key, ""))):
              raise SystemExit(f"FATAL malformed hash rank={rank} key={key}")

  telemetry_evidence = {"status": "OFF", "enabled": False, "rank_files": 0}
  if telemetry_enabled:
      root = Path(telemetry_root_raw)
      root_meta = root.lstat()
      if not stat.S_ISDIR(root_meta.st_mode) or root.is_symlink():
          raise SystemExit("FATAL telemetry root is not a real directory")
      plan = json.loads((plan_root / "header.json").read_text(encoding="utf-8"))
      catalog = json.loads((catalog_root / "header.json").read_text(encoding="utf-8"))
      expected_names = {f"io_profile.rank{rank:04d}.jsonl" for rank in range(4)}
      observed_names = {path.name for path in root.iterdir()}
      if observed_names != expected_names:
          raise SystemExit(
              f"FATAL telemetry file set mismatch observed={observed_names} expected={expected_names}"
          )
      shared_root = output_path.parent / f"thread_telemetry.{arm}.steps{steps}"
      shared_stage = output_path.parent / f".thread_telemetry.{arm}.steps{steps}.{host}.tmp"
      if shared_root.exists() or shared_root.is_symlink() or shared_stage.exists() or shared_stage.is_symlink():
          raise SystemExit("FATAL stale shared telemetry evidence directory")
      shared_stage.mkdir(mode=0o700)
      def write_all(handle, payload):
          view = memoryview(payload)
          while view:
              written = handle.write(view)
              if not written:
                  raise OSError("short write while preserving shared telemetry")
              view = view[written:]
      files = []
      for rank in range(4):
          path = root / f"io_profile.rank{rank:04d}.jsonl"
          meta = path.lstat()
          if not stat.S_ISREG(meta.st_mode) or path.is_symlink() or meta.st_size <= 0:
              raise SystemExit(f"FATAL invalid telemetry file rank={rank}")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          if not lines or any(not line.endswith("\n") for line in lines):
              raise SystemExit(f"FATAL incomplete telemetry line rank={rank}")
          records = [json.loads(line) for line in lines]
          for sequence, record in enumerate(records):
              if (
                  not isinstance(record, dict)
                  or record.get("schema_version") != "offline_arb_io_profile_v1"
                  or record.get("sequence") != sequence
                  or record.get("rank") != rank
              ):
                  raise SystemExit(f"FATAL telemetry schema/sequence/rank drift rank={rank}")
          identities = [value for value in records if value.get("record_type") == "identity"]
          closures = [value for value in records if value.get("record_type") == "closure"]
          if len(identities) != 1 or identities[0] is not records[0]:
              raise SystemExit(f"FATAL identity is not unique first record rank={rank}")
          if len(closures) != 1 or closures[0] is not records[-1]:
              raise SystemExit(f"FATAL closure is not unique last record rank={rank}")
          identity = identities[0]
          expected_identity = {
              "world_size": 4,
              "local_rank": rank,
              "local_world_size": 4,
              "plan_id": plan["plan_id"],
              "plan_hash": plan["plan_hash"],
              "catalog_hash": catalog["catalog_hash"],
              "sidecar_header_sha256": sidecar_header,
              "sidecar_release_digest": sidecar_release,
              "attempt_jobtag": jobtag,
              "attempt_nonce": nonce,
              "attempt_host": host,
              "telemetry_root": str(root),
              "telemetry_path": str(path),
              "prefetch_steps": 4,
              "gpic_threads_per_node": 16,
              "gpic_workers_per_rank": 4,
              "tar_workers_per_rank": 8,
              "gpic_payload_in_memory": True,
          }
          for key, expected in expected_identity.items():
              if identity.get(key) != expected:
                  raise SystemExit(
                      f"FATAL identity drift rank={rank} key={key}: "
                      f"{identity.get(key)!r} != {expected!r}"
                  )
          closure = closures[0]
          before = len(records) - 1
          windows = sum(value.get("record_type") == "window" for value in records)
          rejected_before = closure.get("rejected_emits_before_closure")
          rejected_observed = closure.get("rejected_emits_observed_by_writer")
          if (
              closure.get("next_step") != steps
              or closure.get("records_before_closure") != before
              or closure.get("records_enqueued_before_closure") != before
              or closure.get("telemetry_fatal") is not False
              or closure.get("dropped_emits") != 0
              or closure.get("runtime_errors") != 0
              or type(rejected_before) is not int
              or type(rejected_observed) is not int
              or rejected_before != 0
              or rejected_observed != 0
              or rejected_before != rejected_observed
              or windows <= 0
          ):
              raise SystemExit(f"FATAL closure accounting drift rank={rank}")
          raw_bytes = path.read_bytes()
          digest = hashlib.sha256(raw_bytes).hexdigest()
          shared_path = shared_stage / path.name
          with shared_path.open("xb", buffering=0) as handle:
              write_all(handle, raw_bytes)
              os.fsync(handle.fileno())
          files.append(
              {
                  "rank": rank,
                  "local_path": str(path),
                  "shared_path": str(shared_root / path.name),
                  "bytes": meta.st_size,
                  "sha256": digest,
                  "records": len(records),
                  "windows": windows,
                  "identity": identity,
                  "closure": closure,
              }
          )
      manifest_value = {
          "status": "PASS",
          "schema_version": "offline_arb_caption_thread_matrix_shared_telemetry_v1",
          "jobtag": jobtag,
          "run_nonce": nonce,
          "host": host,
          "arm": arm,
          "steps": steps,
          "local_root": str(root),
          "shared_root": str(shared_root),
          "files": files,
      }
      manifest_payload = (
          json.dumps(
              manifest_value,
              ensure_ascii=False,
              indent=2,
              sort_keys=True,
              allow_nan=False,
          )
          + "\n"
      ).encode("utf-8")
      manifest_stage = shared_stage / "manifest.json"
      with manifest_stage.open("xb", buffering=0) as handle:
          write_all(handle, manifest_payload)
          os.fsync(handle.fileno())
      directory_fd = os.open(shared_stage, os.O_RDONLY | os.O_DIRECTORY)
      try:
          os.fsync(directory_fd)
      finally:
          os.close(directory_fd)
      os.replace(shared_stage, shared_root)
      parent_fd = os.open(output_path.parent, os.O_RDONLY | os.O_DIRECTORY)
      try:
          os.fsync(parent_fd)
      finally:
          os.close(parent_fd)
      manifest_final = shared_root / "manifest.json"
      telemetry_evidence = {
          "status": "PASS",
          "enabled": True,
          "schema_version": "offline_arb_caption_thread_matrix_telemetry_v1",
          "local_root": str(root),
          "shared_root": str(shared_root),
          "manifest": str(manifest_final),
          "manifest_sha256": hashlib.sha256(manifest_final.read_bytes()).hexdigest(),
          "rank_files": len(files),
          "files": files,
      }
  elif telemetry_root_raw != "-" or "OFFLINE_ARB_IO_TELEMETRY_DIR" in os.environ:
      raise SystemExit("FATAL telemetry-off arm retained telemetry environment")

  snapshot_path = Path(os.environ["OFFLINE_ARB_SMOKE_DATASET_CONFIG"])
  snapshot_sha = hashlib.sha256(snapshot_path.read_bytes()).hexdigest()
  if snapshot_sha != config_sha:
      raise SystemExit("FATAL config snapshot SHA drift")
  value = {
      "status": "PASS",
      "schema_version": "offline_arb_caption_thread_matrix_arm_v1",
      "arm": arm,
      "gpic_threads_per_node": threads,
      "telemetry_enabled": telemetry_enabled,
      "steps": steps,
      "run_context": {
          "run_nonce": nonce,
          "jobtag": jobtag,
          "worker_index": int(worker_raw),
          "host": host,
      },
      "shared_inputs": {
          "config_path": str(snapshot_path),
          "config_sha256": snapshot_sha,
          "caption_backend": "sidecar_direct",
          "sidecar_header_sha256": sidecar_header,
          "sidecar_release_digest": sidecar_release,
      },
      "telemetry": telemetry_evidence,
      "smoke": smoke,
      "log": str(log_path),
  }
  output_path.write_text(
      json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
      encoding="utf-8",
  )
  PYEOF
    mv "$RESULT_TMP" "$RESULT"
    echo "CAPTION_THREAD_MATRIX_ARM_DONE arm=$ARM steps=$STEPS result=$RESULT" >&2
  done

  if [ "$IDX" != 0 ]; then
    exit 0
  fi
  timeout --signal=TERM --kill-after=30s 28800s bash -c '
    set -euo pipefail
    for _ in $(seq 1 2880); do
      for index in 0 1 2; do
        if [ -s "$1/thread.failed.worker$index" ] && grep -Fq "$2" "$1/thread.failed.worker$index"; then
          echo "FATAL: thread matrix peer failed worker=$index" >&2
          exit 32
        fi
      done
      ready=1
      for arm in l32_off l16_off l16_on; do
        for steps in 6 12; do
          [ -s "$1/thread.$arm.steps$steps.json" ] || ready=0
        done
      done
      [ "$ready" -eq 1 ] && exit 0
      sleep 10
    done
    echo "FATAL: timed out waiting for thread matrix arms" >&2
    exit 31
  ' _ "$RUN_DIR" "$RUN_NONCE"

  FINAL_CONTROL=$LOCAL_TMP/sidecar_control.final.json
  "$PY" scripts/offline_arb/make_freeze_manifest.py \
    --verify-sidecar-control --sidecar-root "$SIDECAR_ROOT" \
    --catalog-root "$CATALOG_ROOT" > "$FINAL_CONTROL.tmp"
  mv "$FINAL_CONTROL.tmp" "$FINAL_CONTROL"
  "$PY" - "$RUN_DIR" "$RUN_NONCE" "$JOBTAG" "$PLAN_ROOT" \
    "$CATALOG_ROOT" "$SIDECAR_ROOT" "$FINAL_CONTROL" <<'PYEOF'
  import hashlib
  import json
  import os
  import stat
  import sys
  from pathlib import Path

  root = Path(sys.argv[1])
  nonce, jobtag = sys.argv[2:4]
  plan_root, catalog_root, sidecar_root, control_path = map(Path, sys.argv[4:8])
  run = json.loads((root / "run.json").read_text(encoding="utf-8"))
  if run.get("run_nonce") != nonce or run.get("jobtag") != jobtag:
      raise SystemExit("FATAL aggregate run identity mismatch")
  snapshot_raw = (root / "formal.snapshot.yaml").read_bytes()
  plan_raw = (plan_root / "header.json").read_bytes()
  catalog_raw = (catalog_root / "header.json").read_bytes()
  sidecar_raw = (sidecar_root / "header.json").read_bytes()
  sidecar = json.loads(sidecar_raw)
  control = json.loads(control_path.read_text(encoding="utf-8"))
  if (
      hashlib.sha256(snapshot_raw).hexdigest() != run.get("config_sha256")
      or hashlib.sha256(plan_raw).hexdigest() != run.get("plan_header_sha256")
      or hashlib.sha256(catalog_raw).hexdigest() != run.get("catalog_header_sha256")
      or hashlib.sha256(sidecar_raw).hexdigest() != run.get("sidecar_header_file_sha256")
      or sidecar.get("header_sha256") != run.get("sidecar_header_sha256")
      or (sidecar_root / "_SUCCESS").read_text(encoding="ascii")
      not in {run["sidecar_header_sha256"], run["sidecar_header_sha256"] + "\n"}
      or control.get("status") != "PASS"
      or control.get("mode") != "verify-sidecar-control"
      or control.get("header_sha256") != run.get("sidecar_header_sha256")
      or control.get("release_digest") != run.get("sidecar_release_digest")
  ):
      raise SystemExit("FATAL shared config/plan/catalog/sidecar identity changed")
  arms = ("l32_off", "l16_off", "l16_on")
  expected = {
      "l32_off": (0, 32, False),
      "l16_off": (1, 16, False),
      "l16_on": (2, 16, True),
  }
  by_steps = {
      steps: {
          arm: json.loads((root / f"thread.{arm}.steps{steps}.json").read_text(encoding="utf-8"))
          for arm in arms
      }
      for steps in (6, 12)
  }
  hash_keys = ("trace_sha256", "prompts_sha256", "pixels_sha256", "cfg_keep_sha256")
  identity_keys = (
      "plan_id", "plan_hash", "catalog_hash", "assignment_hash",
      "semantic_hash_schema", "ranks", "per_rank_bs", "start_step", "steps",
  )
  comparisons = {}
  for steps in (6, 12):
      values = by_steps[steps]
      for arm in arms:
          result = values[arm]
          worker, threads, telemetry = expected[arm]
          context = result.get("run_context", {})
          shared = result.get("shared_inputs", {})
          telemetry_evidence = result.get("telemetry", {})
          if (
              result.get("status") != "PASS"
              or result.get("schema_version") != "offline_arb_caption_thread_matrix_arm_v1"
              or result.get("arm") != arm
              or result.get("steps") != steps
              or result.get("gpic_threads_per_node") != threads
              or result.get("telemetry_enabled") is not telemetry
              or context.get("worker_index") != worker
              or context.get("run_nonce") != nonce
              or context.get("jobtag") != jobtag
              or not context.get("host")
              or shared.get("config_path") != str(root / "formal.snapshot.yaml")
              or shared.get("config_sha256") != run["config_sha256"]
              or shared.get("caption_backend") != "sidecar_direct"
              or shared.get("sidecar_header_sha256") != run["sidecar_header_sha256"]
              or shared.get("sidecar_release_digest") != run["sidecar_release_digest"]
          ):
              raise SystemExit(f"FATAL arm identity drift arm={arm} steps={steps}")
          if telemetry:
              if telemetry_evidence.get("status") != "PASS" or telemetry_evidence.get("rank_files") != 4:
                  raise SystemExit("FATAL L16-on telemetry evidence is incomplete")
              expected_shared = root / f"thread_telemetry.{arm}.steps{steps}"
              expected_manifest = expected_shared / "manifest.json"
              if (
                  telemetry_evidence.get("shared_root") != str(expected_shared)
                  or telemetry_evidence.get("manifest") != str(expected_manifest)
                  or expected_shared.is_symlink()
                  or not expected_shared.is_dir()
                  or expected_manifest.is_symlink()
                  or not expected_manifest.is_file()
                  or hashlib.sha256(expected_manifest.read_bytes()).hexdigest()
                  != telemetry_evidence.get("manifest_sha256")
              ):
                  raise SystemExit("FATAL shared telemetry manifest identity mismatch")
              manifest = json.loads(expected_manifest.read_text(encoding="utf-8"))
              if (
                  manifest.get("status") != "PASS"
                  or manifest.get("schema_version")
                  != "offline_arb_caption_thread_matrix_shared_telemetry_v1"
                  or manifest.get("jobtag") != jobtag
                  or manifest.get("run_nonce") != nonce
                  or manifest.get("arm") != arm
                  or manifest.get("steps") != steps
                  or manifest.get("shared_root") != str(expected_shared)
                  or manifest.get("files") != telemetry_evidence.get("files")
              ):
                  raise SystemExit("FATAL shared telemetry manifest content mismatch")
              expected_entries = {"manifest.json"} | {
                  f"io_profile.rank{rank:04d}.jsonl" for rank in range(4)
              }
              if {path.name for path in expected_shared.iterdir()} != expected_entries:
                  raise SystemExit("FATAL shared telemetry directory file-set mismatch")
              for rank, file_evidence in enumerate(manifest["files"]):
                  shared_path = expected_shared / f"io_profile.rank{rank:04d}.jsonl"
                  meta = shared_path.lstat()
                  raw_bytes = shared_path.read_bytes()
                  if (
                      file_evidence.get("rank") != rank
                      or file_evidence.get("shared_path") != str(shared_path)
                      or not stat.S_ISREG(meta.st_mode)
                      or shared_path.is_symlink()
                      or meta.st_size != file_evidence.get("bytes")
                      or hashlib.sha256(raw_bytes).hexdigest()
                      != file_evidence.get("sha256")
                  ):
                      raise SystemExit(f"FATAL shared telemetry file mismatch rank={rank}")
                  records = [json.loads(line) for line in raw_bytes.decode("utf-8").splitlines()]
                  if (
                      not records
                      or records[0] != file_evidence.get("identity")
                      or records[-1] != file_evidence.get("closure")
                      or records[0].get("record_type") != "identity"
                      or records[-1].get("record_type") != "closure"
                      or records[-1].get("rejected_emits_before_closure") != 0
                      or records[-1].get("rejected_emits_observed_by_writer") != 0
                  ):
                      raise SystemExit(f"FATAL shared identity/closure mismatch rank={rank}")
          elif telemetry_evidence != {"status": "OFF", "enabled": False, "rank_files": 0}:
              raise SystemExit(f"FATAL telemetry-off evidence drift arm={arm}")
          smoke = result.get("smoke", {})
          expected_items = int(smoke.get("ranks", -1)) * steps * int(smoke.get("per_rank_bs", -1))
          if smoke.get("assertions", {}).get("item_trace_exact") != expected_items:
              raise SystemExit(f"FATAL exact trace evidence missing arm={arm} steps={steps}")
          if smoke.get("plan_hash") != run["plan_hash"] or smoke.get("catalog_hash") != run["catalog_hash"]:
              raise SystemExit(f"FATAL plan/catalog drift arm={arm} steps={steps}")
      smokes = {arm: values[arm]["smoke"] for arm in arms}
      identities = [{key: smokes[arm].get(key) for key in identity_keys} for arm in arms]
      if identities[1:] != identities[:-1]:
          raise SystemExit(f"FATAL smoke identity mismatch steps={steps}")
      per_rank = {}
      for rank in ("0", "1", "2", "3"):
          per_rank[rank] = {}
          for key in hash_keys:
              hashes = [smokes[arm]["per_rank"][rank].get(key) for arm in arms]
              if len(set(hashes)) != 1:
                  raise SystemExit(
                      f"FATAL semantic drift steps={steps} rank={rank} key={key}: {hashes}"
                  )
              per_rank[rank][key] = hashes[0]
      comparisons[str(steps)] = {
          "identity": identities[0],
          "per_rank_hashes": per_rank,
          "logs": {arm: values[arm]["log"] for arm in arms},
          "telemetry_on": values["l16_on"]["telemetry"],
      }
  aggregate = {
      "status": "PASS",
      "schema_version": "offline_arb_caption_thread_telemetry_semantic_v1",
      "run_context": {"run_nonce": nonce, "jobtag": jobtag},
      "arms": list(arms),
      "steps": [6, 12],
      "matched_hashes": list(hash_keys),
      "shared_inputs": {
          key: run[key]
          for key in (
              "config_sha256", "sidecar_header_sha256", "sidecar_release_digest",
              "plan_hash", "catalog_hash",
          )
      },
      "comparisons": comparisons,
      "interpretation": (
          "Changing GPIC node threads 32->16 and enabling detailed local telemetry "
          "preserved per-rank trace, prompts, pixels, and cfg_keep hashes."
      ),
  }
  temporary = root / ".thread_aggregate.json.tmp"
  final = root / "thread_aggregate.json"
  temporary.write_text(
      json.dumps(aggregate, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
      encoding="utf-8",
  )
  os.replace(temporary, final)
  print(json.dumps(aggregate, ensure_ascii=False, indent=2, sort_keys=True))
  PYEOF
  echo "CAPTION_THREAD_TELEMETRY_SEMANTIC_PASS result=$RUN_DIR/thread_aggregate.json" >&2
