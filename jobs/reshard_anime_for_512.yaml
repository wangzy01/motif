# CONTINGENCY (do NOT run unless 512 will use >16 GPUs): reshard anime source 17->64 (row round-robin).
# Writes to a NEW /s3 path; running 256 runs unaffected. After it finishes, point a 512-specific
# sampling config's anime_caption_source at the out-dir. If 512 runs <=16 GPUs, skip this entirely.
# CPU-bound (gpu:1 only for scheduling). Submit: jcc job submit jobs/reshard_anime_for_512.yaml
name: evan-mot-reshard-anime
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 32
memGBPerWorker: 400
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  echo "===== reshard anime 17->64 $(date -u) ====="; nproc; free -g | head -2
  $PY experiments/exp_scripts/reshard_anime_parquet.py \
    --src-glob '/s3/evan/anime_core_ditv04_ct_soft/data/*.parquet' \
    --out-dir /s3/evan/anime_core_ditv04_ct_soft_resharded64/data \
    --num-shards 64 --batch-rows 20000
  echo "===== reshard done $(date -u) ====="
  ls /s3/evan/anime_core_ditv04_ct_soft_resharded64/data/*.parquet | wc -l
