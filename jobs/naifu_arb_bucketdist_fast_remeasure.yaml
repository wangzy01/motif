# native_bucket_dist 重测（免取图快速审计,50k 样本/域 × 随机 16 shard,替代旧 256 样本头部偏置版）。
# 产出三份 JSON（anime/monet_real/gpic）,由后续步骤折进 configs/stage256_redesign_naifu_arb_v1.yaml。
name: evan-mot-crop-naifu-arb-bdist-fast
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 32
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export OMP_NUM_THREADS=1 ARROW_NUM_THREADS=1 PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1
  RUN_TAG="$(date -u +%Y%m%dT%H%M%SZ)"
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/naifu_arb_bucketdist_fast_$RUN_TAG
  mkdir -p "$ROOT"
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  $PY -m py_compile scripts/audit_naifu_arb_bucketdist_fast.py training/dataline/manifest_index.py
  for D in anime monet_real gpic; do
    $PY scripts/audit_naifu_arb_bucketdist_fast.py \
      --config configs/stage256_redesign_naifu_arb_v1.yaml \
      --domain "$D" --max-samples 50000 --max-shards 16 --anime-nrows 50000 \
      --out "$ROOT/bdist_fast_${D}.json" 2>&1 | tail -5
  done
  echo "[bdist-fast] DONE ROOT=$ROOT"
  ls -la "$ROOT"
