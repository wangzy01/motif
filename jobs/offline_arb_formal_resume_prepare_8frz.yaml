# One-shot, CPU-only preparation for resuming the failed 8frz FORMAL attempt.
# It chains the preceding nlcz recovery, the independent step-51000 checkpoint
# audit and the independent steps1-52940 metrics audit.  Only after all live
# inputs still match those receipts byte-for-byte does it preserve the complete
# failed stream and atomically restore active metrics to steps1-51000.
name: evan-offarb-formal-8frz-resume-prepare
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  SOURCE_JOBTAG=evan-mot-crop-offline-exact-256-8x8-formal-8frz
  PARENT_SOURCE_JOBTAG=evan-mot-crop-offline-exact-256-8x8-formal-nlcz
  PARENT_AUDIT_JOBTAG=evan-offarb-formal-nlcz-resume-prepare-99mv
  CHECKPOINT_AUDIT_JOBTAG=evan-offarb-formal-8frz-checkpoint51000-audit-rvj6
  METRICS_AUDIT_JOBTAG=evan-offarb-formal-8frz-metrics52940-audit-v7tm
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  CK=/fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/stage256_offline_exact_v1
  PARENT=$BASE/offline_formal_resume_prep_v1/$PARENT_SOURCE_JOBTAG/$PARENT_AUDIT_JOBTAG
  CHECKPOINT_AUDIT=$BASE/offline_formal_checkpoint_audit_v1/step51000/$CHECKPOINT_AUDIT_JOBTAG
  METRICS_AUDIT=$BASE/offline_formal_metrics_audit_v1/$SOURCE_JOBTAG/$METRICS_AUDIT_JOBTAG
  AUDIT_HOST=$(hostname)
  AUDIT_JOBTAG=${AUDIT_HOST%-0}
  OUT=$BASE/offline_formal_resume_prep_v1/$SOURCE_JOBTAG/$AUDIT_JOBTAG
  test ! -e "$OUT" && test ! -L "$OUT" \
    || { echo "FATAL: resume-prep output namespace exists: $OUT"; exit 2; }
  mkdir -p "$(dirname "$OUT")"
  mkdir "$OUT"

  "$PY" - "$CK" "$OUT" "$SOURCE_JOBTAG" "$AUDIT_JOBTAG" \
    "$PARENT" "$PARENT_SOURCE_JOBTAG" "$PARENT_AUDIT_JOBTAG" \
    "$CHECKPOINT_AUDIT" "$CHECKPOINT_AUDIT_JOBTAG" \
    "$METRICS_AUDIT" "$METRICS_AUDIT_JOBTAG" <<'PYEOF'
  import hashlib
  import json
  import os
  import stat
  import sys
  from pathlib import Path

  checkpoint_root = Path(sys.argv[1])
  output_root = Path(sys.argv[2])
  source_jobtag = sys.argv[3]
  audit_jobtag = sys.argv[4]
  parent_root = Path(sys.argv[5])
  parent_source_jobtag = sys.argv[6]
  parent_audit_jobtag = sys.argv[7]
  checkpoint_audit_root = Path(sys.argv[8])
  checkpoint_audit_jobtag = sys.argv[9]
  metrics_audit_root = Path(sys.argv[10])
  metrics_audit_jobtag = sys.argv[11]

  checkpoint = checkpoint_root / "last.pt"
  metrics = checkpoint_root / "metrics.jsonl"
  parent_receipt_path = parent_root / "receipt.json"
  parent_success_path = parent_root / "_SUCCESS"
  checkpoint_audit_receipt_path = checkpoint_audit_root / "receipt.json"
  checkpoint_audit_success_path = checkpoint_audit_root / "_SUCCESS"
  metrics_audit_receipt_path = metrics_audit_root / "receipt.json"
  metrics_audit_success_path = metrics_audit_root / "_SUCCESS"

  expected_checkpoint_step = 51_000
  expected_failed_last_step = 52_940
  expected_checkpoint_sha = "7370909185c9c1f4f2144a305674316cd28f711c43e1775bfa3be5ace78d184d"
  expected_checkpoint_identity = {
      "device": 2_985_749_804,
      "inode": 144_116_600_130_240_535,
      "bytes": 22_636_962_042,
      "mtime_ns": 1_784_010_400_000_000_000,
      "ctime_ns": 1_784_010_400_000_000_000,
  }
  expected_failed_metrics_identity = {
      "device": 2_985_749_804,
      "inode": 144_116_600_096_686_081,
      "bytes": 17_451_080,
      "mtime_ns": 1_784_014_126_000_000_000,
      "ctime_ns": 1_784_014_126_000_000_000,
  }
  expected_parent_receipt_sha = "ffe544b5a96b2406f0313e6accf212d21014a1abdb9c10250dd4cc9a0c6a340e"
  expected_parent_success_sha = "78d4b5aace79fa90dde89c414ac7fa833fd49a11d425ab0cd5833895cc6feab2"
  expected_checkpoint_audit_receipt_sha = "a56c91db82db856dd3c1165d6e08c38d128f0a3051036e497bff572f431d4a82"
  expected_checkpoint_audit_success_sha = "dee4ab2fbad505e951bc8c1e7f440ae63317f76e7fb532de020cc32414efe7a4"
  expected_metrics_audit_receipt_sha = "5acc2683292eb69c0f7654fd13cbcbe7f22e42cb7037bde160de4c26305ae4bb"
  expected_metrics_audit_success_sha = "082d12f628955519c1e5bbca44e9ebf14104b00a44a5fbd28defb64ef3a53aee"
  expected_failed_metrics_sha = "512c555d5c939786824cf42c22bf1933625034f0b8d5d9f0182ecd6a7b7cf3c8"
  expected_resume_metrics_sha = "d5a67226b0c685533e8ea5a5e056bee4a2077f135ea88a6a4a836bf300eefc40"
  expected_failed_tail_sha = "cee7ee01480899615bd129ecbd189469af0551318002033fa9c07b41839ee0aa"

  def file_identity(path):
      value = path.lstat()
      if path.is_symlink() or not stat.S_ISREG(value.st_mode) or value.st_size <= 0:
          raise SystemExit(f"FATAL: not a nonempty ordinary file: {path}")
      return {
          "device": value.st_dev,
          "inode": value.st_ino,
          "bytes": value.st_size,
          "mtime_ns": value.st_mtime_ns,
          "ctime_ns": value.st_ctime_ns,
      }

  def read_stable(path):
      before = file_identity(path)
      raw = path.read_bytes()
      if file_identity(path) != before:
          raise SystemExit(f"FATAL: file changed while reading: {path}")
      return raw, before

  def atomic_exclusive(path, raw):
      temporary = path.with_name(f".{path.name}.tmp.{os.getpid()}")
      if path.exists() or path.is_symlink() or temporary.exists() or temporary.is_symlink():
          raise SystemExit(f"FATAL: refusing output overwrite: {path}")
      with temporary.open("xb", buffering=0) as handle:
          handle.write(raw)
          handle.flush()
          os.fsync(handle.fileno())
      os.replace(temporary, path)

  def fsync_directory(path):
      directory_fd = os.open(path, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
      try:
          os.fsync(directory_fd)
      finally:
          os.close(directory_fd)

  def read_bound_receipt(receipt_path, success_path, expected_receipt_sha, expected_success_sha, label):
      receipt_raw, receipt_identity = read_stable(receipt_path)
      success_raw, success_identity = read_stable(success_path)
      receipt_sha = hashlib.sha256(receipt_raw).hexdigest()
      success_sha = hashlib.sha256(success_raw).hexdigest()
      if receipt_sha != expected_receipt_sha or success_sha != expected_success_sha:
          raise SystemExit(f"FATAL: {label} receipt identity drift")
      return (
          json.loads(receipt_raw), receipt_sha, success_sha,
          receipt_identity, success_identity,
      )

  (
      parent_receipt, parent_receipt_sha, parent_success_sha,
      parent_receipt_identity, parent_success_identity,
  ) = read_bound_receipt(
      parent_receipt_path, parent_success_path,
      expected_parent_receipt_sha, expected_parent_success_sha, "parent recovery",
  )
  if (
      parent_receipt.get("schema_version")
      != "offline_formal_resume_prep_v3_checkpoint_audit_chained"
      or parent_receipt.get("status") != "PASS"
      or parent_receipt.get("source_jobtag") != parent_source_jobtag
      or parent_receipt.get("audit_jobtag") != parent_audit_jobtag
      or parent_receipt.get("checkpoint", {}).get("global_step") != 6_000
      or parent_receipt.get("checkpoint", {}).get("sha256")
      != "169ac62429ffadb9e72eaa4fb71c8da9616b68612233095599abe6b5abf74a90"
      or parent_receipt.get("resume_metrics", {}).get("rows") != 6_000
      or parent_receipt.get("resume_metrics", {}).get("sha256")
      != "4b356e075e86d195de24c7b9be15fab053f892586f8b55d7ba48ef8051ca24db"
  ):
      raise SystemExit("FATAL: parent recovery receipt semantic drift")

  (
      checkpoint_audit_receipt, checkpoint_audit_receipt_sha,
      checkpoint_audit_success_sha, checkpoint_audit_receipt_identity,
      checkpoint_audit_success_identity,
  ) = read_bound_receipt(
      checkpoint_audit_receipt_path, checkpoint_audit_success_path,
      expected_checkpoint_audit_receipt_sha,
      expected_checkpoint_audit_success_sha, "checkpoint audit",
  )
  audited_checkpoint = checkpoint_audit_receipt.get("checkpoint", {})
  if (
      checkpoint_audit_receipt.get("schema_version")
      != "offline_formal_checkpoint_audit_v1"
      or checkpoint_audit_receipt.get("status") != "PASS"
      or checkpoint_audit_receipt.get("source_jobtag") != source_jobtag
      or checkpoint_audit_receipt.get("audit_jobtag") != checkpoint_audit_jobtag
      or checkpoint_audit_receipt.get("read_only") is not True
      or audited_checkpoint.get("global_step") != expected_checkpoint_step
      or audited_checkpoint.get("sha256") != expected_checkpoint_sha
      or audited_checkpoint.get("trainable_tensors") != 373
      or audited_checkpoint.get("optimizer_state_entries") != 373
      or audited_checkpoint.get("optimizer_param_groups") != 1
      or audited_checkpoint.get("ema_tensors") != 373
      or audited_checkpoint.get("trainable_numel") != 1_414_773_888
      or audited_checkpoint.get("ema_numel") != 1_414_773_888
  ):
      raise SystemExit("FATAL: checkpoint audit semantic drift")
  for key, expected in expected_checkpoint_identity.items():
      if audited_checkpoint.get(key) != expected:
          raise SystemExit(f"FATAL: checkpoint audit identity drift: {key}")

  (
      metrics_audit_receipt, metrics_audit_receipt_sha,
      metrics_audit_success_sha, metrics_audit_receipt_identity,
      metrics_audit_success_identity,
  ) = read_bound_receipt(
      metrics_audit_receipt_path, metrics_audit_success_path,
      expected_metrics_audit_receipt_sha, expected_metrics_audit_success_sha,
      "metrics audit",
  )
  audited_metrics = metrics_audit_receipt.get("metrics", {})
  audited_prefix = audited_metrics.get("checkpoint_prefix", {})
  audited_tail = audited_metrics.get("post_checkpoint_tail", {})
  if (
      metrics_audit_receipt.get("schema_version")
      != "offline_formal_metrics_audit_v1"
      or metrics_audit_receipt.get("status") != "PASS"
      or metrics_audit_receipt.get("source_jobtag") != source_jobtag
      or metrics_audit_receipt.get("audit_jobtag") != metrics_audit_jobtag
      or metrics_audit_receipt.get("read_only") is not True
      or audited_metrics.get("rows") != expected_failed_last_step
      or audited_metrics.get("sha256") != expected_failed_metrics_sha
      or audited_prefix.get("rows") != expected_checkpoint_step
      or audited_prefix.get("sha256") != expected_resume_metrics_sha
      or audited_tail.get("rows") != expected_failed_last_step - expected_checkpoint_step
      or audited_tail.get("sha256") != expected_failed_tail_sha
  ):
      raise SystemExit("FATAL: metrics audit semantic drift")
  for key, expected in expected_failed_metrics_identity.items():
      if audited_metrics.get(key) != expected:
          raise SystemExit(f"FATAL: metrics audit identity drift: {key}")

  checkpoint_identity = file_identity(checkpoint)
  if checkpoint_identity != expected_checkpoint_identity:
      raise SystemExit(f"FATAL: live step-51000 checkpoint identity drift: {checkpoint_identity}")

  metrics_raw, metrics_identity = read_stable(metrics)
  if metrics_identity != expected_failed_metrics_identity:
      raise SystemExit(f"FATAL: live failed metrics identity drift: {metrics_identity}")
  failed_metrics_sha = hashlib.sha256(metrics_raw).hexdigest()
  if failed_metrics_sha != expected_failed_metrics_sha:
      raise SystemExit(f"FATAL: failed metrics SHA drift: {failed_metrics_sha}")
  lines = metrics_raw.splitlines(keepends=True)
  if len(lines) != expected_failed_last_step or any(not line.endswith(b"\n") for line in lines):
      raise SystemExit(f"FATAL: failed metrics shape drift: rows={len(lines)}")
  for expected_step, raw_line in enumerate(lines, 1):
      value = json.loads(raw_line)
      if not isinstance(value, dict) or value.get("step") != expected_step:
          raise SystemExit(
              f"FATAL: metrics sequence drift at row={expected_step}: "
              f"{value.get('step') if isinstance(value, dict) else type(value)}"
          )
  resume_raw = b"".join(lines[:expected_checkpoint_step])
  failed_tail_raw = b"".join(lines[expected_checkpoint_step:])
  resume_sha = hashlib.sha256(resume_raw).hexdigest()
  failed_tail_sha = hashlib.sha256(failed_tail_raw).hexdigest()
  if resume_sha != expected_resume_metrics_sha or failed_tail_sha != expected_failed_tail_sha:
      raise SystemExit(
          f"FATAL: metrics prefix/tail drift: prefix={resume_sha},tail={failed_tail_sha}"
      )

  backup = output_root / f"metrics.{source_jobtag}.steps1-{expected_failed_last_step}.jsonl"
  atomic_exclusive(backup, metrics_raw)
  backup_raw, backup_identity = read_stable(backup)
  if hashlib.sha256(backup_raw).hexdigest() != expected_failed_metrics_sha:
      raise SystemExit("FATAL: failed metrics backup verification failed")
  # Make the complete failed stream durable before the only destructive
  # operation in this job: replacing the active metrics file with its prefix.
  fsync_directory(output_root)

  temporary_metrics = checkpoint_root / f".metrics.jsonl.resume-prep.{audit_jobtag}.tmp"
  if temporary_metrics.exists() or temporary_metrics.is_symlink():
      raise SystemExit(f"FATAL: stale metrics temporary: {temporary_metrics}")
  with temporary_metrics.open("xb", buffering=0) as handle:
      handle.write(resume_raw)
      handle.flush()
      os.fsync(handle.fileno())
  if (
      metrics.read_bytes() != metrics_raw
      or file_identity(metrics) != metrics_identity
      or file_identity(checkpoint) != checkpoint_identity
      or file_identity(parent_receipt_path) != parent_receipt_identity
      or file_identity(parent_success_path) != parent_success_identity
      or file_identity(checkpoint_audit_receipt_path) != checkpoint_audit_receipt_identity
      or file_identity(checkpoint_audit_success_path) != checkpoint_audit_success_identity
      or file_identity(metrics_audit_receipt_path) != metrics_audit_receipt_identity
      or file_identity(metrics_audit_success_path) != metrics_audit_success_identity
  ):
      raise SystemExit("FATAL: recovery inputs changed before metrics cutover")
  os.replace(temporary_metrics, metrics)
  fsync_directory(checkpoint_root)
  active_metrics_raw, active_metrics_identity = read_stable(metrics)
  if active_metrics_raw != resume_raw:
      raise SystemExit("FATAL: active metrics cutover verification failed")

  receipt = {
      "schema_version": "offline_formal_resume_prep_v4_dual_audit_chained",
      "status": "PASS",
      "source_jobtag": source_jobtag,
      "audit_jobtag": audit_jobtag,
      "parent_receipt": {
          "source_jobtag": parent_source_jobtag,
          "audit_jobtag": parent_audit_jobtag,
          "root": str(parent_root.resolve(strict=True)),
          "receipt_sha256": parent_receipt_sha,
          "success_sha256": parent_success_sha,
      },
      "checkpoint_audit": {
          "audit_jobtag": checkpoint_audit_jobtag,
          "root": str(checkpoint_audit_root.resolve(strict=True)),
          "receipt_sha256": checkpoint_audit_receipt_sha,
          "success_sha256": checkpoint_audit_success_sha,
      },
      "metrics_audit": {
          "audit_jobtag": metrics_audit_jobtag,
          "root": str(metrics_audit_root.resolve(strict=True)),
          "receipt_sha256": metrics_audit_receipt_sha,
          "success_sha256": metrics_audit_success_sha,
      },
      "checkpoint": {
          "path": str(checkpoint.resolve(strict=True)),
          "sha256": expected_checkpoint_sha,
          **checkpoint_identity,
          "global_step": expected_checkpoint_step,
          "trainable_tensors": audited_checkpoint["trainable_tensors"],
          "optimizer_state_entries": audited_checkpoint["optimizer_state_entries"],
          "optimizer_param_groups": audited_checkpoint["optimizer_param_groups"],
          "ema_tensors": audited_checkpoint["ema_tensors"],
          "trainable_numel": audited_checkpoint["trainable_numel"],
          "ema_numel": audited_checkpoint["ema_numel"],
      },
      "failed_metrics": {
          "rows": expected_failed_last_step,
          "step_range": [1, expected_failed_last_step],
          "sha256": expected_failed_metrics_sha,
          "backup_path": str(backup.resolve(strict=True)),
          "backup_identity": backup_identity,
          "post_checkpoint_tail": {
              "rows": expected_failed_last_step - expected_checkpoint_step,
              "step_range": [expected_checkpoint_step + 1, expected_failed_last_step],
              "sha256": failed_tail_sha,
          },
      },
      "resume_metrics": {
          "rows": expected_checkpoint_step,
          "step_range": [1, expected_checkpoint_step],
          "sha256": resume_sha,
          "path": str(metrics.resolve(strict=True)),
          "identity": active_metrics_identity,
      },
  }
  receipt_raw = json.dumps(
      receipt, sort_keys=True, separators=(",", ":"), allow_nan=False
  ).encode("utf-8")
  atomic_exclusive(output_root / "receipt.json", receipt_raw)
  receipt_sha = hashlib.sha256(receipt_raw).hexdigest()
  marker = (
      f"PASS|{source_jobtag}|{audit_jobtag}|{parent_receipt_sha}|"
      f"{checkpoint_audit_receipt_sha}|{metrics_audit_receipt_sha}|"
      f"{expected_checkpoint_sha}|{expected_failed_metrics_sha}|"
      f"{resume_sha}|{receipt_sha}\n"
  ).encode("ascii")
  atomic_exclusive(output_root / "_SUCCESS", marker)
  fsync_directory(output_root)
  print(
      "OFFLINE_FORMAL_DUAL_AUDIT_CHAINED_RESUME_PREP_PASS "
      f"source={source_jobtag} checkpoint_step={expected_checkpoint_step} "
      f"checkpoint_sha256={expected_checkpoint_sha} "
      f"failed_metrics_sha256={expected_failed_metrics_sha} "
      f"resume_metrics_sha256={resume_sha} receipt_sha256={receipt_sha}"
  )
  PYEOF
