# EXP6 (我的选择，≤4卡) — 两个高价值/低风险项，2×H100 顺序跑：
#  6c VAE 对 anime 目标域保真度复核（纯推理，回答交接 G7 开放问题；1 GPU）
#  6a timestep_multiplier ∈ {1,10,1000} 小扫（§7 明确"仍待做"；2 GPU 训练，看 loss/grad 稳定性）
# 提交: jcc job submit jobs/exp6_vae_tsmul.yaml ; 日志: jcc job log evan-mot-exp6-vae-tsmul -p all -n 400
name: evan-mot-exp6-vae-tsmul
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 2
cpuPerWorker: 48
memGBPerWorker: 500
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=8 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/exp6; mkdir -p $RES/vae $RES/samples
  date -u; hostname; nvidia-smi

  echo "##### 6c — VAE anime fidelity (纯推理, 1 GPU) #####"
  timeout 1h $PY experiments/exp_scripts/vae_anime_fidelity.py \
    --n-anime 48 --n-real 24 --sizes 256,512,1024 --out $RES/vae 2>&1 | tee $RES/vae_fidelity.log || true

  echo "##### 6a — timestep_multiplier sweep {1,10,1000} (2 GPU, 256) #####"
  DS="dataset.stats_cache=$STATS dataset.buffer_size=384 dataset.queue_size=192 dataset.min_fill=128 dataset.anime_nrows=16000 dataset.anime_cache_dir=/local/evan/anime_img_cache"
  tsm() { # mult port tag
    CK=/local/evan/mot_exp/exp6_tsm_$3; rm -rf $CK; mkdir -p $CK
    echo "##### timestep_multiplier=$1 #####"
    timeout 2h $PY -m torch.distributed.run --nproc_per_node=2 --master_port=$2 \
      train.py --config configs/stage1a_t2i_256.yaml --max-steps 2000 trainer.batch_size=64 trainer.seed=42 \
      trainer.log_every=20 scheduler.num_warmup_steps=200 trainer.checkpoint_steps=1000 \
      model.timestep_multiplier=$1 trainer.checkpoint_dir=$CK trainer.resume=false $DS 2>&1 | tee $RES/train_tsm$3.log
    cp -f $CK/metrics.jsonl $RES/metrics_tsm$3.jsonl 2>/dev/null || true
    timeout 20m $PY experiments/exp_scripts/sample_prompt_grid.py \
      --config configs/stage1a_t2i_256.yaml --ckpt $CK/last.pt --out $RES/samples/exp6_tsm$3.png \
      --size 256 --steps 40 --cfg 4.0 --seed 7 model.timestep_multiplier=$1 dataset.stats_cache=$STATS 2>&1 | tail -5 || true
  }
  # gate: first run must reach step 2000
  tsm 1 29750 1 || true
  if ! grep -q "step 2000/2000" $RES/train_tsm1.log; then echo "tsm trial failed, skip rest"; else
    tsm 10 29751 10 || true
    tsm 1000 29752 1000 || true
  fi

  echo "##### loss@final per multiplier #####"
  for f in $RES/metrics_tsm*.jsonl; do echo -n "$f -> "; tail -1 $f; done | tee $RES/tsm_loss_summary.txt
  echo "##### DONE #####"; date -u
