# 最小 4×8(=32卡/4节点) 探针：测多节点能否调度起跑 + 揭示 jcc 注入的多机 rendezvous env。
# 本项目此前从未跑过多机；>8 卡按指南需先找 Tom 要额度——若 Pending 即说明额度/可用性问题。
# 提交: jcc job submit jobs/probe_4x8.yaml ; 看全 worker 日志: jcc job log evan-mot-4x8-probe -p all -n 200
name: evan-mot-4x8-probe
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 4
gpuPerWorker: 8
cpuPerWorker: 8
memGBPerWorker: 32
maxRetries: 0
command: |
  set -uxo pipefail
  echo "===== WORKER host=$(hostname) ====="
  echo "--- 可能的 rendezvous env（发现 jcc 多机约定）---"
  env | grep -iE 'rank|master|world|node|nccl|addr|port|pet_|group|replica|jcc|host|pod|svc|dns|endpoint' | sort
  echo "--- GPU ---"
  nvidia-smi -L
  echo "===== WORKER host=$(hostname) DONE ====="
