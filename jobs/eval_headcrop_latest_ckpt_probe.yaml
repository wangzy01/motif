name: evan-hc-latest-ckpt-probe
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 2
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  $PY - <<'PY'
  import json, os, torch
  paths = [
      "/fsx/evan/checkpoints/mot_pilot_v1/redesign_512a_multiar_anchor_global1536_20260705/last.pt",
      "/fsx/evan/checkpoints/mot_pilot_v1/redesign_512a_multiar_anchor_global1536_20260705/step_60000.pt",
      "/fsx/evan/mot_code/data_analysis/outputs/headcrop_matrix_now_comprehensive/ckpts/rd512a_latest_eval_snapshot.pt",
  ]
  for p in paths:
      ckpt = torch.load(p, map_location="cpu", weights_only=False)
      print(json.dumps({
          "path": p,
          "size": os.path.getsize(p),
          "mtime": os.path.getmtime(p),
          "global_step": ckpt.get("global_step"),
          "has_trainable_state": "trainable_state" in ckpt,
          "has_ema": bool(ckpt.get("ema")),
          "top_keys": sorted(list(ckpt.keys()))[:20],
      }, sort_keys=True))
  PY
