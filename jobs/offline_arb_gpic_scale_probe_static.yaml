# One-node CPU16 synthetic/red-team gate.  It launches eight tiny local worker
# processes but performs no network reads and cannot authorize production.
name: evan-mot-crop-offlinearb-gpic-scale-probe-static
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 32
maxRetries: 0
command: |
  set -euo pipefail
  umask 077
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop

  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1
  export PYTHONFAULTHANDLER=1
  export PYTHONHASHSEED=0
  export PYTHONDONTWRITEBYTECODE=1
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export OPENBLAS_NUM_THREADS=1
  export NUMEXPR_NUM_THREADS=1
  export ARROW_NUM_THREADS=1

  HOST=$(hostname)
  [ "${HOST##*-}" = 0 ] || { echo "FATAL: static must be one worker"; exit 2; }
  JOBTAG=${HOST%-0}
  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUNNER=$REPO/scripts/offline_arb/run_offline_gpic_scale_probe.py
  ANALYZER=$REPO/scripts/offline_arb/analyze_offline_gpic_scale_probe.py
  TEST=$REPO/scripts/offline_arb/test_offline_gpic_scale_probe_static.py
  SELF=$REPO/jobs/offline_arb_gpic_scale_probe_static.yaml
  PROBE_JOB=$REPO/jobs/offline_arb_gpic_scale_probe.yaml
  ANALYZE_JOB=$REPO/jobs/offline_arb_gpic_scale_probe_analyze.yaml
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/.offline_gpic_scale_static/$JOBTAG

  for FILE in "$RUNNER" "$ANALYZER" "$TEST" "$SELF" "$PROBE_JOB" "$ANALYZE_JOB"; do
    [ -f "$FILE" ] && [ ! -L "$FILE" ] && [ -s "$FILE" ] \
      || { echo "FATAL: invalid static input"; exit 2; }
  done
  [ ! -e "$ROOT" ] && [ ! -L "$ROOT" ] || { echo "FATAL: static namespace is not fresh"; exit 2; }
  cleanup() {
    case "$ROOT" in
      /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/.offline_gpic_scale_static/*)
        rm -rf -- "$ROOT"
        ;;
      *) echo "FATAL: unsafe static cleanup target" >&2; return 1 ;;
    esac
  }
  trap cleanup EXIT

  "$PY" -m py_compile "$RUNNER" "$ANALYZER" "$TEST"
  timeout --preserve-status --signal=TERM --kill-after=30s 1800s \
    "$PY" "$TEST" \
      --root "$ROOT" \
      --job-spec "$SELF" \
      --probe-job-spec "$PROBE_JOB" \
      --analyzer-job-spec "$ANALYZE_JOB"
  echo "OFFLINE_GPIC_SCALE_STATIC_JCC_PASS"
