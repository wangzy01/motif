# stage1a@256 正式训练 — 版本 v1 = baseline（所有消融关，Day-1 锁定配方）
# 单节点 1×8（NVLink，无跨节点 Socket 税）；global batch 512 = config 原生设计（8卡×64）；LR 1e-4；400k 步上限。
# world=8 → 各域 shard 数(anime17/其余64)均 ≥8 → 数据占比天然正确，无 anime 偏斜。
# 决策(Evan 2026-06-18): 放弃 4×8(Socket 慢~4.5×)，改 3× 1×8 跑 v1/B1/B2 三版消融，stage256 为便宜消融单元。
# 提交: jcc job submit jobs/s256_1x8_v1_baseline.yaml ; 进度: tail .../checkpoints/.../s256_1x8_v1_20260618/metrics.jsonl
name: evan-mot-s256-v1-baseline
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 8
cpuPerWorker: 48
memGBPerWorker: 900
maxRetries: 50
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=6 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  RUN_ID=s256_1x8_v1_20260618
  CK=/fsx/evan/checkpoints/mot_pilot_v1/$RUN_ID
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/$RUN_ID
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  mkdir -p "$CK" "$RES"
  { echo "===== v1 baseline 1x8 @256 $(date -u) ====="; hostname; nvidia-smi -L; df -h /fsx/evan | tail -1; } 2>&1 | tee "$RES/probe.log"
  DOTS="trainer.checkpoint_dir=$CK trainer.resume=true dataset.stats_cache=$STATS dataset.anime_cache_dir=/local/evan/anime_img_cache"
  $PY -m torch.distributed.run --nproc_per_node=8 --master_port=29621 \
      train.py --config configs/stage1a_t2i_256.yaml --max-steps 400000 \
      $DOTS 2>&1 | tee "$RES/train.log"
  RC=${PIPESTATUS[0]}; echo "===== v1 exited rc=$RC $(date -u) ====="; exit $RC   # 传播真实退出码 → 崩溃时 maxRetries 自动 resume
