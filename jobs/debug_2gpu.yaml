# jcc 2 卡 debug job【草稿，GPU 阶段再核对/提交】
# 参考 /fsx/evan/doc/env/空间使用.md 第二步形态。
# 提交: jcc job submit jobs/debug_2gpu.yaml ; 看日志: jcc job log evan-mot-debug -f
name: evan-mot-debug
image: harbor.jh1.mewtant.io/public/autobuild:pytorch-cu128
numWorkers: 1
gpuPerWorker: 2
cpuPerWorker: 20
memGBPerWorker: 400
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1
  export HF_HOME=/local/evan/cache/huggingface
  export TORCH_HOME=/local/evan/cache/torch
  export TRITON_CACHE_DIR=/local/evan/cache/triton
  nvidia-smi
  # TODO(GPU 阶段)：确认镜像 python 与 /fsx/evan/mot_code/venv-gpu 兼容性，
  # 单卡先跑 smoke，再决定 torchrun + FSDP2 还是搬进 naifu。
  /fsx/evan/mot_code/venv-gpu/bin/python scripts/smoke_real_weights.py
  /fsx/evan/mot_code/venv-gpu/bin/python train.py --config configs/debug_tiny_cpu.yaml \
    target_device=cuda trainer.checkpoint_dir=/fsx/evan/checkpoints/mot_pilot_v1/debug
