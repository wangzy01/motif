# OFFLINE_ARB_V1 Phase-3a Job2：全量 N[B,d] + 裁剪保留率（桶表决策材料，给 Evan 晨读）。
# fetch-free：只读 5 域全量 manifest 的 width/height[,holdout,elig_256] 窄列，按现行
# training/dataline/multi_ar.py 的 build_adaptive_buckets/assign_adaptive_bucket 做桶指派。
# 不设自动 PASS/FAIL 门槛（决策材料，非 stop/go gate）；只有某域完全扫描失败才非零退出。
# 输出固定路径：
#   /fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_bucketstats_v1/
name: evan-mot-crop-offlinearb-p3a-bstats
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
# 64→16(2026-07-10 集群新规:禁 64cpu/0gpu;本 job 已跑成功,此改动只为未来重跑合规)
cpuPerWorker: 16
memGBPerWorker: 96
maxRetries: 0
command: |
  set -euxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_bucketstats_v1
  mkdir -p "$ROOT"
  echo "ROOT=$ROOT host=$(hostname) started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee "$ROOT/run_info.txt"
  "$PY" -m py_compile scripts/offline_arb/phase3a_bucket_stats.py
  RC=0
  set +e
  # 墙钟预算 <=2h：6900s(1h55m) + kill-after 60s 缓冲。
  timeout --signal=TERM --kill-after=60s 6900s \
    "$PY" scripts/offline_arb/phase3a_bucket_stats.py \
      --config configs/stage256_redesign_naifu_arb_v1.yaml \
      --output-dir "$ROOT" --workers 14 \
    2>&1 | tee "$ROOT/run.log"
  RC=${PIPESTATUS[0]}
  set -e
  echo "==== OFFLINE_ARB PHASE3a BUCKETSTATS exit_code=$RC ===="
  GATE_PY='
  import json, sys
  with open(sys.argv[1], encoding="utf-8") as f:
      r = json.load(f)
  summary = {
      "domain_totals": r.get("domain_totals"),
      "domain_totals_sum": r.get("domain_totals_sum"),
      "domain_total_scan_failure": r.get("domain_total_scan_failure"),
      "failed_shard_count": r.get("failed_shard_count"),
  }
  print(json.dumps(summary, indent=2, ensure_ascii=False))
  '
  if [ -f "$ROOT/bucket_decision_report.json" ]; then
    "$PY" -c "$GATE_PY" "$ROOT/bucket_decision_report.json"
  fi
  exit "$RC"
