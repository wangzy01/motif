# SUBMISSION-BLOCKED 8x8 GPIC blob probation.
# Logical plan coverage is steps 1..500. Round A reaches 250 and writes the
# exact step-200 checkpoint; Round B must resume at 200 and reach 500.
name: evan-offarb-prod-gpic-8x8-one80omp4-probation
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 8
gpuPerWorker: 8
cpuPerWorker: 80
memGBPerWorker: 900
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=4
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN FI_EFA_USE_DEVICE_RDMA=1
  export OFFLINE_ARB_GPIC_THREADS_PER_NODE=16 OFFLINE_ARB_STEP_TIMEOUT_S=1800
  export OFFLINE_ARB_PREFETCH_STEPS=4 OFFLINE_ARB_PROFILE_WINDOWS=0
  unset OFFLINE_ARB_SMOKE_DATASET_CONFIG OFFLINE_ARB_IO_TELEMETRY_DIR
  unset MALLOC_ARENA_MAX MALLOC_TRIM_THRESHOLD_ ARROW_DEFAULT_MEMORY_POOL
  unset LD_PRELOAD TCMALLOC_RELEASE_RATE
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton \
    /local/evan/anime_img_cache

  # Deliberate hard blockers.  Materialize a submission copy only after the
  # full fresh verifier has published this exact build on FSx and S3.
  ARTIFACT_ROOT="/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_gpic_blob_v1_release/evan-mot-crop-offlinearb-gpic-s3-production-build-zg8g"
  ARTIFACT_BUILDTAG="evan-mot-crop-offlinearb-gpic-s3-production-build-zg8g"
  MANIFEST_SHA256="a18ba1f1250e3b00abdc1051dc71e08a254b8855d5b61b9975e88d2e6ae2ee05"
  test -n "$ARTIFACT_ROOT" || { echo "FATAL: ARTIFACT_ROOT is submission-blocked"; exit 64; }
  test -n "$ARTIFACT_BUILDTAG" || { echo "FATAL: ARTIFACT_BUILDTAG is submission-blocked"; exit 64; }
  test -n "$MANIFEST_SHA256" || { echo "FATAL: MANIFEST_SHA256 is submission-blocked"; exit 64; }
  case "$MANIFEST_SHA256" in (*[!0-9a-f]*|'') echo "FATAL: malformed manifest SHA"; exit 64;; esac
  [ "${#MANIFEST_SHA256}" -eq 64 ] || { echo "FATAL: malformed manifest SHA length"; exit 64; }
  [ "$(basename "$ARTIFACT_ROOT")" = "$ARTIFACT_BUILDTAG" ] \
    || { echo "FATAL: artifact root/buildtag mismatch"; exit 64; }
  [ "$ARTIFACT_BUILDTAG" != latest ] || { echo "FATAL: mutable latest buildtag forbidden"; exit 64; }

  REPO=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  CFG=$REPO/configs/stage256_offline_exact_v1.yaml
  PLAN=$BASE/offline_arb_plans_v1/w64_prod/plan
  CAT=$BASE/offline_arb_catalog_v1
  ANIME_FREQ=$BASE/offline_arb_animefreq_v1
  SIDECAR=$BASE/offline_arb_caption_sidecar_v1
  YAML_SELF=$REPO/jobs/offline_exact_256_8x8_gpic_blob_probation_PRODUCTION.yaml
  PREFLIGHT=$REPO/scripts/offline_arb/verify_offline_gpic_compact_controls.py
  SUPERVISOR=$REPO/scripts/offline_arb/supervise_offline_gpic_probation.py
  ANALYZER=$REPO/scripts/offline_arb/analyze_offline_gpic_probation.py
  HOST=$(hostname); NODE_RANK=${HOST##*-}; JOBTAG=${HOST%-*}
  case "$NODE_RANK" in (0|1|2|3|4|5|6|7) ;; (*) echo "FATAL: invalid node rank"; exit 20;; esac
  [ "$HOST" = "$JOBTAG-$NODE_RANK" ] || { echo "FATAL: hostname/jobtag drift"; exit 20; }

  RES_PARENT=$BASE/offline_gpic_blob_8x8_probation_v1
  RES=$RES_PARENT/$JOBTAG
  CK_PARENT=/fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/offline_gpic_blob_probation/$ARTIFACT_BUILDTAG
  CK=$CK_PARENT/$JOBTAG
  mkdir -p "$RES_PARENT" "$CK_PARENT"
  INIT=$RES_PARENT/.init.$JOBTAG
  if [ "$NODE_RANK" = 0 ]; then
    test ! -e "$RES" && test ! -L "$RES" || { echo "FATAL: probation result namespace exists"; exit 65; }
    test ! -e "$CK" && test ! -L "$CK" || { echo "FATAL: probation checkpoint namespace exists"; exit 65; }
    mkdir "$RES" "$CK"
    NONCE=$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')
    printf 'READY|%s|%s|%s|%s|%s\n' "$JOBTAG" "$NONCE" "$ARTIFACT_BUILDTAG" \
      "$MANIFEST_SHA256" "$(date +%s)" > "$INIT.tmp"
    mv "$INIT.tmp" "$INIT"
  fi
  for _ in $(seq 1 900); do [ -s "$INIT" ] && break; sleep 2; done
  [ -s "$INIT" ] || { echo "FATAL: probation init timed out"; exit 20; }
  IFS='|' read -r INIT_STATUS INIT_JOBTAG NONCE INIT_BUILDTAG INIT_MANIFEST INIT_TS < "$INIT"
  [ "$INIT_STATUS" = READY ] && [ "$INIT_JOBTAG" = "$JOBTAG" ] \
    && [ "$INIT_BUILDTAG" = "$ARTIFACT_BUILDTAG" ] \
    && [ "$INIT_MANIFEST" = "$MANIFEST_SHA256" ] \
    || { echo "FATAL: probation init identity drift"; exit 20; }
  case "$NONCE" in (*[!0-9a-f]*|'') echo "FATAL: malformed probation nonce"; exit 20;; esac
  [ "${#NONCE}" -eq 64 ] || { echo "FATAL: malformed probation nonce length"; exit 20; }

  # Fast launch preflight: small controls/fingerprints only. The publisher's
  # full verifier receipt is required, rank0 will hash the index collectively,
  # and every runtime read verifies its segment SHA.
  "$PY" "$PREFLIGHT" --artifact-root "$ARTIFACT_ROOT" \
    --buildtag "$ARTIFACT_BUILDTAG" --manifest-sha256 "$MANIFEST_SHA256" \
    --catalog-root "$CAT" --plan-root "$PLAN" --config "$CFG" \
    --job-yaml "$YAML_SELF" --jobtag "$JOBTAG" --node-rank "$NODE_RANK" \
    --output "$RES/preflight.$JOBTAG.n$NODE_RANK.json"
  "$PY" scripts/offline_arb/make_freeze_manifest.py --verify-sidecar-control \
    --sidecar-root "$SIDECAR" --catalog-root "$CAT" \
    > "$RES/sidecarcontrol.$JOBTAG.n$NODE_RANK.json.tmp"
  mv "$RES/sidecarcontrol.$JOBTAG.n$NODE_RANK.json.tmp" \
    "$RES/sidecarcontrol.$JOBTAG.n$NODE_RANK.json"
  printf 'PREFLIGHT|%s|%s|%s|%s\n' "$JOBTAG" "$NONCE" "$NODE_RANK" \
    "$(sha256sum "$RES/preflight.$JOBTAG.n$NODE_RANK.json" | awk '{print $1}')" \
    > "$RES/preflight.$JOBTAG.n$NODE_RANK.ready.tmp"
  mv "$RES/preflight.$JOBTAG.n$NODE_RANK.ready.tmp" "$RES/preflight.$JOBTAG.n$NODE_RANK.ready"
  if [ "$NODE_RANK" = 0 ]; then
    for _ in $(seq 1 900); do
      ready=1
      for rank in 0 1 2 3 4 5 6 7; do [ -s "$RES/preflight.$JOBTAG.n$rank.ready" ] || ready=0; done
      [ "$ready" = 1 ] && break
      sleep 2
    done
    [ "${ready:-0}" = 1 ] || { echo "FATAL: all-node compact preflight timed out"; exit 20; }
    "$PY" - "$RES" "$JOBTAG" "$NONCE" "$ARTIFACT_BUILDTAG" "$MANIFEST_SHA256" <<'PYEOF'
  import hashlib, json, re, sys
  from pathlib import Path
  root, jobtag, nonce, buildtag, manifest = Path(sys.argv[1]), *sys.argv[2:]
  for rank in range(8):
      marker = (root / f"preflight.{jobtag}.n{rank}.ready").read_text().strip().split("|")
      if len(marker) != 5 or marker[:4] != ["PREFLIGHT", jobtag, nonce, str(rank)]:
          raise SystemExit(f"FATAL malformed preflight marker rank={rank}")
      path = root / f"preflight.{jobtag}.n{rank}.json"
      raw = path.read_bytes()
      value = json.loads(raw)
      if (
          hashlib.sha256(raw).hexdigest() != marker[4]
          or value.get("status") != "PASS"
          or value.get("jobtag") != jobtag
          or value.get("node_rank") != rank
          or value.get("buildtag") != buildtag
          or value.get("manifest_sha256") != manifest
          or value.get("backend") != "mountpoint_s3"
          or value.get("full_publication_verified_once") is not True
      ):
          raise SystemExit(f"FATAL compact preflight identity mismatch rank={rank}")
  PYEOF
    printf 'PASS|%s|%s|%s|%s\n' "$JOBTAG" "$NONCE" "$ARTIFACT_BUILDTAG" "$MANIFEST_SHA256" \
      > "$RES/preflight.$JOBTAG.pass.tmp"
    mv "$RES/preflight.$JOBTAG.pass.tmp" "$RES/preflight.$JOBTAG.pass"
  fi
  for _ in $(seq 1 900); do [ -s "$RES/preflight.$JOBTAG.pass" ] && break; sleep 2; done
  [ -s "$RES/preflight.$JOBTAG.pass" ] || { echo "FATAL: compact preflight PASS missing"; exit 20; }
  IFS='|' read -r P_STATUS P_JOBTAG P_NONCE P_BUILD P_MANIFEST < "$RES/preflight.$JOBTAG.pass"
  [ "$P_STATUS" = PASS ] && [ "$P_JOBTAG" = "$JOBTAG" ] && [ "$P_NONCE" = "$NONCE" ] \
    && [ "$P_BUILD" = "$ARTIFACT_BUILDTAG" ] && [ "$P_MANIFEST" = "$MANIFEST_SHA256" ] \
    || { echo "FATAL: compact preflight PASS identity drift"; exit 20; }

  rendezvous() {
    round=$1
    RDZV=$RES/rdzv.$JOBTAG.r$round.addr
    if [ "$NODE_RANK" = 0 ]; then
      MASTER_ADDR=$(hostname -i | awk '{print $1}')
      printf '%s|%s|%s|%s|%s\n' "$MASTER_ADDR" "$JOBTAG" "$NONCE" "$round" "$(date +%s)" \
        > "$RDZV.tmp"
      mv "$RDZV.tmp" "$RDZV"
    else
      MASTER_ADDR=""
      for _ in $(seq 1 900); do
        if [ -s "$RDZV" ]; then
          IFS='|' read -r CANDIDATE R_JOBTAG R_NONCE R_ROUND R_TS < "$RDZV" || true
          NOW=$(date +%s); case "$R_TS" in (*[!0-9]*|'') R_TS=0;; esac
          if [ "$R_JOBTAG" = "$JOBTAG" ] && [ "$R_NONCE" = "$NONCE" ] \
            && [ "$R_ROUND" = "$round" ] && [ "$R_TS" -le $((NOW + 60)) ] \
            && [ $((NOW - R_TS)) -lt 1800 ]; then MASTER_ADDR=$CANDIDATE; break; fi
        fi
        sleep 2
      done
      [ -n "$MASTER_ADDR" ] || { echo "FATAL: probation rendezvous missing round=$round"; exit 20; }
    fi
  }

  round_barrier() {
    round=$1; rc=$2
    printf 'DONE|%s|%s|%s|%s|%s\n' "$JOBTAG" "$NONCE" "$round" "$NODE_RANK" "$rc" \
      > "$RES/round.$JOBTAG.r$round.n$NODE_RANK.done.tmp"
    mv "$RES/round.$JOBTAG.r$round.n$NODE_RANK.done.tmp" "$RES/round.$JOBTAG.r$round.n$NODE_RANK.done"
    if [ "$NODE_RANK" = 0 ]; then
      for _ in $(seq 1 900); do
        ready=1
        for rank in 0 1 2 3 4 5 6 7; do [ -s "$RES/round.$JOBTAG.r$round.n$rank.done" ] || ready=0; done
        [ "$ready" = 1 ] && break
        sleep 2
      done
      status=PASS
      [ "${ready:-0}" = 1 ] || status=FAIL
      if [ "$status" = PASS ]; then
        for rank in 0 1 2 3 4 5 6 7; do
          IFS='|' read -r D_STATUS D_JOBTAG D_NONCE D_ROUND D_RANK D_RC \
            < "$RES/round.$JOBTAG.r$round.n$rank.done"
          [ "$D_STATUS" = DONE ] && [ "$D_JOBTAG" = "$JOBTAG" ] \
            && [ "$D_NONCE" = "$NONCE" ] && [ "$D_ROUND" = "$round" ] \
            && [ "$D_RANK" = "$rank" ] && [ "$D_RC" = 0 ] || status=FAIL
        done
      fi
      printf '%s|%s|%s|%s\n' "$status" "$JOBTAG" "$NONCE" "$round" \
        > "$RES/round.$JOBTAG.r$round.status.tmp"
      mv "$RES/round.$JOBTAG.r$round.status.tmp" "$RES/round.$JOBTAG.r$round.status"
    fi
    for _ in $(seq 1 900); do [ -s "$RES/round.$JOBTAG.r$round.status" ] && break; sleep 2; done
    IFS='|' read -r B_STATUS B_JOBTAG B_NONCE B_ROUND < "$RES/round.$JOBTAG.r$round.status"
    [ "$B_STATUS" = PASS ] && [ "$B_JOBTAG" = "$JOBTAG" ] \
      && [ "$B_NONCE" = "$NONCE" ] && [ "$B_ROUND" = "$round" ] \
      || { echo "FATAL: probation round=$round failed on at least one node"; return 88; }
  }

  run_round() {
    round=$1; max_steps=$2; resume=$3; expected_first=$4; port=$5
    rendezvous "$round"
    STOP=$RES/early_stop.$JOBTAG.json
    LOG=$RES/train.$JOBTAG.r$round.n$NODE_RANK.log
    SUP_RESULT=$RES/supervisor.$JOBTAG.r$round.n$NODE_RANK.json
    set +e
    "$PY" "$SUPERVISOR" --node-rank "$NODE_RANK" --round "$round" \
      --metrics "$CK/metrics.jsonl" --log "$LOG" --result "$SUP_RESULT" \
      --stop-marker "$STOP" --jobtag "$JOBTAG" --buildtag "$ARTIFACT_BUILDTAG" \
      --manifest-sha256 "$MANIFEST_SHA256" --expected-first-step "$expected_first" \
      --minimum-observations 100 --window 40 --check-stride 10 --slow-windows 2 \
      --hard-max-iter-s 2.75 --timeout-s 10800 -- \
      "$PY" -m torch.distributed.run --nnodes 8 --nproc-per-node 8 \
        --node-rank "$NODE_RANK" --master-addr "$MASTER_ADDR" --master-port "$port" \
        train.py --config "$CFG" --max-steps "$max_steps" \
        dataset.offline_plan_root="$PLAN" \
        dataset.gpic_payload_backend=offline_gpic_blob_v1 \
        dataset.offline_gpic_blob_root="$ARTIFACT_ROOT" \
        dataset.gpic_blob_manifest_sha256="$MANIFEST_SHA256" \
        dataset.gpic_blob_fd_cache_size=1024 \
        trainer.checkpoint_dir="$CK" trainer.resume="$resume" \
        trainer.checkpoint_steps=200 trainer.checkpoint_keep_max=2 \
        trainer.save_final=false trainer.log_every=5 trainer.dataline_metrics_every=5
    rc=$?
    set -e
    round_barrier "$round" "$rc"
  }

  run_round A 250 false 1   29831
  test -s "$CK/last.pt" || { echo "FATAL: Round A did not publish step-200 checkpoint"; exit 89; }
  run_round B 500 true  201 29832

  if [ "$NODE_RANK" = 0 ]; then
    set +e
    "$PY" "$ANALYZER" --artifact-root "$ARTIFACT_ROOT" \
      --buildtag "$ARTIFACT_BUILDTAG" --manifest-sha256 "$MANIFEST_SHA256" \
      --result-root "$RES" --checkpoint-root "$CK" --jobtag "$JOBTAG" \
      --config "$CFG" --plan-root "$PLAN" --catalog-root "$CAT" --job-yaml "$YAML_SELF" \
      --output "$RES/analysis.json"
    ANALYSIS_RC=$?
    set -e
    printf '%s|%s|%s|%s\n' "$ANALYSIS_RC" "$JOBTAG" "$NONCE" \
      "$(sha256sum "$RES/analysis.json" 2>/dev/null | awk '{print $1}')" \
      > "$RES/analysis.status.tmp"
    mv "$RES/analysis.status.tmp" "$RES/analysis.status"
    if [ "$ANALYSIS_RC" = 0 ]; then
      cp "$RES/analysis.status" "$RES/_SUCCESS.tmp"
      mv "$RES/_SUCCESS.tmp" "$RES/_SUCCESS"
    fi
  fi
  for _ in $(seq 1 900); do [ -s "$RES/analysis.status" ] && break; sleep 2; done
  IFS='|' read -r ANALYSIS_RC A_JOBTAG A_NONCE A_SHA < "$RES/analysis.status"
  [ "$ANALYSIS_RC" = 0 ] && [ "$A_JOBTAG" = "$JOBTAG" ] && [ "$A_NONCE" = "$NONCE" ] \
    && [ "${#A_SHA}" = 64 ] && [ -s "$RES/_SUCCESS" ] \
    || { echo "FATAL: probation analysis failed"; exit 90; }
  echo "GPIC_BLOB_8X8_PROBATION_PASS node=$NODE_RANK output=$RES analysis_sha256=$A_SHA"
