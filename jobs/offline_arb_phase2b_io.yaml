# OFFLINE_ARB_V1 Phase-2b IO shootout: T1(密集聚簇 seq vs coalesce) T2(gpic深预取→/local)
# T3(textatlas补测+staging分段) T4(混合gate复测S5b)。修正 Phase-2 S1 稀疏前提/S5 浅预取两点。
# 可选注入 REUSE_INDEX_DIR=<phase2 输出目录> 复用其 s1_indexes；缺省则 T1/T4 自行重建索引。
# /local/evan/gpic_prefetch_test 是本 job 唯一允许的非 output-dir 写入点（trap 兜底清理）。
name: evan-mot-crop-offlinearb-p2b-io
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 64
memGBPerWorker: 384
maxRetries: 0
command: |
  set -euxo pipefail
  trap 'rm -rf /local/evan/gpic_prefetch_test || true' EXIT
  rm -rf /local/evan/gpic_prefetch_test || true
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  # 复用 p2 run(rp25)已建好的 6 个 tar 索引,省 T1/T4 重建时间
  REUSE_INDEX_DIR=${REUSE_INDEX_DIR:-/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_phase2_20260710T002824Z_evan-mot-crop-offlinearb-p2-io-rp25-0_31780/s1_indexes}
  RUN_TAG="${RUN_TAG:-$(date -u +%Y%m%dT%H%M%SZ)_${HOSTNAME:-local}_${RANDOM}}"
  ROOT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_phase2b_${RUN_TAG}
  mkdir -p "$ROOT"
  echo "RUN_TAG=$RUN_TAG ROOT=$ROOT REUSE_INDEX_DIR=${REUSE_INDEX_DIR:-}" | tee "$ROOT/run_info.txt"
  "$PY" -m py_compile scripts/offline_arb/phase2_shootout.py scripts/offline_arb/phase2b_shootout.py
  RESULT_PY='
  import json, sys
  with open(sys.argv[1], encoding="utf-8") as f:
      data = json.load(f)
  task = str(data.get("task", "")).upper()
  verdict = str(data.get("verdict", "")).upper()
  ok_verdicts = {"PASS", "FAIL", "WARN", "INCOMPLETE"}
  # T1 的模式选型结论用 DECISIVE_* token（成功且决定性的探测，非 PASS/FAIL 否决）。
  is_decisive = verdict.startswith("DECISIVE_")
  print(verdict if task == sys.argv[2] and (verdict in ok_verdicts or is_decisive) else "")
  '
  FAIL=0
  run_task () {
    local TASK="$1" LIMIT_S="$2" SCRIPT="$3"
    shift 3
    local RESULT="$ROOT/task${TASK}_result.json" LOG="$ROOT/task${TASK}.log"
    local RC=0
    set +e
    timeout --signal=TERM --kill-after=60s "${LIMIT_S}s" \
      "$PY" "$SCRIPT" --test "$TASK" --output-dir "$ROOT" "$@" \
      2>&1 | tee "$LOG"
    RC=${PIPESTATUS[0]}
    set -e
    if [ "$RC" -eq 124 ] || [ "$RC" -eq 137 ]; then
      printf '{"task":"%s","verdict":"INCOMPLETE","reason":"outer_timeout","timeout_s":%s,"return_code":%s}\n' \
        "$TASK" "$LIMIT_S" "$RC" > "$RESULT"
      printf 'task=%s verdict=INCOMPLETE key_numbers=timeout_s=%s,rc=%s\n' \
        "$TASK" "$LIMIT_S" "$RC" >> "$ROOT/pilot_summary.txt"
      return 0
    fi
    local VERDICT
    VERDICT=$("$PY" -c "$RESULT_PY" "$RESULT" "$TASK" 2>/dev/null || true)
    if [ "$RC" -ne 0 ] && [ "$VERDICT" != FAIL ]; then
      printf '{"task":"%s","verdict":"FAIL","reason":"runner_error","return_code":%s}\n' \
        "$TASK" "$RC" > "$RESULT"
      printf 'task=%s verdict=FAIL key_numbers=runner_rc=%s\n' "$TASK" "$RC" >> "$ROOT/pilot_summary.txt"
      VERDICT=FAIL
    elif [ -z "$VERDICT" ]; then
      printf '{"task":"%s","verdict":"FAIL","reason":"missing_or_invalid_result","return_code":%s}\n' \
        "$TASK" "$RC" > "$RESULT"
      printf 'task=%s verdict=FAIL key_numbers=invalid_result=1,rc=%s\n' \
        "$TASK" "$RC" >> "$ROOT/pilot_summary.txt"
      VERDICT=FAIL
    fi
    [ "$VERDICT" != FAIL ] || FAIL=1
  }
  # 墙钟预算：3000+2400+1500+2700=9600s(~2.67h) ≤ 3h，为环境启动/清理留缓冲。
  run_task T1 3000 scripts/offline_arb/phase2b_shootout.py --reuse-index-dir "${REUSE_INDEX_DIR:-}"
  run_task T2 2400 scripts/offline_arb/phase2b_shootout.py
  run_task T3 1500 scripts/offline_arb/phase2b_shootout.py
  run_task T4 2700 scripts/offline_arb/phase2b_shootout.py --reuse-index-dir "${REUSE_INDEX_DIR:-}"
  rm -rf /local/evan/gpic_prefetch_test || true
  echo "==== OFFLINE_ARB PHASE2B IO VERDICTS ===="
  cat "$ROOT/pilot_summary.txt"
  echo "RUN_TAG=$RUN_TAG ROOT=$ROOT"
  exit "$FAIL"
