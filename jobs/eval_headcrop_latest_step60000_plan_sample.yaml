name: evan-hc-latest60-plan-sample
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 2
memGBPerWorker: 16
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/headcrop_latest_step60000_20260708
  OUT=$BASE/subagent_batches_remaining_sample
  $PY - <<'PY'
  import json
  import glob
  import os
  from collections import defaultdict

  base = "/fsx/evan/mot_code/data_analysis/outputs/headcrop_latest_step60000_20260708"
  out = os.path.join(base, "subagent_batches_remaining_sample")
  os.makedirs(out, exist_ok=True)

  priority = {
      "full_body_multi": 0,
      "full_body_single": 1,
      "lower_body_focus": 2,
      "non_fullbody_control": 3,
  }

  all_rows = []
  for batch_path in sorted(glob.glob(os.path.join(base, "subagent_batches_remaining", "batch_*.json"))):
      with open(batch_path) as f:
          payload = json.load(f)
      all_rows.extend(payload["images"])

  by_manifest = defaultdict(list)
  for row in all_rows:
      by_manifest[row["manifest"]].append(row)

  selected = []
  coverage = []
  for path, rows in sorted(by_manifest.items()):
      by_seed = defaultdict(list)
      for r in rows:
          by_seed[r["seed"]].append(r)
      picked = []
      for seed in sorted(by_seed):
          candidates = sorted(
              by_seed[seed],
              key=lambda r: (
                  priority.get(r.get("composition_target"), 9),
                  r.get("prompt_id", ""),
              ),
          )
          picked.extend(candidates[:4])
      selected.extend(picked)
      coverage.append({
          "manifest": path,
          "selected": len(picked),
          "by_seed": {str(seed): sum(1 for r in picked if r["seed"] == seed) for seed in sorted(by_seed)},
          "by_target": {
              t: sum(1 for r in picked if r.get("composition_target") == t)
              for t in sorted({r.get("composition_target") for r in picked})
          },
      })

  batch_size = 20
  for batch_index in range(0, len(selected), batch_size):
      items = selected[batch_index:batch_index + batch_size]
      batch_id = f"batch_{batch_index // batch_size + 1:03d}"
      payload = {"batch_id": batch_id, "images": items}
      json_path = os.path.join(out, f"{batch_id}.json")
      md_path = os.path.join(out, f"{batch_id}.md")
      with open(json_path, "w") as f:
          json.dump(payload, f, ensure_ascii=False, indent=2)
      with open(md_path, "w") as f:
          f.write(f"# {batch_id}\n\n")
          for i, r in enumerate(items, 1):
              f.write(
                  f"{i}. `{r['image']}` | domain={r.get('domain')} | "
                  f"style={r.get('prompt_style')} | size={r.get('size')} | "
                  f"seed={r.get('seed')} | target={r.get('composition_target')} | "
                  f"prompt_id={r.get('prompt_id')}\n"
              )

  with open(os.path.join(out, "coverage.json"), "w") as f:
      json.dump({"total": len(selected), "coverage": coverage}, f, ensure_ascii=False, indent=2)
  print("WROTE", out, "total", len(selected))
  PY
