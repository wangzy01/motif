# DPG smoke: validate the DPG generate->score handoff + the Qwen3-VL judge (venv-dpg,
# unproven this session) at tiny scale (3 prompts x {b1, ab3lora} = adapter + lora paths).
# Two python envs in one job: venv-gpu generates, venv-dpg scores. Single GPU, read-only.
name: evan-mot-eval-dpg-smoke
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 16
memGBPerWorker: 220
maxRetries: 0
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  PYG=/fsx/evan/mot_code/venv-gpu/bin/python
  PYD=/fsx/evan/mot_code/venv-dpg/bin/python
  export PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  export HF_HOME=/local/evan/cache/huggingface TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  mkdir -p $HF_HOME $TORCH_HOME $TRITON_CACHE_DIR
  OUT=experiments/results/eval_dpg_smoke
  SAMP=$OUT/samples
  RUNS="b1 ab3lora"
  mkdir -p $SAMP
  nvidia-smi -L || true

  echo "===== GENERATE DPG images (venv-gpu, 3 prompts) ====="
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 30m $PYG experiments/eval/dpg/generate_dpg.py \
    --runs $RUNS --out-dir $SAMP --size 256 --steps 64 --cfg 4.0 \
    --seed 7 --weights ema --batch-size 4 --limit 3 --grid 1

  echo "===== SCORE DPG (venv-dpg, Qwen3-VL judge) ====="
  set +e
  HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 timeout 30m $PYD experiments/eval/dpg/run_dpg.py \
    --samples-dir $SAMP --runs $RUNS --backend qwen3vl --limit 3 --out-dir $OUT
  echo "[dpg-score] rc=$?"
  set -e
  echo "===== DONE ====="
  cat $OUT/comparison.md || true
