# One-node CPU proof: verified 17-file /local mirror + formal loader config.
name: evan-mot-crop-offlinearb-anime-caption-stage-proof
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export CUDA_VISIBLE_DEVICES=""
  export PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 ARROW_NUM_THREADS=1
  export OFFLINE_ARB_STEP_TIMEOUT_S=1800
  export OFFLINE_ARB_PROFILE_WINDOWS=1
  export OFFLINE_ARB_SMOKE_DATASET_CONFIG=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop/configs/stage256_offline_exact_v1.yaml
  unset OFFLINE_ARB_ANIME_CAPTION_WORKERS

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  BASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  MANIFEST=$BASE/offline_arb_anime_caption_source_manifest_v1/header.json
  test -f "$MANIFEST"
  "$PY" -m py_compile \
    scripts/offline_arb/stage_anime_caption_local.py \
    scripts/offline_arb/smoke_offline_loader.py \
    training/dataline_offline/offline_dataset.py
  HOST=$(hostname); STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  OUT=$BASE/offline_arb_anime_caption_stage_proof_20260711r2
  mkdir -p "$OUT"
  STAGE_LOG=$OUT/captionstage.$HOST.$STAMP.log
  set +e
  CAPTION_ROOT=$(timeout --signal=TERM --kill-after=30s 1800s \
    "$PY" scripts/offline_arb/stage_anime_caption_local.py \
      --manifest "$MANIFEST" --workers 2 \
      2> >(tee "$STAGE_LOG" >&2))
  STAGE_RC=$?
  set -e
  [ "$STAGE_RC" -eq 0 ] || { echo "STAGE_PROOF staging failed rc=$STAGE_RC"; exit "$STAGE_RC"; }
  test -d "$CAPTION_ROOT"
  export OFFLINE_ARB_ANIME_CAPTION_ROOT=$CAPTION_ROOT
  export OFFLINE_ARB_LOCAL_ROOT=/local/evan/offline_arb_stage_proof_${HOST}

  PLAN_ROOT=$BASE/offline_arb_plans_v1/w4_smoke/plan
  CATALOG_ROOT=$BASE/offline_arb_catalog_v1
  ANIME_FREQ_ROOT=$BASE/offline_arb_animefreq_v1
  LOG_TMP=$OUT/.proof.$HOST.$STAMP.tmp
  echo "STAGE_PROOF host=$HOST caption_root=$CAPTION_ROOT"
  set +e
  timeout --signal=TERM --kill-after=30s 1770s \
    "$PY" scripts/offline_arb/smoke_offline_loader.py \
      --plan-root "$PLAN_ROOT" \
      --catalog-root "$CATALOG_ROOT" \
      --anime-freq-root "$ANIME_FREQ_ROOT" \
      --ranks 4 \
      --steps 12 \
    2>&1 | tee "$LOG_TMP"
  PIPE_RC=("${PIPESTATUS[@]}")
  set -e
  SMOKE_RC=${PIPE_RC[0]}; TEE_RC=${PIPE_RC[1]}
  if [ "$TEE_RC" -ne 0 ]; then
    rm -f "$LOG_TMP"
    echo "STAGE_PROOF evidence tee failed rc=$TEE_RC"; exit "$TEE_RC"
  fi
  if [ "$SMOKE_RC" -eq 0 ]; then
    LOG_FINAL=$OUT/proof.$HOST.$STAMP.PASS.log
  else
    LOG_FINAL=$OUT/proof.$HOST.$STAMP.FAIL.log
  fi
  mv "$LOG_TMP" "$LOG_FINAL"
  echo "STAGE_PROOF_DONE rc=$SMOKE_RC log=$LOG_FINAL caption_root=$CAPTION_ROOT"
  exit "$SMOKE_RC"
