# 验证 dataline 真值埋点端到端写进 metrics.jsonl。1 GPU、bs8、20 步、dataline_metrics_every=5。
# 通过判据：metrics.jsonl 里步 1/5/10/15/20 出现 mix_*/buf_*/prod_*/anime_fetch_* 且数值合理；done rc=0。
name: evan-mot-smk-dlmetrics
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 1
cpuPerWorker: 24
memGBPerWorker: 200
maxRetries: 1
command: |
  set -uxo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=6 PYTHONUNBUFFERED=1 PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN FI_EFA_USE_DEVICE_RDMA=1
  mkdir -p /local/evan/cache/huggingface /local/evan/cache/torch /local/evan/cache/triton /local/evan/anime_img_cache
  PY=/fsx/evan/mot_code/venv-gpu/bin/python

  RUN_ID=smk_dlmetrics
  CK=/local/evan/mot_smoke/$RUN_ID
  RES=/fsx/evan/mot_code/mot_pilot_v1/experiments/results/$RUN_ID
  STATS=/fsx/evan/mot_code/mot_pilot_v1/experiments/stats/monet_global_stats.json
  mkdir -p "$CK" "$RES"
  DOTS="trainer.checkpoint_dir=$CK trainer.resume=false trainer.save_final=false trainer.batch_size=8 \
        trainer.dataline_metrics_every=5 trainer.force_os_exit_after_train=true trainer.skip_distributed_teardown=true \
        dataset.stats_cache=$STATS dataset.anime_cache_dir=/local/evan/anime_img_cache dataset.first_fill_timeout_s=60"

  $PY -m torch.distributed.run --standalone --nnodes=1 --nproc_per_node=1 \
      train.py --config configs/stage1a_t2i_256_v2.yaml --max-steps 20 $DOTS 2>&1 | tee "$RES/smoke.log"
  RC=${PIPESTATUS[0]}
  echo "===== DL-METRICS-SMOKE rc=$RC; metrics.jsonl 新 key 抽样: ====="
  grep -oE '"(mix_[a-z_]+|buf_[a-z_]+|prod_[a-z_]+|anime_fetch_ok_rate)":[0-9.]+' "$CK/metrics.jsonl" 2>/dev/null | sort -u | head -40 || echo "(无 metrics.jsonl)"
  echo "===== 最后一行 metrics.jsonl ====="
  tail -1 "$CK/metrics.jsonl" 2>/dev/null || true
  echo "===== DL-METRICS-SMOKE exited rc=$RC $(date -u) ====="; exit $RC
