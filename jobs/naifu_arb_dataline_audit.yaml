name: evan-mot-cleanup-crop-naifu-arb-dataline
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 24
memGBPerWorker: 128
maxRetries: 0
command: |
  set -euo pipefail
  cd /fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export PYTHONPATH=/fsx/evan/mot_code/mot_pilot_v1_cleanup_crop
  RUN_TAG="$(date -u +%Y%m%dT%H%M%SZ)_${HOSTNAME:-local}_${RANDOM}"
  OUT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/naifu_arb_dataline_audit_$RUN_TAG
  mkdir -p "$OUT"
  echo "[dataline-audit] OUT=$OUT"
  /fsx/evan/mot_code/venv-gpu/bin/python - <<'PY' | tee "$OUT/audit.json"
  import json, os, sys
  from collections import Counter
  from omegaconf import OmegaConf
  from training.dataline.complete_dataset import CompleteV1Dataset

  cfg = OmegaConf.load("configs/stage256_redesign_naifu_arb_v1.yaml")
  kwargs = OmegaConf.to_container(cfg.dataset, resolve=True)
  kwargs.update({
      "rank": 0,
      "world_size": 1,
      "buffer_size": 768,
      "queue_size": 256,
      "min_fill": 16,
      "max_shards": 4,
      "max_rows_per_shard": 512,
      "anime_nrows": 4000,
  })
  ds = CompleteV1Dataset(**kwargs)
  buckets = set(tuple(x) for x in ds._mar_buckets)
  loader = ds.loader(16)
  shapes = Counter()
  for i in range(30):
      batch = next(loader)
      pix = batch["pixels"]
      shape = tuple(pix.shape)
      hw = (int(shape[2]), int(shape[3]))
      assert shape[0] == 16 and shape[1] == 3, shape
      assert hw in buckets, hw
      shapes[hw] += 1
      rr = sum(ds._mar_reresize_by_domain.values())
      assert rr == 0, dict(ds._mar_reresize_by_domain)
      print(json.dumps({
          "batch": i + 1,
          "shape": hw,
          "domain_mix": dict(ds.domain_counter),
          "produced": dict(ds.produced),
          "buffer_fill": getattr(ds, "buffer_fill", {}),
          "reresize": dict(ds._mar_reresize_by_domain),
          "extreme_clamped": int(ds._mar_extreme_clamped),
      }, ensure_ascii=False), flush=True)
  out = {
      "status": "PASS",
      "batches": 30,
      "shape_counts": {str(k): v for k, v in shapes.items()},
      "domain_counter": dict(ds.domain_counter),
      "produced": dict(ds.produced),
      "reresize": dict(ds._mar_reresize_by_domain),
      "extreme_clamped": int(ds._mar_extreme_clamped),
  }
  print(json.dumps(out, ensure_ascii=False, indent=2), flush=True)
  sys.stdout.flush()
  sys.stderr.flush()
  os._exit(0)
  PY
