name: evan-s512b-plan-row-reuse-20260802
description: "Per-ROW reuse over all 245 plan blocks. Every exposure audit so far aggregates by sub-source, cluster or band, and all three average over rows -- which hides the one failure mode that matters at 512M exposures: a small set of rows shown hundreds of times while the domain-level epoch count looks calm. Reports percentiles over USED rows, how many rows are never drawn at all, the share of exposures held by the hottest 0.1/1/10 percent, and names the hottest rows so a suspicious count can be inspected rather than just noted. Read-only apart from one JSON written beside the plan."
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
maxRetries: 0
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 64
environments:
  EXPECTED_COMMIT: ""
command: |
  set -euo pipefail
  HOST=$(hostname); NODE_RANK=${HOST##*-}
  case "$NODE_RANK" in ''|*[!0-9]*) NODE_RANK=0 ;; esac
  [ "$NODE_RANK" = 0 ] || { echo "FATAL: rank!=0"; exit 42; }
  export CUDA_VISIBLE_DEVICES="" LC_ALL=C PYTHONUNBUFFERED=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  REPO=/fsx/evan/mot_code_s512b_impl
  test -x "$PY" && test -d "$REPO/.git" || { echo "FATAL: env"; exit 43; }
  export PYTHONPATH="$REPO"
  export PYTHONPYCACHEPREFIX="/local/evan/pycache/${JCC_JOB_ID:-job}/$HOST"; mkdir -p "$PYTHONPYCACHEPREFIX"
  cd "$REPO"
  [ -n "${EXPECTED_COMMIT:-}" ] || { echo "FATAL: EXPECTED_COMMIT unset"; exit 43; }
  bash scripts/jcc_preflight.sh "$EXPECTED_COMMIT" "$REPO"
  B=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  PLAN=$B/offline_arb_plan_stage512b_w64_512m_anchors_v1_20260802
  OUT=$B/offline_arb_plan_stage512b_w64_512m_anchors_v1_20260802.ROW_REUSE.json
  test ! -e "$OUT" || { echo "FATAL: report exists"; exit 45; }
  echo "=== per-row reuse over all 245 blocks ==="
  timeout --signal=TERM --kill-after=300s 7200s "$PY" scripts/offline_arb/audit_plan_row_reuse_v1.py \
    --plan-root "$PLAN" --catalog-root "$B/offline_arb_catalog_stage512b_v1" \
    --top 25 --json-out "$OUT"
  echo "=== report ==="; ls -la "$OUT"
  echo "=== DONE ==="
