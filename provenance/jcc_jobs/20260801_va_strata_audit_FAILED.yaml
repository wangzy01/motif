name: evan-s512b-va-strata-audit-20260801-v1
description: "Read-only metadata audit of the FULL SURVIVOR pool (VA) chosen for Stage512b-real. Reproduces the survivor gates exactly, re-derives B13 anchor assignment with the new anchors_v1 module (full-scale control against Part 2), and reports the quality / caption-band / source strata Part 2 did not compute. No image reads, no model, CPU only."
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
maxRetries: 0
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 16
memGBPerWorker: 128
environments: {}
command: |
  set -euo pipefail

  HOST=$(hostname); NODE_RANK=${HOST##*-}
  case "$NODE_RANK" in ''|*[!0-9]*) NODE_RANK=0 ;; esac
  [ "$NODE_RANK" = 0 ] || { echo "FATAL: rank!=0 on a 1-worker job"; exit 42; }

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  test -x "$PY" || { echo "FATAL: interpreter missing"; exit 43; }

  export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 PYTHONUNBUFFERED=1
  export HF_HOME=/local/evan/cache/huggingface TORCH_HOME=/local/evan/cache/torch
  export PYTHONPYCACHEPREFIX="/local/evan/pycache/${JCC_JOB_ID:-job}/$HOST"
  mkdir -p "$PYTHONPYCACHEPREFIX" /local/evan/s512b/mod

  B=/s3-pixai-test-uw2/evan/mot_filtering_v1
  OUT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/stage512b_va_strata_audit_20260801_v1
  SRC=/fsx/evan/mot_code_s512b_impl/training/dataline/anchors_v1.py

  test -d "$B" || { echo "FATAL: missing $B"; exit 43; }
  test -f "$SRC" || { echo "FATAL: missing anchors_v1.py"; exit 43; }
  test ! -e "$OUT" && test ! -L "$OUT" || { echo "FATAL: output exists: $OUT"; exit 45; }
  mkdir "$OUT"

  # Stage the real module so this audit validates the code that will build the catalog,
  # not a re-implementation of it.
  cp "$SRC" /local/evan/s512b/mod/anchors_v1.py
  sha256sum "$SRC" | tee "$OUT/anchors_v1.sha256"

  cat > /local/evan/s512b/va_strata.py <<'PYEOF'
  import json, os, sys, glob, time
  import numpy as np
  import pyarrow as pa
  import pyarrow.parquet as pq

  sys.path.insert(0, "/local/evan/s512b/mod")
  import anchors_v1 as A

  B, OUT = sys.argv[1], sys.argv[2]
  AREA_GATE = 262144
  NA = 13
  T0 = time.time()

  # Part 2 reference values, for a hard control on the gate reproduction.
  REF = {
      "monet_survivors": 73820347,
      "monet_accepted": 73117956,
      "gpic_survivors_target": 81915002,
      "gpic_accepted": 66820793,
      "gpic_aes_threshold": 4.36969,
  }
  AES_BINS = np.arange(0.0, 10.0001, 0.1)

  def log(m):
      print(f"[{time.time()-T0:8.1f}s] {m}", flush=True)

  def write_partial(obj, name):
      p = os.path.join(OUT, name)
      tmp = p + ".tmp"
      with open(tmp, "w") as fh:
          json.dump(obj, fh, indent=2, sort_keys=True, default=str)
          fh.write("\n")
          fh.flush()
          os.fsync(fh.fileno())
      os.replace(tmp, p)
      log(f"wrote {name}")

  def load_dropset(path, col):
      t = pq.read_table(path, columns=[col])
      ca = t.column(0)
      arr = pa.concat_arrays(ca.chunks) if isinstance(ca, pa.ChunkedArray) else ca
      s = set(arr.to_pylist())
      log(f"dropset {os.path.basename(path)}: {t.num_rows:,} rows -> set {len(s):,}")
      return s

  def not_in(vals, dropset):
      # pc.is_in rebuilds a hash table per call; a prebuilt python set is ~5x faster
      # on this shape and gives identical results.
      return np.fromiter((v not in dropset for v in vals), dtype=bool, count=len(vals))

  report = {
      "schema": "mot_stage512b_va_strata_audit_v1",
      "purpose": ("Full-survivor (VA) pool: exact gate reproduction, B13 assignment via the "
                  "production anchors_v1 module, plus quality/band/source strata."),
      "read_only": True, "images_read": 0, "models_loaded": 0,
      "source_area_gate": AREA_GATE, "crop_loss_threshold": A.CROP_LOSS_MAX,
      "anchor_set_id": A.ANCHOR_SET_ID,
      "anchors": [{"anchor_id": i, "width": w, "height": h}
                  for i, (w, h) in enumerate(A.ANCHORS_V1_WH)],
      "part2_reference": REF,
  }

  # ---------------- MONET ----------------
  drop = load_dropset(f"{B}/t2_monet_internal_cuvs_single_full/monet_neardup_drop_ids.parquet",
                      "drop_id")
  files = sorted(glob.glob(f"{B}/monet_manifest/*.parquet"))
  log(f"monet shards: {len(files):,}")
  if not files:
      print("FATAL: no monet shards"); sys.exit(44)

  TOKS = ["tok_original", "tok_florence", "tok_internvl", "tok_sharegpt4v", "tok_gemini"]
  COLS = (["id", "source", "keep", "width", "height", "aes_jasperai",
           "has_t1", "has_t2", "has_t3", "has_t4"] + TOKS)

  m_anchor = np.zeros(NA, dtype=np.int64)
  m_src_anchor = {}
  m_src_aes = {}
  m_src_band = {}
  m_anchor_band = np.zeros((NA, 4), dtype=np.int64)
  m_neg_tok = {t: 0 for t in TOKS}
  m_considered = 0
  m_accepted = 0
  m_area_fail = 0
  m_aes_lt5 = {}
  m_src_rows = {}

  for i, f in enumerate(files):
      t = pq.read_table(f, columns=COLS)
      n = t.num_rows
      if n == 0:
          continue
      keep = np.asarray(t["keep"].to_pylist(), dtype=np.int8).astype(bool)
      ids = t["id"].to_pylist()
      alive = keep & not_in(ids, drop)
      if not alive.any():
          continue
      idx = np.flatnonzero(alive)
      m_considered += int(alive.sum())
      # width/height are double in this manifest -> rint before int cast
      w = np.rint(np.asarray(t["width"].to_pylist(), dtype=np.float64)[idx]).astype(np.int64)
      h = np.rint(np.asarray(t["height"].to_pylist(), dtype=np.float64)[idx]).astype(np.int64)
      src = np.asarray(t["source"].to_pylist(), dtype=object)[idx]
      aes = np.asarray(t["aes_jasperai"].to_pylist(), dtype=np.float64)[idx]
      m_area_fail += int((w * h < AREA_GATE).sum())

      aid, _cl = A.assign_anchor_batch(w, h, area_gate=AREA_GATE)
      ok = aid >= 0
      m_accepted += int(ok.sum())
      m_anchor += np.bincount(aid[ok], minlength=NA).astype(np.int64)

      bands = np.stack([np.asarray(t[f"has_t{k}"].to_pylist(), dtype=np.int8)[idx].astype(bool)
                        for k in (1, 2, 3, 4)], axis=1)
      for bi in range(4):
          sel = ok & bands[:, bi]
          if sel.any():
              m_anchor_band[:, bi] += np.bincount(aid[sel], minlength=NA).astype(np.int64)

      for tk in TOKS:
          tv = np.asarray(t[tk].to_pylist(), dtype=np.int64)[idx]
          m_neg_tok[tk] += int((tv < 0).sum())

      for s in np.unique(src):
          sm = src == s
          s = str(s)
          m_src_rows[s] = m_src_rows.get(s, 0) + int(sm.sum())
          smok = sm & ok
          if s not in m_src_anchor:
              m_src_anchor[s] = np.zeros(NA, dtype=np.int64)
              m_src_aes[s] = np.zeros(len(AES_BINS) - 1, dtype=np.int64)
              m_src_band[s] = np.zeros(4, dtype=np.int64)
              m_aes_lt5[s] = 0
          if smok.any():
              m_src_anchor[s] += np.bincount(aid[smok], minlength=NA).astype(np.int64)
              a_ok = aes[smok]
              a_ok = a_ok[np.isfinite(a_ok)]
              m_src_aes[s] += np.histogram(a_ok, bins=AES_BINS)[0].astype(np.int64)
              m_aes_lt5[s] += int((a_ok < 5.0).sum())
              for bi in range(4):
                  m_src_band[s][bi] += int((smok & bands[:, bi]).sum())

      if (i + 1) % 500 == 0:
          log(f"monet {i+1}/{len(files)} considered={m_considered:,} accepted={m_accepted:,}")
          report["monet_progress"] = {"shards_done": i + 1, "considered": m_considered}
          write_partial(report, "REPORT.partial.json")

  report["monet"] = {
      "shards": len(files),
      "survivors_reproduced": m_considered,
      "survivors_target": REF["monet_survivors"],
      "survivors_match": m_considered == REF["monet_survivors"],
      "accepted_rows": m_accepted,
      "accepted_target_part2": REF["monet_accepted"],
      "accepted_match": m_accepted == REF["monet_accepted"],
      "area_gate_failed": m_area_fail,
      "per_anchor": [{"anchor_id": k, "width": A.ANCHORS_V1_WH[k][0],
                      "height": A.ANCHORS_V1_WH[k][1], "rows": int(m_anchor[k])}
                     for k in range(NA)],
      "per_anchor_band_available": {f"T{b+1}": [int(x) for x in m_anchor_band[:, b]]
                                    for b in range(4)},
      "negative_tok_counts_int16_overflow": m_neg_tok,
      "by_source": {s: {"survivor_rows": m_src_rows[s],
                        "accepted_rows": int(m_src_anchor[s].sum()),
                        "per_anchor": [int(x) for x in m_src_anchor[s]],
                        "band_available": {f"T{b+1}": int(m_src_band[s][b]) for b in range(4)},
                        "aes_lt_5_0": m_aes_lt5[s],
                        "aes_hist_0_to_10_step_0p1": [int(x) for x in m_src_aes[s]]}
                    for s in sorted(m_src_anchor)},
  }
  write_partial(report, "REPORT.partial.json")
  log("MONET done")
  del drop

  # ---------------- GPIC ----------------
  gdrop = load_dropset(f"{B}/t5_inputs/gpic_drop_union.parquet", "drop_key")
  base = sorted(glob.glob(f"{B}/gpic_manifest_base/*.parquet"))
  pas = sorted(glob.glob(f"{B}/gpic_pass/*.parquet"))
  log(f"gpic shards: base {len(base):,} pass {len(pas):,}")
  if len(base) != len(pas):
      report["gpic_error"] = f"shard count mismatch {len(base)} vs {len(pas)}"
      write_partial(report, "REPORT.json")
      sys.exit(44)

  g_anchor = np.zeros(NA, dtype=np.int64)
  g_tier_anchor = {}
  g_aes = np.zeros(len(AES_BINS) - 1, dtype=np.int64)
  g_considered = 0
  g_accepted = 0
  g_area_fail = 0
  THR = REF["gpic_aes_threshold"]

  for i, (fb, fp) in enumerate(zip(base, pas)):
      tb = pq.read_table(fb, columns=["key", "width", "height", "tier", "keep_basic"])
      tp = pq.read_table(fp, columns=["key", "ok", "aes_laion_improved"])
      if tb.num_rows != tp.num_rows:
          report["gpic_error"] = f"row misalignment at shard {i}"
          write_partial(report, "REPORT.json")
          sys.exit(44)
      if tb.num_rows == 0:
          continue
      kb = np.asarray(tb["keep_basic"].to_pylist(), dtype=np.int8).astype(bool)
      okc = np.asarray(tp["ok"].to_pylist(), dtype=object) == True   # noqa: E712
      aes = np.asarray(tp["aes_laion_improved"].to_pylist(), dtype=np.float64)
      keys = tb["key"].to_pylist()
      alive = kb & okc & np.isfinite(aes) & (aes >= THR) & not_in(keys, gdrop)
      if not alive.any():
          continue
      idx = np.flatnonzero(alive)
      g_considered += int(alive.sum())
      w = np.asarray(tb["width"].to_pylist(), dtype=np.int64)[idx]
      h = np.asarray(tb["height"].to_pylist(), dtype=np.int64)[idx]
      tier = np.asarray(tb["tier"].to_pylist(), dtype=np.int8)[idx]
      g_area_fail += int((w * h < AREA_GATE).sum())
      aid, _cl = A.assign_anchor_batch(w, h, area_gate=AREA_GATE)
      ok = aid >= 0
      g_accepted += int(ok.sum())
      g_anchor += np.bincount(aid[ok], minlength=NA).astype(np.int64)
      a_ok = aes[idx][ok]
      g_aes += np.histogram(a_ok[np.isfinite(a_ok)], bins=AES_BINS)[0].astype(np.int64)
      for tv in np.unique(tier):
          key = f"tier_{int(tv)}"
          sel = ok & (tier == tv)
          if key not in g_tier_anchor:
              g_tier_anchor[key] = np.zeros(NA, dtype=np.int64)
          if sel.any():
              g_tier_anchor[key] += np.bincount(aid[sel], minlength=NA).astype(np.int64)
      if (i + 1) % 500 == 0:
          log(f"gpic {i+1}/{len(base)} considered={g_considered:,} accepted={g_accepted:,}")
          report["gpic_progress"] = {"shards_done": i + 1, "considered": g_considered}
          write_partial(report, "REPORT.partial.json")

  report["gpic"] = {
      "shards": len(base),
      "survivors_reproduced": g_considered,
      "survivors_target": REF["gpic_survivors_target"],
      "survivors_delta": g_considered - REF["gpic_survivors_target"],
      "accepted_rows": g_accepted,
      "accepted_target_part2": REF["gpic_accepted"],
      "accepted_delta": g_accepted - REF["gpic_accepted"],
      "area_gate_failed": g_area_fail,
      "aes_threshold_used": THR,
      "per_anchor": [{"anchor_id": k, "width": A.ANCHORS_V1_WH[k][0],
                      "height": A.ANCHORS_V1_WH[k][1], "rows": int(g_anchor[k])}
                     for k in range(NA)],
      "per_tier_per_anchor": {k: [int(x) for x in v] for k, v in sorted(g_tier_anchor.items())},
      "aes_hist_0_to_10_step_0p1": [int(x) for x in g_aes],
      "note": ("A +117 survivor delta against Part 2 is the known p10-threshold rounding "
               "artifact (aes recorded to 5 decimals as 4.36969); it is accepted, not a bug."),
  }

  report["cluster_availability"] = {
      "monet_manifest_has_cluster_column": False,
      "gpic_manifest_has_cluster_column": False,
      "note": ("cluster_id exists only in t5_manifest/rich_v1 (the curated 60M). The full "
               "survivor pool has no cluster assignment, so cluster_beta cannot be applied "
               "to it. sscd_cluster_id in the MONET source parquet is a per-image dedup id "
               "(all singletons), not a semantic cluster, so size**-beta is identically 1.0."),
  }
  report["elapsed_s"] = round(time.time() - T0, 1)
  write_partial(report, "REPORT.json")
  try:
      os.remove(os.path.join(OUT, "REPORT.partial.json"))
  except FileNotFoundError:
      pass

  ok_all = (report["monet"]["survivors_match"] and report["monet"]["accepted_match"]
            and abs(report["gpic"]["accepted_delta"]) <= 200)
  fd = os.open(os.path.join(OUT, "_SUCCESS"), os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o444)
  with os.fdopen(fd, "w") as fh:
      fh.write(f"monet_survivors_match={report['monet']['survivors_match']}\n"
               f"monet_accepted_match={report['monet']['accepted_match']}\n"
               f"gpic_accepted_delta={report['gpic']['accepted_delta']}\n"
               f"elapsed_s={report['elapsed_s']}\n")
      fh.flush()
      os.fsync(fh.fileno())
  dfd = os.open(OUT, os.O_RDONLY)
  os.fsync(dfd)
  os.close(dfd)
  log(f"DONE ok_all={ok_all}")
  sys.exit(0 if ok_all else 44)
  PYEOF

  $PY -m py_compile /local/evan/s512b/va_strata.py || { echo "FATAL: py_compile"; exit 43; }
  timeout --signal=TERM --kill-after=120s 25200s "$PY" /local/evan/s512b/va_strata.py "$B" "$OUT"
