name: evan-s512b-phase3a-anchors-formal-20260802-v2
description: "Stage512b-real phase3a FORMAL run 2 (full pool). Supersedes the 2026-08-01 run: textatlas is now capped at anchors_crop_loss_max_by_domain=0.12 (global stays 0.20) because 2,388 of its non-square rows were cropped through rendered glyphs while their captions still quoted the full string. Run 1 is archived under _superseded_run1_20260801/ and this job refuses to start unless that evidence is present and the formal names are free. Metadata only: reads manifest width/height/holdout, no image reads, no model, CPU only."
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
maxRetries: 0
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 32
memGBPerWorker: 96
environments: {}
command: |
  set -euo pipefail

  HOST=$(hostname); NODE_RANK=${HOST##*-}
  case "$NODE_RANK" in ''|*[!0-9]*) NODE_RANK=0 ;; esac
  [ "$NODE_RANK" = 0 ] || { echo "FATAL: rank!=0 on a 1-worker job"; exit 42; }

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  test -x "$PY" || { echo "FATAL: interpreter missing"; exit 43; }

  REPO=/fsx/evan/mot_code_s512b_impl
  test -d "$REPO/.git" || { echo "FATAL: repo missing"; exit 43; }

  export PYTHONPATH="$REPO"
  export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 PYTHONUNBUFFERED=1
  export HF_HOME=/local/evan/cache/huggingface TORCH_HOME=/local/evan/cache/torch
  export PYTHONPYCACHEPREFIX="/local/evan/pycache/${JCC_JOB_ID:-job}/$HOST"
  mkdir -p "$PYTHONPYCACHEPREFIX"

  cd "$REPO"
  echo "=== identity ==="
  git rev-parse HEAD
  git status --porcelain | head -20
  sha256sum training/dataline/anchors_v1.py \
            scripts/offline_arb/phase3a_bucket_stats.py \
            scripts/offline_arb/phase5_build_catalog.py \
            configs/stage512b_real_anchors_v1.yaml \
            data_analysis/configs/t5_sampling_stage512b_real_v1.json

  echo "=== the branch must be pushed: a receipt that cites an unpushed SHA is unverifiable ==="
  git fetch --quiet origin codex/stage512b-real-v04-20260801 2>/dev/null || \
    echo "WARN: fetch unavailable on this node; SHA above is the binding record"

  echo "=== local test suites must pass before touching data ==="
  "$PY" scripts/test_anchors_v1_geometry.py  | tail -1
  "$PY" scripts/test_phase5_anchors_v1.py    | tail -1
  "$PY" scripts/test_phase3a_anchors_v1.py   | tail -1
  "$PY" data_analysis/scripts/s512b_joint_matrix_v1.py --self-test | tail -1

  OUT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_bucketstats_stage512b_v1
  for f in N_matrix.parquet bucket_decision_report.json bucket_decision_summary.md; do
    test ! -e "$OUT/$f" || { echo "FATAL: formal artifact already exists: $OUT/$f"; exit 45; }
  done
  echo "=== run 1 is archived, not overwritten ==="
  test -f "$OUT/_superseded_run1_20260801/README.txt" || { echo "FATAL: run1 evidence missing"; exit 45; }
  ls "$OUT/_superseded_run1_20260801/"

  echo "=== phase3a FORMAL run 2 (FULL pool, textatlas capped at 0.12) -> $OUT ==="
  timeout --signal=TERM --kill-after=120s 14400s "$PY" scripts/offline_arb/phase3a_bucket_stats.py \
      --config configs/stage512b_real_anchors_v1.yaml \
      --stage 512b \
      --output-dir "$OUT" \
      --workers 32 \
      --batch-size 65536 \
      --floors 0.0 \
      --world-size 64 --per-rank-bs 32

  echo "=== products ==="
  ls -la "$OUT"

  "$PY" - <<'PYEOF'
  import json
  import pyarrow.parquet as pq
  base = "/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_bucketstats_stage512b_v1"
  t = pq.read_table(f"{base}/N_matrix.parquet")
  c = {k: t[k].to_pylist() for k in t.column_names}
  dom = [x for x in t.column_names if x.startswith("n_") and x != "n_total"]
  print(f'{"idx":>4} {"WxH":>10} {"ar":>7} ' + " ".join(f"{d[2:]:>12}" for d in dom) + f' {"total":>12}')
  for i in range(t.num_rows):
      print(f'{c["bucket_idx"][i]:>4} {c["bucket_w"][i]}x{c["bucket_h"][i]:<6}'
            f' {c["bucket_ar"][i]:>7.3f} '
            + " ".join(f'{c[d][i]:>12,}' for d in dom) + f' {c["n_total"][i]:>12,}')
  print("SUM:", {d[2:]: sum(c[d]) for d in dom})

  rep = json.load(open(f"{base}/bucket_decision_report.json"))
  print("\nstage", rep.get("stage"), " diagnostic", rep.get("diagnostic_run"),
        " duration", round(rep.get("duration_seconds", 0), 1), "s")
  print("multi_ar_params:", json.dumps(rep["config"]["multi_ar_params"], sort_keys=True))
  print("eligibility_audit:", json.dumps(rep.get("eligibility_audit"), ensure_ascii=False)[:300])

  print("\ncoverage identity:")
  for d, r in rep["coverage"].items():
      ident = (r["rows_raw"] - r["rows_holdout_dropped"] - r["rows_elig_dropped"]
               - r["rows_invalid_wh_dropped"] - r["rows_unservable_dropped"])
      print(f'  {d:<12} raw {r["rows_raw"]:>11,} holdout {r["rows_holdout_dropped"]:>8,}'
            f' areagate {r["rows_elig_dropped"]:>10,} invalid {r["rows_invalid_wh_dropped"]:>7,}'
            f' UNSERV {r["rows_unservable_dropped"]:>9,} kept {r["rows_kept"]:>11,}'
            f'  ok={ident == r["rows_kept"]}')

  # The textatlas cap is the reason this run exists, so state its effect explicitly
  # rather than leaving it to be inferred from the totals.
  ta = rep["coverage"]["textatlas"]
  print(f'\ntextatlas: kept {ta["rows_kept"]:,} (run 1, uncapped, was 4,118,484;'
        f' expected delta about -2,400)')
  for d, prior in (("gpic", 15_787_767), ("synthetic", 13_802_182),
                   ("monet_real", 39_677_874), ("anime", 16_404_684)):
      now = rep["coverage"][d]["rows_kept"]
      print(f'  {d:<12} {now:>11,}  vs run 1 {prior:>11,}  '
            f'{"UNCHANGED" if now == prior else "CHANGED -- investigate"}')

  fl = rep.get("floors")
  if isinstance(fl, list) and fl:
      f0 = fl[0]
      print("\nfloor=0:", f0.get("kept_bucket_count"), "/13 anchors, folded_mass",
            f0.get("folded_mass_fraction"))
  PYEOF

  echo "=== sha256 of the new formal triple ==="
  sha256sum "$OUT/N_matrix.parquet" "$OUT/bucket_decision_report.json" "$OUT/bucket_decision_summary.md"
  echo "=== DONE ==="
