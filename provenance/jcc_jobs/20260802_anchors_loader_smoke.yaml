name: evan-s512b-anchors-loader-smoke-20260802-v2
description: "Decode a real batch at every one of the 13 Stage512b anchors through the production loader, plus an independent re-derivation of the same geometry from the plan and catalog on disk. First end-to-end exercise of the full Stage512b offline chain: catalog -> anime_priority -> weighted contract -> plan -> anime_freq -> caption sidecar -> loader. Seeks to the first step using each anchor rather than walking sequentially, since 352x704 is only 0.763% of steps."
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
maxRetries: 0
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 32
memGBPerWorker: 256
environments: {}
command: |
  set -euo pipefail
  HOST=$(hostname); NODE_RANK=${HOST##*-}
  case "$NODE_RANK" in ''|*[!0-9]*) NODE_RANK=0 ;; esac
  [ "$NODE_RANK" = 0 ] || { echo "FATAL: rank!=0"; exit 42; }
  export CUDA_VISIBLE_DEVICES="" LC_ALL=C PYTHONUNBUFFERED=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  REPO=/fsx/evan/mot_code_s512b_impl
  test -x "$PY" && test -d "$REPO/.git" || { echo "FATAL: env"; exit 43; }
  export PYTHONPATH="$REPO"
  export PYTHONPYCACHEPREFIX="/local/evan/pycache/${JCC_JOB_ID:-job}/$HOST"; mkdir -p "$PYTHONPYCACHEPREFIX"
  mkdir -p /local/evan/anime_img_cache
  cd "$REPO"
  echo "=== identity ==="; git rev-parse HEAD; git status --porcelain | head
  echo "=== every bound artifact must be present ==="
  B=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  for d in offline_arb_catalog_stage512b_v1 offline_arb_plan_stage512b_w64_512m_anchors_v1_20260802 \
           offline_arb_anime_priority_stage512b_weighted_v1_20260802 \
           offline_arb_animefreq_stage512b_v1 offline_arb_caption_sidecar_stage512b_v1; do
    test -d "$B/$d" || { echo "FATAL: missing $d"; exit 45; }
    echo "  ok $d"
  done
  echo "=== 13-anchor loader smoke: real decode at every anchor ==="
  timeout --signal=TERM --kill-after=600s 14400s "$PY" scripts/offline_arb/smoke_anchors_loader_v1.py \
    --config configs/stage512b_real_anchors_v1.yaml \
    --json-out /tmp/anchors_smoke.json
  echo "=== summary ==="
  "$PY" -c "
  import json;d=json.load(open('/tmp/anchors_smoke.json'))
  print('pass:',d['pass'],' anchors_passed:',d['anchors_passed'],'/',len(d['anchors_requested']))
  for k in sorted(d['per_anchor'], key=int):
      r=d['per_anchor'][k]
      print(f\"  a{k:<2} {r['size']:>8} step {r['step']:>6} {r['status']:<5} tensor {r.get('batch_shape')} rows {r.get('planned_rows_checked',0):,}\")
  if d['failures']: print('FAILURES:', d['failures'][:5])
  "
  cp /tmp/anchors_smoke.json "$B/offline_arb_plan_stage512b_w64_512m_anchors_v1_20260802.anchors_smoke.json" || true
  echo "=== DONE ==="
