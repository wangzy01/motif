name: evan-s512b-weighted-plan-build-20260802-v3
description: "Stage512b weighted offline plan, third attempt. v1 was refused for a non-conforming plan_id; v2 failed its own preflight because the working tree was mid-edit and an in-flight phase5 signature change broke a test it runs. Tree is clean and committed at 8ff082c now. v1 was refused by planner_v1.py:363 -- format_version=2 requires plan_id to start with stage512b_offline_exact_v2_, matching Stage512a's stage512a_offline_exact_v2_w64_256m_weighted_v1. Nothing was published by that attempt; its planner_input is archived under _failed_attempts/. Materializes the deterministic per-step bucket/row/band plan the loader consumes, bound by hash to the Stage512b catalog (b91e4906...) and today's anime priority sidecar. build_weighted_plan refuses a pre-existing output or staging root, so this is create-once by construction."
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
maxRetries: 0
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 32
memGBPerWorker: 256
environments: {}
command: |
  set -euo pipefail
  HOST=$(hostname); NODE_RANK=${HOST##*-}
  case "$NODE_RANK" in ''|*[!0-9]*) NODE_RANK=0 ;; esac
  [ "$NODE_RANK" = 0 ] || { echo "FATAL: rank!=0"; exit 42; }
  export CUDA_VISIBLE_DEVICES="" LC_ALL=C PYTHONUNBUFFERED=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  REPO=/fsx/evan/mot_code_s512b_impl
  test -x "$PY" && test -d "$REPO/.git" || { echo "FATAL: env"; exit 43; }
  export PYTHONPATH="$REPO"
  export PYTHONPYCACHEPREFIX="/local/evan/pycache/${JCC_JOB_ID:-job}/$HOST"; mkdir -p "$PYTHONPYCACHEPREFIX"
  cd "$REPO"
  echo "=== identity ==="; git rev-parse HEAD; git status --porcelain | head

  OUTBASE=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  PLAN=$OUTBASE/offline_arb_plan_stage512b_w64_512m_anchors_v1_20260802
  PI=$PLAN.planner_input.json
  CONTRACT=$REPO/data_analysis/configs/weighted_contract_stage512b_v1.json

  test ! -e "$PLAN" && test ! -e "$PLAN.work" || { echo "FATAL: plan root or staging exists"; exit 45; }

  echo "=== suites ==="
  "$PY" scripts/test_anchors_v1_geometry.py | tail -1
  "$PY" scripts/test_phase5_anchors_v1.py   | tail -1
  "$PY" scripts/offline_arb/test_stage512a_planner_v2.py | tail -1

  echo "=== regenerate planner_input beside the plan, from the formal N and the catalog header ==="
  # --catalog-header mode: N is the on-disk materialized count after tar exclusion, and
  # the plan is bound to the catalog's real hashes rather than a proxy.
  test ! -e "$PI" || { echo "FATAL: planner_input exists"; exit 45; }
  "$PY" scripts/offline_arb/make_planner_input.py \
    --n-matrix $OUTBASE/offline_arb_bucketstats_stage512b_v1/N_matrix.parquet \
    --config configs/stage512b_real_anchors_v1.yaml \
    --stage 512b --format-version 2 \
    --total-steps 250000 --world-size 64 --per-rank-bs 32 \
    --plan-id stage512b_offline_exact_v2_w64_512m_anchors_v1 \
    --catalog-header $OUTBASE/offline_arb_catalog_stage512b_v1/header.json \
    --out "$PI"
  sha256sum "$PI" "$CONTRACT"

  echo "=== build weighted plan ==="
  timeout --signal=TERM --kill-after=600s 36000s "$PY" scripts/offline_arb/build_weighted_plan_v1.py \
    --planner-input "$PI" --weighted-contract "$CONTRACT" --out "$PLAN"

  echo "=== products ==="
  ls -la "$PLAN"; echo "blocks: $(ls "$PLAN/blocks" | wc -l)"; du -sh "$PLAN"

  "$PY" - "$PLAN" <<'PYEOF'
  import json, sys
  from pathlib import Path
  p = Path(sys.argv[1]); h = json.loads((p / "header.json").read_text())
  print("plan_id       ", h["plan_id"])
  print("plan_hash     ", h["plan_hash"])
  print("stage/img     ", h.get("stage"), h.get("image_size"), "format_v", h.get("format_version"))
  print("steps/G/M     ", h["total_steps"], h["global_batch_size"], h.get("total_exposures"))
  print("blocks        ", h["num_blocks"], "block_steps", h["block_steps"])
  print("catalog_hash  ", h["catalog_hash"])
  print("assignment    ", h["assignment_hash"])
  wb = h.get("weighted_binding", {})
  print("weighted_binding.algorithm       ", wb.get("algorithm"))
  print("weighted_contract_sha256         ", h.get("weighted_contract_sha256"))
  print("materialization.collision_swaps  ", h["materialization"]["weighted_collision_swaps"])
  S = h["S"]
  print(f"per-anchor steps ({len(S)} anchors, sum {sum(S):,}):")
  for i, s in enumerate(S):
      print(f"   a{i:<2} {s:>8,} steps  {100*s/sum(S):6.3f}%")
  dm = h.get("domain_mix"); print("domain_mix:", dm)
  PYEOF
  echo "=== DONE ==="
