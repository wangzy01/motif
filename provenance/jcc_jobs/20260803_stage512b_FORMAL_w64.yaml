# Stage512b-real FORMAL training. 250,000 steps x global batch 2048 = 512,000,000
# exposures, 8 nodes x 8 H100, ~7.4 days at the 2.57 s/step the GPUVAL measured.
#
# NOT SUBMITTED WITHOUT EXPLICIT AUTHORISATION. Read STAGE512B_DECISIONS.md first.
#
# RUN_MODE is the whole safety story and there is no default.
#   fresh    -- CKPT_DIR must NOT exist. First launch: trainer.resume=true plus an empty
#               directory means train.py takes the init_from branch, loads Stage512a's
#               weights and optimizer, and resets global_step to 0 with a fresh warmup.
#   continue -- CKPT_DIR must exist AND contain last.pt. A resubmission continuing an
#               interrupted run, which is what stage512a_..._recovery_v1 / _v2 were.
# The hazard this replaces: resume=true against a directory that happens to contain a
# stale last.pt SILENTLY continues from it instead of initialising from Stage512a, and
# nothing downstream looks wrong. Requiring the operator to name which case this is
# makes that unrepresentable rather than merely unlikely.
#
# maxRetries 3 is deliberate and depends on resume working. A retry re-enters the same
# CKPT_DIR and must pick up from last.pt. If it silently re-initialised from Stage512a
# instead, days of progress would vanish with no error -- so in continue mode the job
# ASSERTS the resume line train.py prints. That assertion is why a separate resume
# GPUVAL is not a launch blocker: the failure mode is loud here.
#
# What the GPUVAL already established, on 64 GPUs with this plan and these weights
# (job evan-s512b-gpuval-w64-20260802-v2-fzm7, 420 steps):
#   loss 0.8701 warm vs Stage512a's final-200 mean 0.8611  (+1.2%, no geometry fault)
#   iter_s p50 2.570 vs 2.618                              (throughput unchanged)
#   data_wait_frac p50 0.0435 vs 0.048                     (GPIC per-file S3 FUSE is FINE)
#   peak_mem_gb 17.76 of 80                                (large headroom)
# The GPIC blob question is closed: no blob is needed despite 3.08x the read volume.
name: evan-s512b-real-formal-w64
description: "Stage512b-real FORMAL: 250,000 steps x 2048 = 512M exposures over the 13-anchor curated pool, resuming Stage512a's 125,000-step weights. RUN_MODE must be fresh or continue and is checked against the directory; maxRetries 3 relies on resume, which the job asserts in continue mode. All artifact digests verified before the first batch."
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
numWorkers: 8
gpuPerWorker: 8
cpuPerWorker: 80
memGBPerWorker: 900
maxRetries: 3
environments:
  EXPECTED_COMMIT: ""
  CKPT_DIR: ""
  RUN_MODE: ""
  ARRIVAL_WAIT_S: ""
command: |
  set -euo pipefail
  REPO=/fsx/evan/mot_code_s512b_impl
  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  test -x "$PY" && test -d "$REPO/.git" || { echo "FATAL: env"; exit 43; }
  cd "$REPO"
  export PYTHONPATH="$REPO"
  export HF_HOME=/local/evan/cache/huggingface HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
  export TORCH_HOME=/local/evan/cache/torch TRITON_CACHE_DIR=/local/evan/cache/triton
  export OMP_NUM_THREADS=4 PYTHONUNBUFFERED=1 PYTHONFAULTHANDLER=1 PYTHONHASHSEED=0
  export TORCH_NCCL_ASYNC_ERROR_HANDLING=1 NCCL_DEBUG=WARN FI_EFA_USE_DEVICE_RDMA=1
  export OFFLINE_ARB_PREFETCH_STEPS=4
  unset OFFLINE_ARB_STEP_TIMEOUT_S OFFLINE_ARB_PROFILE_WINDOWS OFFLINE_ARB_SMOKE_DATASET_CONFIG
  unset OFFLINE_ARB_IO_TELEMETRY_DIR OFFLINE_ARB_GPIC_THREADS_PER_NODE
  unset MALLOC_ARENA_MAX MALLOC_TRIM_THRESHOLD_ ARROW_DEFAULT_MEMORY_POOL LD_PRELOAD
  unset PYTHONOPTIMIZE
  [ "$("$PY" -c 'import sys; print(sys.flags.optimize)')" = 0 ] \
    || { echo "FATAL: optimized Python is forbidden for a FORMAL run"; exit 64; }
  mkdir -p /local/evan/anime_img_cache /local/evan/cache

  NNODES=8; PORT=29816
  CFG=configs/stage512b_real_anchors_v1.yaml
  B=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop
  INIT=/fsx/evan/checkpoints/mot_pilot_v1_cleanup_crop/stage512a_20260724_weighted_w64_recovery_v2/last.pt
  INIT_SHA=957bfcf12b89c4042a32056566012a2451e72aa0b2706b0ca51808ab79155c31
  WAIT_S=${ARRIVAL_WAIT_S:-3600}
  RDZV_STALE_S=$((WAIT_S + 3600))

  HOST=$(hostname); NODE_RANK=${HOST##*-}; JOBTAG=${HOST%-*}
  STAMP=$(date -u +%Y%m%dT%H%M%SZ)
  case "$NODE_RANK" in (*[!0-9]*|'') echo "FATAL: malformed node rank: $NODE_RANK"; exit 21;; esac
  test "$NODE_RANK" -lt "$NNODES" || { echo "FATAL: node rank out of range"; exit 21; }

  [ -n "${EXPECTED_COMMIT:-}" ] || { echo "FATAL: EXPECTED_COMMIT unset"; exit 43; }
  bash scripts/jcc_preflight.sh "$EXPECTED_COMMIT" "$REPO"

  [ -n "${CKPT_DIR:-}" ] || { echo "FATAL: CKPT_DIR unset"; exit 43; }
  case "$CKPT_DIR" in *PLACEHOLDER*) echo "FATAL: CKPT_DIR is a placeholder"; exit 43;; esac
  CKPT=$CKPT_DIR
  case "${RUN_MODE:-}" in
    fresh|continue) ;;
    *) echo "FATAL: RUN_MODE must be 'fresh' or 'continue', got '${RUN_MODE:-}'"; exit 43;;
  esac

  # RUN_MODE is the OPERATOR's intent for a new submission. A JCC RETRY of that same
  # submission is a different question, and answering it wrong makes maxRetries
  # decorative: the retry re-runs this script with RUN_MODE still "fresh", finds the
  # directory the first attempt created, and exits 45 -- so a seven-day run would die
  # permanently on its first eviction, which is the exact scenario maxRetries exists for.
  #
  # So intent is combined with identity. $CKPT/.jobtag records which submission owns the
  # directory; a retry sees its own tag and promotes fresh -> continue. Another
  # submission still gets exit 45. If the first attempt died before writing any
  # checkpoint, .jobtag matches but last.pt is absent, and the run correctly stays fresh
  # -- train.py's init_from branch fires on "no local last.pt".
  # RANK 0 DECIDES ALONE. Having every rank run this resolution is racy, and not
  # theoretically: rank 0 creates $CKPT and then writes .jobtag as two operations, so a
  # non-zero rank that reads the directory in between sees it exist with no .jobtag,
  # falls into the "owned by <none>" branch, and exits 45 -- on a first launch, with a
  # perfectly good configuration. Eight nodes starting together on a shared filesystem
  # is exactly where that window gets hit.
  #
  # So rank 0 resolves, publishes the answer, and the other ranks read it. No extra
  # synchronisation is needed: non-zero ranks already block on $RDZV, and rank 0 writes
  # $RDZV only after publishing, so the ordering is already enforced by the rendezvous.
  RES=$CKPT
  MODEFILE=$CKPT/.runmode.$JOBTAG
  if [ "$NODE_RANK" = 0 ]; then
    EFFECTIVE_MODE=$RUN_MODE
    if [ -e "$CKPT" ]; then
      OWNER=$(cat "$CKPT/.jobtag" 2>/dev/null || echo "<none>")
      if [ "$OWNER" = "$JOBTAG" ]; then
        if [ -f "$CKPT/last.pt" ]; then
          EFFECTIVE_MODE=continue
          [ "$RUN_MODE" = continue ] || echo "retry of our own attempt: fresh -> continue"
        else
          EFFECTIVE_MODE=fresh
          echo "retry of our own attempt, no checkpoint yet: staying fresh"
        fi
      elif [ "$RUN_MODE" = fresh ]; then
        echo "FATAL: RUN_MODE=fresh but $CKPT exists and is owned by '$OWNER'."
        echo "       Use RUN_MODE=continue to resume it, or a new CKPT_DIR."; exit 45
      fi
    elif [ "$RUN_MODE" = continue ]; then
      echo "FATAL: RUN_MODE=continue but $CKPT does not exist."; exit 45
    fi
    if [ "$EFFECTIVE_MODE" = continue ]; then
      test -f "$CKPT/last.pt" || {
        echo "FATAL: continue mode but $CKPT/last.pt is missing."; exit 45; }
    fi
    mkdir -p "$CKPT"
    test -f "$CKPT/.jobtag" || printf '%s\n' "$JOBTAG" > "$CKPT/.jobtag"

    if [ "$EFFECTIVE_MODE" = fresh ]; then
      # Only meaningful on a fresh launch: init_from is a mutable path that the frozen
      # Stage512a job would overwrite if it were ever relaunched. On a continue the
      # weights come from our own last.pt and init_from is not read at all.
      GOT=$(sha256sum "$INIT" | awk '{print $1}')
      [ "$GOT" = "$INIT_SHA" ] || { echo "FATAL: init_from sha drift: $GOT != $INIT_SHA"; exit 44; }
      echo "init_from sha verified: $GOT"
    fi

    # Arrival markers from a PREVIOUS attempt of this same submission would otherwise
    # satisfy the barrier instantly on a retry -- eight stale files, count reaches eight,
    # everyone proceeds while only two nodes are actually up. Cleared here, before $RDZV
    # exists, so no peer can have written a marker yet.
    rm -rf "$CKPT/arrival.$JOBTAG"
    mkdir -p "$CKPT/arrival.$JOBTAG"
    printf '%s\n' "$EFFECTIVE_MODE" > "$MODEFILE.tmp"
    mv "$MODEFILE.tmp" "$MODEFILE"
  fi

  echo "=== every bound artifact must be present before the first batch ==="
  for d in offline_arb_catalog_stage512b_v1 \
           offline_arb_plan_stage512b_w64_512m_anchors_v1_20260802 \
           offline_arb_anime_priority_stage512b_weighted_v1_20260802 \
           offline_arb_animefreq_stage512b_v1 \
           offline_arb_caption_sidecar_stage512b_v1 \
           offline_arb_textatlas_gt_stage512b_v2; do
    test -d "$B/$d" || { echo "FATAL: missing $d"; exit 45; }
  done
  # The loader enforces sampling_config_sha256 against the catalog and refuses to load on
  # drift, but failing here costs seconds instead of a model build.
  "$PY" - "$CFG" "$B" <<'PYEOF'
  import hashlib, json, pathlib, sys
  from omegaconf import OmegaConf
  cfg = OmegaConf.load(sys.argv[1]); base = pathlib.Path(sys.argv[2])
  cat = pathlib.Path(str(cfg.dataset.offline_catalog_root))
  head = json.loads((cat / "header.json").read_text())
  sc = pathlib.Path("data_analysis/configs/t5_sampling_stage512b_real_v1.json")
  got = hashlib.sha256(sc.read_bytes()).hexdigest()
  want = head["inputs"]["sampling_config_sha256"]
  assert got == want, f"sampling config drift: {got} != {want} -- catalog is UNBOUND"
  plan = json.loads((pathlib.Path(str(cfg.dataset.offline_plan_root)) / "header.json").read_text())
  assert plan["plan_hash"] == str(cfg.dataset.offline_plan_hash), "plan_hash mismatch"
  assert plan["upstream_catalog_hash"] == head["catalog_hash"], "plan/catalog mismatch"
  assert int(plan["world_size"]) == 64 and int(plan["per_rank_bs"]) == 32
  assert int(cfg.trainer.max_exposure_images) == 512_000_000
  # max_steps is informational: derive_max_steps computes the horizon from exposures.
  assert int(cfg.trainer.max_exposure_images) // 2048 == int(cfg.trainer.max_steps)
  snaps = len(range(int(cfg.trainer.checkpoint_keep_every), int(cfg.trainer.max_steps) + 1,
                    int(cfg.trainer.checkpoint_keep_every)))
  assert snaps <= int(cfg.trainer.checkpoint_keep_max), (
      f"{snaps} periodic snapshots but keep_max={cfg.trainer.checkpoint_keep_max}: "
      "checkpoint.py:193 prunes snaps[:-keep_max], so the earliest would be deleted")
  print(f"bindings OK: catalog {head['catalog_hash'][:12]} plan {plan['plan_hash'][:12]} "
        f"snapshots {snaps} <= keep_max {cfg.trainer.checkpoint_keep_max}")
  PYEOF

  RDZV=$RES/rdzv.$JOBTAG.addr
  if [ "$NODE_RANK" = 0 ]; then
    MYIP=$(hostname -i | awk '{print $1}')
    printf '%s %s %s\n' "$MYIP" "$(date +%s)" "$JOBTAG" > "$RDZV.tmp"
    mv "$RDZV.tmp" "$RDZV"; MASTER_ADDR=$MYIP
  else
    MASTER_ADDR=""
    for _ in $(seq 1 $((WAIT_S / 5))); do
      if test -s "$RDZV" && test ! -L "$RDZV"; then
        read -r ADDR TS TOKEN < "$RDZV" || true
        case "$TS" in (*[!0-9]*|'') TS="";; esac
        NOW=$(date +%s)
        if [ -n "$TS" ] && [ "$TOKEN" = "$JOBTAG" ] && [ $((NOW - TS)) -lt "$RDZV_STALE_S" ]; then
          MASTER_ADDR=$ADDR; break
        fi
      fi
      sleep 5
    done
    test -n "$MASTER_ADDR" || { echo "FATAL: rendezvous missing after ${WAIT_S}s"; exit 20; }
    # $RDZV exists, therefore rank 0 has finished resolving and published both the mode
    # and a cleared arrival directory. Reading either is safe from here and only here.
    EFFECTIVE_MODE=$(cat "$MODEFILE" 2>/dev/null || echo "")
    case "$EFFECTIVE_MODE" in
      fresh|continue) ;;
      *) echo "FATAL: rank 0 published no run mode at $MODEFILE"; exit 43;;
    esac
  fi
  echo "run mode: declared=$RUN_MODE effective=$EFFECTIVE_MODE"

  # Arrival barrier. Counts nodes that STARTED, which is what a scheduling shortfall
  # looks like; it is not a liveness check and does not pretend to be one -- a node that
  # writes its marker and then dies still counts here, and torch's own rendezvous is what
  # catches that. The directory was cleared by rank 0 before $RDZV appeared, so every
  # marker present belongs to this attempt.
  MDIR=$RES/arrival.$JOBTAG
  : > "$MDIR/ready.n$NODE_RANK"
  ARRIVED=0
  for _ in $(seq 1 $((WAIT_S / 5))); do
    ARRIVED=$(ls "$MDIR"/ready.n* 2>/dev/null | wc -l)
    [ "$ARRIVED" -ge "$NNODES" ] && break
    sleep 5
  done
  [ "$ARRIVED" -ge "$NNODES" ] || {
    echo "FATAL: only $ARRIVED/$NNODES nodes arrived within ${WAIT_S}s"; exit 47; }
  echo "all $NNODES nodes arrived"

  if [ "$NODE_RANK" = 0 ]; then
    "$PY" - "$CKPT" "$CFG" "$JOBTAG" "$EXPECTED_COMMIT" "$EFFECTIVE_MODE" "$INIT_SHA" <<'PYEOF'
  import hashlib, json, pathlib, sys
  ckpt, cfg, jobtag, commit, mode, init_sha = sys.argv[1:7]
  out = pathlib.Path(ckpt) / "FORMAL_RUN.json"
  rec = {
      "schema": "stage512b_real_formal_run_v1", "jobtag": jobtag, "commit": commit,
      "run_mode": mode, "config_sha256": hashlib.sha256(pathlib.Path(cfg).read_bytes()).hexdigest(),
      "init_from_sha256": init_sha, "world_size": 64, "global_batch": 2048,
      "max_steps": 250000, "max_exposure_images": 512_000_000,
  }
  # Append-only: a continue must not erase the record of the launch it continues.
  hist = json.loads(out.read_text())["attempts"] if out.exists() else []
  out.write_text(json.dumps({"schema": rec["schema"], "attempts": hist + [rec]}, indent=1))
  print(f"FORMAL_RUN.json now records {len(hist) + 1} attempt(s)")
  PYEOF
  fi

  echo "===== STAGE512B-REAL FORMAL node=$NODE_RANK master=$MASTER_ADDR world=64 mode=$RUN_MODE ====="
  { hostname; nvidia-smi -L; df -h /local | tail -1; sha256sum "$CFG"; } \
    2>&1 | tee "$RES/probe.n$NODE_RANK.$STAMP.log"

  (while true; do
     date -u
     [ -r /sys/fs/cgroup/memory.current ] && echo "mem.current: $(cat /sys/fs/cgroup/memory.current)"
     nvidia-smi --query-gpu=index,memory.used,utilization.gpu --format=csv,noheader
     df --output=avail /local | tail -1
     sleep 300
   done) > "$RES/nodemon.n$NODE_RANK.$STAMP.log" 2>&1 &

  (while true; do
     use=$(df --output=pcent /local 2>/dev/null | tail -1 | tr -dc '0-9' || true)
     if [ "${use:-0}" -ge 85 ]; then
       ts=$(date +%s)
       mv /local/evan/anime_img_cache /local/evan/anime_img_cache.old.$ts 2>/dev/null || true
       mkdir -p /local/evan/anime_img_cache
       nice -n 19 rm -rf /local/evan/anime_img_cache.old.$ts &
       echo "$(date -u) rotated anime image cache at ${use}%"
     fi
     sleep 3600
   done) > "$RES/cachejanitor.n$NODE_RANK.$STAMP.log" 2>&1 &

  LOG=$RES/train.n$NODE_RANK.$STAMP.log
  set +e
  "$PY" -m torch.distributed.run \
    --nnodes "$NNODES" --nproc-per-node 8 --node-rank "$NODE_RANK" \
    --master-addr "$MASTER_ADDR" --master-port "$PORT" \
    train.py --config "$CFG" \
    2>&1 | tee "$LOG"
  PIPE_RC=("${PIPESTATUS[@]}")
  set -e
  test "${PIPE_RC[1]}" -eq 0 || exit "${PIPE_RC[1]}"
  RC=${PIPE_RC[0]}

  # THE assertion that makes maxRetries safe. In continue mode the run must have picked
  # up from last.pt; a silent re-init from Stage512a would discard days of progress and
  # every downstream metric would look healthy. Checked on the line train.py prints.
  if [ "$EFFECTIVE_MODE" = continue ] && [ "$NODE_RANK" = 0 ]; then
    grep -q "resumed from .* at step [1-9]" "$LOG" || {
      echo "FATAL: effective mode was continue but the run did not resume -- it re-initialised."
      grep -E "resumed from|init_from" "$LOG" | head; exit 46; }
    echo "resume verified: continued from an existing checkpoint"
  fi
  test "$RC" -eq 0 || { echo "training exited $RC"; exit "$RC"; }
  echo "=== DONE ==="
