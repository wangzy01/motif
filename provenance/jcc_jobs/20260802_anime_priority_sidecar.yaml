name: evan-s512b-anime-priority-build-20260802-v1
description: "Stage512b anime priority sidecar. Reconstructs the streaming sampler's per-row anime priority from the exact source rows the Stage512b catalog addresses, and publishes a read-only sidecar the weighted planner binds to. Never reads images. The builder was imported verbatim from the Stage512a control dir (its sha is the one the frozen 512a artifact records as its own producer) and then widened; the widened version reproduces the 512a parquet bit-identically. Every producer input is sha-pinned below, and the builder itself refuses a pre-existing output root."
image: 471112743779.dkr.ecr.us-west-2.amazonaws.com/autobuild:py312-torch211-cu129
maxRetries: 0
numWorkers: 1
gpuPerWorker: 0
cpuPerWorker: 32
memGBPerWorker: 128
environments: {}
command: |
  set -euo pipefail

  HOST=$(hostname); NODE_RANK=${HOST##*-}
  case "$NODE_RANK" in ''|*[!0-9]*) NODE_RANK=0 ;; esac
  [ "$NODE_RANK" = 0 ] || { echo "FATAL: rank!=0 on a 1-worker job"; exit 42; }

  export CUDA_VISIBLE_DEVICES=""
  export LC_ALL=C
  export PYTHONUNBUFFERED=1
  export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1

  PY=/fsx/evan/mot_code/venv-gpu/bin/python
  test -x "$PY" || { echo "FATAL: interpreter missing"; exit 43; }
  REPO=/fsx/evan/mot_code_s512b_impl
  test -d "$REPO/.git" || { echo "FATAL: repo missing"; exit 43; }
  export PYTHONPATH="$REPO"
  export PYTHONPYCACHEPREFIX="/local/evan/pycache/${JCC_JOB_ID:-job}/$HOST"
  mkdir -p "$PYTHONPYCACHEPREFIX"

  SCRIPT=$REPO/scripts/offline_arb/build_anime_priority_sidecar_v1.py
  CATALOG=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_catalog_stage512b_v1
  SAMPLING=$REPO/data_analysis/configs/t5_sampling_stage512b_real_v1.json
  OUT=/fsx/evan/mot_code/data_analysis/outputs/mot_pilot_v1_cleanup_crop/offline_arb_anime_priority_stage512b_weighted_v1_20260802

  cd "$REPO"
  echo "=== identity ==="
  git rev-parse HEAD
  git status --porcelain | head -20

  # The sidecar header records producer_sources by content hash, so a mid-edit
  # working tree would silently pin the wrong provenance.  Pin it here instead of
  # trusting that nobody is editing.
  echo "=== producer input pins ==="
  check_sha() { local got; got=$(sha256sum "$1" | cut -d' ' -f1); \
    [ "$got" = "$2" ] || { echo "FATAL: sha drift $1: got $got want $2"; exit 44; }; \
    echo "  ok $(basename "$1") $got"; }
  check_sha "$SCRIPT"                            5712f789e150919acf845c892cb46974c5ea490bd4e2ff2c87abc60cc0e34ef2
  check_sha "$REPO/training/dataline/manifest_index.py" 63a1a4c7bbb2baff4e6132d6c291d585e84428fd4f137be1c621bcb55858bb99
  check_sha "$REPO/training/dataline/config.py"   7541f803002d15566175b4958bae6ed09e437c9e030fed46aad9394a626fe5cb
  check_sha "$SAMPLING"                          a3ecd965ff41aa359474f7730425d24032f13ac16996fdc4f9b9f1436bded713
  check_sha "$CATALOG/header.json"               4ab78bb39715cf596362a8e68eed0e4b77abdfbf1f44f06bbcca454aee366ed8

  test ! -e "$OUT" && test ! -L "$OUT" || { echo "FATAL: output root exists: $OUT"; exit 45; }

  echo "=== suites ==="
  "$PY" scripts/test_anchors_v1_geometry.py | tail -1
  "$PY" scripts/test_phase5_anchors_v1.py   | tail -1
  "$PY" scripts/test_phase3a_anchors_v1.py  | tail -1

  echo "=== build ==="
  timeout --signal=TERM --kill-after=300s 21600s "$PY" "$SCRIPT" \
    --stage 512b \
    --repo-root "$REPO" \
    --catalog-root "$CATALOG" \
    --sampling-config "$SAMPLING" \
    --catalog-hash b91e4906df9a1f8b039effa69df83a0555310d964bf22d6e1da7c13e9c781b91 \
    --output-root "$OUT"

  echo "=== published artifact ==="
  ls -la "$OUT"
  test "$(stat -c %a "$OUT")" = 555 || { echo "FATAL: output root not sealed 0555"; exit 46; }
  for MEMBER in anime_priority.parquet header.json _SUCCESS; do
    test "$(stat -c %a "$OUT/$MEMBER")" = 444 || { echo "FATAL: $MEMBER not 0444"; exit 46; }
    test "$(stat -c %h "$OUT/$MEMBER")" = 1   || { echo "FATAL: $MEMBER is hardlinked"; exit 46; }
  done

  "$PY" - "$OUT" <<'PYEOF'
  import json, pathlib, sys
  import numpy as np
  import pyarrow.parquet as pq

  root = pathlib.Path(sys.argv[1])
  header = json.loads((root / "header.json").read_text())
  success = json.loads((root / "_SUCCESS").read_text())
  assert header["schema"] == "stage512b_anime_priority_sidecar_v1", header["schema"]
  assert success["schema"] == "stage512b_anime_priority_sidecar_v1"
  assert header["status"] == "PASS" and success["status"] == "PASS"
  assert header["output"]["rows"] == 16_404_684, header["output"]["rows"]

  pf = pq.ParquetFile(root / "anime_priority.parquet")
  assert pf.metadata.num_rows == 16_404_684
  print("columns:", pf.schema_arrow.names)

  # Contract the weighted planner depends on: row_id contiguous from 0, and every
  # bucket_idx inside the 13-anchor range.  A 361-space value here would mean the
  # sidecar was bound to the wrong catalog and the planner would index past cfg.B.
  lo, hi, prev_end, n = None, None, -1, 0
  bmin, bmax = 1 << 30, -(1 << 30)
  for rg in range(pf.num_row_groups):
      t = pf.read_row_group(rg, columns=["row_id", "bucket_idx", "priority"])
      rid = t["row_id"].to_numpy(zero_copy_only=False)
      bkt = t["bucket_idx"].to_numpy(zero_copy_only=False)
      pri = t["priority"].to_numpy(zero_copy_only=False)
      assert rid[0] == prev_end + 1, (rg, rid[0], prev_end)
      assert np.array_equal(rid, np.arange(rid[0], rid[0] + rid.size))
      prev_end = int(rid[-1]); n += rid.size
      bmin, bmax = min(bmin, int(bkt.min())), max(bmax, int(bkt.max()))
      lo = float(pri.min()) if lo is None else min(lo, float(pri.min()))
      hi = float(pri.max()) if hi is None else max(hi, float(pri.max()))
  assert n == 16_404_684 and prev_end == 16_404_683
  assert 0 <= bmin and bmax <= 12, (bmin, bmax)
  print(f"rows {n:,}  row_id contiguous 0..{prev_end:,}  bucket_idx {bmin}..{bmax}  priority [{lo:.4f}, {hi:.4f}]")
  print("ANIME_PRIORITY_BUILD_POSTCHECK_PASS")
  PYEOF

  echo "=== sha of the published sidecar ==="
  sha256sum "$OUT/anime_priority.parquet" "$OUT/header.json" "$OUT/_SUCCESS"
  echo "=== DONE ==="
